 monthly / annual. |\n| `list_price` | NUMERIC | List Price | Published list price for this plan at this interval. |\n| `currency` | STRING | Currency | Currency of the list price. |\n| `is_active` | BOOLEAN | Is Active | Whether the plan is currently sellable. |\n\n# Example Questions\n\n- How does list pricing step up across tiers, and what is the effective saving for paying annually?\n- Which tiers and billing intervals are actually being sold the most?\n- How much revenue sits on plans that are no longer offered to new customers?\n", "saas/subscription-events": "---\ntitle: \"Subscription Events\"\ndescription: |\n  The movement history behind recurring revenue: one row per subscription change — new,\n  expansion, contraction, reactivation, or churn — with the signed revenue and seat deltas\n  and the running revenue after each change. This is what reconstructs the revenue waterfall\n  and the retention rates the business lives or dies by.\n\n  Running revenue reconciles with each subscription's own contracted rate. A subscription still\n  on the books finishes the series on that rate; a subscription that churned was carrying it in\n  the period immediately before the churn and the series steps away from it — so a churn reads as\n  revenue lost from a customer's full rate, not as a downgrade on the way up to it.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:01:58.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `event_id` | STRING | Event ID | PK. Unique subscription-event identifier. |\n| `account_id` | STRING | Account ID | Account the event belongs to. FK to [Account](./account.md) |\n| `subscription_id` | STRING | Subscription ID | Subscription the event belongs to. FK to [Subscription](./subscription.md) |\n| `event_ts` | TIMESTAMP | Event Time | When the subscription change occurred. |\n| `event_type` | STRING | Event Type | MRR-movement type: new / expansion / contraction / reactivation / churn. |\n| `plan_from` | STRING | Plan From | Plan before the change. |\n| `plan_to` | STRING | Plan To | Plan after the change. |\n| `mrr_delta` | NUMERIC | MRR Delta | Signed MRR change — the MRR-movement waterfall. Always the step between two consecutive levels, so the deltas of a subscription add up to the movement in its recurring revenue over the period. |\n| `seats_delta` | INTEGER | Seats Delta | Signed change in seat count. |\n| `mrr_after` | NUMERIC | MRR After | Total MRR after the change, reconciled with the subscription's contracted rate: a subscription with no churn in the period ends on that rate, and one that churned was carrying it immediately before the churn. |\n\n# Example Questions\n\n- What does the revenue waterfall look like month to month — how much new, expansion, contraction and churned revenue?\n- What are gross and net revenue retention, and which is trending the wrong way?\n- How much of expansion comes from seat growth versus tier upgrades?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id` [N:1] — The account whose recurring revenue moved.\n- [Subscription](./subscription.md) — `subscription_id = subscription_id` [N:1] — The subscription this change was made to.\n  - [Subscription Account](./account.md) — The account behind the changed subscription.\n  - [Subscription Plan](./plan.md) — The plan the changed subscription is on.\n", "saas/subscription": "---\ntitle: \"Subscription\"\ndescription: |\n  The billing spine: one row per subscription showing which account is on which plan, at what\n  monthly recurring revenue and seat count, on what cadence, and with any negotiated discount.\n  It also reveals where a subscription's plan has drifted from the account's current tier under\n  grandfathered or discounted pricing. The source of truth for what each customer pays today.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-18T14:00:22.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `subscription_id` | STRING | Subscription ID | PK. Unique subscription identifier. |\n| `account_id` | STRING | Account ID | Account that owns the subscription. FK to [Account](./account.md) |\n| `plan_id` | STRING | Plan ID | Plan the subscription is billed on. May differ from the account's current tier under grandfathered pricing or a negotiated discount. FK to [Plan](./plan.md) |\n| `status` | STRING | Status | Subscription status: active / past_due / canceled. |\n| `seats_licensed` | INTEGER | Seats Licensed | Number of seats licensed on the subscription. |\n| `mrr` | NUMERIC | MRR | Contracted monthly recurring revenue — the rate on the agreement, unchanged by cancellation. |\n| `active_mrr` | NUMERIC | Active MRR | Live monthly recurring revenue: still contracted unless canceled, when it drops to 0. Equal to `mrr` for `active` and `past_due` subscriptions alike — a failed payment does not by itself stop the contract. |\n| `currency` | STRING | Currency | Billing currency, aligned to the account's region. |\n| `billing_interval` | STRING | Billing Interval | Billing cadence: monthly / annual. |\n| `started_at` | DATE | Started At | Date the subscription started. |\n| `current_period_start` | DATE | Current Period Start | Start of the current billing period. |\n| `current_period_end` | DATE | Current Period End | End of the current billing period. |\n| `canceled_at` | DATE | Canceled At | Date the subscription was canceled, if it was. |\n| `discount_pct` | NUMERIC | Discount % | Negotiated discount fraction applied to list price, if any. |\n\n# Example Questions\n\n- What is total recurring revenue, and how is it spread across tiers, billing intervals and seat counts?\n- How common are negotiated discounts, and how much list price do they give away?\n- Which `accounts` sit on grandfathered pricing that no longer matches their current tier?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id` [N:1] — The account paying for this subscription.\n- [Plan](./plan.md) — `plan_id = plan_id` [N:1] — The plan this subscription is billed on.\n", "saas/support-tickets": "---\ntitle: \"Support Tickets\"\ndescription: |\n  Every support interaction — priority, topic, satisfaction score, time to first response, and\n  resolution time. Support experience is an early churn-risk signal: unhappy, slow-to-resolve\n  accounts are the ones that quietly leave.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:01:59.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `ticket_id` | STRING | Ticket ID | PK. Unique support-ticket identifier. |\n| `account_id` | STRING | Account ID | Account that opened the ticket. FK to [Account](./account.md) |\n| `user_id` | STRING | User ID | User who opened the ticket, if attributable. FK to [User](./user.md) |\n| `opened_at` | TIMESTAMP | Opened At | When the ticket was opened. |\n| `closed_at` | TIMESTAMP | Closed At | When the ticket was closed. |\n| `priority` | STRING | Priority | Ticket priority level. |\n| `category` | STRING | Category | Ticket topic/category. |\n| `csat_score` | INTEGER | Csat Score | Customer satisfaction rating for the ticket. |\n| `first_response_mins` | INTEGER | First Response Mins | Minutes to first agent response. |\n\n# Example Questions\n\n- How do satisfaction scores and response times relate to whether an `account` later churns?\n- Which ticket categories drive the most dissatisfaction and the heaviest support load?\n- Do `accounts` that raise many high-priority tickets expand less than smoother ones?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id` [N:1] — The account that opened the ticket.\n- [User](./user.md) — `user_id = user_id` [N:1] — The seat that opened the ticket, when known.\n  - [User Account](./account.md) — The account of the seat that opened the ticket.\n", "saas/trials": "---\ntitle: \"Trials\"\ndescription: |\n  Every trial and how it ended — converted to paid or not — with when it started and expired,\n  where it came from (self-serve, sales-assisted, product-led upsell), and the plan it was\n  evaluating. The top of the funnel for new recurring revenue.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-11T08:35:35.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `trial_id` | STRING | Trial ID | PK. Unique trial identifier. |\n| `account_id` | STRING | Account ID | Account running the trial. FK to [Account](./account.md) |\n| `started_at` | TIMESTAMP | Started At | When the trial began. |\n| `ends_at` | TIMESTAMP | Ends At | Scheduled trial expiry. |\n| `converted_at` | TIMESTAMP | Converted At | When the trial converted to a paid plan, if it did. |\n| `is_converted` | BOOLEAN | Is Converted | Trial-to-paid outcome flag. |\n| `trial_source` | STRING | Trial Source | Where the trial came from (self-serve, sales-assisted, PLG upsell). |\n| `requested_plan` | STRING | Requested Plan | Plan tier the trial is evaluating. |\n\n# Example Questions\n\n- What is the trial-to-paid conversion rate, and how does it differ by trial source?\n- How long do trials take to convert, and does evaluating a higher tier change the odds?\n- Which trial sources bring in the `accounts` that go on to be worth the most?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id` [N:1] — The account that ran the trial.\n", "saas/usage-daily": "---\ntitle: \"Usage (daily)\"\ndescription: |\n  Daily product engagement at the account-and-user level: active minutes, high-value actions\n  taken, and how many distinct features were touched — the breadth signal for activation. The\n  behavioral pulse that explains why accounts expand, stall, or churn.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:01:59.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `usage_id` | STRING | Usage ID | PK. Unique daily-usage record identifier. |\n| `account_id` | STRING | Account ID | Account that generated the usage. FK to [Account](./account.md) |\n| `user_id` | STRING | User ID | User that generated the usage. FK to [User](./user.md) |\n| `usage_date` | DATE | Usage Date | Calendar day of the usage. |\n| `active_minutes` | INTEGER | Active Minutes | Minutes the user was active in-product. |\n| `key_actions` | INTEGER | Key Actions | Count of high-value actions taken. |\n| `distinct_features_used` | INTEGER | Distinct Features Used | Count of distinct product features touched that day — activation breadth. |\n\n# Example Questions\n\n- How does product engagement in the first weeks predict whether an `account` converts and expands?\n- Which `accounts` are quietly disengaging — falling active minutes or narrowing feature use — before they churn?\n- Does broader feature adoption go hand in hand with higher retention and revenue?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id` [N:1] — The account that generated the usage.\n- [User](./user.md) — `user_id = user_id` [N:1] — The seat that generated the usage.\n  - [User Account](./account.md) — The account of the seat that generated the usage.\n", "saas/user": "---\ntitle: \"User\"\ndescription: |\n  The people inside each account: one row per user seat, with role, seat type, when they were\n  invited, and how recently they were active. Seat-level activity is what turns a licensed\n  account into an adopted one — and idle seats are early signs of shrinking value.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-11T08:35:01.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `user_id` | STRING | User ID | PK. Unique user identifier. |\n| `account_id` | STRING | Account ID | Owning account. FK to [Account](./account.md) |\n| `email` | STRING | Email | User's email address. |\n| `role` | STRING | Role | User's role within the account. |\n| `seat_type` | STRING | Seat Type | Type of seat assigned (e.g. full / viewer). |\n| `invited_at` | TIMESTAMP | Invited At | When the user was invited. |\n| `last_active_at` | TIMESTAMP | Last Active At | Most recent activity timestamp. |\n| `is_active` | BOOLEAN | Is Active | Whether the seat is currently active. |\n\n# Example Questions\n\n- What share of licensed seats is actually active, and how does seat adoption vary by `account`?\n- Which roles and seat types are the most engaged?\n- Are `accounts` with many dormant seats the ones heading toward contraction?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id` [N:1] — The account a seat belongs to.\n", "seo/authority": "---\ntitle: \"Authority\"\ndescription: |\n  How much standing one external site carries in one topic, on one day. A site's\n  standing is a combination of the organic traffic it already has and the links pointing\n  at it within a context, which is why it is measured per site *and* per topic and never\n  per site alone: the same site can have standing on web hosting and none at all on\n  washing machines. Two rows for the same site in two topics are not a duplicate — they\n  are the point.\n\n  Neither ingredient is invented here. The traffic is held on the\n  [host](./third-party-websites.md), because it is true of the site whatever topic is\n  being asked about; the links are what makes the reading topical. One exception is real\n  and is kept on the host as its own flag: the broadly authoritative sites that count in\n  any context.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `authority_id` | STRING | Authority ID | PK. The identifier of this reading — one site, in one topic, on one day. |\n| `third_party_website_id` | STRING | Third Party Website ID | The external site whose standing is being measured. FK to [Third Party Websites](./third-party-websites.md) |\n| `context_id` | STRING | Context ID | The topic the standing is measured in. The same site can hold standing in one topic and none in another. FK to [Context](./context.md) |\n| `authority_score` | FLOAT | Authority Score | How much standing the site carries in this topic — a combination of the organic traffic it already has and the links pointing at it within this context. |\n| `measured_on` | DATE | Measured On | The day this reading was taken. A score is comparable with another only alongside its date. |\n\n# Example Questions\n\n- For a topic we are trying to enter, which sites carry standing in that topic — and are they the same sites as the ones with the most traffic?\n- Which of the hosts we are paying to appear on have no measured standing in the topic our placement on them sits in?\n- Where has a site's standing in a topic moved between readings, and were our placements on it made before or after that?\n\n## Joins\n\n- [Third Party Websites](./third-party-websites.md) — `third_party_website_id = third_party_website_id` [N:1] — The site whose standing is being scored.\n- [Context](./context.md) — `context_id = context_id` [N:1] — The topic it is scored in; a site can be authoritative in one and unknown in another.\n", "seo/backlink": "---\ntitle: \"Backlink\"\ndescription: |\n  One placement of a brand on somebody else's site: a link back to one of its pages, or\n  the brand named in their text without one. Both are held here because both are the\n  same piece of work — a business appears in someone else's article, in some topic, on a\n  host whose standing is what decides the worth. `has_link` tells the two apart, and\n  false is not a missing value: it is a brand mention, and a mention points at no page,\n  so a count that reads an empty page as a defect is counting mentions as broken links.\n\n  What decides what a placement is worth is the topic it appears in. Standing is\n  topical: a host can carry it in one subject and none in another, and a placement whose\n  article sits outside the subject its host carries weight in is worth quite moderately\n  in Google's eyes. The [broadly authoritative sites](./third-party-websites.md) are the\n  exception: a piece on Forbes mentioning a brand counts heavily in its favour in any\n  context.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `backlink_id` | STRING | Backlink ID | PK. The identifier of this placement, whether it carries a link or is a mention without one. |\n| `page_id` | STRING | Page ID | The page on this site the link points at. Empty when `has_link` is false — a mention points at no page. FK to [Page](./page.md) |\n| `third_party_website_id` | STRING | Third Party Website ID | The external site the placement sits on. FK to [Third Party Websites](./third-party-websites.md) |\n| `context_id` | STRING | Context ID | The topic the placement appears in, which is what decides what it is worth. FK to [Context](./context.md) |\n| `has_link` | BOOLEAN | Has Link | Whether the placement carries a link back to this site. False is a brand mention: the brand named in the text, not linked — the signal AI search responds to. |\n| `placed_on` | DATE | Placed On | When the placement went live on the other site. |\n| `is_permanent` | BOOLEAN | Is Permanent | Whether it was bought as a permanent placement — the trade's own word for one that lives on the site permanently, rather than a subscription. |\n| `min_placement_months` | INTEGER | Minimum Placement Months | How long the placement is expected to stay up at the least. Twelve months is the threshold usually expected. |\n| `placement_cost` | NUMERIC | Placement Cost | What was paid to the owner of the site for carrying the placement. |\n| `content_cost` | NUMERIC | Content Cost | What it cost to produce the article that carries the placement — the second half of the price, paid to whoever wrote it rather than to the site. |\n\n# Example Questions\n\n- What has a topic's off-site work actually cost us, once the articles we had to produce are counted alongside what we paid the sites?\n- How much of what the web says about us in a topic carries a link, and how much of it is our brand named with no link at all?\n- Which of our placements sit on sites with standing in the topic they appear in, and which sit on sites that are simply large?\n\n## Joins\n\n- [Page](./page.md) — `page_id = page_id` [N:1] — The page the link points at; empty when the placement is a mention with no link.\n  - [Page Website](./website.md) — The site of yours the placement's link points into.\n    - [Page Website robots.txt](./robots-txt.md) — The crawling rules of the site the link points into.\n    - [Page Website sitemap.xml](./sitemap-xml.md) — The page list of the site the link points into.\n- [Third Party Websites](./third-party-websites.md) — `third_party_website_id = third_party_website_id` [N:1] — The site the placement sits on.\n- [Context](./context.md) — `context_id = context_id` [N:1] — The topic the placement appears in, which is what decides whether it counts.\n", "seo/channel": "---\ntitle: \"Channel\"\ndescription: |\n  How a visitor arrived, as an analytics tool classifies it: organic search, a referral\n  from another site, direct entry, or an AI assistant. In Google's own terms a visit\n  from search is the channel `organic` with the source `google`: the channel says what\n  kind of arrival it was, the source says who sent it.\n\n  Search work moves more than one of these at once, which is why the classification is\n  kept as its own object rather than as a label on the visit. A placement on a good site\n  is read by search engines as a citation, and people follow it: those arrivals are\n  `referral`, while the ranking the same placement supports produces `organic` ones. The\n  same piece of work arrives under two labels, and a practice reading only their sum\n  cannot separate the two effects.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `channel_id` | STRING | Channel ID | PK. The identifier of this way of arriving. |\n| `channel_group` | STRING | Channel Group | The kind of arrival: `organic`, `referral`, `direct` or `ai`. |\n| `source` | STRING | Source | Who sent the visitor — `google` for organic search from Google, the domain for a referral. |\n\n# Example Questions\n\n- How much of the traffic reaching a `page` arrives through search, and how much through the sites that link to it?\n- Which `pages` are entered directly, without any referrer at all, and does that change after a brand is mentioned somewhere prominent?\n- Is the traffic an AI assistant sends behaving like search traffic on the same `pages`, or differently?\n", "seo/content": "---\ntitle: \"Content\"\ndescription: |\n  The text, images and video a site publishes: the first of the three pillars of search\n  — what a business says about itself, and the material that gets indexed and served in\n  AI answers and in Google. It is also one of the three things an SEO practice pays for,\n  alongside the developer work that keeps the site in order and the placements bought on\n  other people's sites, so this is where the first of those three cost lines sits.\n\n  Reading content as a volume is the reading this model is built to prevent. What gives\n  a piece of content a chance of ranking is not that it exists, and not that a person\n  rather than a machine produced it, but whether it adds knowledge to its topic. Content\n  that adds nothing still costs what it cost to produce; and a large body of generated\n  content that does not rank demonstrably worsens a site's traffic figures, often\n  looking like a collapse.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `content_id` | STRING | Content ID | PK. The identifier of this piece of content. |\n| `page_id` | STRING | Page ID | The page this text, image or video sits on, and the only route from content to the site that publishes it. FK to [Page](./page.md) |\n| `knowledge_gain_id` | STRING | Knowledge Gain ID | The assessment of what new knowledge this content brings into its topic. FK to [Knowledge Gain](./knowledge-gain.md) |\n| `content_type` | STRING | Content Type | What kind of content it is: `text`, `image` or `video`. |\n| `published_at` | TIMESTAMP | Published At | When this content went live on the page. |\n| `is_ai_generated` | BOOLEAN | Is AI Generated | Whether the content was produced by AI. On its own this decides nothing: what matters is whether the content adds knowledge to its topic. |\n| `production_cost` | NUMERIC | Production Cost | What it cost to create this content — one of the three things an SEO practice pays for, alongside developer work on the site and placements on other sites. |\n\n# Example Questions\n\n- How much have we spent producing content that adds nothing to its topic, and which topics is that money sitting in?\n- Which of our `pages` are built mostly of machine-written text, and does that text rest on data only we hold?\n- What have we published over the past year, by type, and are those the `pages` that earn traffic from search?\n\n## Joins\n\n- [Page](./page.md) — `page_id = page_id` [N:1] — The page this text, image or video sits on.\n  - [Page Website](./website.md) — The site this content is published on.\n    - [Page Website robots.txt](./robots-txt.md) — The crawling rules of the site this content is published on.\n    - [Page Website sitemap.xml](./sitemap-xml.md) — The page list of the site this content is published on.\n- [Knowledge Gain](./knowledge-gain.md) — `knowledge_gain_id = knowledge_gain_id` [N:1] — The assessment of what new knowledge this content adds.\n  - [Knowledge Gain Context](./context.md) — The topic this content's gain was measured against.\n", "seo/context": "---\ntitle: \"Context\"\ndescription: |\n  The topic a search belongs to — the subject someone is asking about, rather than the\n  words they used to ask. Many different queries and many different keywords can be the\n  same context: \"web analytics for websites\", \"visit analytics for e-commerce\" and \"how\n  do I find out where my customers came from\" are all one topic, and a practice works on\n  the topic rather than on the phrasings one at a time.\n\n  It is a mart of its own, with almost nothing on it, because it is what the rest of the\n  model is judged against. Authority is contextual — standing is topical, and a site can\n  carry it in one subject and none in another — and whether a page adds new knowledge is\n  measured against a topic. Leaving the context out is what an entry-level practitioner\n  does: calling a site authoritative because it is large and gets traffic, and buying a\n  placement on it whose value in Google's eyes turns out to be quite moderate. The more\n  often a site is cited within a context, the better its chance of coming up, and coming\n  up high, for it.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `context_id` | STRING | Context ID | PK. The identifier of this topic. |\n| `topic` | STRING | Topic | The subject itself, in the practice's own words — the thing a set of queries, a set of keywords and a body of content are all about. |\n\n# Example Questions\n\n- Which topics do we already hold positions in, and which are we buying placements in without ranking yet?\n- For a topic we want to enter, which `third-party sites` carry standing in that topic rather than standing in general?\n- How many distinct `queries` collapse into one topic for us, and are we treating that topic as one job or as several?\n", "seo/crawl": "---\ntitle: \"Crawl\"\ndescription: |\n  One fetch of one page by one robot. A row is a single arrival, not a robot: a robot\n  can fetch the same page more than once, and each fetch is its own row. Keeping the\n  grain at the fetch is what lets crawling be read as behaviour over time rather than as\n  a list of who is out there.\n\n  A crawler landing on a site learns its content and its links. The internal ones lead\n  it to internal pages, which it also visits — each of those visits another row here. An\n  external one may send it to a page it did not know, and that page belongs to somebody\n  else and has no row in this model, so the fetch names a\n  [host](./third-party-websites.md) and no page.\n\n  That is why this mart reaches the [crawl rules](./robots-txt.md) by two routes rather\n  than one. A fetch of the site's own page reaches them through the page and its\n  [site](./website.md); a fetch of somebody else's page has only the route through the\n  [indexing request](./initiate-index.md) — one is the rules of the site whose page was\n  fetched, the other the rules the run itself read.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `crawl_id` | STRING | Crawl ID | PK. The identifier of this single fetch. |\n| `page_id` | STRING | Page ID | The page that was fetched, when the fetch was of this site. Empty when the crawler followed a link off it onto somebody else's page. FK to [Page](./page.md) |\n| `third_party_website_id` | STRING | Third Party Website ID | The external host the robot went to, when the page fetched belonged to somebody else. FK to [Third Party Websites](./third-party-websites.md) |\n| `initiate_index_id` | STRING | Indexing Request ID | The run that caused this fetch, which is how a request is tied to the pages it actually reached. FK to [Initiate Index](./initiate-index.md) |\n| `crawler_user_agent` | STRING | Crawler User Agent | Who fetched the page, as it introduced itself. Anyone requesting a page on the internet is obliged to state a user agent, and usually that is more than enough to tell a robot from a person. |\n| `crawled_at` | TIMESTAMP | Crawled At | When this fetch happened. |\n| `was_allowed` | BOOLEAN | Was Allowed | The crawl rules verdict on this fetch: whether the robot was let into the path it asked for. |\n| `links_found` | INTEGER | Links Found | How many links the crawler came away with. Internal ones lead it to pages it then visits too; external ones either credit a page it already knew or send it to crawl one it did not. |\n\n# Example Questions\n\n- Which crawlers are arriving on our `pages`, how often is each one turned away, and how many links does it come away with when it is let in?\n- Which of our `pages` are being fetched and refused, and how many paths does the `robots.txt` behind that refusal close off?\n- When a crawler follows a link off our site, which external hosts does it end up fetching, and how much of our crawling is that?\n\n## Joins\n\n- [Page](./page.md) — `page_id = page_id` [N:1] — The page fetched, when the fetch was of this site; empty for a third-party page.\n  - [Page Website](./website.md) — The site whose page was fetched.\n    - [Page Website robots.txt](./robots-txt.md) — The crawling rules of the site whose page was fetched.\n    - [Page Website sitemap.xml](./sitemap-xml.md) — The page list of the site whose page was fetched.\n- [Third Party Websites](./third-party-websites.md) — `third_party_website_id = third_party_website_id` [N:1] — The external site fetched, when the crawler followed a link off this one.\n- [Initiate Index](./initiate-index.md) — `initiate_index_id = initiate_index_id` [N:1] — The indexing run this fetch belongs to.\n  - [Initiate Index robots.txt](./robots-txt.md) — The rules this indexing run itself read before fetching.\n", "seo/google-search-console": "---\ntitle: \"Google Search Console\"\ndescription: |\n  The property registered with Google: Google's own facility where a site is entered\n  directly, as a claim of ownership and a request that it be crawled — and Google goes\n  and crawls it. It is the one place in this model where a site is declared to a search\n  engine instead of being discovered by one, which is why it is held as an object of its\n  own rather than as a flag on the site.\n\n  It carries no numbers. Impressions, clicks and positions are read *through* this\n  property and are kept in [Search Performance](./search-performance.md); what lives\n  here is the registration itself — which site, whether the claim was confirmed, and\n  when. Search Console is also where searching done by AI is fairly visible, as very\n  long queries a normal person would never write.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `property_id` | STRING | Property ID | PK. The identifier of this registered property. |\n| `website_id` | STRING | Website ID | The site this property was registered for. FK to [Website](./website.md) |\n| `property_url` | STRING | Property URL | The address the property covers, as it was entered when the site was registered. |\n| `is_verified` | BOOLEAN | Is Verified | Whether ownership of the site has been confirmed, which is what makes the property a claim rather than an entry. |\n| `verified_at` | TIMESTAMP | Verified At | When ownership was confirmed, so a change in crawling or in search numbers can be lined up against the moment the site was declared. |\n\n# Example Questions\n\n- Which of our sites have a verified property, and which are left to be found on their own?\n- How long after a site was put into technical order was its property verified, and did its `pages` start being crawled before or after that?\n- Are we reading search numbers for every site we run, or only for the ones whose property someone got round to verifying?\n\n## Joins\n\n- [Website](./website.md) — `website_id = website_id` [N:1] — The site this property was verified for.\n  - [Website robots.txt](./robots-txt.md) — The crawling rules of the site this property was verified for.\n  - [Website sitemap.xml](./sitemap-xml.md) — The page list of the site this property was verified for.\n", "seo/initiate-index": "---\ntitle: \"Initiate Index\"\ndescription: |\n  The moment a site or one of its pages enters the queue to be indexed. The name is the\n  one coined on the call this model was drawn from rather than a phrase used elsewhere\n  in the trade.\n\n  A run arrives here by one of three routes. A site can be entered into Google's [Search\n  Console](./google-search-console.md) directly, as a claim of ownership and a request\n  that it be crawled. A [sitemap](./sitemap-xml.md) can offer the structured list of\n  pages to be indexed. Or a crawler already working somewhere else can find a link to a\n  page it did not know, and go and crawl that page. The sitemap route is optional: a\n  sitemap helps, but if there is none, Google will crawl the site anyway, as long as the\n  robots.txt is in order.\n\n  The date here is when the asking happened, not when a robot turned up, and the gap to\n  the [fetches](./crawl.md) that followed is what shows how long a site waited.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `initiate_index_id` | STRING | Indexing Request ID | PK. The identifier of this run. |\n| `robots_txt_id` | STRING | Robots File ID | The crawl rules the arriving crawler reads on the way in, whichever route asked for the run. FK to [robots.txt](./robots-txt.md) |\n| `requested_at` | TIMESTAMP | Requested At | When the site or page was put into the queue, which is not when a robot arrived. |\n| `trigger` | STRING | Trigger | Which route started the run: `search_console` for a request made directly in the registered property, `sitemap` for the page list being offered, `external_link` for a crawler that met a link to a page it did not know. |\n\n# Example Questions\n\n- Which of our sites do we have to ask to be crawled, and which are found on their own through a link somebody else published?\n- How long after a request went in did a robot actually arrive, and did it get past the crawl rules when it did?\n- Are the runs that arrive through a `sitemap` reading rules that were valid at the time, or are we asking for `crawls` of sites whose `robots.txt` does not parse?\n\n## Joins\n\n- [robots.txt](./robots-txt.md) — `robots_txt_id = robots_txt_id` [N:1] — The rules the run read before fetching anything.\n", "seo/keyword": "---\ntitle: \"Keyword\"\ndescription: |\n  A term the practice targets — the middle of the three levels this model keeps for\n  demand. It is one of the main terms of the trade. A keyword is, to a considerable\n  extent, a synonym of a [topic](./context.md): many keywords can be one and the same\n  context, and the practice works on the topic rather than on each phrasing separately.\n\n  The word carries two meanings in everyday use, and this model splits them. Asked\n  directly whether the thing a user sees is a keyword or a search query, the answer on\n  the record was: it is a search query. So the string somebody typed is a [Search\n  Query](./search-query.md), and `keyword` is used here by this model's own convention\n  for the term the practice targets — the entry on the practice's list, not the entry in\n  somebody's search box. Holding the two apart is what makes it possible to ask which of\n  the chosen terms nobody searches, and which searches a site picks up that it never\n  aimed at.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `keyword_id` | STRING | Keyword ID | PK. The identifier of this term. |\n| `context_id` | STRING | Context ID | The topic this term belongs to; a keyword is to a considerable extent a synonym of a context, and many keywords can be one and the same one. FK to [Context](./context.md) |\n| `keyword_text` | STRING | Keyword | The term itself, as the practice writes it on its own list. |\n| `is_targeted` | BOOLEAN | Is Targeted | Whether the practice is optimising for this term, as opposed to keeping it on the list to watch. |\n\n# Example Questions\n\n- Which of the terms we target sit in topics we already hold positions in, and which are aimed at topics we have never appeared in?\n- For a topic we are working on, how many terms are we actively targeting and how many are we only watching?\n- Which of our targeted terms do people actually type something matching, and which exist only on our own list?\n\n## Joins\n\n- [Context](./context.md) — `context_id = context_id` [N:1] — The topic this term belongs to; many keywords share one.\n", "seo/knowledge-gain": "---\ntitle: \"Knowledge Gain\"\ndescription: |\n  Whether a piece of content brings new knowledge into a topic — a super-important\n  component of ranking. Google holds patented technology for the judgement, published\n  information rather than a secret, by which it assesses how valuable a page is in\n  bringing new knowledge into a context. It is kept as an object of its own rather than\n  as a column on the content because there is a context, there is content other sites\n  have already written on that context, and what is being measured is the difference a\n  page makes to it.\n\n  It is the brick people fail to understand when they hand content creation over to AI\n  and are then surprised at how their site is doing. The term is not much circulated,\n  and it stays uncirculated because it gets in the way of selling AI content generators.\n  It is not a verdict on the author: content that merely retells what is already\n  available carries no gain, and content built on data nobody else holds carries it\n  whether or not a machine wrote the words.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `knowledge_gain_id` | STRING | Knowledge Gain ID | PK. The identifier of this assessment. |\n| `context_id` | STRING | Context ID | The topic the content is being judged against — there is no such thing as a gain in the abstract. FK to [Context](./context.md) |\n| `score` | FLOAT | Knowledge Gain Score | How much new knowledge this content brings into its topic, as a number. It is read against the topic, not against the content on its own. |\n| `adds_new_knowledge` | BOOLEAN | Adds New Knowledge | Whether the content brings knowledge that was not already in general circulation, or only retells what other sites have written on the topic. |\n| `is_expert_authored` | BOOLEAN | Is Expert Authored | Whether the author is already visible in this topic as the author of content, ideas, opinions and analysis — which gives a page a chance of ranking despite weak support from links. |\n| `is_based_on_unique_data` | BOOLEAN | Is Based on Unique Data | Whether the content rests on data that was not otherwise available. Where it does, machine authorship makes no difference to how it ranks. |\n| `contradicts_consensus` | BOOLEAN | Contradicts Consensus | Whether the content argues against an established consensus in its topic. Content that does is deranked even when it is right. |\n\n# Example Questions\n\n- In which topics does our `content` add something that was not already in general circulation, and in which are we restating what other sites have written?\n- Where does what we publish rest on data only we hold, and where does it rest only on an expert's standing in the topic?\n- Which of our `pages` argue against the settled view in their topic, and what did we spend producing them?\n\n## Joins\n\n- [Context](./context.md) — `context_id = context_id` [N:1] — The topic the gain is measured against; the same content scores differently in another.\n", "seo/page": "---\ntitle: \"Page\"\ndescription: |\n  One page of the site being optimised: the unit that gets crawled, indexed, ranked and\n  arrived at. A page is what content sits on, and the level at which what a site asks a\n  search engine for — index this — can be compared with what happened to it.\n  `is_in_sitemap` is a column here and not a link to the [page list](./sitemap-xml.md):\n  the list is optional, and being named in it is simply true or false about a page.\n\n  It carries its own behaviour numbers because Google reads user signals per page *and*\n  for the site as a whole, as an average. A hack turns on that arithmetic: removing\n  content that does not work lifts the averages of what is left, which Google reads as\n  an improvement in quality. Whether a dead page should be removed, redirected or\n  rewritten is not settled, and depends heavily on how spoilt Google is for content on\n  that topic: where it has plenty, such pages should not be on the site at all; where it\n  has little, it will show even weak ones for want of anything better. Pages kept for\n  regulatory or documentation reasons can be held quite safely.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `page_id` | STRING | Page ID | PK. The identifier of this page. |\n| `website_id` | STRING | Website ID | The site this page belongs to, which is what separates the pages of the site being optimised from anyone else's. FK to [Website](./website.md) |\n| `url` | STRING | Page URL | Where the page is published. |\n| `page_type` | STRING | Page Type | What kind of page it is: `home`, `service`, `contact`, `case_study` or `blog`. |\n| `is_indexable` | BOOLEAN | Is Indexable | Whether the page is telling search engines it wants to be indexed. |\n| `is_indexed` | BOOLEAN | Is Indexed | Whether the page is actually in the index. It can differ from what the page asks for. |\n| `is_in_sitemap` | BOOLEAN | Is In Sitemap | Whether the site's page list names this page. The list itself is optional — a site with none is still crawled. |\n| `last_crawled_at` | TIMESTAMP | Last Crawled At | When a search robot last fetched this page. |\n| `avg_time_on_page` | FLOAT | Average Time on Page | How long visitors stay on this page — a user signal Google reads per page as well as averaged over the site. |\n| `avg_depth_of_scroll` | FLOAT | Average Depth of Scroll | How far down this page visitors get before they stop. |\n| `bounce_rate` | FLOAT | Bounce Rate | The share of visitors who arrive on this page and leave straight away. |\n| `has_organic_traffic` | BOOLEAN | Has Organic Traffic | Whether the page earns any traffic from search at all. Pages that earn none are the ones a removal experiment is aimed at, and the ones that move the site's averages down. |\n\n# Example Questions\n\n- Which of our pages earn nothing from search, and what are they doing to the site's average time on page and depth of scroll?\n- Where are we telling search engines a page should be indexed while it is not indexed — and are those the pages missing from the site's page list?\n- Which pages were last crawled before the `content` on them went live, and how do their behaviour numbers compare with the pages that have been refetched since?\n\n## Joins\n\n- [Website](./website.md) — `website_id = website_id` [N:1] — The site this page belongs to, which is what separates the pages of the site being optimised from anyone else's.\n  - [Website robots.txt](./robots-txt.md) — The crawling rules of the site this page sits on.\n  - [Website sitemap.xml](./sitemap-xml.md) — The page list of the site this page sits on — whether this page itself is listed is `is_in_sitemap` here.\n", "seo/robots-txt": "---\ntitle: \"robots.txt\"\ndescription: |\n  The file a site publishes to tell arriving search robots where they may go and where\n  they may not, and which of them the owner wants indexed at all. It is its own object\n  rather than a field on the site because it decides what everything downstream is even\n  allowed to see.\n\n  A site that publishes no sitemap is still crawled, as long as its robots.txt is in\n  order. A path closed here is a path the crawler does not fetch, whatever the page\n  behind it says about wanting to be indexed — which is why the rules and the pages are\n  worth reading together rather than separately. The count of closed paths says nothing\n  on its own about whether the closures are right: a site that deliberately keeps part\n  of itself out of the index has a high count and a sound setup, and a site that has\n  closed a content directory by mistake looks identical from here.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `robots_txt_id` | STRING | Robots File ID | PK. The identifier of this crawl-rules file. |\n| `url` | STRING | File URL | Where the file is published, at the root of the site it governs. |\n| `is_valid` | BOOLEAN | Is Valid | Whether the file parses as valid crawl rules. When it does not, an arriving crawler is left without the instructions it came for. |\n| `disallowed_path_count` | INTEGER | Disallowed Paths | How many paths the file closes to crawlers. Read against what the pages behind them are meant to do, not on its own. |\n| `last_modified_at` | TIMESTAMP | Last Modified At | When the rules last changed, so a shift in crawl behaviour can be lined up against a change in what the crawler was told. |\n\n# Example Questions\n\n- For each of our sites, is the file valid, and how much of the site is it holding back from crawlers?\n- Which sites changed their crawl rules recently, and did the `pages` behind those rules stop being fetched afterwards?\n- Where are we disallowing paths that hold `pages` we are still expecting to see in search results?\n", "seo/search-performance": "---\ntitle: \"Search Performance\"\ndescription: |\n  Where one page stood for one query on one day, and what that standing earned. A page\n  can hold quite different positions for two queries on the same day, so the key is all\n  three.\n\n  The distinction this model turns on lives here: a position is not traffic. Coming from\n  nowhere into the top 20 is a very noticeable result, and there is no traffic yet.\n  Getting from the top 20 into the top five is another three or four months of work: 90%\n  of traffic is concentrated in Google's first five lines, because people do not scroll\n  down when the first five answer them. Searches made by AI land here beside the ones\n  people typed, and a position averaged over both puts the two kinds into one figure.\n\n  Because every row is dated, the two clocks of SEO can be told apart here. Work done\n  fundamentally — strong content, good links, and no competitor whose own work starts\n  pushing a site off the top places — can stay stable for as much as five years. A hack\n  can be closed off by an algorithm update, after which it stops giving what it was\n  giving.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `date` | DATE | Date | PK. The day these figures were measured for, which is what makes a position readable as movement rather than as a single snapshot. |\n| `search_query_id` | STRING | Search Query ID | PK. The query this row's impressions and position were measured for. FK to [Search Query](./search-query.md) |\n| `page_id` | STRING | Page ID | PK. The page that appeared in the results for that query. FK to [Page](./page.md) |\n| `impressions` | INTEGER | Impressions | How many times the page was shown in the results for this query on this day. |\n| `clicks` | INTEGER | Clicks | How many times someone went from the results to the page. |\n| `ctr` | FLOAT | Click-Through Rate | The share of impressions that became clicks. |\n| `avg_position` | FLOAT | Average Position | Where the page stood in the results that day, averaged over its impressions. It is not traffic: a page in the top 20 has a real result and no visits yet, while 90% of traffic sits in the first five lines. |\n\n# Example Questions\n\n- Which `queries` did we move from nowhere into the top 20, and which of those have gone on into the first five lines?\n- Where are we collecting impressions in quantity and almost no clicks — which `pages` are sitting below the first five for `queries` that get plenty of impressions?\n- Which of our positions have held for years, and which fell away across many `queries` at once around a single date?\n\n## Joins\n\n- [Search Query](./search-query.md) — `search_query_id = search_query_id` [N:1] — The query this row's impressions and position were measured for.\n  - [Search Query Keyword](./keyword.md) — The term the practice targets behind this measured query.\n    - [Search Query Keyword Context](./context.md) — The topic this measured query belongs to.\n- [Page](./page.md) — `page_id = page_id` [N:1] — The page that appeared in the results for it.\n  - [Page Website](./website.md) — The site whose page held this position.\n    - [Page Website robots.txt](./robots-txt.md) — The crawling rules of the site whose page held this position.\n    - [Page Website sitemap.xml](./sitemap-xml.md) — The page list of the site whose page held this position.\n", "seo/search-query": "---\ntitle: \"Search Query\"\ndescription: |\n  What somebody actually put into a search box. It is the finest of the three levels\n  this model keeps for demand: a query is the string that was typed, a\n  [keyword](./keyword.md) is — by this model's own convention — the term the practice\n  targets, and a [context](./context.md) is the topic both of them sit in.\n\n  The level is where ranking is settled: a position is a position *for a query*. In the\n  practitioner's own picture of it, for a given query a site was not taking part in the\n  lottery at all, and now it is in it and holding a place.\n\n  The boundary between a query and a keyword has blurred a little. A search made by AI\n  is, as a rule, not a keyword but a pile of key words — a very long string a normal\n  person would never write — and those searches land in this mart next to the short ones\n  a person typed.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `search_query_id` | STRING | Search Query ID | PK. The identifier of this query string. |\n| `keyword_id` | STRING | Keyword ID | The term the practice targets that this typed query was matched to. FK to [Keyword](./keyword.md) |\n| `query_text` | STRING | Search Query | The string that was actually searched for. |\n| `is_ai_generated_query` | BOOLEAN | Is AI-Generated Query | Whether the query looks like a search made by AI rather than typed by a person: as a rule not a keyword but a pile of key words, a very long string a normal person would never write. |\n\n# Example Questions\n\n- Which of the strings people search for in a topic came from an AI assistant rather than from a person, and where do our `pages` sit for each kind?\n- Which queries are we picking up that none of the terms on our own list was aimed at?\n- Which long, sentence-shaped queries do our `pages` appear for, and are those the pages we meant to answer them?\n\n## Joins\n\n- [Keyword](./keyword.md) — `keyword_id = keyword_id` [N:1] — The term the practice targets that this typed query was matched to.\n  - [Keyword Context](./context.md) — The topic this query sits in, reached through the term it was matched to; a query matched to none reaches nothing here.\n", "seo/sitemap-xml": "---\ntitle: \"sitemap.xml\"\ndescription: |\n  The structured list of its own pages a site hands to search engines for indexing. It\n  is the site saying, in one place, what it consists of — which is help a crawler can\n  use, but not help it depends on: removing the sitemap does not worsen a site's results\n  in search, as long as everything else is in order.\n\n  A site may publish none at all, and the absence is a legitimate state rather than a\n  gap in the data, which is why the list is held separately rather than folded into the\n  site record. Where a sitemap does exist, the number it carries is a claim about what\n  the site contains, and a claim that has drifted away from the pages actually published\n  is worth knowing about. Publishing [content](./content.md) and telling search engines\n  about it are two separate acts, and the gap between them is visible here.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `sitemap_id` | STRING | Sitemap ID | PK. The identifier of this page list. |\n| `url` | STRING | Sitemap URL | Where the list is published for search engines to fetch. |\n| `listed_page_count` | INTEGER | Listed Pages | How many pages the list offers for indexing — the site's own claim about what it consists of, to be read against the pages it actually publishes. |\n| `last_submitted_at` | TIMESTAMP | Last Submitted At | When the list was last handed to search engines, which is a separate act from publishing the pages in it. |\n\n# Example Questions\n\n- How many `pages` does each site offer for indexing, and how does that compare with the pages it actually publishes?\n- Which sites have not resubmitted their list since the last round of `content` went live?\n- Are the `pages` left out of the list the same pages that are going uncrawled, or is the list beside the point on this site?\n", "seo/third-party-websites": "---\ntitle: \"Third Party Websites\"\ndescription: |\n  The sites a practice does not own: the hosts that link to it, mention it, or could.\n  Off-site work is the third pillar of search — what the rest of the web says about a\n  business.\n\n  It deliberately carries no single standing for the site: standing combines the organic\n  traffic a host already has with the links pointing at it within a topic, so it is\n  measured per site *and* per topic and kept on [its own object](./authority.md). What\n  lives here is what is true of the host whatever the topic — its traffic, and whether\n  it is one of the broadly authoritative sites, Forbes and Wikipedia, where being\n  mentioned in any context counts heavily in a site's favour.\n\n  Two things have made this work much more complicated than it used to be. Buying links\n  by the hundred used to be the whole game, and that is no longer how it works;\n  reputation and topical relevance are what count now. And AI does not crawl sites, at\n  least not yet: what it responds to is a brand being mentioned in a context, and,\n  judging by indirect signals, the reputation of the source matters a great deal.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `third_party_website_id` | STRING | Third Party Website ID | PK. The identifier of this external host. |\n| `domain` | STRING | Domain | The host itself, as it appears on the placements that sit on it. |\n| `organic_traffic` | INTEGER | Organic Traffic | The search traffic the host already receives — one of the two ingredients behind its standing, the other being the links it holds within a topic. |\n| `is_general_authority` | BOOLEAN | Is General Authority | Whether this is one of the broadly authoritative hosts that count in any context, rather than in one topic. |\n\n# Example Questions\n\n- Which hosts is our off-site work concentrated on, and how much of it sits on a handful of them?\n- When we place in a topic, are we buying from hosts that carry standing in that topic, or only from hosts that are large?\n- How much of what the web says about us sits on generally authoritative sites, and how much on topic-specific ones?\n", "seo/visit": "---\ntitle: \"Visit\"\ndescription: |\n  Somebody — or something — arriving on one of a site's pages. This is the event the\n  whole model points at: most practitioners do treat the visit as their target event,\n  and it is where this model stops. What happens past the arrival belongs to a different\n  model.\n\n  There is no key from a visit to the query that produced it, and that is deliberate\n  rather than missing. What an arrival brings with it is how it arrived — the channel\n  and the source — and not the words somebody typed to get there. Demand and behaviour\n  therefore meet in the daily aggregate in [Search\n  Performance](./search-performance.md), which is keyed by query and page, and nowhere\n  else.\n\n  A visit is also the raw material of the user signals that decide whether a position\n  survives: of the sites somebody opens for one query, the one they spent three minutes\n  on and the one they left at once are read differently, and the one they left at once\n  is thrown out of the top five so the next site can have its chance.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `visit_id` | STRING | Visit ID | PK. The identifier of this arrival. |\n| `page_id` | STRING | Page ID | The page that was landed on. FK to [Page](./page.md) |\n| `channel_id` | STRING | Channel ID | How the visitor arrived, as an analytics tool classifies it. FK to [Channel](./channel.md) |\n| `occurred_at` | TIMESTAMP | Occurred At | When the arrival happened. |\n| `user_agent` | STRING | User Agent | How the visitor introduced itself. Anyone requesting a page on the internet is obliged to state a user agent. |\n| `is_bot` | BOOLEAN | Is Bot | Whether this was a robot rather than a person, read off the user agent — usually more than enough to tell the two apart. |\n| `pages_viewed` | INTEGER | Pages Viewed | How many pages the visitor opened on the site during this arrival. |\n| `duration_seconds` | INTEGER | Duration in Seconds | How long the arrival lasted. |\n| `bounced` | BOOLEAN | Bounced | Whether the visitor left straight away instead of going any further into the site. |\n| `is_qualified` | BOOLEAN | Is Qualified | Whether this arrival met the practice's own definition of a visit worth having. It is the last thing the model says about a visit. |\n\n# Example Questions\n\n- How much of what we are counting as traffic to a `page` is robots, and which pages look different once they are taken out?\n- Which of our `pages` are arrived at and left immediately, and how do their positions compare with the pages people stay and click through?\n- Does traffic arriving from search behave differently on the same `pages` from traffic arriving through the sites that link to us?\n\n## Joins\n\n- [Page](./page.md) — `page_id = page_id` [N:1] — The page the visit landed on.\n  - [Page Website](./website.md) — The site this visit landed on.\n    - [Page Website robots.txt](./robots-txt.md) — The crawling rules of the site this visit landed on.\n    - [Page Website sitemap.xml](./sitemap-xml.md) — The page list of the site this visit landed on.\n- [Channel](./channel.md) — `channel_id = channel_id` [N:1] — How the visitor arrived.\n", "seo/website": "---\ntitle: \"Website\"\ndescription: |\n  The site being optimised — the object the whole technical side of search work is done\n  to, and the boundary between what is within a practice's control and what is not.\n  Content is placed on it, and its crawl rules and page list belong to it; the part of\n  SEO that concerns a site's own condition ends where this record ends.\n\n  Google sees how people behaved after arriving, and it looks at those user signals both\n  per page and for the site overall, as an average — so speed, layout and the behaviour\n  numbers are properties of the site rather than of any one page. A site need not be\n  superfast, but it does have to be reasonably fast, and 80% of its traffic may be\n  coming from phones while its layout breaks on them. The two connect: a visitor who\n  opens the site on a phone and leaves at once, because the content they came for could\n  not be read, earns the site a minus for user signals, and the site slides down in\n  search.\ntags: [\"owox\", \"view\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `website_id` | STRING | Website ID | PK. The identifier of this site. |\n| `domain` | STRING | Domain | The domain the site is published under — the name everything else in the model is claimed and measured against. |\n| `robots_txt_id` | STRING | Robots File ID | The crawl-rules file published at the root of this site, which tells an arriving robot where it may go. FK to [robots.txt](./robots-txt.md) |\n| `sitemap_id` | STRING | Sitemap ID | The list of its own pages this site offers for indexing. Empty when the site publishes none, which does not stop the site being crawled, as long as its robots.txt is in order. FK to [sitemap.xml](./sitemap-xml.md) |\n| `page_speed_score` | FLOAT | Page Speed Score | How quickly the site loads. The bar is not superfast — it is reasonably fast. |\n| `mobile_optimization_score` | FLOAT | Mobile Optimization Score | How well the layout holds up across device types, read against how much of the site's traffic arrives from phones. |\n| `avg_time_on_page` | FLOAT | Average Time on Page | Time on page averaged across the site — one of the user signals Google reads for the site as a whole and not only per page. |\n| `avg_depth_of_scroll` | FLOAT | Average Depth of Scroll | How far down a page visitors get, averaged across the site. |\n| `bounce_rate` | FLOAT | Bounce Rate | The share of arrivals that leave straight away, whatever sent them away — being unable to read the content on a phone is one such reason. |\n| `development_cost` | NUMERIC | Development Cost | What has been spent on developer work to put the site in technical order and keep it there. |\n\n# Example Questions\n\n- Which of our sites are slow or badly laid out on phones, and are their behaviour numbers worse than the sites that are not?\n- How does a site's average time on page and depth of scroll compare with the individual `pages` it publishes — is one part of the site holding the average down?\n- What have we spent on developer work per site, and which of those sites still have crawl rules that do not parse or no page list at all?\n\n## Joins\n\n- [robots.txt](./robots-txt.md) — `robots_txt_id = robots_txt_id` [N:1] — The file that tells crawlers where on this site they may go.\n- [sitemap.xml](./sitemap-xml.md) — `sitemap_id = sitemap_id` [N:1] — The optional index of the site's pages; empty when the site publishes none.\n", "trading/ad-spend": "---\ntitle: \"Ad Spend\"\ndescription: |\n  Every dollar the brokerage puts into buying traffic, one row per day, source, medium,\n  campaign and targeting country — the exact grain the media buyers work at. Each row carries\n  the money twice, once as `cost` and once as `cost_normalized` — both already in this\n  reporting's single currency, so either sums safely — next to the impressions and clicks it\n  bought, so cost per click, cost per thousand impressions and click-through rate all come out\n  of a single table. Targeting country is where the budget was spent, not where the trader who\n  answered the ad turns out to live — the two diverge often enough that keeping them apart is\n  the whole point of the field.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T07:25:24.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `date` | DATE | Date | PK. Composite key together with source, medium, campaign, targeting_country. Calendar date the spend occurred — use for daily/weekly/monthly spend trends. FK to [Attribution](./attribution.md) |\n| `source` | STRING | Source | PK. Ad traffic source — which channel ran the ad, e.g. `google`, `facebook`, `tiktok`, `bing`, `native`, `applesearch`. Answers \"which channel/platform did we spend on\". FK to [Attribution](./attribution.md) |\n| `medium` | STRING | Medium | PK. Ad format / traffic medium, e.g. `cpc`, `cpm`, `paid-social`. Answers \"what type of ad\" (search vs social vs display). FK to [Attribution](./attribution.md) |\n| `campaign` | STRING | Campaign | PK. UTM campaign name, e.g. `search_generic_fx`, `acq_video_q3`. Use for campaign-level spend breakdowns. FK to [Attribution](./attribution.md) |\n| `targeting_country` | STRING | Targeting Country | PK. Country the ad budget was targeted at — i.e. where the money was spent. This is NOT where the resulting client lives; for that use Clients.country or Attribution.client_country. Use this field to answer \"spend by country\". FK to [Attribution](./attribution.md) |\n| `targeting_region` | STRING | Targeting Region | Business-region roll-up of targeting_country: `SEA`, `ME`, `EU`, `LATAM`, `AFRICA`, `CA`, `UK`, `AU`, `ANZ`, `Other`. Use for \"spend by region\" instead of listing every country. |\n| `ad_platform` | STRING | Ad Platform | Name of the advertising platform that billed this spend: `Google Ads`, `Meta Ads`, `TikTok Ads`, `Bing Ads`, `YouTube Ads`, `Apple Search Ads`, `Native Ads Network`. Answers \"which ad platform/network\". |\n| `cost` | FLOAT | Cost | Ad spend in this dataset's single reporting currency — identical to `cost_normalized` here, so summing it directly is safe. Kept as a separate field for consistency with source systems where ad platforms genuinely bill in local currency and a normalized column is needed. |\n| `cost_normalized` | FLOAT | Cost Normalized | Ad spend converted to USD. This is the field to SUM for \"total spend\", \"ad cost\", \"budget spent\", \"how much did we spend\" questions — safe to aggregate across countries and campaigns. |\n| `impressions` | INTEGER | Impressions | Number of times the ad was displayed. SUM for total impressions; divide clicks by impressions for CTR. |\n| `clicks` | INTEGER | Clicks | Number of ad clicks. SUM for total clicks; divide cost_normalized by clicks for CPC, or clicks by impressions for CTR. |\n\n# Example Questions\n\n- Which ad platforms deliver the cheapest clicks in the regions we push hardest, and is that cost per click drifting up week over week as we scale the budget?\n- How concentrated is our media buy — what share of total spend sits in a handful of campaigns, and does their click-through rate justify the concentration?\n- Are we overpaying for reach in particular countries — how does cost per thousand impressions compare across targeting countries running the same ad format?\n\n## Joins\n\n- [Attribution](./attribution.md) — `date = date`, `source = source`, `medium = medium`, `campaign = campaign`, `targeting_country = targeting_country` [1:N] — The acquisition funnel this day of spend paid for.\n", "trading/attribution": "---\ntitle: \"Attribution\"\ndescription: |\n  The whole acquisition funnel already assembled on one row: for each day, source, medium,\n  campaign and targeting country, the money spent and the impressions and clicks it bought,\n  then the sessions that arrived, the short forms submitted, the long forms completed, the\n  clients who cleared KYC, the first time deposits and finally the new trading clients who\n  placed a real trade — with the deposit volume those clients went on to generate. Cost per\n  lead, cost per FTD and return on ad spend are ratios between two columns of the same row,\n  and because every step is carried side by side, the stage where a channel actually loses\n  people is visible without joining anything.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T07:25:28.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `date` | DATE | Date | Calendar date of the funnel activity. Part of the join grain shared with Ad Spend (plus targeting_country). |\n| `source` | STRING | Source | Traffic source. Part of the join grain. |\n| `medium` | STRING | Medium | Traffic medium. Part of the join grain. |\n| `campaign` | STRING | Campaign | UTM campaign name. Part of the join grain. |\n| `targeting_country` | STRING | Targeting Country | Country the ad budget was targeted at (for organic/direct rows, the country traffic actually came from). Part of the join grain; joins to Ad Spend.targeting_country. |\n| `cost_normalized` | FLOAT | Cost Normalized | Ad spend in USD for this row. `0` for organic/direct/affiliate rows (they have no matching Ad Spend row). SUM this for total spend by any slice; divide by short_forms/ftd_count/ntc_count for CPA-style metrics. |\n| `cost` | FLOAT | Cost | Ad spend in the original billing currency. `0` for organic/direct/affiliate rows. Prefer `cost_normalized` for any cross-currency total. |\n| `impressions` | INTEGER | Impressions | Ad impressions for this row. `0` for unpaid rows. |\n| `clicks` | INTEGER | Clicks | Ad clicks for this row. `0` for unpaid rows. |\n| `ad_platform` | STRING | Ad Platform | Ad platform, e.g. `Google Ads`, `Meta Ads`, `TikTok Ads`. `\"Organic/Direct\"` for unpaid rows. |\n| `sessions` | INTEGER | Sessions | Web/app sessions attributed to this row — funnel step 1. SUM for total traffic; divide short_forms by sessions for the session→lead conversion rate. |\n| `unique_users` | INTEGER | Unique Users | Unique users attributed to this row. |\n| `pages_per_session` | FLOAT | Pages Per Session | Average pages viewed per session for this row — an engagement/traffic-quality signal, not a funnel step. |\n| `avg_session_duration` | FLOAT | Average Session Duration | Average session duration in seconds for this row — engagement signal. |\n| `short_forms` | INTEGER | Short Forms | Short-form submissions (leads) attributed to this row — funnel step 2, \"Profile Short Form\" in dashboards. Divide by `sessions` for session→lead conversion; divide `cost_normalized` by this for CPA per lead. |\n| `long_forms` | INTEGER | Long Forms | Long-form / full registrations attributed to this row — funnel step 3, \"Profile Long Form\" in dashboards. |\n| `registrations` | INTEGER | Registrations | Completed account registrations attributed to this row. Equal to `long_forms` in this model (registration = completing the long form). |\n| `kyc_verified` | INTEGER | KYC Verified | Clients who passed KYC verification, attributed to this row. |\n| `ftd_count` | INTEGER | Ftd Count | First Time Depositors attributed to this row — funnel step 4, \"Profile FTD\" in dashboards. Divide `cost_normalized` by this for cost-per-FTD (CPA), the primary acquisition-efficiency metric. |\n| `ntc_count` | INTEGER | Ntc Count | New Trading Clients (placed a first real trade) attributed to this row — funnel step 5, \"Profile NTC\". Always ≤ `ftd_count` for the same row (a client must fund before trading). |\n| `deposit_volume_normalized` | FLOAT | Deposit Volume Normalized | Total deposit amount in USD from clients attributed to this row (cumulative, not just their first deposit). This is the \"revenue\" field — divide by `cost_normalized` for ROAS. |\n| `client_country` | STRING | Client Country | Country of the clients who actually converted (from Clients.country). May differ from `targeting_country` — e.g. ads targeted at country A but the client registered from country B. |\n| `targeting_region` | STRING | Targeting Region | Business-region roll-up of `targeting_country`. |\n| `region` | STRING | Region | Business region — equal to `targeting_region` in this mart; use either. |\n| `traffic_platform` | STRING | Traffic Platform | `App` or `Web`. |\n| `attribution_id` | STRING | Attribution ID | PK. Unique internal identifier for this attribution row (the row's own surrogate key, not a business dimension). |\n| `user_source` | STRING | User Source | First-touch acquisition source (mirrors `source` in this already-aggregated mart; the first/last-touch distinction matters more at the Sessions grain). |\n| `user_medium` | STRING | User Medium | First-touch acquisition medium. |\n| `user_campaign` | STRING | User Campaign | First-touch acquisition campaign. |\n\n# Example Questions\n\n- What does a funded trader really cost by channel, and how much does that cost rise once we require them to actually trade rather than just `deposit`?\n- Where does the funnel leak — which campaigns turn `sessions into leads` well but then lose people between the long form and KYC verification?\n- Which regions return more `deposit volume` than they consume in budget, and where do the countries we target differ from the countries our `converting clients` live in?\n", "trading/clients": "---\ntitle: \"Clients\"\ndescription: |\n  The trader profile, and the centre of the model: one row per registered client, carrying the\n  four milestones the business is run on — registration, identity verification, first deposit\n  and first real trade — with the dates between them, so how long a client takes to fund and\n  then to trade is a stored number rather than a calculation. Each row also holds the money:\n  every deposit and withdrawal already totalled, net deposits, lifetime value, how recently\n  and how often the client funded, an RFM score on all three axes, and a lifecycle segment\n  that names what the client is today, from someone who registered and never deposited to an\n  active trader, a dormant account or a churned one. It is the mart that answers who the\n  customers are, what they are worth and which of them are slipping away.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:05:11.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `client_id` | STRING | Client ID | PK. Unique client identifier. |\n| `lead_id` | STRING | Lead ID | The first short-form submission that started this client's journey. |\n| `session_id` | STRING | Session ID | The first-touch session that originally brought this client in. NULL if none could be matched. |\n| `email` | STRING | Email | Client email — identity bridge key, matches Leads.email. |\n| `phone` | STRING | Phone | Client phone — identity bridge key. |\n| `first_name` | STRING | First Name | Client first name. |\n| `last_name` | STRING | Last Name | Client last name. |\n| `country` | STRING | Country | Client's country of residence/registration — the client's actual location, NOT the ad targeting country. Use this field (not Ad Spend.targeting_country) to answer \"which country has the most clients/FTD\" or \"FTD by country\" questions. |\n| `region` | STRING | Region | Business-region roll-up of the client's country: `SEA`, `ME`, `EU`, `LATAM`, `AFRICA`, `CA`, `UK`, `AU`, `ANZ`, `Other`. Use for region-level FTD/LTV roll-ups. |\n| `language` | STRING | Language | Client's preferred language. |\n| `registration_date` | DATE | Registration Date | Date the client completed account registration. This corresponds to the \"Long Form\" / \"Profile Long Form\" funnel step in dashboards. |\n| `kyc_status` | STRING | KYC Status | Identity-verification status: `pending`, `verified`, `rejected`, `expired`. |\n| `kyc_verified_date` | DATE | KYC Verified Date | Date KYC was approved. NULL if not yet verified. |\n| `account_type` | STRING | Account Type | Regulatory client classification: `retail` or `professional`. |\n| `is_ftd` | BOOLEAN | Is Ftd | Whether the client made at least one completed deposit (First Time Depositor). This is the \"FTD\" / \"Profile FTD\" metric — `COUNTIF(is_ftd)` gives the FTD count, the primary acquisition-efficiency metric. |\n| `ftd_date` | DATE | Ftd Date | Date of the client's first completed deposit. NULL if `is_ftd = false`. Use for FTD trend charts. |\n| `ftd_amount_normalized` | FLOAT | Ftd Amount Normalized | Amount of the first deposit, in USD. NULL if `is_ftd = false`. |\n| `ftd_payment_method` | STRING | Ftd Payment Method | Payment method used for the first deposit: `card`, `wire_transfer`, `crypto`, `skrill`, `neteller`, `paypal`. NULL if `is_ftd = false`. |\n| `days_to_ftd` | FLOAT | Days To Ftd | Days between `registration_date` and `ftd_date` — how fast a client deposits after registering. NULL if `is_ftd = false`. |\n| `is_ntc` | BOOLEAN | Is Ntc | Whether the client placed at least one real (non-demo) trade — New Trading Client. Always implies `is_ftd = true` (a client must fund before trading). This is the \"NTC\" / \"Profile NTC\" metric — `COUNTIF(is_ntc)` gives the NTC count. |\n| `ntc_date` | DATE | Ntc Date | Date of the client's first real trade. NULL if `is_ntc = false`. |\n| `days_to_ntc` | FLOAT | Days To Ntc | Days between `ftd_date` and `ntc_date` — how fast a depositor starts trading. NULL if `is_ntc = false`. |\n| `has_open_positions` | BOOLEAN | Has Open Positions | Whether the client currently has open trading positions — a live-engagement signal. |\n| `created_at` | TIMESTAMP | Created At | Record creation timestamp in the warehouse. |\n| `count_clients` | INTEGER | Count Clients | Always `1` on every row; SUM to count clients matching a filter. |\n| `total_deposits_normalized` | FLOAT | Total Deposits Normalized | Sum of all this client's completed deposits, in USD. SUM across clients to answer \"total deposit volume\" / \"revenue\" questions. |\n| `total_withdrawals_normalized` | FLOAT | Total Withdrawals Normalized | Sum of all this client's completed withdrawals, in USD. |\n| `net_deposits` | FLOAT | Net Deposits | `total_deposits_normalized` minus `total_withdrawals_normalized` — net money the client has put in. |\n| `deposit_count` | INTEGER | Deposit Count | Number of completed deposit transactions made by this client — the RFM \"frequency\" input. |\n| `last_deposit_date` | DATE | Last Deposit Date | Date of the client's most recent completed deposit. |\n| `days_since_last_deposit` | FLOAT | Days Since Last Deposit | Days elapsed since `last_deposit_date` — the RFM \"recency\" input; also drives `client_segment` (e.g. `dormant`, `churned`). |\n| `days_since_ftd` | FLOAT | Days Since Ftd | Days elapsed since the client's first deposit — client \"age\" in the system. |\n| `ltv` | FLOAT | LTV | Lifetime value in USD — equal to `total_deposits_normalized`. Use for \"what is the LTV of clients acquired via X\" questions. |\n| `recency_score` | FLOAT | Recency Score | RFM recency score, 1-5 (5 = deposited most recently). Derived from `days_since_last_deposit`. |\n| `frequency_score` | FLOAT | Frequency Score | RFM frequency score, 1-5 (5 = most deposits). Derived from `deposit_count`. |\n| `monetary_score` | FLOAT | Monetary Score | RFM monetary score, 1-5 (5 = highest `net_deposits`). |\n| `client_segment` | STRING | Client Segment | Behavioural lifecycle segment, already computed: `active_trader`, `dormant`, `ftd_only`, `churned`, `registered_no_ftd`, `new`. Use this directly for \"give me churned/dormant clients\" questions instead of recomputing from date fields. |\n| `rfm_label` | STRING | Rfm Label | RFM marketing segment, already computed: `champions`, `loyal`, `at_risk`, `lost`, `new`, `promising`. `lost` specifically means the client's most recent contact (see Communications) was an unanswered/unsuccessful call. |\n| `data_source` | STRING | Data Source | `App` or `Web` — the surface this client was first acquired on. |\n\n# Example Questions\n\n- How long does a newly registered client take to make a `first deposit` and then to place a first trade, and how does that lag differ by region and by whether they came in through the app or the web?\n- Where is identity verification costing us money — how many clients sit unverified or rejected without ever depositing, and what is the lifetime value of the ones who do get through?\n- How concentrated is our `deposit base` — what share of
