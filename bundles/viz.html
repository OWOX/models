<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OKF Bundle Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px; color: #0f172a; background: #f8fafc;
  display: flex; flex-direction: column; height: 100vh;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: #fff;
  border-bottom: 1px solid #e2e8f0; flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
#bundle-select {
  font-size: 16px; font-weight: 700; color: #0f172a;
  border: 1px solid #cbd5e1; border-radius: 4px;
  background: #fff; padding: 4px 8px; margin-right: 8px;
}
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px; padding: 5px 8px;
  border: 1px solid #cbd5e1; border-radius: 4px; background: #fff;
}
.controls input { width: 200px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }
main { display: flex; flex: 1; min-height: 0; }
#graph {
  flex: 1 1 60%; background: #fff;
  border-right: 1px solid #e2e8f0; min-width: 0;
}
#detail { flex: 0 0 40%; overflow-y: auto; padding: 18px 22px; background: #fff; }
#detail-empty { text-align: center; margin-top: 40px; color: #64748b; }
.detail-header { margin-bottom: 12px; }
.detail-header h1 { font-size: 18px; margin: 4px 0 2px; font-weight: 600; }
.type-chip {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600; color: #fff; background: #94a3b8;
  text-transform: uppercase; letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid; grid-template-columns: 90px 1fr;
  row-gap: 4px; column-gap: 12px; margin: 8px 0 12px; font-size: 13px;
}
dl.frontmatter dt { color: #64748b; font-weight: 500; }
dl.frontmatter dd { margin: 0; word-break: break-all; }
.tag {
  display: inline-block; background: #f1f5f9; border: 1px solid #e2e8f0;
  border-radius: 4px; padding: 1px 6px; font-size: 11px; margin: 1px 2px 1px 0;
}
a.external { color: #3b82f6; word-break: break-all; }
.markdown-body { font-size: 13px; line-height: 1.6; }
.markdown-body h1 { font-size: 16px; margin: 16px 0 8px; }
.markdown-body h2 { font-size: 14px; margin: 14px 0 6px; }
.markdown-body h3 { font-size: 13px; margin: 12px 0 4px; }
.markdown-body code { background: #f1f5f9; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
.markdown-body pre { background: #f1f5f9; padding: 10px; border-radius: 4px; overflow-x: auto; }
.markdown-body pre code { background: none; padding: 0; }
.markdown-body table { border-collapse: collapse; width: 100%; font-size: 12px; }
.markdown-body th, .markdown-body td { border: 1px solid #e2e8f0; padding: 4px 8px; text-align: left; }
.markdown-body th { background: #f8fafc; }
.markdown-body blockquote { border-left: 3px solid #cbd5e1; margin: 0; padding: 4px 12px; color: #64748b; }
#detail-backlinks { margin-top: 16px; border-top: 1px solid #e2e8f0; padding-top: 12px; }
#detail-backlinks h3 { font-size: 13px; margin: 0 0 6px; }
#backlinks-list { margin: 0; padding-left: 16px; }
#backlinks-list li { margin: 3px 0; }
#backlinks-list a { color: #3b82f6; cursor: pointer; text-decoration: none; }
#backlinks-list a:hover { text-decoration: underline; }
.dim { opacity: 0.15; }
</style>
</head>
<body>
<header>
  <div class="title">
    <select id="bundle-select"></select>
    <span class="muted">OKF Bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search…">
    <select id="filter-type"><option value="">All types</option></select>
    <select id="layout">
      <option value="cose">Force</option>
      <option value="concentric">Concentric</option>
      <option value="breadthfirst">Tree</option>
      <option value="circle">Circle</option>
      <option value="grid">Grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>
<main>
  <div id="graph"></div>
  <div id="detail">
    <div id="detail-empty"><p>Click a node to explore.</p></div>
    <div id="detail-content" hidden>
      <div class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <div id="detail-body" class="markdown-body"></div>
      <div id="detail-backlinks" hidden>
        <h3>Referenced by</h3>
        <ul id="backlinks-list"></ul>
      </div>
    </div>
  </div>
</main>

txt", "label": "robots.txt", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox", "view"], "bundle": "seo", "color": "#94a3b8", "size": 32}}, {"data": {"id": "seo/search-performance", "label": "Search Performance", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox", "view"], "bundle": "seo", "color": "#94a3b8", "size": 32}}, {"data": {"id": "seo/search-query", "label": "Search Query", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox", "view"], "bundle": "seo", "color": "#94a3b8", "size": 32}}, {"data": {"id": "seo/sitemap-xml", "label": "sitemap.xml", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox", "view"], "bundle": "seo", "color": "#94a3b8", "size": 32}}, {"data": {"id": "seo/third-party-websites", "label": "Third Party Websites", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox", "view"], "bundle": "seo", "color": "#94a3b8", "size": 32}}, {"data": {"id": "seo/visit", "label": "Visit", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox", "view"], "bundle": "seo", "color": "#94a3b8", "size": 32}}, {"data": {"id": "seo/website", "label": "Website", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox", "view"], "bundle": "seo", "color": "#94a3b8", "size": 32}}, {"data": {"id": "trading/ad-spend", "label": "Ad Spend", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox"], "bundle": "trading", "color": "#94a3b8", "size": 32}}, {"data": {"id": "trading/attribution", "label": "Attribution", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox"], "bundle": "trading", "color": "#94a3b8", "size": 32}}, {"data": {"id": "trading/clients", "label": "Clients", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox"], "bundle": "trading", "color": "#94a3b8", "size": 32}}, {"data": {"id": "trading/communications", "label": "Communications", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox"], "bundle": "trading", "color": "#94a3b8", "size": 32}}, {"data": {"id": "trading/deposits", "label": "Deposits", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox"], "bundle": "trading", "color": "#94a3b8", "size": 32}}, {"data": {"id": "trading/leads", "label": "Leads", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox"], "bundle": "trading", "color": "#94a3b8", "size": 32}}, {"data": {"id": "trading/sessions", "label": "Sessions", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox"], "bundle": "trading", "color": "#94a3b8", "size": 32}}, {"data": {"id": "trading/trading-accounts", "label": "Trading Accounts", "type": "Data Mart", "description": "", "resource": "", "tags": ["owox"], "bundle": "trading", "color": "#94a3b8", "size": 32}}], "edges": [], "bodies": {"e-commerce/countries": "---\ntitle: \"Countries\"\ndescription: |\n  The countries the storefront sells into, and the relative weight each one carries in the\n  business. Every visitor, session and customer is tied to a country here, which makes this\n  the single place geography is defined for the whole model — so revenue, conversion and\n  acquisition cost can all be cut the same way across markets.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-20T12:57:39.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `country_id` | INTEGER | Country ID | PK. Unique internal identifier for each country record. |\n| `country` | STRING | Country Name | Full name of the country. |\n| `country_code` | STRING | Country Code | Two-letter ISO country code representing the nation. |\n| `weight` | INTEGER | Priority Weight | Numerical value used to prioritize or rank countries in the e-commerce system. |\n\n# Example Questions\n\n- Which countries contribute the most revenue, and how does that compare with their share of `sessions`?\n- Where does conversion hold up across markets, and which countries under-deliver against the traffic they receive?\n- Which countries are worth expanding into, judged on `order` value rather than traffic volume?\n", "e-commerce/customers": "---\ntitle: \"Customers\"\ndescription: |\n  Everyone who has registered an account on the storefront, with the channel that first\n  brought them in, the market they belong to, and the segment their buying behaviour puts them\n  in. This is where acquisition meets retention: the same row explains how a customer was won\n  and how valuable they turned out to be.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-11T13:25:25.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `customer_id` | INTEGER | Customer ID | PK. Unique identifier for an individual registered customer |\n| `customer_segment` | STRING | Customer Segment | The classification of the customer based on their purchase history or value |\n| `registration_date` | DATE | Registration Date | The specific date when the customer account was created in the system |\n| `acquisition_traffic_source_id` | INTEGER |  | FK to [Traffic Sources](./traffic-sources.md) |\n| `country_id` | INTEGER | Country ID | The primary geographical location assigned to the customer FK to [Countries](./countries.md) |\n\n# Example Questions\n\n- Which acquisition channels bring in the customers who go on to `order` repeatedly, rather than just once?\n- How is the customer base split across segments and `countries`, and how has that mix shifted as new customers register?\n- What does an acquired customer cost by channel, and how does that compare with the revenue they generate?\n\n## Joins\n\n- [Countries](./countries.md) — `country_id = country_id` [N:1] — The customer's home market.\n- [Acquisition Traffic Source](./traffic-sources.md) — `acquisition_traffic_source_id = traffic_source_id` [N:1] — The channel that acquired this customer.\n", "e-commerce/orders": "---\ntitle: \"Orders\"\ndescription: |\n  One row per order placed on the storefront — the header of the transaction, tying the\n  browsing session it came from to the customer who placed it, the date, and the fulfilment\n  state. Because a cancelled or returned order still occupies a row, gross order counts and\n  settled revenue can be told apart instead of quietly merged.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-05T06:01:07.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `session_id` | STRING | Session ID | Unique identifier of the session where the order was placed FK to [Sessions](./sessions.md) |\n| `customer_id` | INTEGER | Customer ID | Unique identifier of the customer who placed the order FK to [Customers](./customers.md) |\n| `order_date` | DATE | Order Date | The date when the transaction was completed |\n| `order_id` | STRING | Order ID | PK. Unique identifier of the purchase transaction FK to [Purchases](./purchases.md) |\n| `status` | STRING | Status | Current fulfillment state of the order (e.g., Completed) |\n| `orders_total` | INTEGER | Orders | Distinct orders in the selected rows, every status. |\n| `completed_orders` | INTEGER | Completed Orders | Orders that completed — a conditional count with no helper column. |\n| `completion_rate` | FLOAT | Completion Rate | Share of orders that completed rather than being cancelled or returned. |\n| `distinct_products_in_order` | INTEGER | Distinct Products in Order | Distinct products across the selected orders' lines, counted through Purchases into Products. |\n\n# Example Questions\n\n- How many orders reach completion versus cancellation or return, and is that share drifting over time?\n- What is average order value by `country`, device or acquisition channel?\n- How long after a `session`'s first `pageview` does an order actually land?\n\n## Joins\n\n- [Customers](./customers.md) — `customer_id = customer_id` [N:1] — The customer who placed this order.\n  - [Customer Country](./countries.md) — The customer's home market.\n  - [Customer Acquisition Source](./traffic-sources.md) — The channel that originally acquired the customer, not the one that drove this order.\n- [Purchases](./purchases.md) — `order_id = order_id` [1:N] — The lines this order is made of.\n  - [Ordered Product](./products.md) — The products on this order's lines.\n    - [Product Page](./pages.md) — The storefront page of each ordered product.\n      - [Product Pageviews](./pageviews.md) — Views of those product pages.\n    - [Product Category](./product-category.md) — The category of each ordered product.\n- [Sessions](./sessions.md) — `session_id = session_id` [N:1] — The session this order was placed in.\n  - [Session Country](./countries.md) — The market this order was placed from.\n  - [Session Pageviews](./pageviews.md) — The clickstream of the ordering session.\n    - [Viewed Pages](./pages.md) — The pages seen in the ordering session.\n  - [Session Traffic Source](./traffic-sources.md) — The channel that drove the ordering session.\n  - [Session Ad Spend](./unified-ad-spend.md) — Spend on that day and channel — a cohort match, not this order's cost.\n    - [Ad Spend Traffic Source](./traffic-sources.md) — The channel behind that spend.\n  - [Session Visitor](./visitors.md) — The visitor behind the ordering session.\n", "e-commerce/pages": "---\ntitle: \"Pages\"\ndescription: |\n  The catalog of pages that make up the storefront — path, display title, and the function\n  each page serves (product, category, checkout and so on). It turns raw URL paths into\n  something a business user can read, which is what makes funnel analysis by page type\n  possible at all.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-05T19:03:12.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `page_id` | INTEGER | Page ID | PK. Unique numerical identifier for each specific page on the website. FK to [Pageviews](./pageviews.md) |\n| `page_path` | STRING | Page Path | The URL path of the page relative to the domain root. |\n| `page_title` | STRING | Page Title | The human-readable name or display title of the web page. |\n| `page_type` | STRING | Page Type | Functional category of the page, such as Product, Category, or Checkout. |\n\n# Example Questions\n\n- Which landing pages bring in the most `sessions`, and which of them actually convert?\n- Where in the checkout flow do shoppers drop off, page by page?\n- How does engagement differ between `product` pages, `category` pages and content pages?\n\n## Joins\n\n- [Pageviews](./pageviews.md) — `page_id = page_id` [1:N] — Every view of this page.\n", "e-commerce/pageviews": "---\ntitle: \"Pageviews\"\ndescription: |\n  Every page view recorded on the storefront, in sequence within its session — which page,\n  which visitor, and where in the session the view sits. This is the finest grain in the model\n  and the raw material for funnel and engagement analysis: the step-by-step path a shopper\n  takes between arriving and buying.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-13T09:04:52.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `date` | DATE | Date | The calendar date when the pageview occurred. |\n| `session_id` | STRING | Session ID | PK. Unique identifier for a specific user browsing session. |\n| `visitor_id` | STRING | Visitor ID | Unique identifier for an individual user or browser. |\n| `hit_number` | INTEGER | Hit Number | PK. The sequential order of the pageview within a specific session. |\n| `page_id` | INTEGER | Page ID | Unique identifier for the specific page viewed by the visitor. FK to [Pages](./pages.md) |\n| `hit_timestamp` | TIMESTAMP | Hit Timestamp | The exact date and time when the pageview was recorded, in UTC. |\n\n# Example Questions\n\n- How deep does a typical `session` go before an `order`, and where does the path break down?\n- Which `pages` appear most often as the last view of a `session` that never converts?\n- How does browsing depth differ between `visitors` who buy and visitors who leave?\n\n## Joins\n\n- [Pages](./pages.md) — `page_id = page_id` [N:1] — The page that was viewed.\n", "e-commerce/product-category": "---\ntitle: \"Product Category\"\ndescription: |\n  The category tree the catalog is organised by, together with the target margin each category\n  is managed against and the person accountable for it. Because the target sits next to the\n  category, actual margin from the order lines can be judged against what the category was\n  supposed to deliver, not just reported in isolation.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-05T19:03:08.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `category_id` | INTEGER | Category ID | PK. Unique numerical identifier for each product category. |\n| `category_name` | STRING | Category Name | The descriptive name of the product category used for reporting and classification. |\n| `category_manager` | STRING | Category Manager | Full name of the individual responsible for managing the specific product category. |\n| `target_margin` | FLOAT | Target Margin | The desired profit margin percentage set for the category. |\n| `category_group` | STRING | Category Group | High-level classification used to group related categories together, such as hard or soft goods. |\n\n# Example Questions\n\n- Which categories beat their target margin, and which sell well but earn little?\n- How is revenue distributed across category groups, and is the mix shifting?\n- Which category managers are carrying the categories that drive growth?\n", "e-commerce/products": "---\ntitle: \"Products\"\ndescription: |\n  The product catalog: what the store sells, at what price, at what unit cost, and where each\n  item lives in both the category tree and the website. Price and cost sitting in the same row\n  is what makes unit margin a property of the product rather than something reconstructed\n  downstream.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-13T07:00:24.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `product_id` | INTEGER | Product ID | PK. Unique identifier for a specific product in the catalog |\n| `product_name` | STRING | Product Name | The full commercial name of the product |\n| `price` | FLOAT | Price | The current selling price of a single unit of the product |\n| `cost` | FLOAT | Cost | The acquisition cost or production expense per unit of the product |\n| `sub_category` | STRING | Sub Category | The specific sub-classification of the product within its broader category. |\n| `category_id` | INTEGER | Category ID | Unique identifier for the high-level category the product belongs to. FK to [Product Category](./product-category.md) |\n| `page_path` | STRING | Page Path | The URL relative path for the product's detail page on the website. |\n| `page_id` | INTEGER | Page ID | Unique identifier for the specific web page associated with the product. FK to [Pages](./pages.md) |\n\n# Example Questions\n\n- Which products drive the most revenue, and which of them are actually profitable after cost?\n- How does price positioning differ across `categories` and sub-categories?\n- Which products attract heavy `page` traffic but rarely sell?\n\n## Joins\n\n- [Pages](./pages.md) — `page_id = page_id` [N:1] — This product's page on the storefront.\n  - [Product Pageviews](./pageviews.md) — Views of this product's page.\n- [Product Category](./product-category.md) — `category_id = category_id` [N:1] — The category this product sits in.\n", "e-commerce/purchases": "---\ntitle: \"Purchases\"\ndescription: |\n  The order lines behind every order — one row per product bought, with quantity, the price\n  actually paid, the cost of goods, and the resulting revenue and profit. Revenue is\n  recognised only for completed orders, so gross booked value and settled value never get\n  confused. This is the mart that answers what the business actually earned.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-11T15:00:26.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `purchase_id` | STRING | Purchase ID | PK. A unique identifier for each individual item row within an order |\n| `order_id` | STRING | Order ID | The unique identifier of the transaction. Used to join with the Orders Data Mart. FK to [Orders](./orders.md) |\n| `product_id` | INTEGER | Product ID | The unique identifier of the purchased product FK to [Products](./products.md) |\n| `quantity` | INTEGER | Quantity | The number of units of this specific product included in the purchase line |\n| `sale_price` | FLOAT | Item Sale Price | The price per unit at the moment of purchase |\n| `currency` | STRING | Currency | The currency used for the transaction (e.g., USD) |\n| `unit_cost` | FLOAT | Unit Cost | The cost incurred by the business to acquire or produce a single unit of the product. |\n| `line_revenue` | FLOAT | Item Revenue | Gross revenue for this order line = Item Sale Price × Quantity. Sum across lines for total gross revenue (all order statuses). |\n| `line_cost` | FLOAT | Item COGS | Cost of goods sold for this order line = Unit Cost × Quantity. Sum for total COGS. |\n| `line_net_revenue` | FLOAT | Item Net Revenue | Revenue recognised only for Completed orders (Cancelled / Returned = 0). Sum for net  revenue. |\n| `line_net_profit` | FLOAT | Item Net Profit | Profit for Completed orders = (Item Sale Price − Unit Cost) × Quantity, else 0. Sum for  total net profit. |\n| `line_net_cost` | FLOAT | Item Net COGS | Cost of goods sold recognised only for Completed orders (Cancelled / Returned = 0). This is the cost figure that pairs with Line Net Revenue: net revenue − net cost = net profit. |\n| `net_margin_pct` | FLOAT | Net Margin % | Settled profit over settled revenue, from summed components. |\n| `margin_bucket` | STRING | Margin Bucket | Each line's gross margin band — Thin, Standard, Healthy or Premium — from its sale price and unit cost, banded to how this store's margins actually spread (mid-40s to high-60s percent, not the wide range a generic Loss/Thin/Healthy/Premium split assumes). Row-level; group and filter by it. |\n\n# Example Questions\n\n- What is gross versus net revenue after cancellations and returns, and how wide is the gap?\n- Which `products` and `categories` generate the most profit, as opposed to the most revenue?\n- How many units go into a typical `order`, and how does basket composition vary by market?\n\n## Joins\n\n- [Orders](./orders.md) — `order_id = order_id` [N:1] — The order this line belongs to.\n  - [Order Customer](./customers.md) — The customer who placed the order this line belongs to.\n    - [Customer Country](./countries.md) — The customer's home market.\n    - [Customer Acquisition Source](./traffic-sources.md) — The channel that originally acquired the customer.\n  - [Order Session](./sessions.md) — The session the order was placed in.\n    - [Session Country](./countries.md) — The market the order was placed from.\n    - [Session Pageviews](./pageviews.md) — The clickstream of the ordering session.\n      - [Viewed Pages](./pages.md) — The pages seen in the ordering session.\n    - [Session Traffic Source](./traffic-sources.md) — The channel that drove the ordering session.\n    - [Session Ad Spend](./unified-ad-spend.md) — Spend on that day and channel — a cohort match, not this line's cost.\n      - [Ad Spend Traffic Source](./traffic-sources.md) — The channel behind that spend.\n    - [Session Visitor](./visitors.md) — The visitor behind the ordering session.\n- [Products](./products.md) — `product_id = product_id` [N:1] — The product sold on this line.\n  - [Product Page](./pages.md) — The storefront page of the product on this line.\n    - [Product Pageviews](./pageviews.md) — Views of that product page.\n  - [Product Category](./product-category.md) — The category of the product on this line.\n", "e-commerce/sessions": "---\ntitle: \"Sessions\"\ndescription: |\n  Every browsing session on the storefront, with the device it happened on, the traffic source\n  and campaign that produced it, the market it came from, and whether it ended in an order.\n  Sessions are the hinge of the model: marketing spend attaches on one side and orders on the\n  other, which is what lets acquisition cost be weighed against revenue.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-04T06:57:53.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `date` | DATE | Date | The specific date when the browsing session occurred FK to [Unified Ad Spend](./unified-ad-spend.md) |\n| `session_id` | STRING | Session ID | PK. Unique identifier for an individual user session FK to [Pageviews](./pageviews.md) |\n| `customer_id` | INTEGER | Customer ID | Unique identifier of the customer associated with the session |\n| `device_category` | STRING | Device Category | The type of hardware device used during the session (e.g., mobile, desktop) |\n| `conversion_seed` | FLOAT | Conversion Seed | A technical value used to simulate the probability of a transaction. |\n| `visitor_id` | STRING | Visitor ID | Unique identifier for the anonymous or recognized visitor. FK to [Visitors](./visitors.md) |\n| `traffic_source_id` | INTEGER | Traffic Source ID | Internal numeric identifier for the marketing traffic source. FK to [Traffic Sources](./traffic-sources.md) |\n| `country_id` | INTEGER | Country ID | Numeric identifier representing the geographic country of the visitor. FK to [Countries](./countries.md) |\n| `is_conversion` | BOOLEAN | Is Conversion | Indicates whether the session resulted in a successful transaction or goal completion. |\n| `source` | STRING | Source | The origin of the traffic, such as Google, Facebook, or direct entry. FK to [Unified Ad Spend](./unified-ad-spend.md) |\n| `medium` | STRING | Medium | The high-level channel type of the traffic, such as organic or cost-per-click. FK to [Unified Ad Spend](./unified-ad-spend.md) |\n| `campaign` | STRING | Campaign | The name of the specific marketing campaign that drove the session. |\n| `sessions_count` | INTEGER | Sessions | Distinct sessions in the selected rows. |\n| `orders_count` | INTEGER | Orders | Distinct orders placed in those sessions, counted across the join. |\n| `conversion_rate` | FLOAT | Conversion Rate | Orders per session — right at every cut. Inlined rather than composed over `orders_count`, because that formula reads a joined mart (Orders) and a formula may not read another formula that itself reads a join. |\n| `traffic_type` | STRING | Traffic Type | Paid, Organic, Owned or Direct, from the medium. Row-level; group and filter by it. |\n\n# Example Questions\n\n- Which `traffic sources` and campaigns produce sessions that convert, not just sessions that arrive?\n- How does conversion differ across devices and `countries`?\n- How does paid traffic compare with organic and direct on conversion and `order` value?\n\n## Joins\n\n- [Countries](./countries.md) — `country_id = country_id` [N:1] — The market the session came from.\n- [Orders](./orders.md) — `session_id = session_id` [1:1] — The order this session produced, where it converted.\n  - [Order Customer](./customers.md) — The customer who placed the order in this session.\n    - [Customer Country](./countries.md) — The customer's home market, which can differ from where the session came from.\n    - [Customer Acquisition Source](./traffic-sources.md) — The channel that originally acquired the customer.\n  - [Order Lines](./purchases.md) — The lines of the order placed in this session.\n    - [Ordered Product](./products.md) — The products bought in this session.\n      - [Product Page](./pages.md) — The storefront page of each product bought.\n        - [Product Pageviews](./pageviews.md) — Views of those product pages.\n      - [Product Category](./product-category.md) — The category of each product bought.\n- [Pageviews](./pageviews.md) — `session_id = session_id` [1:N] — The clickstream of this session.\n  - [Viewed Pages](./pages.md) — The pages seen in this session.\n- [Traffic Sources](./traffic-sources.md) — `traffic_source_id = traffic_source_id` [N:1] — The channel that drove this session.\n- [Unified Ad Spend](./unified-ad-spend.md) — `date = date`, `source = source`, `medium = medium` [N:N] — Spend on the same day and channel — a cohort match, not this session's cost.\n  - [Ad Spend Traffic Source](./traffic-sources.md) — The channel behind the matched spend.\n- [Visitors](./visitors.md) — `visitor_id = visitor_id` [N:1] — The visitor who browsed.\n", "e-commerce/traffic-sources": "---\ntitle: \"Traffic Sources\"\ndescription: |\n  Every source, medium and campaign combination that sends traffic to the storefront, grouped\n  into the channels the business actually reports on and flagged for whether the traffic was\n  paid. It is the vocabulary that makes marketing comparable: the same channel grouping\n  applies to sessions, to customers and to advertising spend.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-13T09:04:24.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `traffic_source_id` | INTEGER | Traffic Source ID | PK. Unique internal identifier for a specific combination of traffic source, medium, and campaign. |\n| `source` | STRING | Source | The origin of the website traffic, such as a search engine, social network, or domain. |\n| `medium` | STRING | Medium | The high-level category of the traffic source, such as organic, cost-per-click, or referral. |\n| `campaign` | STRING | Campaign Name | The specific marketing campaign name associated with the traffic. |\n| `is_paid` | BOOLEAN | Is Paid Traffic | Indicates whether the traffic was generated through a paid marketing channel. |\n| `channel_grouping` | STRING | Channel Grouping | The classification of traffic into broad categories like Paid Marketing, Direct, or Organic. |\n\n# Example Questions\n\n- Which channels bring in the most `sessions`, and which bring in the most revenue?\n- How does paid traffic compare with organic and referral on the quality of what it delivers?\n- Which campaigns are worth their spend once `orders`, not clicks, are the measure?\n", "e-commerce/unified-ad-spend": "---\ntitle: \"Unified Ad Spend\"\ndescription: |\n  Advertising spend, clicks, impressions and each platform's own conversion claim, from every\n  paid platform the business runs —\n  Google, Facebook, TikTok, LinkedIn, Microsoft, Reddit and X — brought together on one daily\n  grain with a common source, medium and campaign naming. Because it shares that naming with\n  the storefront's traffic sources, spend can be set against the sessions and revenue it\n  produced instead of being read on its own.\n\n  Unlike every other mart in this model, this one is defined by **SQL inside the data mart\n  itself** rather than by a database view — on purpose. Each advertising platform is\n  collected by its own connector-based data mart, each with a different schema and naming,\n  and this query is how those separate marts are unified: seven `SELECT`s over the tables the\n  connectors land in, normalised to one grain and `UNION ALL`ed together. Open Data Setup to\n  read it — every block is commented with the connector data mart it draws from and links\n  straight to it, which is the shortest demonstration of how connector data becomes\n  reportable with plain SQL.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-15T11:11:46.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `date` | DATE | Date | PK. The calendar date when the advertising activity occurred. |\n| `source` | STRING | Source | PK. The name of the advertising platform or network where the traffic originated. FK to [Traffic Sources](./traffic-sources.md) |\n| `medium` | STRING | Medium | PK. The marketing channel or payment model used, such as cost-per-click. FK to [Traffic Sources](./traffic-sources.md) |\n| `campaign` | STRING | Campaign | PK. The specific marketing campaign name associated with the ad spend. FK to [Traffic Sources](./traffic-sources.md) |\n| `spend` | FLOAT | Spend | The total cost of advertising incurred during the specified period. |\n| `clicks` | INTEGER | Clicks | The total number of times users clicked on the advertisements. |\n| `impressions` | INTEGER | Impressions | The total number of times the advertisements were displayed to users. |\n| `platform_conversions` | FLOAT | Platform Conversions | The number of conversion actions claimed by the advertising platform. |\n| `platform_conversion_value` | FLOAT | Platform Conversion Value | The total monetary value of conversions as reported by the advertising platform. |\n\n# Example Questions\n\n- How many sales does each ad platform claim, and how many did the store actually record?\n- What is blended and per-channel acquisition cost, and which channels return the most revenue per unit spent?\n- How do click-through and cost-per-click compare across platforms week over week?\n- Which campaigns are scaling spend without a matching lift in `orders`?\n\n## Joins\n\n- [Traffic Sources](./traffic-sources.md) — `source = source`, `medium = medium`, `campaign = campaign` [N:1] — The channel this spend was bought on.\n", "e-commerce/visitors": "---\ntitle: \"Visitors\"\ndescription: |\n  Everyone who has visited the storefront, registered or not: when they first and last\n  appeared, how many sessions they ran, the channel that originally acquired them, the cohort\n  month they belong to, and — where they later signed up — the customer account they became.\n  This is where anonymous traffic and known customers meet, which makes cohort retention\n  answerable.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-29T00:40:32.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `visitor_id` | STRING | Visitor ID | PK. Unique identifier for the website visitor. |\n| `linked_customer_id` | INTEGER | Linked Customer ID | Identifier of the registered customer account associated with this visitor, if applicable. |\n| `first_seen_date` | DATE | First Seen Date | The date when the visitor first interacted with the website. |\n| `last_seen_date` | DATE | Last Seen Date | The date of the most recent recorded interaction from this visitor. |\n| `total_sessions` | INTEGER | Total Sessions | Total number of distinct browsing sessions initiated by the visitor. |\n| `acquisition_source` | STRING | Acquisition Source | The specific platform or site that referred the visitor to the website. |\n| `acquisition_medium` | STRING | Acquisition Medium | The high-level channel type used to acquire the visitor, such as organic or paid search. |\n| `acquisition_campaign` | STRING | Acquisition Campaign | The name of the marketing campaign that originally brought the visitor to the site. |\n| `cohort_month` | DATE | Cohort Month | The month and year of the visitor's first visit, used for retention analysis. |\n| `visitor_segment` | STRING | Visitor Segment | Classification of the visitor based on their engagement behavior or frequency. |\n| `country_id` | INTEGER | Country ID | Numeric identifier representing the country where the visitor is located. |\n\n# Example Questions\n\n- What share of visitors ever return, and how does that repeat rate differ by acquisition channel?\n- How do monthly cohorts retain over time, and which acquisition source produces the stickiest ones?\n- How many visitors go on to register as `customers`, and how long does that take?\n", "ecommerce-subscription-store/ad-spend": "---\ntitle: \"Ad Spend\"\ndescription: |\n  Advertising spend, clicks and impressions from every paid platform the store runs, on one daily\n  grain, down to the ad group and the account the money was spent from. Because it shares source,\n  medium and campaign naming with the storefront's traffic sources, spend can be set against the\n  sessions, orders and subscriptions it produced instead of being read on its own.\n\n  For a subscription business the interesting comparison is not cost per order but cost per\n  subscriber, and the two diverge sharply by channel: a channel with expensive first orders can\n  still be the cheapest source of long-lived subscribers.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-12T20:01:43.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `ad_spend_id` | STRING | Spend Record ID | PK. Unique identifier of the daily spend record. |\n| `date` | DATE | Date | Date the advertising activity occurred on. |\n| `source` | STRING | Platform | Advertising platform the spend occurred on. FK to [Traffic Sources](./traffic-sources.md) |\n| `medium` | STRING | Medium | Channel type the spend belongs to, such as cost-per-click. FK to [Traffic Sources](./traffic-sources.md) |\n| `campaign` | STRING | Campaign | Campaign the spend belongs to. FK to [Traffic Sources](./traffic-sources.md) |\n| `ad_group` | STRING | Ad Group | Ad group within the campaign that the spend belongs to. |\n| `ad_account` | STRING | Ad Account | Advertising account the money was spent from. |\n| `spend` | FLOAT | Spend | Amount spent on advertising on this date. |\n| `clicks` | INTEGER | Clicks | Number of clicks the advertising received. |\n| `impressions` | INTEGER | Impressions | Number of times the advertising was displayed. |\n| `platform_conversions` | FLOAT | Platform-Claimed Conversions | How many purchases the ad platform's own reporting credits to this campaign, set here so it can be read against Orders. It runs ahead of the store's own order count on purpose — 1.25x on Google Ads and Microsoft Ads, 1.40x on Meta Ads, 1.55x on TikTok Ads — because platforms count clicks up to 7 days old plus views up to 1 day old, stitch a purchase across a shopper's devices, and let more than one platform claim the same sale. The gap between this and actual orders is the attribution gap, not an error to reconcile away. |\n| `platform_conversion_value` | FLOAT | Platform-Claimed Revenue | Revenue the platform attributes to the conversions it claims above. NULL for TikTok Ads by design — that platform's reporting includes a conversion count but no value, and that gap in what each platform can even tell you is itself worth stating rather than defaulting to zero. |\n| `currency` | STRING | Currency | Three-letter code of the currency the spend is reported in. |\n\n# Example Questions\n\n- What does a new subscriber cost by channel, and how does that compare with the recurring revenue they go on to produce?\n- Which campaigns and ad groups are scaling spend without a matching lift in `subscriptions`?\n- How do cost per click and cost per acquisition compare across platforms week over week?\n\n## Joins\n\n- [Traffic Sources](./traffic-sources.md) — `source = source`, `medium = medium`, `campaign = campaign` [N:N] — The channel this spend was bought on.\n", "ecommerce-subscription-store/customer-value": "---\ntitle: \"Customer Value\"\ndescription: |\n  What each customer is worth today: revenue and units over the last twelve months, lifetime\n  revenue, how recently they bought, the loyalty band that behaviour puts them in, and where\n  they stand with the subscription programme. The session that first brought them in sits in the\n  same row, which is what lets value be traced back to the channel that acquired it.\n\n  Subscription standing is explicit — never subscribed, active, paused, churned or reactivated —\n  alongside the share of the customer's revenue that is recurring. That combination answers the\n  question the programme exists to settle: whether subscribers are genuinely worth more than\n  one-time buyers, and by how much.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:21:31.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `customer_id` | STRING | Customer ID | PK. Customer this value profile describes. FK to [Customers](./customers.md) |\n| `acquisition_session_id` | STRING | Acquisition Session ID | Browsing session during which the customer was first acquired. FK to [Sessions](./sessions.md) |\n| `net_revenue_last_12m` | FLOAT | Net Revenue Last 12m | Revenue the customer generated over the last twelve months, after discounts and returns. |\n| `units_sold_last_12m` | INTEGER | Units Sold Last 12m | Number of individual units the customer bought over the last twelve months. |\n| `orders_last_12m` | INTEGER | Orders Last 12m | Number of orders the customer placed over the last twelve months. |\n| `lifetime_net_revenue` | FLOAT | Lifetime Net Revenue | Total revenue the customer has generated since their first order. |\n| `loyalty_segment` | STRING | Loyalty Segment | Behavioural band the customer falls into, such as New, Returning, Loyal, At risk or Lapsed. |\n| `subscriber_status` | STRING | Subscriber Status | Where the customer stands with the subscription programme: Never subscribed, Active, Paused, Churned or Reactivated. |\n| `active_subscriptions` | INTEGER | Active Subscriptions | Number of subscriptions the customer currently holds in an active state. |\n| `months_subscribed` | INTEGER | Months Subscribed | Number of months the customer has held at least one active subscription. |\n| `subscription_revenue_share` | FLOAT | Subscription Revenue Share | Share of the customer's lifetime revenue that came from subscription orders, between zero and one. |\n| `first_order_at` | DATE | First Order At | Date the customer placed their first order. |\n| `last_order_at` | DATE | Last Order At | Date the customer placed their most recent order. |\n| `recency_days` | INTEGER | Recency Days | Number of days since the customer's most recent order. |\n| `acquisition_channel_grouping` | STRING | Acquisition Channel Grouping | Channel the customer was originally acquired through, such as Paid Search, Paid Social, Organic or Direct. |\n\n# Example Questions\n\n- How much more is a subscriber worth over twelve months than a one-time buyer, and does that gap hold across acquisition channels?\n- Which channels deliver `customers` who go on to subscribe, rather than customers who buy once and leave?\n- How much revenue sits with `customers` who have lapsed, and which loyalty bands are worth a win-back campaign?\n\n## Joins\n\n- [Customers](./customers.md) — `customer_id = customer_id` [1:1] — The customer this value profile is for.\n  - [Customer Acquisition Source](./traffic-sources.md) — The channel that acquired the customer.\n- [Sessions](./sessions.md) — `acquisition_session_id = session_id` [N:1] — The visit that first acquired the customer.\n  - [Session Ad Spend](./ad-spend.md) — Spend on the day and channel of the acquiring visit — a cohort match, not this customer's CAC.\n    - [Ad Spend Channel](./traffic-sources.md) — The channel behind that spend.\n  - [Landing Page](./pages.md) — The page the acquiring visit landed on.\n  - [Session Channel](./traffic-sources.md) — The channel that drove the acquiring visit.\n  - [Session Visitor](./visitors.md) — The visitor behind the acquiring visit.\n", "ecommerce-subscription-store/customers": "---\ntitle: \"Customers\"\ndescription: |\n  Everyone who has bought from the store, with the channel that first brought them in, the\n  market they buy from, their contact details for lifecycle marketing, and the behavioural type\n  their buying history puts them in. This is the join point between acquisition and everything\n  that follows: the same row explains how a customer was won and where they are today.\n\n  This mart stays a register of who the customer is, not of what they have bought: order history,\n  value and loyalty band live in Customer Value, which joins one-to-one and is computed over the\n  orders themselves. Marketing consent is explicit, because win-back and dunning campaigns can\n  only address customers who allow it.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-01T08:55:43.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `customer_id` | STRING | Customer ID | PK. Unique identifier of the customer. |\n| `registered_at` | DATE | Registered At | Date the customer account was created. |\n| `email` | STRING | Email | Most recent known email address of the customer. |\n| `phone` | STRING | Phone | Most recent known phone number of the customer. |\n| `city` | STRING | City | City the customer's latest order was shipped to. |\n| `country` | STRING | Country | Country the customer's latest order was shipped to. |\n| `country_code` | STRING | Country Code | Two-letter code of the country the customer buys from. |\n| `acquisition_traffic_source_id` | STRING | Acquisition Traffic Source ID | Traffic source that first brought the customer to the store. FK to [Traffic Sources](./traffic-sources.md) |\n| `marketing_opt_in` | BOOLEAN | Marketing Opt In | Whether the customer consented to receive marketing communication. |\n\n# Example Questions\n\n- Which acquisition channels bring in customers who go on to buy repeatedly, rather than once?\n- How is the customer base split across markets, and where is the `subscription programme` under-represented?\n- How many customers are reachable by email or phone, and how does consent differ by channel and market?\n\n## Joins\n\n- [Traffic Sources](./traffic-sources.md) — `acquisition_traffic_source_id = traffic_source_id` [N:1] — The channel that acquired this customer.\n", "ecommerce-subscription-store/order-items": "---\ntitle: \"Order Items\"\ndescription: |\n  The order lines behind every order — one row per product bought, with quantity, the price\n  actually paid, the cost of goods, and the revenue and profit that result. Because unit cost\n  sits next to the price paid, margin is a property of the line rather than something\n  reconstructed later, and the true cost of subscription discounting becomes visible at the\n  product level.\n\n  Subscription lines are flagged apart from one-time lines, so the same product can be compared\n  in both worlds: what it earns when bought once, and what it earns when it is delivered on a\n  schedule at a standing discount.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:21:32.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `order_item_id` | STRING | Order Item ID | PK. Unique identifier of the order line. |\n| `order_id` | STRING | Order ID | Order this line belongs to. FK to [Orders](./orders.md) |\n| `product_id` | STRING | Product ID | Product bought on this line. FK to [Products](./products.md) |\n| `quantity` | INTEGER | Quantity | Number of units of the product on this line. |\n| `unit_price` | FLOAT | Unit Price | Price paid per unit at the moment of purchase. |\n| `unit_cost` | FLOAT | Unit Cost | Cost to the business of one unit of the product. |\n| `line_discount` | FLOAT | Line Discount | Discount applied to this line, including the subscription discount. |\n| `line_revenue` | FLOAT | Line Revenue | Gross revenue for the line, being quantity multiplied by the price paid. |\n| `line_net_revenue` | FLOAT | Line Net Revenue | Revenue recognised for the line, counted only for completed orders. |\n| `line_cost` | FLOAT | Line Cost | Cost of goods on this line whatever became of the order — a cancelled or returned line still carries a cost here — so pairing it with `line_net_revenue` instead of `line_net_cost` mixes a booked population with a settled one and lands margin about 0.8 percentage points low. |\n| `line_net_cost` | FLOAT | Line Net Cost | Cost of goods for lines that actually sold — zero on a cancelled or returned order — so it is the column that pairs correctly with `line_net_revenue` and `line_net_profit` over that same settled population. |\n| `line_net_profit` | FLOAT | Line Net Profit | Profit for the line on completed orders, being net revenue less cost of goods. |\n| `is_subscription_item` | BOOLEAN | Is Subscription Item | Whether the line was delivered on a subscription rather than bought one-time. |\n\n# Example Questions\n\n- Which `products` are profitable on `subscription` once the standing discount and cost of goods are counted, and which only look profitable at full price?\n- How does basket composition differ between `subscription` deliveries and `one-time orders`?\n- What is gross versus net revenue after cancellations and returns, and how wide is the gap by `product` category?\n\n## Joins\n\n- [Orders](./orders.md) — `order_id = order_id` [N:1] — The order this line belongs to.\n  - [Order Customer](./customers.md) — The customer who placed the order this line belongs to.\n    - [Customer Acquisition Source](./traffic-sources.md) — The channel that acquired that customer.\n  - [Order Session](./sessions.md) — The visit the order was placed in — absent on a recurring charge.\n    - [Session Ad Spend](./ad-spend.md) — Spend on that day and channel — a cohort match, not this line's cost.\n      - [Ad Spend Channel](./traffic-sources.md) — The channel behind that spend.\n    - [Landing Page](./pages.md) — The page the ordering visit landed on.\n    - [Session Channel](./traffic-sources.md) — The channel that drove the ordering visit.\n    - [Session Visitor](./visitors.md) — The visitor behind the ordering visit.\n  - [Order Subscription](./subscriptions.md) — The contract this line was billed under, where the order is recurring.\n    - [Subscriber](./customers.md) — The subscriber on that contract.\n      - [Subscriber Acquisition Source](./traffic-sources.md) — The channel that acquired the subscriber.\n    - [Subscribed Product](./products.md) — The product the contract ships, which need not be this line's product.\n      - [Subscribed Product Page](./pages.md) — The storefront page of the subscribed product.\n    - [Subscription Plan](./selling-plans.md) — The offer the contract was signed on.\n- [Products](./products.md) — `product_id = product_id` [N:1] — The product sold on this line.\n  - [Product Page](./pages.md) — The storefront page of the product on this line.\n", "ecommerce-subscription-store/orders": "---\ntitle: \"Orders\"\ndescription: |\n  One row per order — the header of the transaction, with the money on it and the reason it\n  exists. Every order says whether it was a one-time purchase, the first order of a new\n  subscription, or a recurring delivery, and recurring orders carry the subscription and the\n  cycle they belong to. That single classification is what separates predictable revenue from\n  the rest without leaving the order grain.\n\n  Gross sales, discounts, tax, shipping and net revenue all sit on the header, so the discount\n  the subscription programme gives away is measurable rather than assumed. Retail and wholesale\n  orders are flagged apart, and cancelled or returned orders keep their row, so booked and\n  settled revenue never quietly merge.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:21:31.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `order_id` | STRING | Order ID | PK. Unique identifier of the order. |\n| `order_date` | DATE | Order Date | Date the order was placed. |\n| `order_timestamp` | TIMESTAMP | Order Timestamp | Exact moment the order was placed, in UTC. |\n| `customer_id` | STRING | Customer ID | Customer who placed the order. FK to [Customers](./customers.md) |\n| `session_id` | STRING | Session ID | Browsing session the order was placed in. FK to [Sessions](./sessions.md) |\n| `subscription_id` | STRING | Subscription ID | Subscription the order was generated by; empty on one-time orders. FK to [Subscriptions](./subscriptions.md) |\n| `purchase_type` | STRING | Purchase Type | Why the order exists: One-time, Subscription first order or Subscription recurring. |\n| `order_type` | STRING | Order Type | Whether the order is Retail or Wholesale. |\n| `cycle_number` | INTEGER | Cycle Number | Which delivery cycle of the subscription this order fulfils; zero on one-time orders. |\n| `status` | STRING | Status | Fulfilment state of the order: Completed, Cancelled or Returned. |\n| `gross_sales` | FLOAT | Gross Sales | Value of the order before discounts, tax and shipping. |\n| `discounts` | FLOAT | Discounts | Total discount applied to the order, including the subscription discount. |\n| `tax` | FLOAT | Tax | Total tax charged on the order. |\n| `shipping` | FLOAT | Shipping | Total shipping charged on the order. |\n| `net_revenue` | FLOAT | Net Revenue | Settled revenue for the order — zero on a cancelled or returned order, so it never has to be filtered by status to be trusted. Booked revenue is not lost, it is simply a different number: `gross_sales - discounts`, carried on every row regardless of status. |\n| `applied_discount_codes` | STRING | Discount Codes | Promotional codes the customer used at checkout. |\n| `loyalty_segment` | STRING | Loyalty Segment | Loyalty band the customer was in when the order was placed. |\n| `currency` | STRING | Currency | Three-letter code of the currency the order was placed in. |\n| `items_count` | INTEGER | Items Count | Number of order lines on the order. |\n\n# Example Questions\n\n- What share of revenue is recurring, and how has the mix of one-time, first and recurring `subscription orders` shifted?\n- How does average order value compare between one-time buyers and subscribers once `subscription discounts` are counted?\n- How much is the `subscription programme` giving away in discounts, and how does that compare with the revenue it secures?\n\n## Joins\n\n- [Customers](./customers.md) — `customer_id = customer_id` [N:1] — The customer who placed this order.\n  - [Customer Acquisition Source](./traffic-sources.md) — The channel that acquired the customer.\n- [Sessions](./sessions.md) — `session_id = session_id` [N:1] — The visit this order was placed in — absent on a recurring charge.\n  - [Session Ad Spend](./ad-spend.md) — Spend on that day and channel — a cohort match, not this order's cost.\n    - [Ad Spend Channel](./traffic-sources.md) — The channel behind that spend.\n  - [Landing Page](./pages.md) — The page the ordering visit landed on.\n  - [Session Channel](./traffic-sources.md) — The channel that drove the ordering visit.\n  - [Session Visitor](./visitors.md) — The visitor behind the ordering visit.\n- [Subscriptions](./subscriptions.md) — `subscription_id = subscription_id` [N:1] — The contract this order was billed under, where it is recurring.\n  - [Subscriber](./customers.md) — The subscriber on the billed contract.\n    - [Subscriber Acquisition Source](./traffic-sources.md) — The channel that acquired the subscriber.\n  - [Subscribed Product](./products.md) — The product the billed contract ships.\n    - [Subscribed Product Page](./pages.md) — The storefront page of that product.\n  - [Subscription Plan](./selling-plans.md) — The offer the billed contract was signed on.\n", "ecommerce-subscription-store/page-views": "---\ntitle: \"Page Views\"\ndescription: |\n  Every page view recorded on the storefront, in sequence within its session — which page, when,\n  and where in the session the view sits. This is the finest grain in the model and the raw\n  material for funnel analysis: the step-by-step path between arriving and buying, or between\n  arriving and leaving.\n\n  Because the subscription management pages are part of the same page catalog, the same funnel\n  logic covers both new sign-ups and existing subscribers going in to skip, swap or cancel — the\n  behaviour that precedes churn is visible before the churn itself.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:21:32.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `pageview_id` | STRING | Pageview ID | PK. Unique identifier of the page view. |\n| `session_id` | STRING | Session ID | Session the page view belongs to. FK to [Sessions](./sessions.md) |\n| `page_id` | STRING | Page ID | Page that was viewed. FK to [Pages](./pages.md) |\n| `date` | DATE | Date | Date the page view occurred. |\n| `hit_number` | INTEGER | Hit Number | Position of the page view within its session, starting at one. |\n| `hit_timestamp` | TIMESTAMP | Hit Timestamp | Exact moment the page view was recorded, in UTC. |\n| `pageview_count` | INTEGER | Pageview Count | Always one, so page views can be summed without counting distinct identifiers. |\n\n# Example Questions\n\n- How deep does a `session` go before a `subscription sign-up`, and where does the path break down?\n- Which `pages` appear most often as the last view of a `session` that never converts?\n- Do subscribers who visit the `subscription` management `pages` churn more often in the following weeks?\n\n## Joins\n\n- [Pages](./pages.md) — `page_id = page_id` [N:1] — The page that was viewed.\n- [Sessions](./sessions.md) — `session_id = session_id` [N:1] — The visit this page view belongs to.\n  - [Session Ad Spend](./ad-spend.md) — Spend on the day and channel of this visit — a cohort match.\n    - [Ad Spend Channel](./traffic-sources.md) — The channel behind that spend.\n  - [Landing Page](./pages.md) — The page this visit landed on, not the page viewed here.\n  - [Session Channel](./traffic-sources.md) — The channel that drove this visit.\n  - [Session Visitor](./visitors.md) — The visitor behind this visit.\n", "ecommerce-subscription-store/pages": "---\ntitle: \"Pages\"\ndescription: |\n  The catalog of pages that make up the storefront — path, display title, and the function each\n  page serves. It turns raw URL paths into something a business user can read, which is what\n  makes funnel analysis by page type possible at all.\n\n  The subscription portal is a page type of its own, next to product, cart and checkout. That is\n  deliberate: the pages where subscribers skip, swap or cancel are as load-bearing for a\n  recurring business as the checkout is for a one-time one.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-28T16:51:52.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `page_id` | STRING | Page ID | PK. Unique identifier of the page. |\n| `page_path` | STRING | Page Path | URL path of the page relative to the domain root. |\n| `page_title` | STRING | Page Title | Human-readable title of the page. |\n| `page_type` | STRING | Page Type | Function the page serves, such as Home, Category, Product, Cart, Checkout, Subscription Portal, Blog or Account. |\n| `host_name` | STRING | Host Name | Domain the page is served from. |\n\n# Example Questions\n\n- Which landing pages bring in the most `sessions`, and which of them produce `subscriptions`?\n- Where in the checkout flow do shoppers drop off, page by page?\n- How much traffic do the `subscription` management pages take, and what happens to those subscribers next?\n", "ecommerce-subscription-store/products": "---\ntitle: \"Products\"\ndescription: |\n  The catalog: what the store sells, at what price, at what unit cost, which brand and category\n  it belongs to, whether it can be subscribed to, and which page on the site it lives on. Price\n  and cost in the same row make unit margin a property of the product, which is the starting\n  point for judging whether a product can carry a standing subscription discount at all.\n\n  Two naming columns are kept side by side on purpose: the name as it appears in the storefront,\n  and a cleaned unified name that groups variants and inconsistent spellings of the same\n  product. Reporting on the unified name is what stops one product from appearing as several.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-28T16:51:51.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `product_id` | STRING | Product ID | PK. Unique identifier of the product. |\n| `product_name` | STRING | Product Name | Name of the product as shown in the storefront. |\n| `unified_product_name` | STRING | Unified Product Name | Cleaned product name that groups variants and inconsistent spellings of the same product. |\n| `product_brand` | STRING | Product Brand | Brand the product is sold under. |\n| `product_category` | STRING | Product Category | Category the product belongs to, such as Supplements, Skincare or Accessories. |\n| `sku` | STRING | SKU | Stock keeping unit identifying the exact variant. |\n| `price` | FLOAT | Price | Current one-time selling price of a single unit. |\n| `unit_cost` | FLOAT | Unit Cost | Cost to the business of producing or acquiring a single unit. |\n| `is_subscription_eligible` | BOOLEAN | Is Subscription Eligible | Whether the product can be bought on a subscription plan. |\n| `page_id` | STRING | Page ID | Product detail page on the website. FK to [Pages](./pages.md) |\n\n# Example Questions\n\n- Which products carry `subscriptions` well — high repeat delivery volume at a margin that survives the discount?\n- Which `subscription-eligible` products are rarely subscribed to, and are they priced or presented wrongly?\n- How does unit margin vary across brands and categories, and where is the catalog thinnest on subscribable products?\n\n## Joins\n\n- [Pages](./pages.md) — `page_id = page_id` [N:1] — This product's page on the storefront.\n", "ecommerce-subscription-store/selling-plans": "---\ntitle: \"Selling Plans\"\ndescription: |\n  The subscription offers the store sells against — every cadence a customer can choose, the\n  discount attached to it, and whether it is paid per delivery or upfront for several\n  deliveries at once. Because the plan carries both the delivery rhythm and the discount, the\n  cost of the subscription programme and the retention it buys can be judged offer by offer\n  rather than as one blended number.\n\n  Two families of offer live here, and they behave differently in every report: pay-as-you-go\n  (\"subscribe & save\"), where the customer is charged on each delivery, and prepaid, where a\n  single payment covers a fixed number of future deliveries. Prepaid revenue arrives in one\n  lump and its churn shows up much later, which is exactly why the plan type has to be\n  explicit rather than inferred.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-29T14:33:10.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `selling_plan_id` | STRING | Selling Plan ID | PK. Unique identifier of the subscription offer a customer can subscribe to. |\n| `plan_name` | STRING | Plan Name | Customer-facing name of the offer, such as Monthly Subscribe & Save or Prepaid 3-Month. |\n| `plan_type` | STRING | Plan Type | Whether the customer pays on every delivery (Pay-as-you-go) or upfront for several deliveries (Prepaid). |\n| `delivery_interval_unit` | STRING | Delivery Interval Unit | Unit the delivery rhythm is expressed in, such as week or month. |\n| `delivery_interval_count` | INTEGER | Delivery Interval Count | Number of interval units between two deliveries, for example 2 with a unit of week means every two weeks. |\n| `delivery_interval_days` | INTEGER | Delivery Interval Days | Delivery rhythm normalised to days, so cadences expressed in weeks and months can be compared directly. |\n| `prepaid_cycles` | INTEGER | Prepaid Cycles | Number of deliveries covered by a single upfront payment; zero for pay-as-you-go offers. |\n| `discount_pct` | FLOAT | Discount % | Discount off the one-time price granted for subscribing on this plan, in percent. |\n| `is_skippable` | BOOLEAN | Is Skippable | Whether the subscriber is allowed to skip an upcoming delivery instead of cancelling. |\n| `is_active` | BOOLEAN | Is Active | Whether the offer is currently available to new subscribers. |\n\n# Example Questions\n\n- Which delivery cadence retains subscribers longest, and does the answer change once the discount given away is taken into account?\n- How does prepaid compare with pay-as-you-go on revenue per subscriber and on how long subscribers stay?\n- Are the deepest discounts going to the plans that actually produce the most `lifetime value`, or just the most sign-ups?\n", "ecommerce-subscription-store/sessions": "---\ntitle: \"Sessions\"\ndescription: |\n  Every browsing session on the storefront, with the device it happened on, the market it came\n  from, the traffic source and campaign that produced it, the page it started on, and what it\n  ended in. Sessions are the hinge of the model: advertising spend attaches on one side and\n  orders on the other, which is what lets acquisition cost be weighed against the revenue it\n  returns.\n\n  Conversions are recorded twice over on purpose — whether the session produced an order at all,\n  and whether it started a subscription. Those are different outcomes worth very different\n  amounts, and a channel that produces plenty of the first and none of the second is exactly what\n  the distinction is there to expose.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:21:30.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `session_id` | STRING | Session ID | PK. Unique identifier of the browsing session. |\n| `date` | DATE | Date | Date the session took place. FK to [Ad Spend](./ad-spend.md) |\n| `visitor_id` | STRING | Visitor ID | Visitor who ran the session. FK to [Visitors](./visitors.md) |\n| `customer_id` | STRING | Customer ID | Customer the session belongs to, when the visitor was recognised. |\n| `traffic_source_id` | STRING | Traffic Source ID | Traffic source that produced the session. FK to [Traffic Sources](./traffic-sources.md) |\n| `landing_page_id` | STRING | Landing Page ID | First page of the session. FK to [Pages](./pages.md) |\n| `device_category` | STRING | Device Category | Type of device used during the session, such as mobile, desktop or tablet. |\n| `country` | STRING | Country | Country the session came from. |\n| `session_count` | INTEGER | Session Count | Always one, so sessions can be summed without counting distinct identifiers. |\n| `pageview_count` | INTEGER | Pageview Count | Number of pages viewed during the session. |\n| `is_conversion` | BOOLEAN | Is Conversion | Whether the session ended in an order of any kind. |\n| `is_subscription_conversion` | BOOLEAN | Is Subscription Conversion | Whether a subscription was started during the session. |\n| `source` | STRING | Source | Platform or site the traffic came from, used to align sessions with advertising spend. FK to [Ad Spend](./ad-spend.md) |\n| `medium` | STRING | Medium | Channel type of the traffic, such as cost-per-click or organic. FK to [Ad Spend](./ad-spend.md) |\n| `campaign` | STRING | Campaign | Marketing campaign that produced the session; empty for traffic that runs no campaign, such as organic, direct and referral. FK to [Ad Spend](./ad-spend.md) |\n\n# Example Questions\n\n- Which channels and campaigns produce sessions that start `subscriptions`, not just sessions that convert once?\n- How does conversion differ across devices, markets and `landing pages`?\n- What does a `subscription sign-up` cost by channel, compared with a `one-time order`?\n\n## Joins\n\n- [Ad Spend](./ad-spend.md) — `date = date`, `source = source`, `medium = medium`, `campaign = campaign` [N:N] — Spend on the same day and channel — a cohort match, not this visit's cost.\n  - [Ad Spend Channel](./traffic-sources.md) — The channel behind the matched spend.\n- [Pages](./pages.md) — `landing_page_id = page_id` [N:1] — The page the visit landed on.\n- [Traffic Sources](./traffic-sources.md) — `traffic_source_id = traffic_source_id` [N:1] — The channel that drove this visit.\n- [Visitors](./visitors.md) — `visitor_id = visitor_id` [N:1] — The visitor who browsed.\n", "ecommerce-subscription-store/subscription-events": "---\ntitle: \"Subscription Events\"\ndescription: |\n  Everything that ever happened to a subscription, in order — created, charged, declined,\n  retried, skipped, paused, resumed, swapped to another plan, changed in quantity, cancelled\n  and reactivated. Each row carries the cycle it belongs to and what it did to recurring\n  revenue, which is what makes a month-over-month recurring revenue movement explainable\n  rather than merely visible.\n\n  Billing attempts live here alongside lifecycle changes on purpose. A declined charge never\n  becomes an order, so without these rows the failed-payment half of churn would be invisible\n  — and it is the half that is recoverable, because a retry that succeeds saves a subscriber\n  who never intended to leave.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:21:30.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `event_id` | STRING | Event ID | PK. Unique identifier of the subscription event. |\n| `subscription_id` | STRING | Subscription ID | Subscription the event belongs to. FK to [Subscriptions](./subscriptions.md) |\n| `event_date` | DATE | Event Date | Calendar date the event occurred on. |\n| `event_timestamp` | TIMESTAMP | Event Timestamp | Exact moment the event was recorded, in UTC. |\n| `event_type` | STRING | Event Type | What happened: created, charge_success, charge_failed, charge_retry_success, skipped, paused, resumed, plan_swapped, quantity_changed, cancelled or reactivated. |\n| `event_category` | STRING | Event Category | Whether the event is a Billing attempt or a Lifecycle change, so the two can be reported apart. |\n| `cycle_number` | INTEGER | Cycle Number | Which delivery cycle of the subscription the event relates to, starting at one. |\n| `amount` | FLOAT | Amount | Amount involved in the event; the charged amount for billing events and zero for lifecycle changes. |\n| `mrr_delta` | FLOAT | MRR Delta | Signed change this event made to the subscription's monthly recurring value. |\n| `retry_number` | INTEGER | Retry Number | Which dunning retry this charge attempt was; zero for a first attempt. |\n| `decline_reason` | STRING | Decline Reason | Why a charge attempt was declined, such as Insufficient funds, Card expired or Card declined. |\n| `quantity_delta` | INTEGER | Quantity Delta | Signed change in the number of units per delivery, on events that changed the quantity. |\n\n# Example Questions\n\n- How many charges fail each month, and what share of them is recovered by a later retry?\n- Are skips protecting retention — do subscribers who skip a cycle stay longer than those who never do?\n- What drives recurring revenue movement month over month: new `subscriptions`, quantity and `plan changes`, or cancellations?\n\n## Joins\n\n- [Subscriptions](./subscriptions.md) — `subscription_id = subscription_id` [N:1] — The contract this event happened to.\n  - [Subscriber](./customers.md) — The subscriber whose contract this event happened to.\n    - [Subscriber Acquisition Source](./traffic-sources.md) — The channel that acquired the subscriber.\n  - [Subscribed Product](./products.md) — The product the contract ships.\n    - [Subscribed Product Page](./pages.md) — The storefront page of that product.\n  - [Subscription Plan](./selling-plans.md) — The offer the contract was signed on.\n", "ecommerce-subscription-store/subscription-monthly-snapshot": "---\ntitle: \"Subscription Monthly Snapshot\"\ndescription: |\n  Where every subscriber stood at the end of each month: how many subscriptions they held, how\n  much recurring and one-time revenue they produced, how many cycles were charged, skipped or\n  declined, and whether that month was their first, their last, or a return after a break.\n  Retention and recurring revenue become a single grouping rather than a window calculation.\n\n  The cohort the subscriber belongs to travels with every row, so month-three and month-twelve\n  retention can be read straight off this mart and compared across cadences and acquisition\n  channels. Recurring and one-time revenue are kept apart deliberately: a store that sells both\n  ways cannot judge the health of its subscription programme from a blended total.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:21:29.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `snapshot_id` | STRING | Snapshot ID | PK. Unique identifier of the subscriber-month record. |\n| `month` | DATE | Month | First day of the month the snapshot describes. |\n| `customer_id` | STRING | Customer ID | Subscriber the snapshot describes. FK to [Customers](./customers.md) |\n| `primary_selling_plan_id` | STRING | Primary Selling Plan ID | Offer that carried most of this subscriber's recurring revenue in the month. FK to [Selling Plans](./selling-plans.md) |\n| `cohort_month` | DATE | Cohort Month | Month the subscriber first subscribed in, used as the cohort anchor. |\n| `months_since_cohort` | INTEGER | Months Since Cohort | Number of months between the cohort month and this snapshot month. |\n| `status_at_month_end` | STRING | Status At Month End | Where the subscriber stood on the last day of the month: Active, Paused or Cancelled. |\n| `active_subscriptions` | INTEGER | Active Subscriptions | Number of subscriptions the customer held in an active state at month end. |\n| `paused_subscriptions` | INTEGER | Paused Subscriptions | Number of the customer's subscriptions that were paused at month end. |\n| `recurring_revenue` | FLOAT | Recurring Revenue | Revenue the customer generated from subscription charges during the month. |\n| `one_time_revenue` | FLOAT | One Time Revenue | Revenue the customer generated from one-time orders during the month. |\n| `total_revenue` | FLOAT | Total Revenue | All revenue the customer generated during the month, recurring and one-time together. |\n| `cycles_charged` | INTEGER | Cycles Charged | Number of subscription cycles successfully charged during the month. |\n| `failed_charges` | INTEGER | Failed Charges | Number of charge attempts declined during the month. |\n| `skipped_cycles` | INTEGER | Skipped Cycles | Number of deliveries the subscriber chose to skip during the month. |\n| `is_new_subscriber` | BOOLEAN | Is New Subscriber | Whether the customer's first ever subscription started in this month. |\n| `is_churned` | BOOLEAN | Is Churned | Whether the customer's last active subscription ended in this month. |\n| `is_reactivated` | BOOLEAN | Is Reactivated | Whether the customer returned to an active subscription this month after a period without one. |\n\n# Example Questions\n\n- How do monthly subscriber cohorts retain over three, six and twelve months, and which cadence produces the stickiest ones?\n- What share of total revenue is recurring, and is that share growing month over month?\n- How many subscribers reactivate after churning, and how much revenue do they bring back compared with a newly acquired subscriber?\n\n## Joins\n\n- [Customers](./customers.md) — `customer_id = customer_id` [N:1] — The subscriber this month belongs to.\n  - [Customer Acquisition Source](./traffic-sources.md) — The channel that acquired the subscriber.\n- [Selling Plans](./selling-plans.md) — `primary_selling_plan_id = selling_plan_id` [N:1] — The offer the subscriber was mainly on that month.\n", "ecommerce-subscription-store/subscriptions": "---\ntitle: \"Subscriptions\"\ndescription: |\n  One row per subscription contract — who subscribed, to which product on which offer, how\n  much it bills per cycle, how many cycles it has survived, and, when it ended, why. This is\n  the centre of the recurring business: the active rows are the revenue base, and the ended\n  rows are the entire churn story with its reason attached.\n\n  A contract distinguishes the two ways subscriptions die, which reporting that only counts\n  cancellations cannot: a subscriber who decided to leave, and a subscriber whose card kept\n  failing until the retries ran out. Pause and skip are held apart from cancellation too, so a\n  subscriber taking a break is never counted as lost.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:21:29.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `subscription_id` | STRING | Subscription ID | PK. Unique identifier of the subscription contract. |\n| `customer_id` | STRING | Customer ID | Customer who owns this subscription. FK to [Customers](./customers.md) |\n| `selling_plan_id` | STRING | Selling Plan ID | Subscription offer the contract was created on. FK to [Selling Plans](./selling-plans.md) |\n| `product_id` | STRING | Product ID | Product being delivered on this subscription. FK to [Products](./products.md) |\n| `status` | STRING | Status | Current state of the contract: Active, Paused or Cancelled. |\n| `started_at` | DATE | Started At | Date the subscription was created. |\n| `cohort_month` | DATE | Cohort Month | First day of the month the subscription started in, used for retention cohorts. |\n| `quantity` | INTEGER | Quantity | Number of units delivered on each cycle. |\n| `unit_price` | FLOAT | Unit Price | Price charged per unit on this contract, after the plan discount. |\n| `recurring_value` |
