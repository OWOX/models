use. |\n| `first_seen_at` | TIMESTAMP | First Seen At | When the practice first saw this person: the moment of the first page view, which is also when the identity was minted. |\n| `first_source` | STRING | First Source | Where the person came from on that very first visit, such as `google`, `facebook` or `direct`. Frozen on the person, so it still describes a patient treated years later. |\n| `first_medium` | STRING | First Medium | How that first visit arrived, such as `cpc`, `organic` or `referral` — the split between paid and earned traffic at first touch. |\n| `first_campaign` | STRING | First Campaign | Campaign that brought the person in the first time. NULL when the first visit came from somewhere that carries no campaign, such as direct or organic search. |\n| `first_landing_page_url` | STRING | First Landing Page | Address of the page the person first landed on. Plain text rather than a link to a page record, because a site gets rewritten and that page may no longer exist. |\n| `identified_at` | TIMESTAMP | Identified At | When the person first gave contact details and stopped being anonymous. NULL for someone who has only ever browsed. |\n\n# Example Questions\n\n- How long does it take people to go from their first page view to giving us their contact details, and does that gap differ by the channel they first arrived through?\n- What share of the people who first found us this year are still anonymous, and what does that unworked audience amount to?\n- Which first-touch campaigns bring people who eventually identify themselves and enquire, rather than people who read once and never come back?\n", "healthcare-clinic-attribution/revenue": "---\ntitle: \"Revenue\"\ndescription: |\n  Money the practice has actually received. Issuing a bill creates a claim; only a\n  payment creates revenue, and the two are kept apart because they are not the same event\n  and do not happen at the same time. A single [invoice](./invoice.md) can be settled in\n  more than one payment, or in none, so this mart is joined to the invoice rather than\n  folded into it.\n\n  A treatment is paid for in two pieces. The patient's copay is collected before the\n  treatment starts and is revenue straight away, though a small share of the total. The\n  rest comes from the insurer, after the claim is submitted and with a lag;\n  `days_to_payment` records that wait, and read with `payment_source` it says who the\n  practice is waiting on. That lag is why a total taken over the month a treatment\n  happened is not the same as one taken over the month the money landed.\n\n  Revenue reaches advertising through the [patient](./customer-patient.md), whose\n  `person_id` goes back to the first visit and the campaign frozen on it. One patient's\n  payments can spread over years, so a campaign total sums a whole\n  history rather than a single purchase.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:20:03.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `revenue_id` | STRING | Revenue ID | PK. Unique identifier for one payment received. It is an event, not a balance: one bill can be settled by several rows here. |\n| `customer_id` | STRING | Customer ID | The patient the money came in for. Through them the payment reaches the person record, which is how revenue is credited back to the visit and the advertising that started it. FK to [Customer (Patient)](./customer-patient.md) |\n| `invoice_id` | STRING | Invoice ID | The bill this payment settles, in whole or in part. Comparing the two is how a practice sees what is still outstanding. FK to [Invoice](./invoice.md) |\n| `received_at` | TIMESTAMP | Received At | When the money arrived. This is the date revenue belongs to, and for an insurer's part it can fall in a later period than the treatment it pays for. |\n| `amount` | NUMERIC | Amount Received | How much actually arrived in this payment. It can be less than the bill asked for, and a bill can be settled by several payments. |\n| `currency` | STRING | Payment Currency | Currency the money arrived in, such as `USD`. Needed before payments can be summed together. |\n| `payment_source` | STRING | Payment Source | Where the money came from: `patient_copay`, collected before the treatment starts and a small share of the total, or `insurance_reimbursement`, paid after the claim is processed. One arrives before the treatment and the other after the claim is processed, so cash-flow questions need this split. |\n| `days_to_payment` | INTEGER | Days to Payment | How long this money took to arrive, counted from the bill. It is the reimbursement lag made measurable: read by `payment_source` it separates the copay collected before treatment from the insurer's part, and tracked over time it shows whether insurers are paying more slowly. |\n\n# Example Questions\n\n- How long does our money take to arrive, split between what the patient pays before treatment and what the insurer reimburses?\n- How much revenue did each first-touch channel produce, once it is resolved through the patient back to the visit that started the journey?\n- How much of what we invoiced in a period has actually been received, and where is the rest sitting?\n\n## Joins\n\n- [Customer (Patient)](./customer-patient.md) — `customer_id = customer_id` [N:1] — Who the money came in for.\n  - [Customer (Patient) Person](./person.md) — The human behind the patient this money came in for, which is how a payment reaches the campaign that started the journey.\n- [Invoice](./invoice.md) — `invoice_id = invoice_id` [N:1] — The bill this payment settles, in whole or in part.\n  - [Invoice Customer (Patient)](./customer-patient.md) — The patient the settled bill was raised against.\n    - [Invoice Customer (Patient) Person](./person.md) — The human behind the patient the settled bill was raised against.\n  - [Invoice Treatment](./treatment.md) — What the settled bill was for.\n    - [Invoice Treatment Consultation](./consultation.md) — The assessment that cleared the treatment behind this payment.\n      - [Invoice Treatment Consultation Employee](./employee.md) — Who held the assessment that cleared that treatment, who need not be the one who delivered it.\n      - [Invoice Treatment Consultation Lead](./lead.md) — The enquiry that was screened into the treatment behind this payment.\n        - [Invoice Treatment Consultation Lead Person](./person.md) — The human behind that enquiry, reached through the treatment rather than through the paying patient.\n    - [Invoice Treatment Customer (Patient)](./customer-patient.md) — The patient the treatment was booked for, reached through the treatment rather than off the bill.\n      - [Invoice Treatment Customer (Patient) Person](./person.md) — The human behind the patient the treatment was booked for.\n    - [Invoice Treatment Employee](./employee.md) — Who delivered the treatment behind this payment.\n", "healthcare-clinic-attribution/session": "---\ntitle: \"Session\"\ndescription: |\n  One visit to the practice's website, from the moment someone arrives to the moment they\n  go quiet; everything seen or clicked in between belongs to it. A session carries the\n  channel that brought this particular visit, the device it happened on and where in the\n  world it came from, so it answers \"what was this trip for\", while the\n  [person](./person.md) record answers \"who was this and what first brought them here\".\n\n  `visitor_id` is browser-level — the Google Analytics `client_id` — lost when someone\n  switches device, clears cookies or changes browser; `person_id` sits above it. Counting\n  distinct visitors counts browsers, counting distinct people counts prospective\n  patients, and only the second means anything for a practice's own numbers.\n\n  The UTM fields describe *this* visit and are deliberately not the first-touch source\n  frozen on the person: someone who arrived through an ad and returned through a branded\n  search has one record of each, which separates the channel that creates demand from the\n  channel that merely collects it. `campaign`, `term` and `content` are empty for visits\n  that carry no campaign at all, the normal state for direct and organic arrivals.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:19:59.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `session_id` | STRING | Session ID | PK. Unique identifier for this visit. Every page view and every ad click that landed in the visit carries it. |\n| `person_id` | STRING | Person ID | The human this visit belongs to, which is how visits made months apart and on different devices add up to one journey. FK to [Person](./person.md) |\n| `visitor_id` | STRING | Visitor ID | Browser-level identifier the visit was recorded under — one browser on one device. Several of these belong to one person, so counting them counts devices, not patients. |\n| `started_at` | TIMESTAMP | Started At | When the visit began, which is the moment of its first page view. |\n| `ended_at` | TIMESTAMP | Ended At | When the visit was closed off after the visitor went quiet. The gap from `started_at` is the time spent on site. |\n| `source` | STRING | Source | Where this particular visit came from, such as `google`, `facebook` or `direct` — the source of this trip, not of the person's first ever arrival. |\n| `medium` | STRING | Medium | How the visit arrived, such as `cpc`, `organic` or `referral` — the line between traffic that was paid for and traffic that was not. |\n| `campaign` | STRING | Campaign | Campaign behind this visit. Empty for arrivals that carry no campaign, such as direct traffic or unpaid search. |\n| `term` | STRING | Search Term | Keyword the visit was bought or found under, where the channel supplies one. |\n| `content` | STRING | Creative | Which creative or link variant brought this visit, matching the creative identifier carried on the ad click. |\n| `landing_page_url` | STRING | Landing Page | Address of the first page seen in this visit — the page that had to do the persuading. |\n| `device_type` | STRING | Device Type | What the visit happened on: `mobile`, `desktop` or `tablet`. One person's visits can be spread across several devices, which is why this sits on the visit rather than on the person. |\n| `browser` | STRING | Browser | Browser the visit was made in. Useful for spotting tracking that has broken in one browser and not the others. |\n| `country` | STRING | Country | Country the visit came from, which is what separates local demand from traffic a single-site practice can never treat. |\n| `is_first_session` | BOOLEAN | Is First Session | TRUE for the one visit during which this person's identity was minted, and FALSE for every return. Splits new prospects from returning ones without recomputing the journey. |\n\n# Example Questions\n\n- How many visits does someone make, and over how many weeks, before they give us their contact details?\n- Which channels bring back people who already know us, rather than paying again for visitors who arrived through another route first?\n- Do visits on a phone behave differently from visits on a desktop — shorter, earlier in the journey, less likely to end in an enquiry?\n\n## Joins\n\n- [Person](./person.md) — `person_id = person_id` [N:1] — The human this visit belongs to, across every device they use.\n", "healthcare-clinic-attribution/treatment": "---\ntitle: \"Treatment\"\ndescription: |\n  The step between a clinician saying yes and the practice being paid. Once a\n  consultation qualifies someone a date is agreed and the treatment is booked, the\n  patient's copay is collected before it starts, and the claim goes to the insurer after\n  it. Every bill and every payment in this model is raised against one of these rows:\n  before this record the model describes demand, after it money.\n\n  **Being qualified and being treated are two different things.** Someone can be cleared\n  and still decide not to go ahead, a drop-off that stays invisible unless bookings are\n  counted separately from verdicts. `booked_at` and `scheduled_date` are deliberately\n  separate too: one is when the appointment was agreed, the other the day it was set for,\n  and the distance between them is the practice's waiting time.\n\n  A treatment points back at the\n  [consultation](./consultation.md) that cleared it, forward at the\n  [patient](./customer-patient.md) receiving it and at the [clinician](./employee.md)\n  delivering it — the same staff list the screenings point at — so a clinician's verdict\n  and the money that followed sit on one chain, and advertising can be read against\n  treatments delivered, not only enquiries taken.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:20:01.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `treatment_id` | STRING | Treatment ID | PK. Unique identifier for one booked treatment, which is what every invoice and every payment in this model is ultimately raised against. |\n| `consultation_id` | STRING | Consultation ID | The assessment that cleared this treatment to go ahead. It is the step that carries a clinician's verdict forward into the money, and the enquiry and its advertising can be reached through it. FK to [Consultation](./consultation.md) |\n| `customer_id` | STRING | Customer ID | The patient being treated, as the billing side of the practice knows them. FK to [Customer (Patient)](./customer-patient.md) |\n| `employee_id` | STRING | Employee ID | The clinician delivering the treatment, drawn from the same staff list that holds the screening. It allows one person's assessments and their delivered work to be compared. FK to [Employee](./employee.md) |\n| `booked_at` | TIMESTAMP | Booked At | When the appointment was agreed, not when it happens. Measured against the consultation, it is how long the practice took to convert a yes into a booking. |\n| `scheduled_date` | DATE | Scheduled Date | The day the treatment is set for. The distance from `booked_at` is the waiting time a patient is asked to accept. |\n| `completed_date` | DATE | Completed Date | The day the treatment actually happened. Empty while it is still in the diary or was cancelled, which is what separates delivered work from booked work. |\n| `treatment_name` | STRING | Treatment Name | What is being done. It is what makes a channel's demand readable as a case mix rather than as a single count. |\n| `status` | STRING | Treatment Status | Where the booking stands: `booked` while it is ahead, `completed` once delivered, `cancelled` when it will not happen. Cancellations are qualified patients who did not get treated, so they belong in a funnel count rather than being dropped. |\n\n# Example Questions\n\n- How many qualified consultations turn into booked treatments, and how does that differ by the channel the enquiry came from?\n- How long do patients wait between being cleared and being treated, and how many bookings are cancelled before they happen?\n- Which treatments do our paid enquiries end up having, and how does that mix differ from the enquiries that arrive without advertising?\n\n## Joins\n\n- [Consultation](./consultation.md) — `consultation_id = consultation_id` [N:1] — The assessment that cleared this treatment to go ahead.\n  - [Consultation Employee](./employee.md) — Who held the assessment that cleared this treatment, rather than the clinician delivering it.\n  - [Consultation Lead](./lead.md) — The CRM enquiry the clearing assessment was held against.\n    - [Consultation Lead Person](./person.md) — The human behind that enquiry, which is this treatment's route back to the first visit.\n- [Customer (Patient)](./customer-patient.md) — `customer_id = customer_id` [N:1] — Who is being treated.\n  - [Customer (Patient) Person](./person.md) — The human behind the patient being treated, back to their first anonymous visit.\n- [Employee](./employee.md) — `employee_id = employee_id` [N:1] — The clinician delivering it.\n", "healthcare-clinic-network/ad-spend": "---\ntitle: \"Ad Spend\"\ndescription: |\n  What the network paid to be found, at the finest grain it is billed: one row per day, channel,\n  campaign, keyword, creative and country, with cost in the original currency and converted to a\n  single one, alongside impressions and clicks. This is the mart to use when the question is which\n  keyword or creative is consuming budget, rather than which channel — that coarser view is already\n  rolled up with its outcomes in Attribution. Because healthcare acquisition costs vary enormously\n  by channel, keyword-level spend is usually where a blended cost per patient turns out to be\n  hiding one very expensive route and one very cheap one.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:02:28.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `date` | DATE | Date | PK. Calendar date the spend was incurred. FK to [Attribution](./attribution.md) |\n| `source` | STRING | Source | PK. Platform or network the spend went to, such as Google or Meta. FK to [Attribution](./attribution.md) |\n| `medium` | STRING | Medium | PK. Advertising model used, such as `cpc`. FK to [Attribution](./attribution.md) |\n| `campaign` | STRING | Campaign Name | PK. Campaign the spend belongs to. FK to [Attribution](./attribution.md) |\n| `keyword` | STRING | Keyword | PK. Search term the advertising bid on. |\n| `ad_content` | STRING | Ad Content | PK. Creative or ad variant the spend ran against. |\n| `country` | STRING | Country | PK. Country the advertising was targeted at. |\n| `cost` | FLOAT | Cost | Spend in the original billing currency. |\n| `cost_normalized` | FLOAT | Normalized Cost | Spend converted to USD. Use this whenever markets are compared. |\n| `impressions` | INTEGER | Impressions | Times the advertising was displayed. |\n| `clicks` | INTEGER | Clicks | Times the advertising was clicked. |\n\n# Example Questions\n\n- Which keywords and creatives absorb the largest share of budget, and does that share match the share of enquiries they produce?\n- How much of our spend goes to terms that generate clicks but no enquiries at all?\n- Has cost per click drifted over the period for our highest-spend campaigns, and in which market?\n\n## Joins\n\n- [Attribution](./attribution.md) — `date = date`, `source = source`, `medium = medium`, `campaign = campaign` [N:N] — The acquisition funnel this day of spend paid for.\n", "healthcare-clinic-network/attribution": "---\ntitle: \"Attribution\"\ndescription: |\n  The funnel on one row: for every day, channel, campaign and country, what was spent and what came\n  back — sessions, enquiries, new patients, completed visits, revenue and the lifetime value now\n  attached to the patients that channel produced. This is the mart that answers what a patient\n  costs to acquire, and it is deliberately built on completed visits rather than on bookings,\n  because a booking that turns into a no-show has not acquired anyone. Having spend and outcome\n  side by side at the same grain is what makes cost per new patient comparable across channels\n  without stitching marts together first.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T13:47:15.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `attribution_id` | STRING | Attribution ID | PK. Unique identifier for this day, channel, campaign and country combination. |\n| `date` | DATE | Date | Calendar date the spend and outcomes are attributed to. |\n| `source` | STRING | Traffic Source | Origin of the traffic, such as a search engine or social network. |\n| `medium` | STRING | Traffic Medium | Traffic type, such as `cpc`, `organic` or `referral`. |\n| `campaign` | STRING | Campaign Name | Marketing campaign the spend and outcomes belong to. |\n| `country` | STRING | Country | Country the activity is attributed to. |\n| `cost` | FLOAT | Raw Cost | Advertising spend in the original billing currency. |\n| `cost_normalized` | FLOAT | Normalized Cost | Advertising spend converted to USD. Use this for any cross-country comparison. |\n| `impressions` | INTEGER | Impressions | Times the advertising was displayed. |\n| `clicks` | INTEGER | Clicks | Times the advertising was clicked. |\n| `sessions` | INTEGER | Sessions | Website sessions attributed to this row. |\n| `leads` | INTEGER | Leads | Enquiries attributed to this row. |\n| `new_patients` | INTEGER | New Patients | First-time patients attributed to this row. The usual denominator for acquisition cost. |\n| `completed_visits` | INTEGER | Completed Visits | Visits that were actually attended. The stricter acquisition denominator, since a booking lost to a no-show acquires nobody. |\n| `revenue_normalized` | FLOAT | Early Revenue (USD) | Revenue the attributed patients billed within 90 days of their first attended visit, in USD — how fast the acquisition cost on this row started coming back. Deliberately narrower than `ltv`: measured over the full relationship the two would be the same number. |\n| `ltv` | FLOAT | Lifetime Value | Total revenue the patients on this row have billed to date, in USD. Read against `revenue_normalized` to see how far eventual value runs ahead of the first 90 days. |\n\n# Example Questions\n\n- What do we pay per new `patient` by channel and country, and which channels look cheap on cost per enquiry but expensive once only completed `visits` are counted?\n- How far apart are acquisition cost and the lifetime value that follows it, and which channel has the widest gap in our favour?\n- Where does the funnel leak hardest — `sessions` to enquiries, enquiries to new `patients`, or new patients to a completed `visit`?\n", "healthcare-clinic-network/clinic": "---\ntitle: \"Clinic\"\ndescription: |\n  The network's footprint: one row per clinic location, with where it is, what currency it bills\n  in and which practice-management system its records come from. Locations span the United States\n  and Canada, so a clinic carries both its own billing currency and the state or province it sits\n  in — the cut every regional comparison starts from. `is_active` separates locations that are\n  open and taking patients from ones that have closed or not yet opened, which matters whenever a\n  per-location average would otherwise be dragged down by a site that was dark for part of the\n  period. This is the dimension that turns any patient, visit or enquiry number into a\n  location-level one.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:02:27.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `clinic_id` | STRING | Clinic ID | PK. Unique identifier for this clinic location. |\n| `clinic_name` | STRING | Clinic Name | Public-facing name of the location, as patients see it. |\n| `country` | STRING | Country | Two-letter country code the location operates in: `US` or `CA`. |\n| `state_province` | STRING | State / Province | State (US) or province (Canada) the location sits in, e.g. `TX`, `CO`, `ON`. The standard regional cut for comparing locations. |\n| `city` | STRING | City | City the location operates in. |\n| `address` | STRING | Street Address | Street address of the location. |\n| `phone` | STRING | Phone Number | Primary contact number patients call to reach this location. |\n| `currency` | STRING | Local Currency | Currency this location bills patients in: `USD` or `CAD`. Revenue is also carried normalised to USD wherever it appears. |\n| `ehr_system` | STRING | EHR System | Practice-management / electronic health record system the location's records originate from. Check this first when one clinic's data looks structurally unlike another's. |\n| `is_active` | BOOLEAN | Is Active | True while the location is open and accepting patients. Exclude inactive locations before comparing per-location averages. |\n\n# Example Questions\n\n- Which locations bill in Canadian dollars, and how much of the network's revenue sits outside the US once everything is converted to a single currency?\n- Do clinics running one practice-management system show different data completeness than those on the other, and is that a reporting artefact rather than a real difference?\n- How does performance per location vary across states and provinces once closed sites are excluded from the comparison?\n", "healthcare-clinic-network/communications": "---\ntitle: \"Communications\"\ndescription: |\n  Every attempt to reach a patient, and every time one reached us: one row per interaction, with the\n  channel it used, which direction it went, whether it succeeded, and which agent handled it. Calls\n  dominate, because that is how most people still choose a clinician, and the honest measure of a\n  contact centre lives here rather than in the enquiry record — how many attempts it takes before\n  someone answers, which enquiries are given up on, and whether persistence actually changes the\n  outcome. `is_first` and `is_last` bracket each conversation, and `is_scheduling` separates the\n  interactions that were about getting an appointment in the diary from reminders, follow-ups and\n  automated replies.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:20:36.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `communication_id` | STRING | Communication ID | PK. Unique identifier for this interaction. |\n| `lead_id` | STRING | Lead ID | Enquiry this interaction concerns. FK to [Leads](./leads.md) |\n| `patient_id` | STRING | Patient ID | Patient this interaction concerns, once the enquiry has converted. FK to [Patients](./patients.md) |\n| `agent_id` | STRING | Agent ID | Agent who handled the interaction. FK to [Patient Access Agent](./patient-access-agent.md) |\n| `type` | STRING | Communication Type | Channel used: `call`, `sms`, `email`, `web_chat`, `portal_message`. |\n| `direction` | STRING | Direction | `inbound` when the patient contacted us, `outbound` when we contacted them. |\n| `status` | STRING | Status | Outcome of the attempt: `successful` or `unsuccessful`. Counting unsuccessful outbound attempts is how the cost of chasing is measured. |\n| `subject` | STRING | Subject | Short label describing what the interaction was about. |\n| `message_text` | STRING | Message Text | Body of the message sent or received. |\n| `is_autoreply` | BOOLEAN | Is Auto Reply | True when the interaction was generated automatically rather than sent by a person. |\n| `creation_date` | DATE | Creation Date | Date the interaction took place. |\n| `is_first` | BOOLEAN | Is First Communication | True for the first interaction recorded against the enquiry. |\n| `is_last` | BOOLEAN | Is Last Communication | True for the most recent interaction recorded against the enquiry. |\n| `is_scheduling` | BOOLEAN | Is Scheduling Interaction | True when the interaction was about getting an appointment into the diary, as opposed to a reminder or follow-up. |\n| `is_last_scheduling` | BOOLEAN | Is Last Scheduling Interaction | True for the most recent scheduling interaction on the enquiry. |\n| `count_communications` | INTEGER | Communication Count | Always `1` on every row; SUM to count interactions. |\n\n# Example Questions\n\n- How many attempts do we make before an enquiry is reached, at what point do we give up, and does one more attempt still pay for itself?\n- Do enquiries handled entirely by automated replies convert at a materially different rate than those a person actually spoke to?\n- Which channels do `patients` answer on rather than merely receive, and has that shifted over the period?\n\n## Joins\n\n- [Leads](./leads.md) — `lead_id = lead_id` [N:1] — The enquiry this interaction is about.\n  - [Leads Clinic](./clinic.md) — The clinic the enquiry asked about.\n  - [Leads Patients](./patients.md) — The patient the enquiry was matched to.\n  - [Leads Sessions](./sessions.md) — The website visit the enquiry came from.\n    - [Lead Attribution](./attribution.md) — The acquisition funnel behind the enquiry.\n- [Patient Access Agent](./patient-access-agent.md) — `agent_id = agent_id` [N:1] — The agent who handled the interaction.\n- [Patients](./patients.md) — `patient_id = patient_id` [N:1] — The patient this interaction was with.\n", "healthcare-clinic-network/leads": "---\ntitle: \"Leads\"\ndescription: |\n  The moment someone asks for an appointment: one row per inbound enquiry, whether it arrived as a\n  tracked phone call, a website form, a chat, a lead form on an ad platform, a referral from another\n  physician or typed in by staff. Each enquiry carries the location it was directed to, the session\n  that produced it where the two could be matched, and the state it has since reached — still new,\n  being worked, converted into a patient, or one of the two dead ends: never reached, or rejected\n  with a stated reason. This is the only place in the model where the enquiries that were never\n  reached at all sit next to the ones that converted, which is what makes the size of that loss\n  visible rather than assumed.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:20:35.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `lead_id` | STRING | Lead ID | PK. Unique identifier for this enquiry. |\n| `session_id` | STRING | Session ID | Session the enquiry was submitted during. NULL when the enquiry began outside the web funnel, such as a physician referral or a direct call. FK to [Sessions](./sessions.md) |\n| `patient_id` | STRING | Patient ID | Set only once the enquiry converts into a patient. NULL until then — use `IS NOT NULL` for \"converted enquiries\", which is why a rejected or unreached enquiry is never counted as a patient. FK to [Patients](./patients.md) |\n| `clinic_id` | STRING | Clinic ID | Location the enquiry was directed to. FK to [Clinic](./clinic.md) |\n| `lead_submitted_at` | TIMESTAMP | Lead Submitted At | When the enquiry was received. The series to plot for enquiry volume. |\n| `status` | STRING | Status | How far the enquiry got: `new`, `in_work`, `converted`, `no_answer`, `rejected`. |\n| `source_system` | STRING | Source System | What captured the enquiry: `call_tracking`, `google_ads`, `meta_lead_form`, `web_form`, `web_chat`, `physician_referral`, `manual`. |\n| `channel_name` | STRING | Channel | How the patient reached out: `phone`, `web_form`, `web_chat`, `patient_portal`. |\n| `rejection_reason` | STRING | Rejection Reason | Why the enquiry was rejected: `insurance_not_accepted`, `cost_concern`, `chose_competitor`, `wrong_number`, `duplicate`, `not_interested`. NULL unless `status = 'rejected'`. |\n| `is_manual_entry` | BOOLEAN | Is Manual Entry | True when a staff member created the enquiry by hand rather than it being captured automatically. |\n| `country` | STRING | Country | Country the enquiry came from. |\n| `created_at` | TIMESTAMP | Created At | When the enquiry record was created in the warehouse. |\n| `count_leads` | INTEGER | Lead Count | Always `1` on every row; SUM to count enquiries. |\n\n# Example Questions\n\n- What share of enquiries do we never manage to reach, and does that dead share depend on the channel that produced them or the location they went to?\n- Why do enquiries fail — insurance we do not accept, cost, or a competitor — and does the mix differ between markets?\n- Do enquiries staff enter by hand convert at a different rate than those captured automatically, and is the difference big enough to change how intake is run?\n\n## Joins\n\n- [Clinic](./clinic.md) — `clinic_id = clinic_id` [N:1] — The clinic the enquiry asked about.\n- [Patients](./patients.md) — `patient_id = patient_id` [N:1] — The patient this enquiry was matched to.\n- [Sessions](./sessions.md) — `session_id = session_id` [N:1] — The website visit the enquiry came from.\n  - [Sessions Attribution](./attribution.md) — The acquisition funnel behind this visit.\n", "healthcare-clinic-network/patient-access-agent": "---\ntitle: \"Patient Access Agent\"\ndescription: |\n  The people who answer the phone. Patient access is the function that handles inbound enquiries\n  and books them into a clinician's diary, and since the overwhelming majority of new patients\n  arrive by phone rather than by form, this small team sits directly on the network's growth. One\n  row per agent, with the role they hold — front-line representative, senior representative or\n  supervisor — and the country they work in. On its own the mart is a short staff list; joined to\n  the interaction history it is what makes contact-centre performance answerable at all, because\n  every call, message and booking attempt is attributed to the agent who handled it.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:02:27.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `agent_id` | STRING | Agent ID | PK. Unique identifier for this contact-centre agent. |\n| `first_name` | STRING | First Name | Agent's given name. |\n| `last_name` | STRING | Last Name | Agent's family name. |\n| `role` | STRING | Role | Position on the team: `patient_access_rep`, `senior_rep` or `supervisor`. Use this to ask whether experience changes booking rates. |\n| `country` | STRING | Country | Two-letter country code the agent works in. |\n| `email` | STRING | Email Address | Work email address for the agent. |\n| `is_active` | BOOLEAN | Is Active | True while the agent is still on the team. |\n\n# Example Questions\n\n- Does an enquiry handled by a senior representative end up booked more often than one handled by a front-line agent, and by enough to justify how calls are routed?\n- Which agents are reaching enquiries that others give up on, and how many attempts do they make before they succeed?\n- Is contact-centre capacity spread evenly across the countries we operate in, or is one market being served by a handful of people?\n", "healthcare-clinic-network/patients": "---\ntitle: \"Patients\"\ndescription: |\n  Who the network is treating, and what each patient is worth: one row per patient, combining the\n  identity and contact details the clinics hold with the value metrics built on top of their visit\n  history — lifetime value, average value per visit, how many times they have attended, when they\n  first and last came, and how long it has been since. The distinction between a new and an\n  established patient runs through everything here, because the two behave differently on almost\n  every measure that matters, from how much treatment they accept to how likely they are to attend.\n  `has_unused_plan` and `unused_plan_revenue` make the recall opportunity explicit: treatment that\n  was planned and paid attention to but never delivered is revenue already earned and still sitting\n  on the table.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:02:24.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `patient_id` | STRING | Patient ID | PK. Unique identifier for this patient. |\n| `lead_id` | STRING | Acquisition Lead ID | Enquiry that first brought this patient in. First touch only — a patient who enquired more than once keeps just the earliest here. Denormalised, not a declared relationship; the full history is in Leads. |\n| `session_id` | STRING | First Session ID | Website session the patient was first captured in, where one could be matched. |\n| `source_ehr` | STRING | Source EHR | Practice-management system this patient record originated in. |\n| `external_ehr_id` | STRING | External EHR ID | Identifier for this patient in the originating system. |\n| `first_name` | STRING | First Name | Patient's given name. |\n| `last_name` | STRING | Last Name | Patient's family name. |\n| `phone` | STRING | Phone Number | Primary contact number for the patient. |\n| `email` | STRING | Email Address | Primary email address for the patient. |\n| `date_of_birth` | DATE | Date of Birth | Patient's date of birth, the basis for any age banding. |\n| `gender` | STRING | Gender | Patient's recorded gender. |\n| `country` | STRING | Country | Patient's country of residence. |\n| `language` | STRING | Language | Preferred language for communication: `en`, `fr` or `es`. |\n| `patient_type` | STRING | Patient Type | `new` for a first-time patient, `established` for a returning one. Control for this before comparing acceptance, attendance or value. |\n| `rfm_label` | STRING | RFM Segment | Recency, frequency and monetary segment: `new`, `promising`, `loyal`, `champions`, `at_risk` or `lost`. |\n| `recency_score` | INTEGER | Recency Score | Score for how recently the patient last attended. Kept so segment boundaries can be re-cut. |\n| `frequency_score` | INTEGER | Frequency Score | Score for how often the patient attends. |\n| `monetary_score` | INTEGER | Monetary Score | Score for how much the patient has spent. |\n| `ltv` | NUMERIC | Lifetime Value | Total revenue from this patient to date, in USD. |\n| `avg_visit_value` | NUMERIC | Average Visit Value | Average revenue per attended visit for this patient, in USD. |\n| `total_visits` | INTEGER | Total Visits | Number of visits this patient has attended. Reconciles with the attended rows in Visits. |\n| `first_visit_date` | DATE | First Visit Date | Date of the patient's first visit. |\n| `last_visit_date` | DATE | Last Visit Date | Date of the patient's most recent visit. |\n| `days_since_last_visit` | INTEGER | Days Since Last Visit | Whole days between the last visit and the reporting date. The recall trigger. |\n| `has_unused_plan` | BOOLEAN | Has Unused Plan | True when the patient has planned treatment that has not been delivered. |\n| `unused_plan_revenue` | NUMERIC | Unused Plan Revenue | Value of planned but undelivered treatment for this patient, in USD. |\n| `created_at` | TIMESTAMP | Created At | When the patient record was first created. |\n| `count_patients` | INTEGER | Patient Count | Always `1` on every row; SUM to count patients. |\n\n# Example Questions\n\n- How much planned treatment is sitting unused, which patients is it concentrated in, and what is that worth if we recall them?\n- Do patients acquired through paid channels reach the same lifetime value as those who arrived by referral, and how long does the gap take to close?\n- Which patients have slipped from loyal into at-risk on recency alone, and how much revenue does that segment represent?\n", "healthcare-clinic-network/provider": "---\ntitle: \"Provider\"\ndescription: |\n  The clinicians patients actually see: one row per provider, with the specialty they practise and\n  the location they practise at. \"Provider\" is the collective the industry uses for the physicians,\n  nurse practitioners and physician assistants who deliver care, and `specialty` is what makes this\n  mart load-bearing — it is the only place the model says whether a visit was primary care,\n  dermatology, orthopedics or behavioral health, and those service lines behave nothing alike on\n  revenue per visit or on how often patients fail to turn up. `is_active` distinguishes clinicians\n  currently practising from those who have left, so a provider who worked two months of the year is\n  not compared against one who worked twelve.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:02:24.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `provider_id` | STRING | Provider ID | PK. Unique identifier for this clinician. |\n| `clinic_id` | STRING | Clinic ID | Location this clinician practises at. FK to [Clinic](./clinic.md) |\n| `first_name` | STRING | First Name | Clinician's given name. |\n| `last_name` | STRING | Last Name | Clinician's family name. |\n| `specialty` | STRING | Specialty | Service line this clinician practises: `primary_care`, `dermatology`, `orthopedics`, `cardiology`, `pediatrics`, `physiotherapy`, `behavioral_health`. The only path from a visit to its service line. |\n| `email` | STRING | Email Address | Work email address for the clinician. |\n| `is_active` | BOOLEAN | Is Active | True while the clinician is still practising at the network. Filter on it before comparing providers, so a mid-period joiner is not read as underproductive. |\n\n# Example Questions\n\n- Which specialties carry the network's revenue, and which ones fill their schedules but bill little per `visit`?\n- Do no-show rates differ more between specialties or between locations — that is, is missed capacity a service-line problem or a site problem?\n- Are any locations relying on a single clinician within a specialty, so that one departure would remove that service line from that site entirely?\n\n## Joins\n\n- [Clinic](./clinic.md) — `clinic_id = clinic_id` [N:1] — The clinic the clinician works out of.\n", "healthcare-clinic-network/sessions": "---\ntitle: \"Sessions\"\ndescription: |\n  Every visit to the website, before anyone has identified themselves: one row per session, with\n  the campaign, keyword and ad creative that brought it, the page it landed on, the device it came\n  from and the city it came from. This is the widest mart in the model and the top of the\n  acquisition funnel — most sessions never become an enquiry, which is the point, because the ratio\n  between sessions and enquiries by landing page and channel is where wasted spend shows up. It\n  also records `consent_at`, so sessions that predate tracking consent can be separated from those\n  that carry it, and `patient_id` on the small minority of sessions the network could later tie\n  back to a known patient.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T13:47:16.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `session_id` | STRING | Session ID | PK. Unique identifier for this website session. |\n| `date` | DATE | Date | Calendar date the session occurred. The series to plot for traffic volume. Part of the join grain shared with Attribution. FK to [Attribution](./attribution.md) |\n| `source` | STRING | Source | Origin of the traffic, such as a search engine or social network. Part of the join grain shared with Attribution. FK to [Attribution](./attribution.md) |\n| `medium` | STRING | Medium | Traffic type, such as `cpc`, `organic`, `referral` or `(none)`. Part of the join grain shared with Attribution. FK to [Attribution](./attribution.md) |\n| `campaign` | STRING | Campaign | Marketing campaign that produced the session. Part of the join grain shared with Attribution. FK to [Attribution](./attribution.md) |\n| `ad_content` | STRING | Ad Content | Specific creative or ad variant the visitor clicked. |\n| `ad_group` | STRING | Ad Group | Ad group within the campaign. |\n| `channel_grouping` | STRING | Channel Grouping | Pre-rolled channel classification: `Paid Search`, `Paid Social`, `Organic Search`, `Direct`, `Referral`. The default grouping for channel reporting. |\n| `keyword` | STRING | Keyword | Search term that triggered the ad or organic result. |\n| `landing_page` | STRING | Landing Page | Page path the visitor first arrived on. Compare enquiry rates across these to find pages that attract volume but convert poorly. |\n| `landing_host_name` | STRING | Landing Host Name | Domain or subdomain the session started on. |\n| `url` | STRING | URL | Full web address of the landing page, including protocol and domain. |\n| `session_start` | TIMESTAMP | Session Start | Exact moment the session began. |\n| `consent_at` | TIMESTAMP | Consent Time | When the visitor granted tracking consent. NULL when no consent was recorded. |\n| `client_id` | STRING | Client ID | Browser-level identifier, used to tell devices apart. |\n| `user_id` | STRING | User ID | Known-user identifier, stable across sessions once the visitor is recognised. |\n| `country` | STRING | Country | Country the session originated from. Part of the join grain shared with Attribution, which is why including it makes each session resolve to exactly one attribution row rather than one per country. FK to [Attribution](./attribution.md) |\n| `region` | STRING | Region | State or province the visitor was in. |\n| `city` | STRING | City | City the visitor was in. |\n| `device_category` | STRING | Device Category | Hardware used: `Mobile`, `Desktop` or `Tablet`. |\n| `is_first_visitor_session` | BOOLEAN | Is First Visitor Session | True when this is the first session recorded for that visitor. |\n| `patient_id` | STRING | Patient ID | Always NULL. Sessions stay anonymous here by design — resolving one to a patient would need this mart to read Patients, closing a cycle back through Visits and Leads. The linkage lives on `Patients.session_id` and `Leads.session_id` instead, so join from those. |\n| `count_sessions` | INTEGER | Session Count | Always `1` on every row; SUM to count sessions. |\n\n# Example Questions\n\n- Which landing pages attract volume but produce almost no enquiries, and which quietly convert far above their share of traffic?\n- Does the mix of device and channel differ between the markets we operate in enough to change where the next dollar of spend should go?\n- What share of traffic arrives without tracking consent, and does excluding it change the channel picture we report?\n\n## Joins\n\n- [Attribution](./attribution.md) — `date = date`, `source = source`, `medium = medium`, `campaign = campaign`, `country = country` [N:1] — The acquisition funnel this visit rolls into.\n", "healthcare-clinic-network/visits": "---\ntitle: \"Visits\"\ndescription: |\n  Where the network earns: one row per appointment, from the moment it is put in the diary to\n  whatever became of it — attended, cancelled in advance, or simply not turned up to. Keeping\n  cancellations and no-shows apart is deliberate, because they are different problems with different\n  fixes: one gives the clinic a chance to refill the slot and the other does not. Each visit records\n  the clinician who delivered it and the service they delivered, the location and its currency, what\n  it billed both locally and converted, how the patient paid, and where the wider treatment plan\n  stood at the time. It is the only mart that carries revenue, so every question about money starts\n  here.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:20:36.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `visit_id` | STRING | Visit ID | PK. Unique identifier for this appointment. |\n| `patient_id` | STRING | Patient ID | Patient the appointment is for. FK to [Patients](./patients.md) |\n| `lead_id` | STRING | Lead ID | Enquiry that produced this appointment. NULL for established patients who booked without a fresh enquiry. FK to [Leads](./leads.md) |\n| `provider_id` | STRING | Provider ID | Clinician delivering the appointment. FK to [Provider](./provider.md) |\n| `clinic_id` | STRING | Clinic ID | Location the appointment takes place at. FK to [Clinic](./clinic.md) |\n| `visit_date` | DATE | Visit Date | Date the appointment is scheduled for. |\n| `visit_time` | TIME | Visit Time | Time of day the appointment is scheduled for. |\n| `visit_type` | STRING | Visit Type | `new_patient_visit` for a patient's first appointment, `follow_up` for a subsequent one. |\n| `status` | STRING | Status | What became of the appointment: `scheduled`, `completed`, `cancelled` (called off in advance) or `no_show` (not attended, no notice). The last two are distinct because only a cancellation lets the slot be refilled. |\n| `service_name` | STRING | Service | Service delivered at the appointment. |\n| `treatment_plan_status` | STRING | Treatment Plan Status | Where the patient's wider course of treatment stood: `none`, `active`, `partial`, `completed`, `unused`. |\n| `revenue_local` | NUMERIC | Revenue (Local) | Revenue billed, in the location's own currency. Only attended visits carry revenue. |\n| `currency` | STRING | Local Currency | Currency `revenue_local` is denominated in: `USD` or `CAD`. |\n| `revenue_normalized` | NUMERIC | Revenue (USD) | Revenue converted to USD. Use this for any figure spanning both markets. |\n| `fx_rate_to_usd` | NUMERIC | FX Rate to USD | Rate used to convert `revenue_local` into `revenue_normalized`. |\n| `payment_method` | STRING | Payment Method | How the visit was settled: `insurance`, `card`, `cash`, `online`, `payment_plan`. |\n| `created_at` | TIMESTAMP | Created At | When the appointment was booked. Compare against `visit_date` for booking lead time. |\n| `is_first_visit` | BOOLEAN | Is First Visit | True when this is the patient's first ever attendance at the network. |\n| `count_visits` | INTEGER | Visit Count | Always `1` on every row; SUM to count appointments. |\n\n# Example Questions\n\n- What is our no-show rate by location, specialty and clinician, and what revenue does the missed capacity represent over the period?\n- Which service lines earn most per attended visit, and how does that ranking change once cancellations and no-shows are counted against them?\n- Do `patients` paying through insurance attend more reliably than those paying out of pocket, and does that hold across both markets?\n\n## Joins\n\n- [Clinic](./clinic.md) — `clinic_id = clinic_id` [N:1] — The clinic where the visit happened.\n- [Leads](./leads.md) — `lead_id = lead_id` [N:1] — The enquiry this appointment came from.\n  - [Leads Clinic](./clinic.md) — The clinic the enquiry asked about, which can differ from where the visit happened.\n  - [Leads Patients](./patients.md) — The patient as the enquiry recorded them.\n  - [Leads Sessions](./sessions.md) — The website visit the enquiry came from.\n    - [Lead Attribution](./attribution.md) — The acquisition funnel behind the booked enquiry.\n- [Patients](./patients.md) — `patient_id = patient_id` [N:1] — The patient who attended.\n- [Provider](./provider.md) — `provider_id = provider_id` [N:1] — The clinician who saw the patient.\n  - [Provider Clinic](./clinic.md) — The clinician's home clinic, which can differ from where the visit happened.\n", "marketing-leadgen/account": "---\ntitle: \"Account\"\ndescription: |\n  One row per target company, the firmographic backbone the rest of the model hangs off. Every\n  account carries an industry, an employee-count band and a region, plus a flag marking whether\n  it sits on the account-based marketing (ABM) target list. Because real B2B deals belong to\n  accounts rather than to whichever individual filled out a form, this mart is the join point\n  that lets leads, opportunities and touchpoints be rolled up to \"who is this company, and how\n  big an opportunity is it.\"\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T17:34:31.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `account_id` | STRING | Account ID | PK. Unique identifier for the target company. |\n| `name` | STRING | Name | Company name. |\n| `industry` | STRING | Industry | Industry the company operates in. |\n| `employee_band` | STRING | Employee Band | Company-size bucket — the mid-market segmentation axis. Vocabulary: `1-50` / `51-200` / `201-1000` / `1000+`. |\n| `region` | STRING | Region | Geographic region of the company. |\n| `is_target_account` | BOOLEAN | Is Target Account | Whether the company is on the ABM target list. ~10–20% of accounts, skewed toward larger `employee_band`; target accounts show higher engagement, pipeline and win rate. |\n\n# Example Questions\n\n- How is the account base distributed across industries, company sizes and regions?\n- Do target accounts on the ABM list actually generate more pipeline and win more often than the rest of the book?\n- Which industries or employee bands should the target-account list be expanded into?\n", "marketing-leadgen/ad-spend": "---\ntitle: \"Ad Spend\"\ndescription: |\n  Daily cost, impressions and clicks for every paid campaign, broken out by ad group. This is\n  the cost side of the funnel — the numbers a demand-gen team reconciles against Google Ads,\n  LinkedIn Ads and other platform reports every week to know what a click, a lead and ultimately\n  a closed deal actually costs.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T17:34:31.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `spend_id` | STRING | Spend ID | PK. Unique identifier for each spend record. |\n| `spend_date` | DATE | Spend Date | Day the spend was incurred. Within the campaign's `[start_date, end_date]` flight. |\n| `campaign_id` | STRING | Campaign ID | Campaign this spend belongs to. FK to [Campaign](./campaign.md) |\n| `channel` | STRING | Channel | Marketing channel where the cost was spent. Denormalized copy of the campaign's `channel`. |\n| `ad_group` | STRING | Ad Group | Ad group or ad set within the campaign. |\n| `impressions` | INTEGER | Impressions | Number of times ads were shown. |\n| `clicks` | INTEGER | Clicks | Number of clicks the ads received. Always `≤ impressions`; CTR by channel. |\n| `cost` | NUMERIC | Cost | Money spent on this ad group for the day (USD). Derived from clicks × per-channel CPC. |\n\n# Example Questions\n\n- What is the blended and per-channel CPC and CTR, and how do they trend week over week?\n- Which `campaigns` or ad groups are burning budget without matching traffic or click performance?\n- How does cost per `lead` and cost per `opportunity` compare across channels once spend is joined to downstream conversions?\n\n## Joins\n\n- [Campaign](./campaign.md) — `campaign_id = campaign_id` [N:1] — The campaign this spend was bought for.\n", "marketing-leadgen/campaign": "---\ntitle: \"Campaign\"\ndescription: |\n  Reference of every marketing initiative run — paid and non-paid alike, from search and social\n  ads to email nurtures, webinars and content syndication — each carrying its channel, its\n  objective and the UTM tags that tie it back to ad-platform and web-analytics data. This is the\n  conformed campaign dimension of the model: every channel value that shows up on ad spend, web\n  sessions, touchpoints or opportunities agrees with what is declared here, so a channel-level\n  report never splits into phantom categories.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T17:34:31.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `campaign_id` | STRING | Campaign ID | PK. Unique identifier for each campaign. |\n| `campaign_name` | STRING | Campaign Name | Human-readable name of the campaign. |\n| `channel` | STRING | Channel | Marketing channel. Controlled vocabulary: `paid_search`, `paid_social`, `display`, `organic_search`, `email`, `webinar`, `content_syndication`, `direct`, `referral`. |\n| `objective` | STRING | Objective | Primary goal. One of: `awareness`, `lead_generation`, `conversion`, `retargeting`. |\n| `utm_source` | STRING | UTM Source | UTM source tag identifying where the traffic originates. |\n| `utm_medium` | STRING | UTM Medium | UTM medium tag describing the type of traffic (e.g. cpc, email). |\n| `utm_campaign` | STRING | UTM Campaign | UTM campaign tag — the key ad-platform ↔ web-analytics join key. |\n| `start_date` | DATE | Start Date | Date the campaign went live. |\n| `end_date` | DATE | End Date | Date the campaign flight ended (nullable for always-on). Spend/touches fall within `[start_date, end_date]`. |\n\n# Example Questions\n\n- How many campaigns are running per channel and objective, and how does that mix shift over time?\n- Which campaigns are actively in-flight versus always-on programs like nurture or content syndication?\n- How does spend, traffic and pipeline performance compare across campaigns that share the same objective (e.g. all lead-generation campaigns)?\n", "marketing-leadgen/lead": "---\ntitle: \"Lead\"\ndescription: |\n  One row per lead or contact captured by marketing, carrying where they came from, their\n  fit-and-engagement score, the dated milestones marking when they became marketing-qualified\n  (MQL) and sales-qualified (SQL), and firmographics that mirror the account they belong to.\n  Because the qualification milestones are dated rather than just a current-state label, leads\n  can be grouped into cohorts — \"leads created in March\" — and tracked through the funnel over\n  time, not just counted at a single point.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T17:34:32.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `lead_id` | STRING | Lead ID | PK. Unique identifier for each lead or contact. |\n| `account_id` | STRING | Account ID | Company the lead belongs to; null for a lead not yet matched to an account. FK to [Account](./account.md) |\n| `created_at` | TIMESTAMP | Created At | When the lead first entered the system (coincides with the `is_lead_create` touchpoint). |\n| `source_channel` | STRING | Source Channel | Channel that first brought in the lead. Equals the channel of the lead's `is_lead_create` touchpoint. Same controlled vocabulary as [Campaign](./campaign.md)`.channel`. |\n| `lead_score` | INTEGER | Lead Score | Fit + engagement score for MQL gating. |\n| `became_mql_at` | TIMESTAMP | Became Mql At | When the lead reached marketing-qualified status; null if never MQL. `created_at ≤ became_mql_at`. |\n| `became_sql_at` | TIMESTAMP | Became Sql At | When the lead reached sales-qualified status; null if never SQL. `became_mql_at ≤ became_sql_at`. |\n| `employee_band` | STRING | Employee Band | Company-size bucket. Same vocabulary as [Account](./account.md)`.employee_band`: `1-50` / `51-200` / `201-1000` / `1000+`. For matched leads, agrees with the account. |\n| `industry` | STRING | Industry | Industry the lead's company operates in. For matched leads, agrees with the account. |\n| `country` | STRING | Country | Country where the lead is located; consistent with the account's `region`. |\n| `lifecycle_stage` | STRING | Lifecycle Stage | `subscriber` / `lead` / `MQL` / `SQL` / `opportunity` / `customer`. Consistent with the `became_*_at` timestamps and with the existence of an [Opportunities](./opportunities.md) row. |\n\n# Example Questions\n\n- What is the lead-to-MQL and MQL-to-SQL conversion rate, and how many days does each `stage` typically take?\n- Which source channels and industries produce the highest-scoring, fastest-qualifying leads?\n- How much of the funnel is unmatched to an `account`, and does that share differ by source channel?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id` [N:1] — The company the lead works for.\n", "marketing-leadgen/opportunities": "---\ntitle: \"Opportunities\"\ndescription: |\n  One row per sales opportunity — the deal object, keyed to the account rather than a single\n  lead, since real B2B buying committees involve multiple people. Each row carries the pipeline\n  stage, the deal size (ACV), the sourcing lead and campaign, and the win/loss outcome with\n  close date and sales-cycle length. This is where marketing-sourced pipeline turns into — or\n  fails to turn into — closed revenue.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:19:58.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `opportunity_id` | STRING | Opportunity ID | PK. Unique identifier for each sales opportunity. |\n| `account_id` | STRING | Account ID | Account the deal belongs to — the primary spine. FK to [Account](./account.md) |\n| `lead_id` | STRING | Lead ID | Sourcing/converting lead the opportunity originated from; nullable. FK to [Lead](./lead.md) |\n| `primary_campaign_id` | STRING | Primary Campaign ID | Primary Campaign Source (single-touch sourcing); nullable. Equals the campaign of the sourcing lead's `is_lead_create` touchpoint. FK to [Campaign](./campaign.md) |\n| `created_at` | TIMESTAMP | Created At | When the opportunity was created. |\n| `stage` | STRING | Stage | Current pipeline stage. One of: `discovery`, `demo`, `proposal`, `negotiation`, `closed_won`, `closed_lost`. |\n| `amount` | NUMERIC | Amount | ACV / deal size (USD). Correlates with the account's `employee_band`. |\n| `close_date` | DATE | Close Date | Date the opportunity was won or lost; null while open. |\n| `is_won` | BOOLEAN | Is Won | True iff `stage = closed_won` (then `close_date` is set); false with a `close_date` means `closed_lost`. |\n| `sales_cycle_days` | INTEGER | Sales Cycle Days | `DATE_DIFF(close_date, created_at, DAY)` for closed deals; null while open. |\n| `owner` | STRING | Owner | Sales rep who owns the opportunity (drawn from a small stable roster). |\n\n# Example Questions\n\n- What is the win rate and average sales cycle by deal size, industry or `account` segment?\n- Which `accounts`, `campaigns` or reps are driving the most pipeline and revenue?\n- Do target (ABM) `accounts` close bigger and faster deals than non-target accounts?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id` [N:1] — The company the deal is with.\n- [Campaign](./campaign.md) — `primary_campaign_id = campaign_id` [N:1] — The campaign credited with sourcing the deal.\n- [Lead](./lead.md) — `lead_id = lead_id` [N:1] — The lead the deal grew out of.\n  - [Lead Account](./account.md) — The lead's own company, which can differ from the account the deal is booked to.\n", "marketing-leadgen/stage-transitions": "---\ntitle: \"Stage Transitions\"\ndescription: |\n  One row per pipeline stage change for a sales opportunity, tracing each deal's path through\n  discovery, demo, proposal and negotiation on the way to a win or a loss. The time spent in\n  each stage before moving to the next is the raw material for bottleneck analysis — where deals\n  get stuck, and for how long.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:19:59.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `transition_id` | STRING | Transition ID | PK. Unique identifier for the stage change. |\n| `opportunity_id` | STRING | Opportunity ID | Opportunity that moved stage. FK to [Opportunities](./opportunities.md) |\n| `from_stage` | STRING | From Stage | Stage the opportunity left. |\n| `to_stage` | STRING | To Stage | Stage the opportunity entered. Contiguous chain: `to_stage` of row n = `from_stage` of row n+1; the last `to_stage` equals `Opportunities.stage`. |\n| `transitioned_at` | TIMESTAMP | Transitioned At | When the stage change happened. Within `[Opportunities.created_at, close_date]`. |\n| `days_in_from_stage` | INTEGER | Days In From Stage | Days spent in the previous stage — the velocity bottleneck driver. Sums (per opportunity) to the sales cycle for closed deals. |\n\n# Example Questions\n\n- Which pipeline stage is the biggest bottleneck, and does that differ for won versus lost deals?\n- How long, on average, does a deal spend in proposal or negotiation before closing?\n- How often do `opportunities` move backward a stage, and does that predict a lower win rate?\n\n## Joins\n\n- [Opportunities](./opportunities.md) — `opportunity_id = opportunity_id` [N:1] — The deal that moved stage.\n  - [Opportunities Account](./account.md) — The company whose deal moved stage.\n  - [Opportunities Campaign](./campaign.md) — The campaign credited with the moving deal.\n  - [Opportunities Lead](./lead.md) — The lead behind the moving deal.\n    - [Opportunities Lead Account](./account.md) — The company of the lead behind the moving deal.\n", "marketing-leadgen/touchpoints": "---\ntitle: \"Touchpoints\"\ndescription: |\n  One row per marketing touch a lead has on the way to becoming a customer, credited under a\n  W-shaped multi-touch attribution model that splits credit 30% to the first touch, 30% to lead\n  creation, 30% to opportunity creation and 10% across everything in between. This is the mart\n  that answers \"which channels and campaigns actually deserve credit,\" rather than crediting\n  only the first click or the last one.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:19:59.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `touchpoint_id` | STRING | Touchpoint ID | PK. Unique identifier for each marketing touch. |\n| `lead_id` | STRING | Lead ID | Lead that this touch belongs to. FK to [Lead](./lead.md) |\n| `campaign_id` | STRING | Campaign ID | Campaign associated with this touch. FK to [Campaign](./campaign.md) |\n| `occurred_at` | TIMESTAMP | Occurred At | When the touch happened. |\n| `channel` | STRING | Channel | Channel where the touch occurred. Equals the campaign's `channel`; same controlled vocabulary as [Campaign](./campaign.md)`.channel`. |\n| `touch_type` | STRING | Touch Type | Kind of interaction. One of: `ad_click`, `form_fill`, `email_open`, `email_click`, `webinar_attend`, `content_download`, `demo_request`. Consistent with `channel` (e.g. no `email_open` on `paid_search`). |\n| `touch_credit` | FLOAT | Touch Credit | W-shaped credit for this touch. Sums to exactly 1.0 per lead: 30% first touch, 30% lead creation, 30% opportunity creation, 10% across middle touches. |\n| `is_first_touch` | BOOLEAN | Is First Touch | True on the lead's earliest touch (exactly one per lead). W-shaped anchor. |\n| `is_lead_create` | BOOLEAN | Is Lead Create | True on the touch that created the lead (exactly one per lead; coincides with `Lead.created_at`). W-shaped anchor. |\n| `is_opp_create` | BOOLEAN | Is Opp Create | True on the touch that created the opportunity (at most one per lead; only for leads with an opportunity; coincides with `Opportunities.created_at`). W-shaped anchor. |\n\n# Example Questions\n\n- Which channels and `campaigns` earn the most attributed credit across the full buyer journey, not just first- or last-touch?\n- How many touches, and of what type, does a typical `lead` have before becoming an `opportunity`?\n- How does attributed pipeline by `campaign` compare to what a single-touch (first- or last-touch) view would show?\n\n## Joins\n\n- [Campaign](./campaign.md) — `campaign_id = campaign_id` [N:1] — The campaign that produced this touch.\n- [Lead](./lead.md) — `lead_id = lead_id` [N:1] — The lead who was touched.\n  - [Lead Account](./account.md) — The company of the touched lead.\n", "marketing-leadgen/web-sessions": "---\ntitle: \"Web Sessions\"\ndescription: |\n  One row per web session, the very top of the funnel, before most visitors are ever identified\n  as a lead. Each session records the traffic source and medium, the landing page, whether it\n  converted into a form submission, and — for the small share of visitors identified through\n  identity stitching — the lead that session belongs to. Because the overwhelming majority of\n  B2B web traffic never converts or gets identified, most sessions carry no lead at all; the\n  ones that do show exactly where anonymous traffic turns into a known contact.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:20:00.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `session_id` | STRING | Session ID | PK. Unique identifier for the web session. |\n| `lead_id` | STRING | Lead ID | Known lead after identity stitching; null for never-identified visitors (the overwhelming majority). FK to [Lead](./lead.md) |\n| `started_at` | TIMESTAMP | Started At | When the session began. |\n| `campaign_id` | STRING | Campaign ID | Campaign that drove the session; null for organic/direct. FK to [Campaign](./campaign.md) |\n| `source` | STRING | Source | Traffic source that referred the session; consistent with the driving campaign's `utm_source`. |\n| `medium` | STRING | Medium | Marketing medium (e.g. organic, cpc, email); consistent with the driving campaign's `utm_medium`. |\n| `landing_page` | STRING | Landing Page | First page viewed in the session. |\n| `form_submits` | INTEGER | Form Submits | Number of forms submitted during the session. `≥ 1` when `is_conversion` is true. |\n| `is_conversion` | BOOLEAN | Is Conversion | Whether the session produced a lead or demo request. Session→lead conversion ~1–3% overall, lowest on paid social. |\n\n# Example Questions\n\n- What is the session-to-lead conversion rate by channel and landing page, and which channels are strongest at the top of the funnel?\n- Which `campaigns` drive the most traffic volume, and how does that traffic's conversion quality compare across them?\n- How much of paid versus organic/direct traffic actually results in a form submission?\n\n## Joins\n\n- [Campaign](./campaign.md) — `campaign_id = campaign_id` [N:1] — The campaign that drove the visit.\n- [Lead](./lead.md) — `lead_id = lead_id` [N:1] — The lead this visit was later tied to.\n  - [Lead Account](./account.md) — The company of the lead this visit belongs to.\n", "marketplace/buyer": "---\ntitle: \"Buyer\"\ndescription: |\n  The demand side of the marketplace: one row per registered buyer, carrying how they were\n  acquired, where they are, and how much they have transacted. Lifetime order count and a\n  repeat flag make demand-side retention a first-class field — most buyers place a single\n  order and never return, and the share who come back for a second is the health number\n  every marketplace watches.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-27T15:57:43.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `buyer_id` | STRING | Buyer ID | PK. Unique buyer identifier. |\n| `signup_date` | DATE | Signup Date | When the buyer first registered. |\n| `acquisition_channel` | STRING | Acquisition Channel | Marketing source that brought the buyer in. |\n| `region` | STRING | Region | Buyer's geographic region. |\n| `segment` | STRING | Segment | Buyer segment (one-time, occasional, regular, power). |\n| `lifetime_orders` | INTEGER | Lifetime Orders | Total orders the buyer has placed to date. |\n| `is_repeat` | BOOLEAN | Is Repeat | Whether the buyer has placed 2+ orders — demand-side retention. |\n\n# Example Questions\n\n- What share of buyers ever place a second `order`, and how does that repeat rate differ by acquisition channel or region?\n- Which channels bring in buyers who go on to `order` repeatedly, versus one-and-done?\n- How concentrated is demand — what fraction of all `orders` comes from repeat buyers?\n", "marketplace/cancellations": "---\ntitle: \"Cancellations\"\ndescription: |\n  One row for every order that was cancelled — and only those. Each row records who pulled\n  the plug (buyer, seller or platform), at which stage (pre-payment, pre-fulfilment or\n  in-transit), the stated reason, and how much was refunded. Because refund magnitude scales\n  with stage — near zero pre-payment, close to full once fulfilment is underway — this is\n  where an ops or trust-and-safety lead finds the fixable concentration of fill-rate failures.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:20:50.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `cancellation_id` | STRING | Cancellation ID | PK. Unique cancellation identifier. |\n| `order_id` | STRING | Order ID | Order that was cancelled. FK to [Orders](./orders.md) |\n| `cancelled_at` | TIMESTAMP | Cancelled At | When the cancellation happened. |\n| `cancelled_by` | STRING | Cancelled By | Who cancelled: buyer, seller or platform. |\n| `stage` | STRING | Stage | Order stage at cancellation: pre-payment, pre-fulfilment or in-transit. |\n| `reason` | STRING | Reason | Stated cancellation reason. |\n| `refund_amount` | NUMERIC | Refund Amount | Amount refunded to the buyer (never more than the order's gmv). |\n\n# Example Questions\n\n- Are cancellations concentrated in a stage or reason we can actually fix, and who is driving them — `buyers`, `sellers` or our own platform?\n- What is the refund exposure by `category`, and how does it track the cancellation stage mix?\n- Which `sellers` cancel disproportionately, hurting the `buyer` experience?\n\n## Joins\n\n- [Orders](./orders.md) — `order_id = order_id` [N:1] — The order that was cancelled.\n  - [Orders Buyer](./buyer.md) — The buyer whose order was cancelled.\n  - [Orders Category](./category.md) — The category of the cancelled order.\n  - [Orders Listings](./listings.md) — The listing that was cancelled.\n    - [Listing Category](./category.md) — The category the cancelled listing is filed under.\n    - [Listing Seller](./seller.md) — The seller who owns the cancelled listing.\n      - [Listing Seller Category](./category.md) — The primary category of that listing's seller.\n  - [Orders Seller](./seller.md) — The seller whose sale was cancelled.\n    - [Seller Category](./category.md) — The primary category of the seller who lost the sale.\n", "marketplace/category": "---\ntitle: \"Category\"\ndescription: |\n  The category tree every listing and order is filed under, and — crucially — the standard\n  take rate the platform charges on sales in each category. Take rate is the biggest lever a\n  category manager holds: raise it and revenue per order rises, but the sellers in that\n  category feel the squeeze. Rates follow real marketplace norms — physical goods sit lower\n  (8–15%), while services and premium or handmade categories carry a higher cut (15–22%).\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-29T14:32:48.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `category_id` | STRING | Category ID | PK. Unique category identifier. |\n| `name` | STRING | Name | Display name of the category. |\n| `parent_category` | STRING | Parent Category | Parent grouping in the category tree (Goods, Media, Services). |\n| `take_rate_pct` | FLOAT | Take Rate % | Platform's standard commission for the category, as a percent (e.g. 12.0 = 12%) — the take-rate optimisation lever. |\n\n# Example Questions\n\n- Which categories carry the highest take rate, and is that where our GMV actually sits?\n- If we lifted the take rate two points in a low-rate goods category, how much extra platform revenue would last quarter's `orders` have produced?\n- How does the blended effective take rate across all `orders` compare with the headline rate of our largest categories?\n", "marketplace/listings": "---\ntitle: \"Listings\"\ndescription: |\n  One row per listing, the unit of supply a buyer actually orders. Each listing belongs to a\n  seller and a category and carries a price and an availability state. The count of live\n  listings per seller is exactly that seller's active inventory, which makes this the\n  backbone behind every order's price and category — and the first place to look when demand\n  arrives and finds nothing to buy.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:20:49.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `listing_id` | STRING | Listing ID | PK. Unique listing identifier. |\n| `seller_id` | STRING | Seller ID | Seller that owns the listing. FK to [Seller](./seller.md) |\n| `created_at` | TIMESTAMP | Created At | When the listing was created. |\n| `category_id` | STRING | Category ID | Category the listing belongs to. FK to [Category](./category.md) |\n| `price` | NUMERIC | Price | Listed price of the offer. |\n| `status` | STRING | Status | Current listing status: active, paused, sold_out or removed. |\n| `is_available` | BOOLEAN | Is Available | Whether the listing is live inventory — supply availability. |\n\n# Example Questions\n\n- Which `categories` are thin on live inventory relative to the demand searching for them — where is supply the bottleneck?\n- How does listing price distribution differ across `categories`, and does it track the category take rate?\n- What share of listings ever converts into an `order`, by `category` and `seller`?\n\n## Joins\n\n- [Category](./category.md) — `category_id = category_id` [N:1] — The category this listing is filed under.\n- [Seller](./seller.md) — `seller_id = seller_id` [N:1] — The seller who owns this listing.\n  - [Seller Category](./category.md) — The seller's primary category, which can differ from the listing's.\n", "marketplace/orders": "---\ntitle: \"Orders\"\ndescription: |\n  The match at the heart of the marketplace: one row per order placed, tying a buyer to a\n  seller's listing. It carries the full transaction economics — gross merchandise value, the\n  category take rate, the platform's cut and the reciprocal seller payout. Revenue is\n  recognised only on orders that settle: a cancelled order keeps its booked GMV for funnel\n  analysis while its net GMV, platform revenue and seller payout all fall to zero, so gross\n  and net are never confused.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:20:49.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `order_id` | STRING | Order ID | PK. Unique order identifier. |\n| `buyer_id` | STRING | Buyer ID | Buyer on the order. FK to [Buyer](./buyer.md) |\n| `seller_id` | STRING | Seller ID | Seller on the order (always the listing's owner). FK to [Seller](./seller.md) |\n| `listing_id` | STRING | Listing ID | Listing that was purchased. FK to [Listings](./listings.md) |\n| `category_id` | STRING | Category ID | Category of the purchased listing, denormalised for slicing. FK to [Category](./category.md) |\n| `ordered_at` | TIMESTAMP | Ordered At | When the order was placed. |\n| `quantity` | INTEGER | Quantity | Units ordered (gmv = listing price × quantity). |\n| `gmv` | NUMERIC | GMV | Gross merchandise value booked for the order. |\n| `take_rate` | FLOAT | Take Rate | Platform's cut as a fraction of GMV (= category take_rate_pct / 100). |\n| `platform_revenue` | NUMERIC | Platform Revenue | Platform's recognised revenue (gmv × take_rate; zero if cancelled). |\n| `seller_payout` | NUMERIC | Seller Payout | Seller's take-home (gmv − platform_revenue; zero if cancelled). |\n| `net_gmv` | NUMERIC | Net GMV | GMV net of cancellations (equal to gmv unless cancelled, then zero). |\n| `status` | STRING | Status | Order status: pending, fulfilled or cancelled. |\n| `is_fulfilled` | BOOLEAN | Is Fulfilled | Whether the order was fulfilled. |\n| `fulfillment_mins` | FLOAT | Fulfillment Mins | Order-to-fulfilment time in minutes — fill speed (null unless fulfilled). |\n\n# Example Questions\n\n- What is our net GMV and net take after `cancellations`, and how far does it sit below the gross headline?\n- Which `categories` and `sellers` produce the most platform revenue, and how does seller payout move as take rate changes?\n- How fast are orders fulfilled, and how does fill speed vary by `seller` fulfilment type or `category`?\n\n## Joins\n\n- [Buyer](./buyer.md) — `buyer_id = buyer_id` [N:1] — The buyer who placed this order.\n- [Category](./category.md) — `category_id = category_id` [N:1] — The category this order is filed under.\n- [Listings](./listings.md) — `listing_id = listing_id` [N:1] — The listing that was ordered.\n  - [Listing Category](./category.md) — The category the listing is filed under, which can differ from the order's.\n
