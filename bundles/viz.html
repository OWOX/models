al_withdrawals_normalized` — net money the client has put in. |\n| `deposit_count` | INTEGER | Deposit Count | Number of completed deposit transactions made by this client — the RFM \"frequency\" input. |\n| `last_deposit_date` | DATE | Last Deposit Date | Date of the client's most recent completed deposit. |\n| `days_since_last_deposit` | FLOAT | Days Since Last Deposit | Days elapsed since `last_deposit_date` — the RFM \"recency\" input; also drives `client_segment` (e.g. `dormant`, `churned`). |\n| `days_since_ftd` | FLOAT | Days Since Ftd | Days elapsed since the client's first deposit — client \"age\" in the system. |\n| `ltv` | FLOAT | LTV | Lifetime value in USD — equal to `total_deposits_normalized`. Use for \"what is the LTV of clients acquired via X\" questions. |\n| `recency_score` | FLOAT | Recency Score | RFM recency score, 1-5 (5 = deposited most recently). Derived from `days_since_last_deposit`. |\n| `frequency_score` | FLOAT | Frequency Score | RFM frequency score, 1-5 (5 = most deposits). Derived from `deposit_count`. |\n| `monetary_score` | FLOAT | Monetary Score | RFM monetary score, 1-5 (5 = highest `net_deposits`). |\n| `client_segment` | STRING | Client Segment | Behavioural lifecycle segment, already computed: `active_trader`, `dormant`, `ftd_only`, `churned`, `registered_no_ftd`, `new`. Use this directly for \"give me churned/dormant clients\" questions instead of recomputing from date fields. |\n| `rfm_label` | STRING | Rfm Label | RFM marketing segment, already computed: `champions`, `loyal`, `at_risk`, `lost`, `new`, `promising`. `lost` specifically means the client's most recent contact (see Communications) was an unanswered/unsuccessful call. |\n| `data_source` | STRING | Data Source | `App` or `Web` — the surface this client was first acquired on. |\n\n# Example Questions\n\n- How long does a newly registered client take to make a `first deposit` and then to place a first trade, and how does that lag differ by region and by whether they came in through the app or the web?\n- Where is identity verification costing us money — how many clients sit unverified or rejected without ever depositing, and what is the lifetime value of the ones who do get through?\n- How concentrated is our `deposit base` — what share of total lifetime value sits with champions rather than at-risk clients, and how large is the pool that registered but never funded?\n", "trading/communications": "---\ntitle: \"Communications\"\ndescription: |\n  Every conversation between the sales desk and the people it is trying to convert: one row\n  per contact attempt across calls, email, SMS, live chat and messengers, recording who\n  handled it, whether the desk reached out or the client got in touch, and whether the attempt\n  actually landed or went unanswered. Rows are flagged as the first and the most recent\n  contact with a person and as sales-driven rather than servicing, so the shape of a\n  relationship — how many attempts it took before someone answered, when the desk last got\n  through, and whether the last thing that happened was silence — can be read without\n  reconstructing the timeline. This is where the human half of the funnel lives, next to the\n  forms and the deposits.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:05:12.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `communication_id` | STRING | Communication ID | PK. Unique communication-event identifier. |\n| `client_id` | STRING | Client ID | — despite the name, this is the client the communication was with (legacy CRM field name, equivalent to `client_id` elsewhere). FK to [Clients](./clients.md) |\n| `agent_id` | STRING | Agent ID | Internal identifier of the agent who handled this communication. Not a foreign key to another mart in this model. |\n| `lead_id` | STRING | Lead ID | The lead this communication relates to, if any. NULL for post-registration servicing contacts. FK to [Leads](./leads.md) |\n| `channel` | STRING | Channel | Channel used: `call`, `email`, `sms`, `live_chat`, `whatsapp`, `telegram`. |\n| `direction` | STRING | Direction | `inbound` (client-initiated) or `outbound` (agent-initiated). |\n| `status` | STRING | Status | Outcome: `successful` or `unsuccessful` (no answer / bounced / failed). This field, combined with `is_last`, is what drives Clients.rfm_label = `lost`. |\n| `subject` | STRING | Subject | Topic/subject line. NULL for phone calls. |\n| `text` | STRING | Text | Message body or call notes, if recorded. |\n| `autoreply` | STRING | Autoreply | Content of any triggered automated reply. NULL if none was sent. |\n| `communication_date` | DATE | Communication Date | Calendar date of the communication. |\n| `is_first` | BOOLEAN | Is First | `\"true\"`/`\"false\"` boolean flag — first ever communication with this client. |\n| `is_last` | BOOLEAN | Is Last | `\"true\"`/`\"false\"` boolean flag — most recent communication with this client. A `\"true\"` row with `channel = 'call'` and `status = 'unsuccessful'` is what marks a client `lost` in Clients.rfm_label. |\n| `is_sales` | BOOLEAN | Is Sales | `\"true\"`/`\"false\"` boolean flag — flagged as a sales-focused interaction. |\n| `is_last_sales` | BOOLEAN | Is Last Sales | `\"true\"`/`\"false\"` boolean flag — most recent sales-flagged communication with this client. |\n| `count_communications` | INTEGER | Count Communications | Always `1` on every row; SUM to count communications matching a filter. |\n\n# Example Questions\n\n- How many attempts does the desk make before someone answers, and which channels reach people that the phone does not?\n- Where do outbound calls go unanswered most — by channel and by agent, and how does that compare with the contacts `clients` start themselves?\n- How many people have gone quiet on us, in the sense that their most recent contact was an unsuccessful outbound attempt rather than a successful conversation?\n\n## Joins\n\n- [Clients](./clients.md) — `client_id = client_id`\n- [Leads](./leads.md) — `lead_id = lead_id`\n", "trading/deposits": "---\ntitle: \"Deposits\"\ndescription: |\n  The money ledger: one row per funding transaction, money in and money out, tied to the\n  client, the trading account it moved through and the lead the client originally came from.\n  Each transaction carries its amount in the currency it was made in and converted to USD, the\n  rate used at the time, the payment method behind it — card, wire, crypto or an e-wallet —\n  and a processing status, because a meaningful share of attempted funding never completes:\n  it fails, is reversed or is cancelled, and counting those as revenue overstates the business.\n  One row per client is flagged as that client's first ever deposit, which is where the\n  acquisition funnel finally turns into cash.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:05:13.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `deposit_id` | STRING | Deposit ID | PK. Unique transaction identifier. |\n| `client_id` | STRING | Client ID | FK to [Clients](./clients.md) |\n| `account_id` | STRING | Account ID | The specific trading account the money moved into/out of. FK to [Trading Accounts](./trading-accounts.md) |\n| `lead_id` | STRING | Lead ID | This client's originating lead. NULL if not traceable. FK to [Leads](./leads.md) |\n| `deposit_datetime` | TIMESTAMP | Deposit Datetime | Timestamp the transaction was initiated. |\n| `transaction_type` | STRING | Transaction Type | `deposit` (money in) or `withdrawal` (money out). Filter on this before summing amounts — don't sum deposits and withdrawals together. |\n| `is_ftd` | BOOLEAN | Is Ftd | True only for the single row that is this client's very first-ever deposit. Row-level equivalent of Clients.is_ftd (which is a per-client flag, not per-transaction). |\n| `status` | STRING | Status | Processing status: `pending`, `completed`, `failed`, `reversed`, `cancelled`. Attempted rows carry their own `payment_method`, `currency`, `amount_local` and `exchange_rate`, so payment friction can be measured and valued; only `amount_normalized` is completion-gated — always filter `status = 'completed'` before summing revenue. |\n| `amount_local` | FLOAT | Amount Local | Transaction amount in its original currency. Populated on attempted transactions too — a failed or pending payment has an amount — so `amount_local * exchange_rate` is the USD value of money that never arrived. For cross-currency totals of money that DID arrive use `amount_normalized`. |\n| `currency` | STRING | Currency | Original transaction currency, taken from the account the money moved through. Populated on attempted transactions too. |\n| `amount_normalized` | FLOAT | Amount Normalized | Transaction amount converted to USD. NULL unless `status = 'completed'` — the one completion-gated money column, so unarrived money can never reach a revenue total. SUM this (filtered to `transaction_type = 'deposit'`, `status = 'completed'`) for \"deposit volume\"/\"revenue\" questions. |\n| `exchange_rate` | FLOAT | Exchange Rate | Conversion rate captured at transaction time; `1.0` on USD rows. Populated on attempted transactions too. |\n| `payment_method` | STRING | Payment Method | `card`, `wire_transfer`, `crypto`, `skrill`, `neteller`, `paypal`. Populated on attempted transactions too — the rail a failed payment was attempted on is the point of asking — so failure rates are comparable across methods. |\n| `country` | STRING | Country | Client's country at the time of the transaction. |\n| `created_at` | TIMESTAMP | Created At | Record creation timestamp in the warehouse. |\n| `count_deposits` | INTEGER | Count Deposits | Always `1` on every row; SUM to count transactions matching a filter (e.g. count of completed deposits). |\n\n# Example Questions\n\n- Which payment methods fail or get reversed most often, and how much money never actually arrives because of it?\n- How does a `client`'s first deposit compare in size to everything they deposit afterwards, and does that depend on how they paid?\n- What is our net money flow by month once withdrawals are set against completed deposits, and which countries are net outflows?\n\n## Joins\n\n- [Clients](./clients.md) — `client_id = client_id`\n- [Leads](./leads.md) — `lead_id = lead_id`\n- [Trading Accounts](./trading-accounts.md) — `account_id = account_id`\n", "trading/leads": "---\ntitle: \"Leads\"\ndescription: |\n  The moment a visitor stops being anonymous: one row per short-form submission, the handful\n  of contact details someone leaves on a landing page before anyone has spoken to them. Each\n  row keeps the page and the session that produced it, the email and phone the desk will call,\n  the system that captured it — a website form, the app, a chatbot or an affiliate — and the\n  stage the lead has reached since, from contacted through the full registration to a first\n  deposit and a first trade, or else no answer and rejection with a stated reason. This is the\n  top of the sales funnel, and the only place where the leads that were never reached at all\n  are visible next to the ones that converted.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:05:12.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `lead_id` | STRING | Lead ID | PK. Unique identifier for this short-form submission. |\n| `session_id` | STRING | Session ID | The session during which this form was submitted. NULL if no session could be matched (e.g. affiliate-referred leads entered outside the web funnel). FK to [Sessions](./sessions.md) |\n| `client_id` | STRING | Client ID | Set only once this lead converts into a registered client. NULL until then — use `IS NOT NULL` to filter \"converted leads\". FK to [Clients](./clients.md) |\n| `short_form_submitted_at` | TIMESTAMP | Short Form Submitted At | Timestamp the form was submitted. Use for lead-volume trends over time. |\n| `landing_page` | STRING | Landing Page | Landing page path where the form was filled. Matches Sessions.landing_page for the same session. |\n| `country` | STRING | Country | Country of the lead, from IP geolocation or form input. |\n| `language` | STRING | Language | Browser / form language of the lead. |\n| `email` | STRING | Email | Email entered in the form — identity bridge key that later matches Clients.email. |\n| `phone` | STRING | Phone | Phone entered in the form. |\n| `status` | STRING | Status | Current funnel stage of this lead: `contacted`, `long_form`, `ftd`, `ntc`, `no_answer`, `rejected`. Use this to answer \"how many leads reached X stage\" without needing to join Clients — though `ftd`/`ntc` status here should match `Clients.is_ftd`/`is_ntc` for the linked client_id. |\n| `rejection_reason` | STRING | Rejection Reason | Why the lead was rejected. NULL unless `status = 'rejected'`. |\n| `form_type` | STRING | Form Type | Always `\"short\"` in this mart — it only captures short-form submissions (the fuller registration is tracked as Clients.registration_date / the `long_form` status, not a separate row here). |\n| `source_system` | STRING | Source System | System that captured this lead: `website_form`, `app_form`, `affiliate`, `chatbot`. |\n| `is_manual_entry` | BOOLEAN | Is Manual Entry | True if a staff member entered this lead manually rather than it being captured automatically from a form. |\n| `created_at` | TIMESTAMP | Created At | Record creation timestamp in the warehouse. |\n| `count_leads` | INTEGER | Count Leads | Always `1` on every row; SUM to count leads — this is the \"Short Form\" / \"Profile Short Form\" metric seen in dashboards. |\n\n# Example Questions\n\n- What share of the leads we buy is the desk never able to reach, and does that dead share depend on the country or the system that captured them?\n- Which landing pages produce leads that go all the way to a funded, `trading account` rather than just volume at the top?\n- Why do we reject leads, and are the ones staff enter by hand rejected more often than the ones captured automatically from a form?\n\n## Joins\n\n- [Clients](./clients.md) — `client_id = client_id`\n- [Sessions](./sessions.md) — `session_id = session_id`\n", "trading/sessions": "---\ntitle: \"Sessions\"\ndescription: |\n  Every visit to the broker's site and app, one row per session, from the anonymous first\n  click on an ad to the return visit of a client who is already trading. A row records where\n  the visit came from — its own last-touch source, medium and campaign alongside the\n  first-touch channel that originally acquired the visitor — where it landed, what device and\n  country it came from, and how engaged it was in pages viewed and seconds spent. Once a\n  visitor registers, the session carries the client identifier, which is what turns raw\n  traffic into something you can follow all the way to a deposit.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:05:11.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `date` | DATE | Date | Calendar date of the session. FK to [Attribution](./attribution.md) |\n| `session_id` | STRING | Session ID | PK. Unique identifier for a single session. Don't COUNT this to get session totals — SUM the `count_sessions` field below instead, it is purpose-built for that. |\n| `source` | STRING | Source | This session's own (last-touch) traffic source. If you need the channel that FIRST acquired the visitor (not just this visit), use `user_source` instead. FK to [Attribution](./attribution.md) |\n| `medium` | STRING | Medium | This session's own (last-touch) traffic medium. See `user_medium` for the first-touch equivalent. FK to [Attribution](./attribution.md) |\n| `campaign` | STRING | Campaign | This session's own (last-touch) UTM campaign. See `user_campaign` for the first-touch equivalent. FK to [Attribution](./attribution.md) |\n| `ad_content` | STRING | Ad Content | UTM ad content — identifies the specific ad creative shown. Only populated for paid sessions. |\n| `ad_group` | STRING | Ad Group | Ad group within the campaign. Only populated for paid sessions. |\n| `channel_grouping` | STRING | Channel Grouping | Simplified channel bucket: `Paid Search`, `Paid Social`, `Organic`, `Direct`, `Referral`, `Affiliate`, `Video`, `Display`. Use this for a high-level channel-mix chart instead of raw source/medium. |\n| `keyword` | STRING | Keyword | Search keyword that triggered the session. Only populated for search (cpc/organic) sessions. |\n| `landing_page` | STRING | Landing Page | Path of the first page viewed in the session (e.g. `/open-account`, `/promo/welcome-bonus`), without UTM parameters. Use to answer \"which landing page converts best\" — join to Leads on `session_id` to compute a conversion rate per landing page. Note: there is no cost breakdown by landing page (ad platforms only report cost per campaign), so CPA/CPL by landing page cannot be computed, only conversion rate/counts. |\n| `landing_host_name` | STRING | Landing Host Name | Landing hostname for web sessions, or the app identifier for App sessions. |\n| `url` | STRING | URL | Full first-hit URL including UTM parameters, for web sessions. |\n| `started_at` | TIMESTAMP | Started At | Timestamp the session began. Use MIN/MAX only — not a metric to SUM or AVG. |\n| `consent_at` | TIMESTAMP | Consent At | Timestamp of first recorded (GDPR-style) consent. NULL if no consent was recorded in this session. |\n| `ga_client_id` | STRING | Ga Client ID | Browser/device analytics cookie id, used only to link anonymous sessions to the same device across visits. This is NOT the CRM client — do not confuse with `client_id` below. |\n| `country` | STRING | Country | Visitor's country from IP geolocation — this is where the visitor actually is, not the ad targeting country (see Ad Spend.targeting_country). |\n| `region` | STRING | Region | Business-region roll-up of the visitor's country: `SEA`, `ME`, `EU`, `LATAM`, `AFRICA`, `CA`, `UK`, `AU`, `ANZ`, `Other`. |\n| `city` | STRING | City | Visitor's city. |\n| `device_category` | STRING | Device Category | `Desktop`, `Mobile` or `Tablet`. |\n| `is_first_visitor_session` | BOOLEAN | Is First Visitor Session | `\"true\"`/`\"false\"` boolean flag — whether this is the visitor's very first ever session. |\n| `traffic_platform` | STRING | Traffic Platform | `App` or `Web` — which surface the session happened on. Use for \"app vs web\" traffic-split questions. |\n| `unique_users` | INTEGER | Unique Users | Always `1` on every row; SUM to count unique users in a report, do not AVG or use as a real per-row metric. |\n| `pages_per_session` | FLOAT | Pages Per Session | Number of pages viewed in this specific session. Engagement/quality-of-traffic signal. |\n| `avg_session_duration` | FLOAT | Average Session Duration | Duration of this specific session, in seconds. Engagement signal. |\n| `client_id` | STRING | Client ID | Set only once the visitor is an identified, registered client — NULL for anonymous, not-yet-registered visitors. Use to join session behaviour to CRM/deposit data. FK to [Clients](./clients.md) |\n| `count_sessions` | INTEGER | Count Sessions | Always `1` on every row; SUM this field to answer \"how many sessions\" — this is the standard sessions-count metric. |\n| `user_source` | STRING | User Source | First-touch acquisition source for this visitor — the channel that originally brought them in, which may differ from this particular session's own `source`. Use when the question is about acquisition/attribution rather than this specific visit. |\n| `user_medium` | STRING | User Medium | First-touch acquisition medium. See `user_source`. |\n| `user_campaign` | STRING | User Campaign | First-touch acquisition campaign. See `user_source`. |\n\n# Example Questions\n\n- Which landing pages pull in the most first-ever visitors yet lose them fastest, going by pages viewed and time on site?\n- How far apart are first-touch and last-touch credit — which sources are closing visits that a different channel originally acquired?\n- Are app visitors more engaged than web visitors, and does that gap hold once you separate identified `clients` from still-anonymous traffic?\n\n## Joins\n\n- [Attribution](./attribution.md) — `date = date`, `source = source`, `medium = medium`, `campaign = campaign`\n- [Clients](./clients.md) — `client_id = client_id`\n", "trading/trading-accounts": "---\ntitle: \"Trading Accounts\"\ndescription: |\n  The accounts clients actually trade on: one row per MT4 or MT5 account, with the terms it\n  was opened under — the base currency it is denominated in, the maximum leverage from a\n  cautious 1:10 up to 1:500, and how the holder is classified: an ordinary retail client, a\n  professional one, a swap-free islamic account or a practice account. Alongside the terms sit\n  the two numbers that describe its state: the\n  settled balance, and the equity that includes the profit or loss running on positions still\n  open. A client can hold several accounts, which is where multi-account behaviour becomes\n  visible — a second, higher-leverage account opened next to a conservative first one is a\n  meaningful change in how someone is trading.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:05:12.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `account_id` | STRING | Account ID | PK. Unique trading account identifier. |\n| `client_id` | STRING | Client ID | Owner of this account — a client may have more than one account, so COUNT(account_id) can exceed COUNT(DISTINCT client_id). FK to [Clients](./clients.md) |\n| `trading_platform` | STRING | Trading Platform | Trading platform: `MT4` or `MT5`. |\n| `account_type` | STRING | Account Type | `retail`, `professional`, `demo` (no real money), `islamic` (swap-free). |\n| `currency` | STRING | Currency | Account's base currency: `USD`, `EUR`, `GBP`, `AUD`. `balance`/`equity` are denominated in this currency, not USD. |\n| `leverage` | STRING | Leverage | Maximum leverage on this account: `1:10`, `1:50`, `1:100`, `1:200`, `1:500`. |\n| `status` | STRING | Status | Account state: `active`, `inactive`, `closed`. |\n| `balance` | FLOAT | Balance | Current balance, in the account's own `currency` — excludes unrealized P&L from open positions. |\n| `equity` | FLOAT | Equity | Current equity, in the account's own `currency` — balance adjusted for unrealized P&L on open positions. |\n| `country` | STRING | Country | Country of the account holder at account-creation time. |\n| `created_at` | TIMESTAMP | Created At | Timestamp the account was opened. |\n| `count_deposits` | INTEGER | Count Deposits | Number of deposit transactions made into this specific account (see Deposits for the transactions themselves). |\n\n# Example Questions\n\n- Does higher leverage go with thinner accounts — how do equity and balance compare across leverage bands, and does the pattern differ between MT4 and MT5?\n- How many `clients` run more than one account, and do the extra accounts attract their own funding or sit near-empty?\n- Which kinds of account go quiet — what share becomes inactive or closed, broken down by account type and base currency?\n\n## Joins\n\n- [Clients](./clients.md) — `client_id = client_id`\n"}, "types": ["Data Mart"]};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleNames = bundle.bundles || [];
  let currentBundle = bundleNames[0] || "";

  const bundleSelect = document.getElementById("bundle-select");
  for (const name of bundleNames) {
    const opt = document.createElement("option");
    opt.value = name; opt.textContent = name;
    bundleSelect.appendChild(opt);
  }
  bundleSelect.value = currentBundle;
  document.title = currentBundle + " — OKF Viewer";

  const inBundle = (el) => el.data.bundle === currentBundle;

  const typeSelect = document.getElementById("filter-type");

  function populateTypeFilter() {
    typeSelect.innerHTML = '<option value="">All types</option>';
    const types = new Set(bundle.nodes.filter(inBundle).map((n) => n.data.type));
    for (const t of [...types].sort()) {
      const opt = document.createElement("option");
      opt.value = t; opt.textContent = t;
      typeSelect.appendChild(opt);
    }
  }
  populateTypeFilter();

  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] = backlinks[target] || []).push(source);
  }

  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes.filter(inBundle), ...bundle.edges.filter(inBundle)],
    style: [
      { selector: "node", style: {
          "background-color": "data(color)", "label": "data(label)",
          "color": "#0f172a", "font-size": 11,
          "text-valign": "bottom", "text-margin-y": 4,
          "text-wrap": "wrap", "text-max-width": 120,
          "width": "data(size)", "height": "data(size)",
          "border-width": 1, "border-color": "#0f172a" } },
      { selector: "node:selected", style: { "border-width": 3, "border-color": "#f59e0b" } },
      { selector: "edge", style: {
          "width": 1.5, "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1", "target-arrow-shape": "triangle",
          "curve-style": "bezier", "arrow-scale": 0.9 } },
      { selector: "edge:selected", style: {
          "line-color": "#f59e0b", "target-arrow-color": "#f59e0b", "width": 2.5 } },
      { selector: ".dim", style: { "opacity": 0.15 } },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => { if (evt.target === cy) clearSelection(); });

  bundleSelect.addEventListener("change", (e) => {
    currentBundle = e.target.value;
    document.title = currentBundle + " — OKF Viewer";
    document.getElementById("search").value = "";
    clearSelection();
    cy.elements().remove();
    cy.add([...bundle.nodes.filter(inBundle), ...bundle.edges.filter(inBundle)]);
    cy.elements().removeClass("dim");
    populateTypeFilter();
    cy.layout({ name: document.getElementById("layout").value, animate: false, padding: 30 }).run();
    cy.fit(null, 30);
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });
  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30); clearSelection();
  });
  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) { cy.elements().removeClass("dim"); return; }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay = (d.label || "").toLowerCase() + " " + d.id.toLowerCase() + " " + (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((e) => {
      e.toggleClass("dim", e.source().hasClass("dim") || e.target().hasClass("dim"));
    });
  });
  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) { cy.elements().removeClass("dim"); return; }
    cy.nodes().forEach((n) => n.toggleClass("dim", n.data("type") !== t));
    cy.edges().forEach((e) => {
      e.toggleClass("dim", e.source().hasClass("dim") || e.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    document.getElementById("detail-content").hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type; chip.style.background = data.color;
    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource; a.textContent = data.resource;
      a.target = "_blank"; a.rel = "noopener"; a.className = "external";
      resourceEl.appendChild(a);
    } else { resourceEl.textContent = "—"; }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    for (const t of (data.tags || [])) {
      const span = document.createElement("span");
      span.className = "tag"; span.textContent = t; tagsEl.appendChild(span);
    }
    if (!data.tags || !data.tags.length) tagsEl.textContent = "—";

    document.getElementById("detail-body").innerHTML =
      marked.parse(bundle.bodies[conceptId] || "", { breaks: false, gfm: true });

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    blSection.hidden = !bl.length;
    for (const src of bl) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.textContent = nodeIndex[src] ? nodeIndex[src].label : src;
      a.onclick = () => showDetail(src);
      li.appendChild(a); blList.appendChild(li);
    }
  }
})();
</script>
