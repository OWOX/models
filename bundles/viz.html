EAN | Is Available | Whether the listing is live inventory — supply availability. |\n\n# Example Questions\n\n- Which `categories` are thin on live inventory relative to the demand searching for them — where is supply the bottleneck?\n- How does listing price distribution differ across `categories`, and does it track the category take rate?\n- What share of listings ever converts into an `order`, by `category` and `seller`?\n\n## Joins\n\n- [Category](./category.md) — `category_id = category_id`\n- [Seller](./seller.md) — `seller_id = seller_id`\n", "marketplace/orders": "---\ntitle: \"Orders\"\ndescription: |\n  The match at the heart of the marketplace: one row per order placed, tying a buyer to a\n  seller's listing. It carries the full transaction economics — gross merchandise value, the\n  category take rate, the platform's cut and the reciprocal seller payout. Revenue is\n  recognised only on orders that settle: a cancelled order keeps its booked GMV for funnel\n  analysis while its net GMV, platform revenue and seller payout all fall to zero, so gross\n  and net are never confused.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-29T14:32:48.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `order_id` | STRING | Order ID | PK. Unique order identifier. |\n| `buyer_id` | STRING | Buyer ID | Buyer on the order. FK to [Buyer](./buyer.md) |\n| `seller_id` | STRING | Seller ID | Seller on the order (always the listing's owner). FK to [Seller](./seller.md) |\n| `listing_id` | STRING | Listing ID | Listing that was purchased. FK to [Listings](./listings.md) |\n| `category_id` | STRING | Category ID | Category of the purchased listing, denormalised for slicing. FK to [Category](./category.md) |\n| `ordered_at` | TIMESTAMP | Ordered At | When the order was placed. |\n| `quantity` | INTEGER | Quantity | Units ordered (gmv = listing price × quantity). |\n| `gmv` | NUMERIC | GMV | Gross merchandise value booked for the order. |\n| `take_rate` | FLOAT | Take Rate | Platform's cut as a fraction of GMV (= category take_rate_pct / 100). |\n| `platform_revenue` | NUMERIC | Platform Revenue | Platform's recognised revenue (gmv × take_rate; zero if cancelled). |\n| `seller_payout` | NUMERIC | Seller Payout | Seller's take-home (gmv − platform_revenue; zero if cancelled). |\n| `net_gmv` | NUMERIC | Net GMV | GMV net of cancellations (equal to gmv unless cancelled, then zero). |\n| `status` | STRING | Status | Order status: pending, fulfilled or cancelled. |\n| `is_fulfilled` | BOOLEAN | Is Fulfilled | Whether the order was fulfilled. |\n| `fulfillment_mins` | FLOAT | Fulfillment Mins | Order-to-fulfilment time in minutes — fill speed (null unless fulfilled). |\n\n# Example Questions\n\n- What is our net GMV and net take after `cancellations`, and how far does it sit below the gross headline?\n- Which `categories` and `sellers` produce the most platform revenue, and how does seller payout move as take rate changes?\n- How fast are orders fulfilled, and how does fill speed vary by `seller` fulfilment type or `category`?\n\n## Joins\n\n- [Buyer](./buyer.md) — `buyer_id = buyer_id`\n- [Category](./category.md) — `category_id = category_id`\n- [Listings](./listings.md) — `listing_id = listing_id`\n- [Seller](./seller.md) — `seller_id = seller_id`\n", "marketplace/reviews": "---\ntitle: \"Reviews\"\ndescription: |\n  One row per review left after a fulfilled order — the marketplace's trust signal. Only a\n  minority of completed orders are ever reviewed, since reviewing is voluntary, and ratings\n  follow the familiar J-shape: mostly five stars, a hard bump at one star, little in between.\n  The reviewer role separates the buyer's rating of the seller from the seller's rating of\n  the buyer, and the complaint flag — concentrated in the low ratings — marks where trust is\n  breaking down.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-27T15:57:45.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `review_id` | STRING | Review ID | PK. Unique review identifier. |\n| `order_id` | STRING | Order ID | Order the review relates to (always a fulfilled order). FK to [Orders](./orders.md) |\n| `reviewer_role` | STRING | Reviewer Role | Side that left the review: buyer or seller. |\n| `rating` | INTEGER | Rating | Star rating 1–5 for the order. |\n| `created_at` | TIMESTAMP | Created At | When the review was submitted. |\n| `has_complaint` | BOOLEAN | Has Complaint | Whether the review flags a complaint (concentrated in 1–2 star ratings). |\n\n# Example Questions\n\n- What is our review coverage of fulfilled `orders`, and does the rating distribution look healthy or is a `category` dragging the average down?\n- Which `sellers` or `categories` attract the most complaints relative to their `order` volume?\n- Do low ratings and complaints cluster around the same `sellers` that later go dormant?\n\n## Joins\n\n- [Orders](./orders.md) — `order_id = order_id`\n", "marketplace/search-requests": "---\ntitle: \"Search Requests\"\ndescription: |\n  One row per search a buyer runs — the top of the demand funnel and the cleanest read on\n  marketplace liquidity. Each request records the category searched, how many results came\n  back, whether the buyer clicked, and whether the search converted into an order, along\n  with the time it took to match. Searches that return nothing, or return results but never\n  convert, are the \"demand with no fill\" signal a liquidity analyst hunts for.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-27T15:57:45.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `request_id` | STRING | Request ID | PK. Unique search request identifier. |\n| `buyer_id` | STRING | Buyer ID | Buyer who made the search. FK to [Buyer](./buyer.md) |\n| `category_id` | STRING | Category ID | Category the search was scoped to. FK to [Category](./category.md) |\n| `requested_at` | TIMESTAMP | Requested At | When the search was made. |\n| `query` | STRING | Query | Raw search text entered by the buyer. |\n| `results_count` | INTEGER | Results Count | Number of results returned. |\n| `clicked` | BOOLEAN | Clicked | Whether the buyer clicked a result. |\n| `converted` | BOOLEAN | Converted | Whether the search led to an order. |\n| `order_id` | STRING | Order ID | Order the search converted into, if any. FK to [Orders](./orders.md) |\n| `time_to_match_mins` | FLOAT | Time To Match Mins | Search → transaction latency in minutes (null unless converted). |\n\n# Example Questions\n\n- Which `categories` and regions show strong demand but weak fill — searches that return few results or rarely convert?\n- What is the search-to-order conversion rate, and where in the funnel (no results, no click, no conversion) does demand leak?\n- For searches that do convert, how long is the time to match and what GMV do they drive?\n\n## Joins\n\n- [Buyer](./buyer.md) — `buyer_id = buyer_id`\n- [Category](./category.md) — `category_id = category_id`\n- [Orders](./orders.md) — `order_id = order_id`\n", "marketplace/seller": "---\ntitle: \"Seller\"\ndescription: |\n  The supply side: one row per seller, with the primary category they sell in, their buyer\n  rating, how many listings they keep live, and — critically for supply-health work — when\n  they last sold and whether they are still active. Supply is heavily concentrated: a small\n  share of sellers drives most of the platform's GMV, so lifecycle status (active, dormant\n  or churned, driven by sale recency) is where a supply manager looks first when GMV softens.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-27T15:57:44.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `seller_id` | STRING | Seller ID | PK. Unique seller identifier. |\n| `onboarded_at` | DATE | Onboarded At | When the seller joined the platform. |\n| `category_id` | STRING | Category ID | Primary category the seller sells in. FK to [Category](./category.md) |\n| `region` | STRING | Region | Seller's geographic region. |\n| `rating` | FLOAT | Rating | Average buyer rating of the seller (null until first review). |\n| `active_listings` | INTEGER | Active Listings | Number of currently live listings. |\n| `is_activated` | BOOLEAN | Is Activated | Whether the seller has reached its first sale — supply activation. |\n| `fulfillment_type` | STRING | Fulfillment Type | How the seller fulfils orders. |\n| `last_sale_at` | DATE | Last Sale At | Date of the seller's most recent sale (null if never sold). |\n| `status` | STRING | Status | Lifecycle state from sale recency: active, dormant or churned. |\n\n# Example Questions\n\n- Are sellers in our highest take-rate `categories` churning faster than sellers in low-rate ones — is take-rate optimisation costing us supply?\n- What share of GMV comes from the top few percent of sellers, and how exposed are we if they go dormant?\n- How many onboarded sellers never reach their first sale, and where does that activation gap concentrate?\n\n## Joins\n\n- [Category](./category.md) — `category_id = category_id`\n", "retail-chain/inventory-daily": "---\ntitle: \"Inventory (daily)\"\ndescription: |\n  What was on the shelf, store by store and line by line, at the close of every day: units on hand\n  and what they are worth, units still on order, the reorder point the line is managed against,\n  whether it ended the day with nothing left, and how many weeks the remaining stock would last at\n  current demand. Availability is the constraint on everything a store can sell — an empty shelf\n  produces no sale, no margin and no loyalty, and the sale it loses rarely comes back later — so\n  this is the mart that explains sales the sales figures themselves cannot. It is also where\n  working capital sits: stock is cash on a shelf, and the same daily position that reveals a\n  stockout reveals overstock in the lines nobody is buying. Reading the two together is the whole\n  of inventory management — too little loses sales, too much ties up money and, in fresh food, is\n  thrown away.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T04:37:30.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `snapshot_id` | STRING | Snapshot ID | PK. Unique identifier for this store, SKU and day position. |\n| `store_id` | STRING | Store ID | Location the stock is held at. FK to [Store](./store.md) |\n| `product_id` | STRING | Product ID | Line the position is recorded for. FK to [Product](./product.md) |\n| `snapshot_date` | DATE | Snapshot Date | Day the position was taken at close of trade. With `store_id` and `product_id` this is the grain of the mart. |\n| `on_hand_units` | INTEGER | On-Hand Units | Selling units left on this line at the close of the day. |\n| `on_hand_value` | NUMERIC | On-Hand Value | Value of the units on hand at unit cost, in USD. The working capital standing on the shelf. |\n| `on_order_units` | INTEGER | On-Order Units | Units already ordered and not yet received. A line can be empty and still covered if a delivery is inbound. |\n| `reorder_point` | INTEGER | Reorder Point | Demand the line must serve before its next delivery lands. On-hand below it means the line is depending on that delivery arriving on time — normal and frequent on lines held to a few days of cover, near-absent on lines held to weeks of it, so compare the share of days below it across lines stocked the same way rather than reading any single figure as a fault. |\n| `is_stockout` | BOOLEAN | Is Stockout | True when the line had no stock left at the close of the day. A line can still have sold during a day that ends in stockout — the snapshot is taken at day end, not across it. |\n| `weeks_of_supply` | FLOAT | Weeks of Supply | How many weeks the stock on hand would last at current demand. Low means lost sales are close; high means cash tied up, and on perishables, write-offs ahead. |\n\n# Example Questions\n\n- What did empty shelves cost us over the period, and do stockouts concentrate in the fast-selling lines where they hurt most?\n- Which `stores` hold weeks of supply far above what their demand justifies, and how much cash is sitting in that overstock?\n- Does a line's reorder point actually protect it, or do the same SKUs run out repeatedly despite being ordered on time?\n\n## Joins\n\n- [Product](./product.md) — `product_id = product_id`\n- [Store](./store.md) — `store_id = store_id`\n", "retail-chain/loyalty-members": "---\ntitle: \"Loyalty Members\"\ndescription: |\n  Everyone enrolled in the loyalty program, and what each of them is worth to the chain: the store\n  they treat as home, the tier they have reached, when they joined and how they have shopped since\n  — lifetime spend, how many baskets it took, the average basket behind it, and how long it has\n  been since the last one. This is the only place a shopper exists as a person rather than as an\n  anonymous basket, which makes it the entry point for every question about retention, frequency\n  and share of wallet. The RFM block turns that history into segments that can be acted on: who is\n  shopping most, who is spending most, and who has quietly stopped coming. `home_store_id` matters\n  more here than it looks — a member's value is earned at a location, so store performance and\n  member value are two views of the same trade, and a store losing gold members is in trouble long\n  before its sales line shows it.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T04:38:08.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `member_id` | STRING | Member ID | PK. Unique identifier for this loyalty account. |\n| `home_store_id` | STRING | Home Store ID | Location the member shops most often, which is where their value is earned. FK to [Store](./store.md) |\n| `enrolled_at` | DATE | Enrolled Date | Date the member joined the loyalty program. The gap to `first_purchase_date` shows how long enrolment takes to turn into trade. |\n| `tier` | STRING | Loyalty Tier | Program tier earned on spend: `base`, `silver` or `gold`. Tier is partly a result of basket size, so treat it as a segment rather than a cause. |\n| `city` | STRING | City | City the member lives in, which need not be the city of their home store. |\n| `state` | STRING | State | US state the member lives in, e.g. `TX`, `OH`, `FL`. |\n| `age_band` | STRING | Age Band | Banded age group the member falls into. Banding keeps the cut usable without holding a date of birth. |\n| `email_opt_in` | BOOLEAN | Email Opt-In | True when the member has agreed to receive email offers. The reachable base for any mailed campaign. |\n| `is_app_user` | BOOLEAN | Is App User | True when the member uses the mobile app, which is what makes an offer targetable in the moment rather than a week ahead. |\n| `rfm_label` | STRING | RFM Segment | Segment summarising the three scores below into one label, e.g. champions, loyal, at risk, lapsed. The everyday cut for campaign selection. |\n| `recency_score` | INTEGER | Recency Score | 1 to 5, where 5 is a member who shopped most recently. |\n| `frequency_score` | INTEGER | Frequency Score | 1 to 5, where 5 is a member who shops most often. |\n| `monetary_score` | INTEGER | Monetary Score | 1 to 5, where 5 is a member who has spent the most. |\n| `lifetime_spend` | NUMERIC | Lifetime Spend | Total spend by this member since enrolment, in USD. |\n| `lifetime_baskets` | INTEGER | Lifetime Baskets | Number of separate shopping trips the member has made. Divides into `lifetime_spend` to give `avg_basket_value`. |\n| `avg_basket_value` | NUMERIC | Average Basket Value | Average spend per shopping trip for this member, in USD. |\n| `first_purchase_date` | DATE | First Purchase Date | Date of the member's first purchase on the program. |\n| `last_purchase_date` | DATE | Last Purchase Date | Date of the member's most recent purchase. |\n| `days_since_last_purchase` | INTEGER | Days Since Last Purchase | Whole days between the last purchase and the reporting date. The lapse trigger behind any recall campaign. |\n| `is_active` | BOOLEAN | Is Active | True while the member is still shopping within the program's activity window. Exclude the dormant tail before comparing per-member averages. |\n| `count_members` | INTEGER | Member Count | Always `1` on every row; SUM to count members. |\n\n# Example Questions\n\n- Which `stores` are losing their most valuable members, and how much annual spend walks out with the ones who have gone quiet?\n- Do members who use the app shop more often than card-only members, or do they simply spend more per visit when they do come?\n- How long does it take a newly enrolled member to reach the basket size of an established one, and does that ramp differ by tier?\n\n## Joins\n\n- [Store](./store.md) — `home_store_id = store_id`\n", "retail-chain/pos-sales": "---\ntitle: \"POS Sales\"\ndescription: |\n  Every line rung through a till across the chain: what was sold, where, when, at what price, at\n  what discount and at what margin. This is the mart the rest of the model exists to explain — one\n  row per receipt line, with the basket it belonged to, the promotion that priced it, the loyalty\n  account behind it when the shopper was identified, and the way it was paid for and scanned. Price\n  is carried alongside cost so margin is available at line level rather than reconstructed\n  afterwards, which is what lets a discount be judged on the profit it left rather than the volume\n  it moved. Because a sale line also carries its store, its SKU and its calendar day, it reaches\n  straight into the two day-grained marts around it: the footfall the store saw that day and the\n  stock position that line finished the day on. That is what turns a sales figure into a diagnosis\n  — whether a weak day was fewer visitors, worse conversion, a smaller basket, or a shelf that had\n  nothing left on it.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T04:39:43.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `sale_id` | STRING | Sale ID | PK. Unique identifier for this receipt line. |\n| `store_id` | STRING | Store ID | Location the line was sold at. FK to [Store Traffic](./store-traffic.md) |\n| `product_id` | STRING | Product ID | SKU that was sold. FK to [Product](./product.md) |\n| `promotion_id` | STRING | Promotion ID | NULL when the line sold at regular price, so promoted and full-price trade separate on this column alone. FK to [Promotion](./promotion.md) |\n| `member_id` | STRING | Member ID | NULL when the basket was not identified, which is how an anonymous shopper appears. FK to [Loyalty Members](./loyalty-members.md) |\n| `basket_id` | STRING | Basket ID | Identifier of the basket this line was paid for in. Groups the lines of one transaction, so basket size and mix are a roll-up of this mart. |\n| `sold_at` | TIMESTAMP | Sold At | Exact moment the line was rung through the till. Use this for hour-of-day and daypart questions. |\n| `sale_date` | DATE | Sale Date | Calendar date of the sale. Carried alongside `sold_at` because day-grained marts — store traffic and the daily stock position — join on a date, not a timestamp. FK to [Store Traffic](./store-traffic.md) |\n| `quantity` | INTEGER | Quantity | Selling units sold on this line. |\n| `unit_price` | NUMERIC | Unit Price | Shelf price per unit before any discount, in USD. |\n| `discount` | NUMERIC | Discount | Value taken off the line by the promotion it was on, in USD. Zero on a line sold at regular price — there is no markdown history in this model, so `promotion_id IS NULL` and a zero discount mean the same thing. |\n| `net_sales` | NUMERIC | Net Sales | What the line actually took after discount, in USD. The revenue figure to sum. |\n| `line_cost` | NUMERIC | Line Cost | What the units on this line cost the chain, in USD. |\n| `gross_margin` | NUMERIC | Gross Margin | `net_sales` less `line_cost`, in USD. The only one of the money columns that says whether the line was worth selling — read promotions and categories on this, with revenue beside it. |\n| `checkout_type` | STRING | Checkout Type | Where the line was scanned: `staffed` or `self_checkout`. Summed by store it gives each site's self-checkout share of trade, which is the figure to set beside that store's `Shrinkage` events with `detected_by = 'self_checkout_audit'` — the two marts are read side by side at store level rather than joined. |\n| `payment_method` | STRING | Payment Method | How the basket was settled: `card`, `cash`, `mobile_wallet`, `ebt` or `gift_card`. `ebt` marks a benefits-funded basket, which shops a distinctly different assortment. |\n| `count_sale_lines` | INTEGER | Sale Line Count | Always `1` on every row; SUM to count receipt lines. |\n\n# Example Questions\n\n- Which `promotions` earned their discount and which merely bought volume we would have taken anyway at full price, once line-level margin rather than revenue is the measure?\n- How much trade did we lose to empty shelves — what did the lines that finished a day out of stock sell on the days they were available, and which velocity bands carry that loss?\n- Do identified loyalty baskets differ from anonymous ones in size, margin and category mix by enough to justify what the programme costs?\n\n## Joins\n\n- [Inventory (daily)](./inventory-daily.md) — `store_id = store_id`, `product_id = product_id`, `sale_date = snapshot_date`\n- [Loyalty Members](./loyalty-members.md) — `member_id = member_id`\n- [Product](./product.md) — `product_id = product_id`\n- [Promotion](./promotion.md) — `promotion_id = promotion_id`\n- [Store](./store.md) — `store_id = store_id`\n- [Store Traffic](./store-traffic.md) — `store_id = store_id`, `sale_date = traffic_date`\n", "retail-chain/product": "---\ntitle: \"Product\"\ndescription: |\n  The assortment, one row per SKU: what the line is, who makes it, who supplies it, what it costs\n  the chain and what it lists at. Two fields do most of the analytical work here. `velocity_band`\n  is the A/B/C classification that decides replenishment priority and shelf position — an A line\n  sells every day and a stockout on it costs real money, a C line may sit for weeks and is mostly a\n  question of whether it earns its space. `is_perishable` separates the lines with a shelf life\n  from the rest, and perishability drives both how often a line has to be reordered and how much of\n  it is written off before it ever sells. Alongside those, `unit_cost` against `list_price` gives\n  the intended margin on every line before any promotion touches it, and `is_private_label`\n  separates the chain's own brands — typically higher margin, and the lever a grocer pulls when\n  shoppers trade down.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T00:46:49.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `product_id` | STRING | Product ID | PK. Unique identifier for this SKU. |\n| `sku` | STRING | SKU | Stock-keeping unit code as it appears on the shelf edge and in ordering. |\n| `name` | STRING | Product Name | Description of the line as it reads on the shelf and the receipt. |\n| `category` | STRING | Category | Top level of the merchandising hierarchy, e.g. `Grocery`, `Fresh Food`, `Apparel`, `Home`. |\n| `subcategory` | STRING | Subcategory | Second level of the merchandising hierarchy within the category. |\n| `brand` | STRING | Brand | Brand the line is sold under. Compare against `is_private_label` to separate own brands from national ones. |\n| `supplier_name` | STRING | Supplier | Vendor the chain buys this line from. Matches the supplier on replenishment orders, so supplier service level is answerable from these two together. |\n| `unit_cost` | NUMERIC | Unit Cost | Cost to the chain of one selling unit. The basis of margin on every sale line. |\n| `list_price` | NUMERIC | List Price | Shelf price of one selling unit before any promotion. The gap to `unit_cost` is the intended margin. |\n| `pack_size` | STRING | Pack Size | How the line is packaged for sale, e.g. `12-count`, `2 lb`, `single`. Normalise on this before comparing prices across brands. |\n| `unit_of_measure` | STRING | Unit of Measure | Unit the line is sold in: `each`, `lb`, `oz`, `pack`, `case`. |\n| `velocity_band` | STRING | Velocity Band | ABC velocity class: `A` for the fastest sellers, `C` for the slowest. A stockout on an A line costs far more than one on a C line. |\n| `is_private_label` | BOOLEAN | Is Private Label | True for the chain's own brands, which carry higher margin and gain share when shoppers trade down. |\n| `is_perishable` | BOOLEAN | Is Perishable | True for lines with a shelf life. Perishability drives both replenishment cadence and expiry write-offs. |\n\n# Example Questions\n\n- Which categories carry our margin once private label is separated from national brands, and where is the intended margin never realised at the till?\n- Are our A-band lines the ones we actually keep in stock, or does availability track pack size and perishability instead?\n- Which suppliers concentrate the most of our perishable assortment, and what does that concentration expose us to?\n", "retail-chain/promotion": "---\ntitle: \"Promotion\"\ndescription: |\n  Every offer the chain ran, and the four things that decide whether it was worth running: the\n  mechanic it used, the channel it reached shoppers through, the categories it covered, and — the\n  one most promotional reporting leaves out — who actually paid for the discount. A vendor-funded\n  deal costs the chain nothing but shelf space and can be judged on volume alone; a retailer-funded\n  one comes straight out of margin and has to earn it back in incremental units, not units that\n  would have sold at full price anyway. `start_date` and `end_date` bound the window a promotion\n  can be credited for, which is what any pre-period, promo-period and post-period read is built on,\n  and `category_scope` is what lets an offer be set against the categories it was supposed to move\n  rather than against total sales.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T00:46:49.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `promotion_id` | STRING | Promotion ID | PK. Unique identifier for this promotion. |\n| `name` | STRING | Promotion Name | Name of the offer as it appears in the promotional calendar. |\n| `promo_type` | STRING | Promotion Type | Mechanic used: `discount`, `bogo` (buy one get one), `loyalty_points`, `bundle`. Mechanics are not comparable on discount depth alone. |\n| `promo_channel` | STRING | Promotion Channel | How the offer reached shoppers: `weekly_circular`, `app_offer`, `in_store_display`, `loyalty_targeted`. Separates broad reach from targeted precision. |\n| `funding_source` | STRING | Funding Source | Who paid for the discount: `vendor_funded` when the supplier covered it, `retailer_funded` when the chain absorbed it. This is what decides whether a promotion made money. |\n| `category_scope` | STRING | Category Scope | Part of the assortment the offer covered. Measure uplift against these categories, not against total store sales. |\n| `start_date` | DATE | Start Date | First day the offer was live. |\n| `end_date` | DATE | End Date | Last day the offer was live. Sales outside this window were not on this deal. |\n| `discount_pct` | FLOAT | Discount % | Headline depth of the offer as a percentage off the shelf price. |\n\n# Example Questions\n\n- Which promotions grew margin rather than moving volume we would have sold anyway, once vendor-funded and retailer-funded offers are judged on different bars?\n- Do app offers and loyalty-targeted deals earn more per discount dollar than the weekly circular, and in which categories?\n- How deep does a discount have to go before the category's uplift stops covering the margin given away?\n", "retail-chain/replenishment": "---\ntitle: \"Replenishment\"\ndescription: |\n  Every order placed to refill a store's shelves, from the day it was raised to the day the goods\n  arrived — how much was asked for, how much actually turned up, what it cost, how long it took,\n  and whether it landed when it was promised. This is where an availability problem is diagnosed\n  rather than merely observed: a shelf can be empty because the store never ordered, because the\n  supplier short-shipped, or because the delivery was late, and only the order record separates the\n  three. Fill rate and on-time delivery are the two halves of on-time-in-full, the standard measure\n  of supplier service, and `supplier_name` is what makes them answerable per vendor. Lead time is\n  the other half of the story, because a supplier who reliably takes ten days can be planned around,\n  while one who takes anywhere between three and fifteen forces every store to carry cover stock it\n  should not need.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T04:40:19.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `order_id` | STRING | Order ID | PK. Unique identifier for this replenishment order. |\n| `store_id` | STRING | Store ID | Location the goods were ordered for. FK to [Store](./store.md) |\n| `product_id` | STRING | Product ID | Line being replenished. FK to [Product](./product.md) |\n| `supplier_name` | STRING | Supplier | Vendor the order was placed with. Matches the supplier on the product, so supplier service level is answerable from the two together. |\n| `ordered_at` | DATE | Ordered Date | Date the order was raised with the supplier. |\n| `expected_at` | DATE | Expected Date | Date the supplier promised delivery. The bar `is_on_time` is measured against. |\n| `received_at` | DATE | Received Date | Date the goods actually arrived. NULL while the order is still open, so exclude open orders from lead-time and service-level calculations rather than treating them as received today. |\n| `status` | STRING | Order Status | Where the order stands: `open` (raised, goods not yet received — including orders already overdue, whose `expected_at` has passed with nothing delivered), `partial` (short-shipped), `received` (complete) or `cancelled` (it will never arrive). |\n| `quantity_ordered` | INTEGER | Quantity Ordered | Selling units requested from the supplier. |\n| `quantity_received` | INTEGER | Quantity Received | Selling units actually delivered. Below `quantity_ordered` on a short shipment. |\n| `order_cost` | NUMERIC | Order Cost | Value of the order at unit cost, in USD. |\n| `lead_time_days` | INTEGER | Lead Time (Days) | Whole days from order to receipt. Its variance matters as much as its level — unpredictable lead time has to be covered with stock. |\n| `fill_rate_pct` | FLOAT | Fill Rate % | Quantity received divided by quantity ordered, as a **percentage on a 0–100 scale** — `96.5` means 96.5% of the order arrived, not 9650%. The \"in full\" half of on-time-in-full, and the standard measure of how completely a supplier serves an order. |\n| `is_on_time` | BOOLEAN | Is On Time | True when the goods arrived by `expected_at`. The \"on time\" half of on-time-in-full; read it alongside `fill_rate_pct`, since a punctual short shipment is still a failure. |\n| `count_orders` | INTEGER | Order Count | Always `1` on every row; SUM to count replenishment orders. |\n\n# Example Questions\n\n- Which suppliers miss on-time-in-full most often, and does their shortfall show up as stockouts on the shelf or get absorbed by cover stock?\n- How much of our lead time is genuinely long versus merely unpredictable, and what would consistency alone save us in stock cover?\n- Are the lines that repeatedly run out actually being ordered late, or ordered on time and short-shipped?\n\n## Joins\n\n- [Product](./product.md) — `product_id = product_id`\n- [Store](./store.md) — `store_id = store_id`\n", "retail-chain/returns": "---\ntitle: \"Returns\"\ndescription: |\n  What came back, and what happened to it: one row per returned line, with the sale it came from\n  when there was a receipt, the reason the shopper gave, and what the chain did with the goods\n  afterwards. Across a general-merchandise assortment returns are a material flow rather than a\n  rounding error, and they cost twice over — the refund handed back and the value destroyed when\n  the returned unit cannot go straight back on the shelf. That second cost is what `disposition`\n  measures: a line resold at full price loses almost nothing, one marked down loses part of its\n  margin, one sent back to the vendor recovers cost from someone else, and one disposed of loses\n  everything. The reason a return was made says where the problem actually sits — a defect belongs\n  to the supplier, a wrong item to the shelf edge or the pick, and a change of mind to nobody but\n  the shopper. Elapsed time and whether a receipt was produced complete the picture, because the\n  returns that arrive late and unreceipted behave differently from the rest in both cost and risk.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T04:41:39.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `return_id` | STRING | Return ID | PK. Unique identifier for this returned line. |\n| `sale_id` | STRING | Sale ID | NULL when the goods came back without a receipt, which is why store and product are also carried directly on this mart. FK to [POS Sales](./pos-sales.md) |\n| `store_id` | STRING | Store ID | Location that accepted the return, which need not be the store that sold the item. FK to [Store](./store.md) |\n| `product_id` | STRING | Product ID | Line that was returned. FK to [Product](./product.md) |\n| `member_id` | STRING | Member ID | NULL when the return was not tied to an identified shopper. FK to [Loyalty Members](./loyalty-members.md) |\n| `returned_at` | TIMESTAMP | Returned At | Exact moment the return was processed at the service desk. |\n| `return_date` | DATE | Return Date | Calendar date the return was processed. |\n| `quantity_returned` | INTEGER | Units Returned | Selling units handed back on this line. |\n| `refund_amount` | NUMERIC | Refund Amount | Money refunded to the shopper for this line, in USD. Only the direct cost — the value destroyed by the disposition sits alongside it. |\n| `reason` | STRING | Return Reason | Why the goods came back: `damaged`, `defective`, `wrong_item`, `changed_mind`, `expired` or `price_dispute`. Separates faults the chain or its suppliers can fix from the cost of a generous returns policy. |\n| `disposition` | STRING | Disposition | What became of the unit: `resell` (back on the shelf at full price), `markdown` (sellable at a reduced price), `vendor_return` (cost recovered from the supplier), `disposal` (written off entirely). This is where the larger cost of a return sits. |\n| `is_receipted` | BOOLEAN | Is Receipted | True when a receipt was produced, so the return resolves to an original sale line. False rows have no `sale_id` and are the harder population to control. |\n| `days_since_purchase` | INTEGER | Days Since Purchase | Days between the original sale and the return. Meaningful only on receipted rows, where the original sale date is known. |\n| `count_returns` | INTEGER | Return Count | Always `1` on every row; SUM to count returned lines. |\n\n# Example Questions\n\n- Which categories and suppliers cost us most after returns, once refunds and the value destroyed by disposition are taken off the margin the original sale reported?\n- How much of the reverse flow arrives without a receipt, where does it concentrate, and how does its reason mix differ from receipted returns?\n- Are defect and wrong-item returns clustered on particular lines or particular `stores`, and how quickly after purchase do they come back?\n\n## Joins\n\n- [Loyalty Members](./loyalty-members.md) — `member_id = member_id`\n- [POS Sales](./pos-sales.md) — `sale_id = sale_id`\n- [Product](./product.md) — `product_id = product_id`\n- [Store](./store.md) — `store_id = store_id`\n", "retail-chain/shrinkage": "---\ntitle: \"Shrinkage\"\ndescription: |\n  Stock the chain paid for and never sold: one row per write-off event, recording what was lost,\n  where, how much of it, why, and how it came to light. Shrink is one of the largest controllable\n  costs in retail and it comes off the bottom line directly — a dollar of shrink has to be replaced\n  by several dollars of extra sales to break even on it. The reason separates problems that need\n  entirely different responses: theft is a security and layout question, expiry is an ordering and\n  rotation question, damage is a handling question, and administrative error means the loss may not\n  be a physical loss at all but a bookkeeping one. How the loss was *found* matters just as much,\n  because it divides known shrink, where the cause is documented at the moment it happens, from\n  unknown shrink, which only surfaces when a count fails to match the book and by then the cause is\n  gone. Each loss is valued twice — at what it cost the chain and at what it would have sold for —\n  because those two numbers answer different questions.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T04:43:02.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `shrink_id` | STRING | Shrink ID | PK. Unique identifier for this write-off event. |\n| `store_id` | STRING | Store ID | Location the loss was recorded at. FK to [Store](./store.md) |\n| `product_id` | STRING | Product ID | Line that was written off. FK to [Product](./product.md) |\n| `recorded_at` | DATE | Recorded Date | Date the write-off was booked. For a loss found by cycle count this is when it was discovered, not necessarily when it occurred. |\n| `reason` | STRING | Shrink Reason | Why the stock was lost: `theft`, `damage`, `expiry` or `admin_error`. Each points at a different owner — security, handling, ordering and rotation, or the back office. |\n| `detected_by` | STRING | Detected By | How the loss came to light: `cycle_count` (a stock count found the book and the shelf disagreed, so the cause is inferred — unknown shrink), `self_checkout_audit` (an audit of an unattended checkout), `security` (loss prevention caught it in the act), `receiving_check` (a discrepancy found at the door before the stock reached the floor). |\n| `units_lost` | INTEGER | Units Lost | Selling units written off in this event. |\n| `shrink_cost` | NUMERIC | Shrink Cost | The loss valued at unit cost, in USD — the money the chain is out of pocket. Use this basis for any margin or profit question. |\n| `retail_value` | NUMERIC | Retail Value | The same loss valued at shelf price, in USD — the trade that will never be rung through the till. Use this basis when quoting shrink as a percentage of sales. |\n| `count_shrink_events` | INTEGER | Shrink Event Count | Always `1` on every row; SUM to count write-off events. |\n\n# Example Questions\n\n- How much of our shrink is unknown rather than documented, and which `stores` carry a share of it far above their trade?\n- Which `stores` and categories carry a share of shrink far above their share of trade, and how much of that loss surfaces only at a cycle count rather than being caught with its cause attached?\n- Which categories lose most to expiry rather than theft, and does that point at ordering, rotation or shelf life?\n\n## Joins\n\n- [Product](./product.md) — `product_id = product_id`\n- [Store](./store.md) — `store_id = store_id`\n", "retail-chain/store-traffic": "---\ntitle: \"Store Traffic\"\ndescription: |\n  How many people walked through each door each day, how many of them bought something, and what\n  they spent when they did. Footfall is the denominator retail is missing whenever it looks only\n  at sales: a store whose revenue fell may have been busier than ever and converted worse, or\n  quieter and converted the same, and those two are completely different problems with completely\n  different fixes. One row per store and day, with the day itself described — weekend and holiday\n  flags are carried because retail demand is driven by the calendar more than by anything a store\n  does, and a Tuesday is not comparable to a Saturday. Conversion and average basket sit alongside\n  footfall so the three levers of a store day — traffic, conversion, basket — can be separated\n  instead of collapsing into one revenue number.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T04:43:44.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `traffic_id` | STRING | Traffic ID | PK. Unique identifier for this store-day. |\n| `store_id` | STRING | Store ID | Location the footfall was counted at. FK to [Store](./store.md) |\n| `traffic_date` | DATE | Traffic Date | Calendar day the count covers. Together with `store_id` this is the grain of the mart. |\n| `is_weekend` | BOOLEAN | Is Weekend | True for Saturday and Sunday. Weekend footfall runs far above weekday, so match days of week before comparing periods. |\n| `is_holiday` | BOOLEAN | Is Holiday | True on a public holiday. Holidays shift both footfall and basket size and should be isolated, not averaged in. |\n| `footfall` | INTEGER | Footfall | People who entered the store that day, counted at the door. The denominator behind conversion and sales per visitor. |\n| `transactions` | INTEGER | Transactions | Baskets paid for that day. Reconciles with the receipt lines recorded for the same store and day. |\n| `conversion_pct` | FLOAT | Conversion % | Transactions divided by footfall, as a **percentage on a 0–100 scale** — `87.4` means 87.4%, not 8740%. In food and general-merchandise retail this runs high — most people who walk in buy something — so read it against a grocery benchmark rather than a fashion one. |\n| `avg_basket_value` | NUMERIC | Average Basket Value | Average spend per basket that day, in USD. The third lever on a store day, alongside footfall and conversion. |\n\n# Example Questions\n\n- When a `store`'s sales fall, is it losing visitors or losing them at the shelf — and which of the two explains more of the chain's variance?\n- What does holiday trading actually add once the extra footfall is separated from the higher basket that comes with it?\n- Which `stores` convert visitors best for their format, and what would the chain gain if the bottom quartile matched the median?\n\n## Joins\n\n- [Store](./store.md) — `store_id = store_id`\n", "retail-chain/store": "---\ntitle: \"Store\"\ndescription: |\n  Every location the chain trades from, and the handful of facts that decide what to expect of it:\n  which format it trades as, how much selling space it has, the region and state it reports into,\n  and when it opened. Format is the first thing to hold constant in any store comparison — a\n  supercenter, a supermarket and a neighborhood market carry different assortments, draw different\n  footfall and turn their space at different rates, so ranking them against one another says more\n  about the format than about the store. Selling area is the denominator behind sales per square\n  foot, the standard measure of retail productivity, and the opening date is what makes a\n  like-for-like read possible at all, since a store needs a full year behind it before this year\n  can be set against last. This is the dimension every sales, stock, shrink and footfall number in\n  the model rolls up through.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T00:46:46.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `store_id` | STRING | Store ID | PK. Unique identifier for this location. |\n| `name` | STRING | Store Name | Store name as it appears in reporting and on the fascia. |\n| `region` | STRING | Region | Reporting region the store belongs to — the level the estate is managed at. |\n| `state` | STRING | State | US state the store trades in, e.g. `TX`, `OH`, `FL`. The standard external comparison cut. |\n| `city` | STRING | City | City the store is located in. |\n| `format` | STRING | Store Format | Trading format: `supercenter`, `supermarket` or `neighborhood_market`. Hold this constant when comparing stores — the three formats trade nothing alike. |\n| `opened_at` | DATE | Opened Date | Date the store opened. Like-for-like comparison needs at least thirteen months of history behind a store. |\n| `selling_area_sqft` | INTEGER | Selling Area (sq ft) | Trading floor area in square feet, excluding back-of-house. The denominator for sales per square foot. |\n| `is_active` | BOOLEAN | Is Active | True while the location is still trading. Exclude closed sites before comparing per-store averages. |\n\n# Example Questions\n\n- Which formats earn most per square foot of selling space, and does that ranking hold across regions?\n- How do stores opened within the last year compare against the mature estate once their opening period is excluded?\n- Which regions carry the most selling space relative to the trade they actually do?\n", "saas/account": "---\ntitle: \"Account\"\ndescription: |\n  Every customer account (a company), with the signals that frame the whole relationship:\n  industry, size and region, the plan tier they are on, a revenue size band, the channel\n  that acquired them, their success-manager owner, a product-health score, and where they\n  sit in the lifecycle (trial, active, at-risk, churned). The dimension you slice the entire\n  business by.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T12:51:25.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `account_id` | STRING | Account ID | PK. Unique account identifier. |\n| `name` | STRING | Name | Company/account name. |\n| `industry` | STRING | Industry | Industry vertical of the account. |\n| `employee_band` | STRING | Employee Band | Company-size bucket by headcount. |\n| `plan_tier` | STRING | Plan Tier | Subscription plan tier. |\n| `mrr_band` | STRING | MRR Band | Monthly-recurring-revenue size bucket. |\n| `region` | STRING | Region | Sales/geographic region. |\n| `acquisition_channel` | STRING | Acquisition Channel | Marketing channel that sourced the account — blended-CAC join key. |\n| `signup_date` | DATE | Signup Date | Date the account first signed up. |\n| `csm_owner` | STRING | CSM Owner | Customer success manager who owns the account. |\n| `health_score` | INTEGER | Health Score | 0–100 product-health composite. |\n| `lifecycle_stage` | STRING | Lifecycle Stage | trial / active / at-risk / churned. |\n\n# Example Questions\n\n- Which industries and company sizes carry the healthiest accounts and the highest revenue bands?\n- How does the mix of at-risk versus healthy accounts differ across acquisition channels?\n- Do accounts with a dedicated success manager show better health and lifecycle outcomes?\n", "saas/invoices": "---\ntitle: \"Invoices\"\ndescription: |\n  Every invoice and how it was paid — amount, tax, discounts and credits, payment status, and\n  where it sits in the dunning cycle when a payment fails. This is where voluntary revenue meets\n  involuntary churn: failed payments and collections stages that quietly erode the customer base.\n\n  This is the model's revenue mart, and it carries two figures on purpose: `amount` is what was\n  billed on every invoice regardless of outcome, and `net_amount` is what was actually recognised\n  — zero for a voided or written-off invoice, equal to `amount` otherwise. Any revenue total\n  should sum `net_amount`, never `amount`. The four collection signals — `status`, `dunning_stage`,\n  `is_failed` and `paid_at` — always agree with each other: a `paid` invoice always has a\n  `paid_at` and never `is_failed` or a write-off, and `is_write_off` is exactly\n  `dunning_stage = 'write_off'`.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-18T14:00:27.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `invoice_id` | STRING | Invoice ID | PK. Unique invoice identifier. |\n| `account_id` | STRING | Account ID | Account billed. FK to [Account](./account.md) |\n| `subscription_id` | STRING | Subscription ID | Subscription being billed. FK to [Subscription](./subscription.md) |\n| `issued_at` | DATE | Issued At | Date the invoice was issued. |\n| `period_start` | DATE | Period Start | Start of the billing period. |\n| `period_end` | DATE | Period End | End of the billing period. |\n| `amount` | NUMERIC | Amount | Invoice amount before tax. Booked on every status, including void and write-off — see `net_amount` for the recognised figure. |\n| `net_amount` | NUMERIC | Net Amount | Recognised revenue: `0` when the invoice is void or written off, otherwise equal to `amount`. Sum this for revenue totals, not `amount`. |\n| `tax` | NUMERIC | Tax | Tax charged on the invoice. |\n| `status` | STRING | Status | Payment status of the invoice. |\n| `currency` | STRING | Currency | Invoice currency, aligned to the account's region. |\n| `discount_amount` | NUMERIC | Discount Amount | Discount applied to the invoice, if any. Always a fraction of `amount`, never larger than it. |\n| `credit_applied` | NUMERIC | Credit Applied | Account credit applied to the invoice, if any. |\n| `dunning_stage` | STRING | Dunning Stage | Collections stage: none / retry_1 / retry_2 / final_notice / write_off. |\n| `paid_at` | DATE | Paid At | Date the invoice was paid. Set if and only if `status = 'paid'`. |\n| `is_failed` | BOOLEAN | Is Failed | Failed payment — involuntary-churn signal. Never true on a `paid` invoice. |\n| `is_write_off` | BOOLEAN | Is Write Off | Uncollectible invoice, exactly `dunning_stage = 'write_off'`. Use this to gate money rather than string-matching the dunning label. |\n\n# Example Questions\n\n- How much recognised revenue did we collect last quarter, and how much billed revenue never\n- How much revenue is lost to failed payments, and how much does dunning recover before write-off?\n- Which accounts are slipping through the collections stages toward involuntary churn?\n- How much do discounts and applied credits reduce collected revenue versus billed revenue?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id`\n- [Subscription](./subscription.md) — `subscription_id = subscription_id`\n", "saas/marketing-spend": "---\ntitle: \"Marketing Spend\"\ndescription: |\n  Marketing investment by channel, campaign and day — cost, leads, and signups — attributed to\n  the cohort of accounts each channel brings in rather than to individual accounts. The numerator\n  and denominator of customer acquisition cost, and the starting point for payback analysis.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-11T08:37:27.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `spend_id` | STRING | Spend ID | PK. Unique identifier for each spend record. |\n| `spend_date` | DATE | Spend Date | Day the spend was incurred. |\n| `channel` | STRING | Channel | Acquisition channel the spend targeted — attributed to the cohort of accounts acquired through it, not to individual accounts. FK to [Account](./account.md) |\n| `campaign` | STRING | Campaign | Campaign the spend belongs to. |\n| `cost` | NUMERIC | Cost | Money spent — the CAC numerator. |\n| `leads` | INTEGER | Leads | Leads generated by the spend. |\n| `signups` | INTEGER | Signups | Accounts created — CAC denominator. |\n\n# Example Questions\n\n- What is blended and per-channel acquisition cost, and which channels turn leads into signups most efficiently?\n- Which channels pay back fastest once their spend is set against the revenue their cohort retains?\n- How has cost per signup shifted over time as spend scaled up or down?\n\n## Joins\n\n- [Account](./account.md) — `channel = acquisition_channel`\n", "saas/plan": "---\ntitle: \"Plan\"\ndescription: |\n  The price book: every sellable plan and price point — four tiers (Starter, Pro, Business,\n  Enterprise), each offered monthly or annually, with its list price and whether it is\n  currently sellable. The reference that gives every subscription its list pricing.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T12:51:26.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `plan_id` | STRING | Plan ID | PK. Unique plan/price-point identifier. |\n| `plan_name` | STRING | Plan Name | Human-readable plan name (tier + billing interval). |\n| `tier` | STRING | Tier | Product tier: Starter / Pro / Business / Enterprise. |\n| `billing_interval` | STRING | Billing Interval | Billing cadence: monthly / annual. |\n| `list_price` | NUMERIC | List Price | Published list price for this plan at this interval. |\n| `currency` | STRING | Currency | Currency of the list price. |\n| `is_active` | BOOLEAN | Is Active | Whether the plan is currently sellable. |\n\n# Example Questions\n\n- How does list pricing step up across tiers, and what is the effective saving for paying annually?\n- Which tiers and billing intervals are actually being sold the most?\n- How much revenue sits on plans that are no longer offered to new customers?\n", "saas/subscription-events": "---\ntitle: \"Subscription Events\"\ndescription: |\n  The movement history behind recurring revenue: one row per subscription change — new,\n  expansion, contraction, reactivation, or churn — with the signed revenue and seat deltas\n  and the running revenue after each change. This is what reconstructs the revenue waterfall\n  and the retention rates the business lives or dies by.\n\n  Running revenue reconciles with each subscription's own contracted rate. A subscription still\n  on the books finishes the series on that rate; a subscription that churned was carrying it in\n  the period immediately before the churn and the series steps away from it — so a churn reads as\n  revenue lost from a customer's full rate, not as a downgrade on the way up to it.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-18T14:00:27.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `event_id` | STRING | Event ID | PK. Unique subscription-event identifier. |\n| `account_id` | STRING | Account ID | Account the event belongs to. FK to [Account](./account.md) |\n| `subscription_id` | STRING | Subscription ID | Subscription the event belongs to. FK to [Subscription](./subscription.md) |\n| `event_ts` | TIMESTAMP | Event Time | When the subscription change occurred. |\n| `event_type` | STRING | Event Type | MRR-movement type: new / expansion / contraction / reactivation / churn. |\n| `plan_from` | STRING | Plan From | Plan before the change. |\n| `plan_to` | STRING | Plan To | Plan after the change. |\n| `mrr_delta` | NUMERIC | MRR Delta | Signed MRR change — the MRR-movement waterfall. Always the step between two consecutive levels, so the deltas of a subscription add up to the movement in its recurring revenue over the period. |\n| `seats_delta` | INTEGER | Seats Delta | Signed change in seat count. |\n| `mrr_after` | NUMERIC | MRR After | Total MRR after the change, reconciled with the subscription's contracted rate: a subscription with no churn in the period ends on that rate, and one that churned was carrying it immediately before the churn. |\n\n# Example Questions\n\n- What does the revenue waterfall look like month to month — how much new, expansion, contraction and churned revenue?\n- What are gross and net revenue retention, and which is trending the wrong way?\n- How much of expansion comes from seat growth versus tier upgrades?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id`\n- [Subscription](./subscription.md) — `subscription_id = subscription_id`\n", "saas/subscription": "---\ntitle: \"Subscription\"\ndescription: |\n  The billing spine: one row per subscription showing which account is on which plan, at what\n  monthly recurring revenue and seat count, on what cadence, and with any negotiated discount.\n  It also reveals where a subscription's plan has drifted from the account's current tier under\n  grandfathered or discounted pricing. The source of truth for what each customer pays today.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-18T14:00:22.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `subscription_id` | STRING | Subscription ID | PK. Unique subscription identifier. |\n| `account_id` | STRING | Account ID | Account that owns the subscription. FK to [Account](./account.md) |\n| `plan_id` | STRING | Plan ID | Plan the subscription is billed on. May differ from the account's current tier under grandfathered pricing or a negotiated discount. FK to [Plan](./plan.md) |\n| `status` | STRING | Status | Subscription status: active / past_due / canceled. |\n| `seats_licensed` | INTEGER | Seats Licensed | Number of seats licensed on the subscription. |\n| `mrr` | NUMERIC | MRR | Contracted monthly recurring revenue — the rate on the agreement, unchanged by cancellation. |\n| `active_mrr` | NUMERIC | Active MRR | Live monthly recurring revenue: still contracted unless canceled, when it drops to 0. Equal to `mrr` for `active` and `past_due` subscriptions alike — a failed payment does not by itself stop the contract. |\n| `currency` | STRING | Currency | Billing currency, aligned to the account's region. |\n| `billing_interval` | STRING | Billing Interval | Billing cadence: monthly / annual. |\n| `started_at` | DATE | Started At | Date the subscription started. |\n| `current_period_start` | DATE | Current Period Start | Start of the current billing period. |\n| `current_period_end` | DATE | Current Period End | End of the current billing period. |\n| `canceled_at` | DATE | Canceled At | Date the subscription was canceled, if it was. |\n| `discount_pct` | NUMERIC | Discount % | Negotiated discount fraction applied to list price, if any. |\n\n# Example Questions\n\n- What is total recurring revenue, and how is it spread across tiers, billing intervals and seat counts?\n- How common are negotiated discounts, and how much list price do they give away?\n- Which accounts sit on grandfathered pricing that no longer matches their current tier?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id`\n- [Plan](./plan.md) — `plan_id = plan_id`\n", "saas/support-tickets": "---\ntitle: \"Support Tickets\"\ndescription: |\n  Every support interaction — priority, topic, satisfaction score, time to first response, and\n  resolution time. Support experience is an early churn-risk signal: unhappy, slow-to-resolve\n  accounts are the ones that quietly leave.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T12:51:28.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `ticket_id` | STRING | Ticket ID | PK. Unique support-ticket identifier. |\n| `account_id` | STRING | Account ID | Account that opened the ticket. FK to [Account](./account.md) |\n| `user_id` | STRING | User ID | User who opened the ticket, if attributable. FK to [User](./user.md) |\n| `opened_at` | TIMESTAMP | Opened At | When the ticket was opened. |\n| `closed_at` | TIMESTAMP | Closed At | When the ticket was closed. |\n| `priority` | STRING | Priority | Ticket priority level. |\n| `category` | STRING | Category | Ticket topic/category. |\n| `csat_score` | INTEGER | Csat Score | Customer satisfaction rating for the ticket. |\n| `first_response_mins` | INTEGER | First Response Mins | Minutes to first agent response. |\n\n# Example Questions\n\n- How do satisfaction scores and response times relate to whether an account later churns?\n- Which ticket categories drive the most dissatisfaction and the heaviest support load?\n- Do accounts that raise many high-priority tickets expand less than smoother ones?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id`\n- [User](./user.md) — `user_id = user_id`\n", "saas/trials": "---\ntitle: \"Trials\"\ndescription: |\n  Every trial and how it ended — converted to paid or not — with when it started and expired,\n  where it came from (self-serve, sales-assisted, product-led upsell), and the plan it was\n  evaluating. The top of the funnel for new recurring revenue.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-11T08:35:35.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `trial_id` | STRING | Trial ID | PK. Unique trial identifier. |\n| `account_id` | STRING | Account ID | Account running the trial. FK to [Account](./account.md) |\n| `started_at` | TIMESTAMP | Started At | When the trial began. |\n| `ends_at` | TIMESTAMP | Ends At | Scheduled trial expiry. |\n| `converted_at` | TIMESTAMP | Converted At | When the trial converted to a paid plan, if it did. |\n| `is_converted` | BOOLEAN | Is Converted | Trial-to-paid outcome flag. |\n| `trial_source` | STRING | Trial Source | Where the trial came from (self-serve, sales-assisted, PLG upsell). |\n| `requested_plan` | STRING | Requested Plan | Plan tier the trial is evaluating. |\n\n# Example Questions\n\n- What is the trial-to-paid conversion rate, and how does it differ by trial source?\n- How long do trials take to convert, and does evaluating a higher tier change the odds?\n- Which trial sources bring in the accounts that go on to be worth the most?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id`\n", "saas/usage-daily": "---\ntitle: \"Usage (daily)\"\ndescription: |\n  Daily product engagement at the account-and-user level: active minutes, high-value actions\n  taken, and how many distinct features were touched — the breadth signal for activation. The\n  behavioral pulse that explains why accounts expand, stall, or churn.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-11T09:03:53.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `usage_id` | STRING | Usage ID | PK. Unique daily-usage record identifier. |\n| `account_id` | STRING | Account ID | Account that generated the usage. FK to [Account](./account.md) |\n| `user_id` | STRING | User ID | User that generated the usage. FK to [User](./user.md) |\n| `usage_date` | DATE | Usage Date | Calendar day of the usage. |\n| `active_minutes` | INTEGER | Active Minutes | Minutes the user was active in-product. |\n| `key_actions` | INTEGER | Key Actions | Count of high-value actions taken. |\n| `distinct_features_used` | INTEGER | Distinct Features Used | Count of distinct product features touched that day — activation breadth. |\n\n# Example Questions\n\n- How does product engagement in the first weeks predict whether an account converts and expands?\n- Which accounts are quietly disengaging — falling active minutes or narrowing feature use — before they churn?\n- Does broader feature adoption go hand in hand with higher retention and revenue?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id`\n- [User](./user.md) — `user_id = user_id`\n", "saas/user": "---\ntitle: \"User\"\ndescription: |\n  The people inside each account: one row per user seat, with role, seat type, when they were\n  invited, and how recently they were active. Seat-level activity is what turns a licensed\n  account into an adopted one — and idle seats are early signs of shrinking value.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-11T08:35:01.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `user_id` | STRING | User ID | PK. Unique user identifier. |\n| `account_id` | STRING | Account ID | Owning account. FK to [Account](./account.md) |\n| `email` | STRING | Email | User's email address. |\n| `role` | STRING | Role | User's role within the account. |\n| `seat_type` | STRING | Seat Type | Type of seat assigned (e.g. full / viewer). |\n| `invited_at` | TIMESTAMP | Invited At | When the user was invited. |\n| `last_active_at` | TIMESTAMP | Last Active At | Most recent activity timestamp. |\n| `is_active` | BOOLEAN | Is Active | Whether the seat is currently active. |\n\n# Example Questions\n\n- What share of licensed seats is actually active, and how does seat adoption vary by account?\n- Which roles and seat types are the most engaged?\n- Are accounts with many dormant seats the ones heading toward contraction?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id`\n", "trading/ad-spend": "---\ntitle: \"Ad Spend\"\ndescription: |\n  Every dollar the brokerage puts into buying traffic, one row per day, source, medium,\n  campaign and targeting country — the exact grain the media buyers work at. Each row carries\n  the money twice, once as `cost` and once as `cost_normalized` — both already in this\n  reporting's single currency, so either sums safely — next to the impressions and clicks it\n  bought, so cost per click, cost per thousand impressions and click-through rate all come out\n  of a single table. Targeting country is where the budget was spent, not where the trader who\n  answered the ad turns out to live — the two diverge often enough that keeping them apart is\n  the whole point of the field.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T07:25:24.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `date` | DATE | Date | PK. Composite key together with source, medium, campaign, targeting_country. Calendar date the spend occurred — use for daily/weekly/monthly spend trends. FK to [Attribution](./attribution.md) |\n| `source` | STRING | Source | PK. Ad traffic source — which channel ran the ad, e.g. `google`, `facebook`, `tiktok`, `bing`, `native`, `applesearch`. Answers \"which channel/platform did we spend on\". FK to [Attribution](./attribution.md) |\n| `medium` | STRING | Medium | PK. Ad format / traffic medium, e.g. `cpc`, `cpm`, `paid-social`. Answers \"what type of ad\" (search vs social vs display). FK to [Attribution](./attribution.md) |\n| `campaign` | STRING | Campaign | PK. UTM campaign name, e.g. `search_generic_fx`, `acq_video_q3`. Use for campaign-level spend breakdowns. FK to [Attribution](./attribution.md) |\n| `targeting_country` | STRING | Targeting Country | PK. Country the ad budget was targeted at — i.e. where the money was spent. This is NOT where the resulting client lives; for that use Clients.country or Attribution.client_country. Use this field to answer \"spend by country\". FK to [Attribution](./attribution.md) |\n| `targeting_region` | STRING | Targeting Region | Business-region roll-up of targeting_country: `SEA`, `ME`, `EU`, `LATAM`, `AFRICA`, `CA`, `UK`, `AU`, `ANZ`, `Other`. Use for \"spend by region\" instead of listing every country. |\n| `ad_platform` | STRING | Ad Platform | Name of the advertising platform that billed this spend: `Google Ads`, `Meta Ads`, `TikTok Ads`, `Bing Ads`, `YouTube Ads`, `Apple Search Ads`, `Native Ads Network`. Answers \"which ad platform/network\". |\n| `cost` | FLOAT | Cost | Ad spend in this dataset's single reporting currency — identical to `cost_normalized` here, so summing it directly is safe. Kept as a separate field for consistency with source systems where ad platforms genuinely bill in local currency and a normalized column is needed. |\n| `cost_normalized` | FLOAT | Cost Normalized | Ad spend converted to USD. This is the field to SUM for \"total spend\", \"ad cost\", \"budget spent\", \"how much did we spend\" questions — safe to aggregate across countries and campaigns. |\n| `impressions` | INTEGER | Impressions | Number of times the ad was displayed. SUM for total impressions; divide clicks by impressions for CTR. |\n| `clicks` | INTEGER | Clicks | Number of ad clicks. SUM for total clicks; divide cost_normalized by clicks for CPC, or clicks by impressions for CTR. |\n\n# Example Questions\n\n- Which ad platforms deliver the cheapest clicks in the regions we push hardest, and is that cost per click drifting up week over week as we scale the budget?\n- How concentrated is our media buy — what share of total spend sits in a handful of campaigns, and does their click-through rate justify the concentration?\n- Are we overpaying for reach in particular countries — how does cost per thousand impressions compare across targeting countries running the same ad format?\n\n## Joins\n\n- [Attribution](./attribution.md) — `date = date`, `source = source`, `medium = medium`, `campaign = campaign`, `targeting_country = targeting_country`\n", "trading/attribution": "---\ntitle: \"Attribution\"\ndescription: |\n  The whole acquisition funnel already assembled on one row: for each day, source, medium,\n  campaign and targeting country, the money spent and the impressions and clicks it bought,\n  then the sessions that arrived, the short forms submitted, the long forms completed, the\n  clients who cleared KYC, the first time deposits and finally the new trading clients who\n  placed a real trade — with the deposit volume those clients went on to generate. Cost per\n  lead, cost per FTD and return on ad spend are ratios between two columns of the same row,\n  and because every step is carried side by side, the stage where a channel actually loses\n  people is visible without joining anything.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T07:25:28.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `date` | DATE | Date | Calendar date of the funnel activity. Part of the join grain shared with Ad Spend (plus targeting_country). |\n| `source` | STRING | Source | Traffic source. Part of the join grain. |\n| `medium` | STRING | Medium | Traffic medium. Part of the join grain. |\n| `campaign` | STRING | Campaign | UTM campaign name. Part of the join grain. |\n| `targeting_country` | STRING | Targeting Country | Country the ad budget was targeted at (for organic/direct rows, the country traffic actually came from). Part of the join grain; joins to Ad Spend.targeting_country. |\n| `cost_normalized` | FLOAT | Cost Normalized | Ad spend in USD for this row. `0` for organic/direct/affiliate rows (they have no matching Ad Spend row). SUM this for total spend by any slice; divide by short_forms/ftd_count/ntc_count for CPA-style metrics. |\n| `cost` | FLOAT | Cost | Ad spend in the original billing currency. `0` for organic/direct/affiliate rows. Prefer `cost_normalized` for any cross-currency total. |\n| `impressions` | INTEGER | Impressions | Ad impressions for this row. `0` for unpaid rows. |\n| `clicks` | INTEGER | Clicks | Ad clicks for this row. `0` for unpaid rows. |\n| `ad_platform` | STRING | Ad Platform | Ad platform, e.g. `Google Ads`, `Meta Ads`, `TikTok Ads`. `\"Organic/Direct\"` for unpaid rows. |\n| `sessions` | INTEGER | Sessions | Web/app sessions attributed to this row — funnel step 1. SUM for total traffic; divide short_forms by sessions for the session→lead conversion rate. |\n| `unique_users` | INTEGER | Unique Users | Unique users attributed to this row. |\n| `pages_per_session` | FLOAT | Pages Per Session | Average pages viewed per session for this row — an engagement/traffic-quality signal, not a funnel step. |\n| `avg_session_duration` | FLOAT | Average Session Duration | Average session duration in seconds for this row — engagement signal. |\n| `short_forms` | INTEGER | Short Forms | Short-form submissions (leads) attributed to this row — funnel step 2, \"Profile Short Form\" in dashboards. Divide by `sessions` for session→lead conversion; divide `cost_normalized` by this for CPA per lead. |\n| `long_forms` | INTEGER | Long Forms | Long-form / full registrations attributed to this row — funnel step 3, \"Profile Long Form\" in dashboards. |\n| `registrations` | INTEGER | Registrations | Completed account registrations attributed to this row. Equal to `long_forms` in this model (registration = completing the long form). |\n| `kyc_verified` | INTEGER | KYC Verified | Clients who passed KYC verification, attributed to this row. |\n| `ftd_count` | INTEGER | Ftd Count | First Time Depositors attributed to this row — funnel step 4, \"Profile FTD\" in dashboards. Divide `cost_normalized` by this for cost-per-FTD (CPA), the primary acquisition-efficiency metric. |\n| `ntc_count` | INTEGER | Ntc Count | New Trading Clients (placed a first real trade) attributed to this row — funnel step 5, \"Profile NTC\". Always ≤ `ftd_count` for the same row (a client must fund before trading). |\n| `deposit_volume_normalized` | FLOAT | Deposit Volume Normalized | Total deposit amount in USD from clients attributed to this row (cumulative, not just their first deposit). This is the \"revenue\" field — divide by `cost_normalized` for ROAS. |\n| `client_country` | STRING | Client Country | Country of the clients who actually converted (from Clients.country). May differ from `targeting_country` — e.g. ads targeted at country A but the client registered from country B. |\n| `targeting_region` | STRING | Targeting Region | Business-region roll-up of `targeting_country`. |\n| `region` | STRING | Region | Business region — equal to `targeting_region` in this mart; use either. |\n| `traffic_platform` | STRING | Traffic Platform | `App` or `Web`. |\n| `attribution_id` | STRING | Attribution ID | PK. Unique internal identifier for this attribution row (the row's own surrogate key, not a business dimension). |\n| `user_source` | STRING | User Source | First-touch acquisition source (mirrors `source` in this already-aggregated mart; the first/last-touch distinction matters more at the Sessions grain). |\n| `user_medium` | STRING | User Medium | First-touch acquisition medium. |\n| `user_campaign` | STRING | User Campaign | First-touch acquisition campaign. |\n\n# Example Questions\n\n- What does a funded trader really cost by channel, and how much does that cost rise once we require them to actually trade rather than just `deposit`?\n- Where does the funnel leak — which campaigns turn `sessions into leads` well but then lose people between the long form and KYC verification?\n- Which regions return more `deposit volume` than they consume in budget, and where do the countries we target differ from the countries our `converting clients` live in?\n", "trading/clients": "---\ntitle: \"Clients\"\ndescription: |\n  The trader profile, and the centre of the model: one row per registered client, carrying the\n  four milestones the business is run on — registration, identity verification, first deposit\n  and first real trade — with the dates between them, so how long a client takes to fund and\n  then to trade is a stored number rather than a calculation. Each row also holds the money:\n  every deposit and withdrawal already totalled, net deposits, lifetime value, how recently\n  and how often the client funded, an RFM score on all three axes, and a lifecycle segment\n  that names what the client is today, from someone who registered and never deposited to an\n  active trader, a dormant account or a churned one. It is the mart that answers who the\n  customers are, what they are worth and which of them are slipping away.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-31T11:05:11.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `client_id` | STRING | Client ID | PK. Unique client identifier. |\n| `lead_id` | STRING | Lead ID | The first short-form submission that started this client's journey. |\n| `session_id` | STRING | Session ID | The first-touch session that originally brought this client in. NULL if none could be matched. |\n| `email` | STRING | Email | Client email — identity bridge key, matches Leads.email. |\n| `phone` | STRING | Phone | Client phone — identity bridge key. |\n| `first_name` | STRING | First Name | Client first name. |\n| `last_name` | STRING | Last Name | Client last name. |\n| `country` | STRING | Country | Client's country of residence/registration — the client's actual location, NOT the ad targeting country. Use this field (not Ad Spend.targeting_country) to answer \"which country has the most clients/FTD\" or \"FTD by country\" questions. |\n| `region` | STRING | Region | Business-region roll-up of the client's country: `SEA`, `ME`, `EU`, `LATAM`, `AFRICA`, `CA`, `UK`, `AU`, `ANZ`, `Other`. Use for region-level FTD/LTV roll-ups. |\n| `language` | STRING | Language | Client's preferred language. |\n| `registration_date` | DATE | Registration Date | Date the client completed account registration. This corresponds to the \"Long Form\" / \"Profile Long Form\" funnel step in dashboards. |\n| `kyc_status` | STRING | KYC Status | Identity-verification status: `pending`, `verified`, `rejected`, `expired`. |\n| `kyc_verified_date` | DATE | KYC Verified Date | Date KYC was approved. NULL if not yet verified. |\n| `account_type` | STRING | Account Type | Regulatory client classification: `retail` or `professional`. |\n| `is_ftd` | BOOLEAN | Is Ftd | Whether the client made at least one completed deposit (First Time Depositor). This is the \"FTD\" / \"Profile FTD\" metric — `COUNTIF(is_ftd)` gives the FTD count, the primary acquisition-efficiency metric. |\n| `ftd_date` | DATE | Ftd Date | Date of the client's first completed deposit. NULL if `is_ftd = false`. Use for FTD trend charts. |\n| `ftd_amount_normalized` | FLOAT | Ftd Amount Normalized | Amount of the first deposit, in USD. NULL if `is_ftd = false`. |\n| `ftd_payment_method` | STRING | Ftd Payment Method | Payment method used for the first deposit: `card`, `wire_transfer`, `crypto`, `skrill`, `neteller`, `paypal`. NULL if `is_ftd = false`. |\n| `days_to_ftd` | FLOAT | Days To Ftd | Days between `registration_date` and `ftd_date` — how fast a client deposits after registering. NULL if `is_ftd = false`. |\n| `is_ntc` | BOOLEAN | Is Ntc | Whether the client placed at least one real (non-demo) trade — New Trading Client. Always implies `is_ftd = true` (a client must fund before trading). This is the \"NTC\" / \"Profile NTC\" metric — `COUNTIF(is_ntc)` gives the NTC count. |\n| `ntc_date` | DATE | Ntc Date | Date of the client's first real trade. NULL if `is_ntc = false`. |\n| `days_to_ntc` | FLOAT | Days To Ntc | Days between `ftd_date` and `ntc_date` — how fast a depositor starts trading. NULL if `is_ntc = false`. |\n| `has_open_positions` | BOOLEAN | Has Open Positions | Whether the client currently has open trading positions — a live-engagement signal. |\n| `created_at` | TIMESTAMP | Created At | Record creation timestamp in the warehouse. |\n| `count_clients` | INTEGER | Count Clients | Always `1` on every row; SUM to count clients matching a filter. |\n| `total_deposits_normalized` | FLOAT | Total Deposits Normalized | Sum of all this client's completed deposits, in USD. SUM across clients to answer \"total deposit volume\" / \"revenue\" questions. |\n| `total_withdrawals_normalized` | FLOAT | Total Withdrawals Normalized | Sum of all this client's completed withdrawals, in USD. |\n| `net_deposits` | FLOAT | Net Deposits | `total_deposits_normalized` minus `tot
