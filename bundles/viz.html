 - [Listing Seller](./seller.md) — The seller who owns the ordered listing.\n    - [Listing Seller Category](./category.md) — The primary category of that listing's seller.\n- [Seller](./seller.md) — `seller_id = seller_id` [N:1] — The seller who fulfilled this order.\n  - [Seller Category](./category.md) — The primary category of the fulfilling seller.\n", "marketplace/reviews": "---\ntitle: \"Reviews\"\ndescription: |\n  One row per review left after a fulfilled order — the marketplace's trust signal. Only a\n  minority of completed orders are ever reviewed, since reviewing is voluntary, and ratings\n  follow the familiar J-shape: mostly five stars, a hard bump at one star, little in between.\n  The reviewer role separates the buyer's rating of the seller from the seller's rating of\n  the buyer, and the complaint flag — concentrated in the low ratings — marks where trust is\n  breaking down.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:20:50.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `review_id` | STRING | Review ID | PK. Unique review identifier. |\n| `order_id` | STRING | Order ID | Order the review relates to (always a fulfilled order). FK to [Orders](./orders.md) |\n| `reviewer_role` | STRING | Reviewer Role | Side that left the review: buyer or seller. |\n| `rating` | INTEGER | Rating | Star rating 1–5 for the order. |\n| `created_at` | TIMESTAMP | Created At | When the review was submitted. |\n| `has_complaint` | BOOLEAN | Has Complaint | Whether the review flags a complaint (concentrated in 1–2 star ratings). |\n\n# Example Questions\n\n- What is our review coverage of fulfilled `orders`, and does the rating distribution look healthy or is a `category` dragging the average down?\n- Which `sellers` or `categories` attract the most complaints relative to their `order` volume?\n- Do low ratings and complaints cluster around the same `sellers` that later go dormant?\n\n## Joins\n\n- [Orders](./orders.md) — `order_id = order_id` [N:1] — The fulfilled order being reviewed.\n  - [Orders Buyer](./buyer.md) — The buyer who left the review.\n  - [Orders Category](./category.md) — The category of the reviewed order.\n  - [Orders Listings](./listings.md) — The listing that was reviewed.\n    - [Listing Category](./category.md) — The category the reviewed listing is filed under.\n    - [Listing Seller](./seller.md) — The seller who owns the reviewed listing.\n      - [Listing Seller Category](./category.md) — The primary category of that listing's seller.\n  - [Orders Seller](./seller.md) — The seller being reviewed.\n    - [Seller Category](./category.md) — The primary category of the reviewed seller.\n", "marketplace/search-requests": "---\ntitle: \"Search Requests\"\ndescription: |\n  One row per search a buyer runs — the top of the demand funnel and the cleanest read on\n  marketplace liquidity. Each request records the category searched, how many results came\n  back, whether the buyer clicked, and whether the search converted into an order, along\n  with the time it took to match. Searches that return nothing, or return results but never\n  convert, are the \"demand with no fill\" signal a liquidity analyst hunts for.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:20:51.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `request_id` | STRING | Request ID | PK. Unique search request identifier. |\n| `buyer_id` | STRING | Buyer ID | Buyer who made the search. FK to [Buyer](./buyer.md) |\n| `category_id` | STRING | Category ID | Category the search was scoped to. FK to [Category](./category.md) |\n| `requested_at` | TIMESTAMP | Requested At | When the search was made. |\n| `query` | STRING | Query | Raw search text entered by the buyer. |\n| `results_count` | INTEGER | Results Count | Number of results returned. |\n| `clicked` | BOOLEAN | Clicked | Whether the buyer clicked a result. |\n| `converted` | BOOLEAN | Converted | Whether the search led to an order. |\n| `order_id` | STRING | Order ID | Order the search converted into, if any. FK to [Orders](./orders.md) |\n| `time_to_match_mins` | FLOAT | Time To Match Mins | Search → transaction latency in minutes (null unless converted). |\n\n# Example Questions\n\n- Which `categories` and regions show strong demand but weak fill — searches that return few results or rarely convert?\n- What is the search-to-order conversion rate, and where in the funnel (no results, no click, no conversion) does demand leak?\n- For searches that do convert, how long is the time to match and what GMV do they drive?\n\n## Joins\n\n- [Buyer](./buyer.md) — `buyer_id = buyer_id` [N:1] — The buyer who ran this search.\n- [Category](./category.md) — `category_id = category_id` [N:1] — The category searched in.\n- [Orders](./orders.md) — `order_id = order_id` [N:1] — The order this search led to, where it converted.\n  - [Orders Buyer](./buyer.md) — The buyer on the order this search led to.\n  - [Orders Category](./category.md) — The category of the order this search led to.\n  - [Orders Listings](./listings.md) — The listing bought after this search.\n    - [Listing Category](./category.md) — The category of the listing bought after this search.\n    - [Listing Seller](./seller.md) — The seller of the listing bought after this search.\n      - [Listing Seller Category](./category.md) — The primary category of that listing's seller.\n  - [Orders Seller](./seller.md) — The seller who won the order after this search.\n    - [Seller Category](./category.md) — The primary category of the winning seller.\n", "marketplace/seller": "---\ntitle: \"Seller\"\ndescription: |\n  The supply side: one row per seller, with the primary category they sell in, their buyer\n  rating, how many listings they keep live, and — critically for supply-health work — when\n  they last sold and whether they are still active. Supply is heavily concentrated: a small\n  share of sellers drives most of the platform's GMV, so lifecycle status (active, dormant\n  or churned, driven by sale recency) is where a supply manager looks first when GMV softens.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-27T15:57:44.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `seller_id` | STRING | Seller ID | PK. Unique seller identifier. |\n| `onboarded_at` | DATE | Onboarded At | When the seller joined the platform. |\n| `category_id` | STRING | Category ID | Primary category the seller sells in. FK to [Category](./category.md) |\n| `region` | STRING | Region | Seller's geographic region. |\n| `rating` | FLOAT | Rating | Average buyer rating of the seller (null until first review). |\n| `active_listings` | INTEGER | Active Listings | Number of currently live listings. |\n| `is_activated` | BOOLEAN | Is Activated | Whether the seller has reached its first sale — supply activation. |\n| `fulfillment_type` | STRING | Fulfillment Type | How the seller fulfils orders. |\n| `last_sale_at` | DATE | Last Sale At | Date of the seller's most recent sale (null if never sold). |\n| `status` | STRING | Status | Lifecycle state from sale recency: active, dormant or churned. |\n\n# Example Questions\n\n- Are sellers in our highest take-rate `categories` churning faster than sellers in low-rate ones — is take-rate optimisation costing us supply?\n- What share of GMV comes from the top few percent of sellers, and how exposed are we if they go dormant?\n- How many onboarded sellers never reach their first sale, and where does that activation gap concentrate?\n\n## Joins\n\n- [Category](./category.md) — `category_id = category_id` [N:1] — The seller's primary category.\n", "measurecamp/attendee": "---\ntitle: \"Attendee\"\ndescription: |\n  The people who actually turned up: one row per ticket that was used on the day.\n  Registering and attending are deliberately separate here — a ticket is a claim on a place,\n  an attendee is someone who took it — and the gap between the two is the number every\n  organiser wants before the event. The two flags are what an edition would want to know\n  about the room: whether this is someone's first MeasureCamp or a return visit, and whether\n  they ended up leading a session, which any attendee may do by putting a card on the board.\n  Who sat in which session is not tracked, and no join in this model implies it.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `attendee_id` | STRING | Attendee ID | PK. Unique attendee identifier. |\n| `ticket_id` | STRING | Ticket ID | The registration this attendee walked in on. Every attendee has one — no ticket, no entry — but not every ticket becomes an attendee. FK to [Ticket](./ticket.md) |\n| `is_first_measurecamp` | BOOLEAN | First MeasureCamp | True when this is the attendee's first MeasureCamp, false for a returning one. The new-versus-returning mix is the single best read on whether the community is growing or circulating. |\n| `is_speaker` | BOOLEAN | Is Speaker | True when this attendee led at least one session. Leading does not stop someone attending other sessions, so speakers are a subset of attendees, not a separate group. |\n\n# Example Questions\n\n- What share of each edition was there for the first time, and how does that mix differ between cities?\n- How many of the people in the room ended up leading a `session`, and is that share higher among first-timers or returners?\n- How many `tickets` went unused — how far is the number who showed up from the number who registered?\n\n## Joins\n\n- [Ticket](./ticket.md) — `ticket_id = ticket_id` [1:1] — The registration this attendee walked in on.\n  - [Ticket Event](./event.md) — The edition this attendee came to.\n    - [Ticket Event City](./city.md) — The city this attendee came to.\n  - [Ticket Person](./person.md) — Who the attendee is, and what they do.\n  - [Ticket Sponsor](./sponsor.md) — The sponsor that issued their ticket, for sponsor staff.\n    - [Ticket Sponsor Event](./event.md) — The edition that sponsorship was bought for.\n      - [Ticket Sponsor Event City](./city.md) — The city of that sponsored edition.\n", "measurecamp/city": "---\ntitle: \"City\"\ndescription: |\n  The cities MeasureCamp runs in. One row per city, so the editions held in the same place\n  across different years resolve to a single row and can be compared over time — which a\n  free-text city name on the event could never do. A small lookup: it carries no dates and\n  no numbers of its own, and is always read through an event.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `city_id` | STRING | City ID | PK. Unique city identifier. |\n| `name` | STRING | City Name | The city an edition is held in — London, Toronto, Delhi. One row per city, however many editions it has hosted. |\n\n# Example Questions\n\n- Which cities have hosted the most `events`, and which have hosted only once?\n- How many cities does the community reach in a year, and which ones came back?\n- Which cities have never had a second edition, and what did their session board look like?\n", "measurecamp/event": "---\ntitle: \"Event\"\ndescription: |\n  One row per edition of MeasureCamp: a single day, in one city, at one venue. Every edition\n  is run by its own local organising committee rather than centrally, so an event is the\n  unit that everything else in this model hangs off — the session board laid out for it, the\n  tickets sold for it, the sponsors who funded it and the committee that put it on. The\n  properties are deliberately few, because an edition is described by what happened around\n  it far more than by its own attributes.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `event_id` | STRING | Event ID | PK. Unique event identifier. |\n| `city_id` | STRING | City ID | The city this edition was held in. FK to [City](./city.md) |\n| `name` | STRING | Event Name | Name of the edition, usually the city and the year. |\n| `date` | DATE | Event Date | The single day the edition runs on — MeasureCamp is a one-day unconference. |\n| `location` | STRING | Venue | The venue inside the city: the building that hosts the day. |\n\n# Example Questions\n\n- How many editions ran in each `city` per year, and is the calendar spreading to new cities or repeating in the same ones?\n- Which editions sold the most `tickets` relative to the room capacity their `session board` offered?\n- Which editions attracted the most `sponsors`, and did the extra funding show up as more rooms on the board?\n\n## Joins\n\n- [City](./city.md) — `city_id = city_id` [N:1] — The city this edition was held in.\n", "measurecamp/organizer": "---\ntitle: \"Organizer\"\ndescription: |\n  The local committee that puts an edition on. MeasureCamp is not run centrally: each event\n  is organised by volunteers in that city, and this mart is one row per person per role they\n  hold on one edition's committee — so someone who runs both the newsletter and the ticket\n  releases appears twice, and someone who organises two years running appears in both. The\n  roles are the working parts of an event: sponsors, venue, catering, finance, social media,\n  newsletter, website, tickets and the afterparty.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `organizer_id` | STRING | Organizer ID | PK. Unique organizer identifier. |\n| `event_id` | STRING | Event ID | The edition this committee seat belongs to. FK to [Event](./event.md) |\n| `person_id` | STRING | Person ID | The individual holding the seat. FK to [Person](./person.md) |\n| `committee_role` | STRING | Committee Role | The job on the committee: `Sponsors`, `Venue`, `Catering`, `Finance`, `Social Media`, `Newsletter`, `Website`, `Tickets`, `Afterparty`. One row per person per role, so counting rows counts roles, not people. |\n| `contact_details` | STRING | Contact Details | How to reach the organiser — a phone number or an address. |\n\n# Example Questions\n\n- How large is a committee, and which roles are the ones that go unfilled when it is small?\n- Which people organise more than one edition, and do the bigger `events` have the more experienced committees?\n- Do editions with someone dedicated to the sponsors role end up with more `sponsors` signed up?\n\n## Joins\n\n- [Event](./event.md) — `event_id = event_id` [N:1] — The edition this committee seat belongs to.\n  - [Event City](./city.md) — The city of the edition being organised.\n- [Person](./person.md) — `person_id = person_id` [N:1] — The individual holding the seat.\n", "measurecamp/person": "---\ntitle: \"Person\"\ndescription: |\n  The individuals behind everything else in the model: one row per human, held once and\n  reused across editions. A person becomes a ticket holder when they register, an attendee\n  when they turn up and an organiser when they take a seat on a committee — so the same row\n  can play all three roles, in the same year or in different ones. The professional\n  attributes here — the organisation someone works for and what they do there — are what\n  turn \"how many people came\" into a picture of who the community actually is.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `person_id` | STRING | Person ID | PK. Unique person identifier. |\n| `name` | STRING | Full Name | The person's name. |\n| `email` | STRING | Email | Email address the person registers under. |\n| `organization` | STRING | Organization | The company or organisation they work for. |\n| `job_title` | STRING | Job Title | What they do — analyst, developer, marketer and so on. The mix of job titles is the closest thing the model has to a profile of the room. |\n\n# Example Questions\n\n- Which job titles and organisations fill the room, and has that mix shifted across editions?\n- How many people come back — how many hold `tickets` for more than one edition, and how many for three or more?\n- Do the people who lead `sessions` come from different organisations than those who only attend?\n", "measurecamp/room": "---\ntitle: \"Room\"\ndescription: |\n  The rooms an edition's session board is built from: one row per room offered on a board,\n  with the name it goes by, how many people it seats and how the seating is laid out. Rooms\n  are usually named after the sponsor that paid for them, which is why a room points at a\n  sponsor as well as at its board — an unsponsored room simply carries no sponsor. Capacity\n  and layout are what decide whether a popular session has room for the people who want it:\n  a boardroom of twelve and a theatre of a hundred are both one column of the grid, and the\n  board itself does not distinguish them.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `room_id` | STRING | Room ID | PK. Unique room identifier. |\n| `session_board_id` | STRING | Session Board ID | The board this room is one column of. FK to [Session Board](./session-board.md) |\n| `sponsor_id` | STRING | Sponsor ID | The sponsor the room is named after. NULL for rooms that carry no sponsor's name. FK to [Sponsor](./sponsor.md) |\n| `name` | STRING | Room Name | What the room is called on the board — often the naming sponsor's brand. |\n| `capacity` | INTEGER | Capacity | How many people the room seats as laid out. Read it together with `style`: the same space seats very different numbers as a boardroom and as a theatre. |\n| `style` | STRING | Layout Style | Seating layout: `Boardroom` (a table, a dozen or so people, discussion-shaped) or `Theatre` (rows facing a speaker). |\n\n# Example Questions\n\n- How much seating does each board actually offer, and how is it split between boardroom and theatre layouts?\n- Do sponsor-named rooms tend to be the big ones, or is the naming spread across the whole board?\n- Which rooms carried the most `sessions`, and did the bigger rooms get the presentations while the small ones got the discussions?\n\n## Joins\n\n- [Session Board](./session-board.md) — `session_board_id = session_board_id` [N:1] — The board this room is one column of.\n  - [Session Board Event](./event.md) — The edition this room was used at.\n    - [Session Board Event City](./city.md) — The city this room was used in.\n- [Sponsor](./sponsor.md) — `sponsor_id = sponsor_id` [N:1] — The sponsor the room is named after; absent on unsponsored rooms.\n  - [Sponsor Event](./event.md) — The edition the naming sponsor signed up for.\n    - [Sponsor Event City](./city.md) — The city of the naming sponsor's edition.\n", "measurecamp/session-board": "---\ntitle: \"Session Board\"\ndescription: |\n  The grid each edition is built around: one board per event, defined by how many rooms and\n  how many session-length time slots the organisers put up. A board is a matrix — rooms on\n  one axis, time slots on the other — and attendees fill it on the morning of the event by\n  placing session cards on it. The three numbers here are static parameters set when the\n  board is laid out, not counts of what happened: they are the capacity of the grid, so\n  rooms times session slots is how many sessions the day *could* hold. Comparing that to the\n  sessions actually placed is the standard post-event question — how full was the board —\n  and the usual answer is that a handful of slots stay empty.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `session_board_id` | STRING | Session Board ID | PK. Unique session board identifier. |\n| `event_id` | STRING | Event ID | The edition this board belongs to — exactly one board per event. FK to [Event](./event.md) |\n| `number_of_rooms` | INTEGER | Number of Rooms | Rooms the organisers put on the board. A static parameter of the layout, not a count of the rooms that ended up being used — organisers routinely plan one room fewer than they need. |\n| `number_of_session_slots` | INTEGER | Number of Session Slots | Time slots reserved for sessions, excluding breaks and lunch. Static. `number_of_rooms * number_of_session_slots` is how many sessions the day can hold — the denominator for any \"how full was the board\" question. |\n| `session_length_minutes` | INTEGER | Session Length (min) | How long one session runs on this board — traditionally 30 minutes, 25 at some editions. Set per board, so it is the same for every session on it. |\n\n# Example Questions\n\n- How full did each board get — what share of the potential slots (`rooms` times session slots) carried an actual `session`?\n- Do bigger boards fill as well as small ones, or does adding rooms mostly add empty slots?\n- Do editions with 25-minute sessions fit more `sessions` into the day than those with 30-minute ones, and does the board fill up the same?\n\n## Joins\n\n- [Event](./event.md) — `event_id = event_id` [1:1] — The edition this board lays out — one board per event.\n  - [Event City](./city.md) — The city this board's edition was held in.\n", "measurecamp/session": "---\ntitle: \"Session\"\ndescription: |\n  The talks themselves — at MeasureCamp, a session card an attendee writes and places on the\n  board to claim a room and a time slot. There is no programme committee and no call for\n  papers: the schedule is made on the morning of the event by the people who turned up,\n  which is why a session points at the attendee who leads it rather than at a separate\n  speaker. A card can exist before it has a place on the grid, so a session with no room and\n  no time slot is one that was offered but never made it onto the board. The descriptive\n  columns — type, level, language and the nature of the audience — are what answer the\n  second post-event question after \"was the board full\": was there enough variety on it.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `session_id` | STRING | Session ID | PK. Unique session identifier. |\n| `session_board_id` | STRING | Session Board ID | The board this session card was placed on. FK to [Session Board](./session-board.md) |\n| `room_id` | STRING | Room ID | The room the session runs in. NULL while the card has not been placed on the board yet. FK to [Room](./room.md) |\n| `time_slot_id` | STRING | Time Slot ID | The slot the session runs in. NULL while the card has not been placed on the board yet — a session with no slot never actually happened. FK to [Time Slot](./time-slot.md) |\n| `speaker_attendee_id` | STRING | Speaker | The attendee who leads the session. Attendees both give sessions and sit in other people's, so this is a role on the day, not a separate kind of person. FK to [Attendee](./attendee.md) |\n| `name` | STRING | Session Name | The title written on the session card. |\n| `description` | STRING | Session Description | What the session is about, as pitched on the card. |\n| `type` | STRING | Session Type | `Presentation` (someone presents) or `Discussion` (the room talks). |\n| `level` | STRING | Level | `Beginner`, `Intermediate` or `Advanced`. A board with nothing for beginners is a recognised failure mode, so the spread matters more than the count. |\n| `language` | STRING | Language | The language the session is held in. |\n| `audience` | STRING | Audience | The nature of the audience the session is pitched at: `Analytical`, `Business` or `Technical`. |\n\n# Example Questions\n\n- Was there a good variety on the board — how did `sessions` split across level, type and audience, and did any edition end up all-technical or all-beginner?\n- How many session cards never made it onto the board at all, and did those differ in level or audience from the ones that did?\n- Do the attendees who lead `sessions` come back to later editions more often than those who only listen?\n\n## Joins\n\n- [Session Board](./session-board.md) — `session_board_id = session_board_id` [N:1] — The board this session card was placed on.\n  - [Session Board Event](./event.md) — The edition this session was held at.\n    - [Session Board Event City](./city.md) — The city this session was held in.\n- [Room](./room.md) — `room_id = room_id` [N:1] — The room it runs in; absent while the card is not yet on the board.\n  - [Room Session Board](./session-board.md) — The board reached through the room — the same board as the session's own.\n    - [Room Session Board Event](./event.md) — The edition reached through the session's room.\n      - [Room Session Board Event City](./city.md) — The city reached through the session's room.\n  - [Room Sponsor](./sponsor.md) — The sponsor the session's room is named after.\n    - [Room Sponsor Event](./event.md) — The edition that room's sponsor signed up for.\n      - [Room Sponsor Event City](./city.md) — The city of that room sponsor's edition.\n- [Time Slot](./time-slot.md) — `time_slot_id = time_slot_id` [N:1] — The slot it runs in; absent while the card is not yet on the board.\n  - [Time Slot Session Board](./session-board.md) — The board reached through the slot — the same board as the session's own.\n    - [Time Slot Session Board Event](./event.md) — The edition reached through the session's slot.\n      - [Time Slot Session Board Event City](./city.md) — The city reached through the session's slot.\n- [Attendee](./attendee.md) — `speaker_attendee_id = attendee_id` [N:1] — The attendee leading it — one attendee may lead several.\n  - [Attendee Ticket](./ticket.md) — The speaker's own registration.\n    - [Attendee Ticket Event](./event.md) — The edition the speaker registered for.\n      - [Attendee Ticket Event City](./city.md) — The city the speaker registered for.\n    - [Attendee Ticket Person](./person.md) — Who the speaker is, and what they do.\n    - [Attendee Ticket Sponsor](./sponsor.md) — The sponsor that issued the speaker's ticket.\n      - [Attendee Ticket Sponsor Event](./event.md) — The edition that speaker's sponsorship was bought for.\n        - [Attendee Ticket Sponsor Event City](./city.md) — The city of that sponsored edition.\n", "measurecamp/sponsor": "---\ntitle: \"Sponsor\"\ndescription: |\n  The organisations funding an edition: one row per sponsorship, per event, so a company\n  that backs the same city three years running is three rows. A sponsorship carries a tier\n  and a place in the pipeline, from a prospect being talked to, through confirmed, to\n  actually paid — which is the difference between a budget an organiser can spend and one\n  they only hope for. Sponsors show up elsewhere in the day too: the rooms are usually named\n  after them, and their staff come in on tickets of their own. Note the boundary — this is\n  the money coming in; the model has no costs side, so \"did the event cover its costs\"\n  cannot be answered here.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `sponsor_id` | STRING | Sponsor ID | PK. Unique sponsorship identifier. |\n| `event_id` | STRING | Event ID | The edition this sponsorship was bought for — sponsorship is always per event. FK to [Event](./event.md) |\n| `organization_name` | STRING | Organization Name | The sponsoring company, as it appears on the room and the banners. |\n| `tier` | STRING | Tier | Sponsorship level: `Gold`, `Silver` or `Bronze`. |\n| `status` | STRING | Status | Where the sponsorship stands: `Prospect` (in conversation), `Confirmed` (agreed) or `Paid` (money received). Only `Paid` is money an organiser actually has. |\n\n# Example Questions\n\n- How much of each edition's sponsorship is still only confirmed rather than paid, and how late does that convert?\n- Which organisations sponsor repeatedly, and do they move up the tiers as they come back?\n- Do editions with more gold `sponsors` put more `rooms` on the board?\n\n## Joins\n\n- [Event](./event.md) — `event_id = event_id` [N:1] — The edition this sponsorship was bought for.\n  - [Event City](./city.md) — The city of the sponsored edition.\n", "measurecamp/ticket": "---\ntitle: \"Ticket\"\ndescription: |\n  Registration: one row per ticket issued for an edition, and the only way in — the rule is\n  that without a ticket you do not get through the door. A ticket names the person it\n  belongs to and the capacity they come in as, since sponsors, organisers and volunteers are\n  all ticket holders too rather than a separate list. Tickets are released in batches, which\n  is what makes a release number worth keeping. And because not everyone who registers\n  arrives, the count of tickets is always larger than the count of attendees — treating the\n  two as the same number is the classic mistake this split exists to prevent.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `ticket_id` | STRING | Ticket ID | PK. Unique ticket identifier. |\n| `event_id` | STRING | Event ID | The edition this ticket admits to. FK to [Event](./event.md) |\n| `person_id` | STRING | Person ID | The individual the ticket belongs to. The same person across editions is the same row in Person, which is what makes returning visitors visible. FK to [Person](./person.md) |\n| `sponsor_id` | STRING | Sponsor ID | The sponsor whose allocation this ticket came out of, for sponsor staff. NULL for every ordinary ticket. FK to [Sponsor](./sponsor.md) |\n| `type` | STRING | Ticket Type | The capacity the holder comes in as: `General Attendee`, `Sponsor`, `Organizer` or `Volunteer`. |\n| `release` | INTEGER | Ticket Release | Which batch the ticket was released in — 1 for the first release, 2 for the second, and so on. |\n| `sponsor_consent` | BOOLEAN | Sponsor Consent | True when the holder agreed at registration that their details may be shared with the edition's sponsors. |\n\n# Example Questions\n\n- How does the no-show rate — `tickets` issued against `attendees` who arrived — differ between editions, and does it change by ticket release?\n- What share of holders consent to being shared with `sponsors`, and does that differ between general attendees and sponsor staff?\n- How much of an edition's room is taken up by organisers, volunteers and sponsor staff rather than general attendees?\n\n## Joins\n\n- [Event](./event.md) — `event_id = event_id` [N:1] — The edition this ticket admits to.\n  - [Event City](./city.md) — The city this ticket admits to.\n- [Person](./person.md) — `person_id = person_id` [N:1] — The individual the ticket belongs to.\n- [Sponsor](./sponsor.md) — `sponsor_id = sponsor_id` [N:1] — The sponsor whose allocation issued it; absent on ordinary tickets.\n  - [Sponsor Event](./event.md) — The edition the issuing sponsor signed up for.\n    - [Sponsor Event City](./city.md) — The city of the issuing sponsor's edition.\n", "measurecamp/time-slot": "---\ntitle: \"Time Slot\"\ndescription: |\n  The other axis of the session board: the day cut into named slots. Not every slot is for\n  sessions — the morning break, lunch, the afternoon break, the closing and the party are\n  slots too, and they are what make the schedule readable as a day rather than a list of\n  talks. Only the session-type slots can carry a session card, so the type is the filter\n  that turns \"slots in the day\" into \"slots a session could go in\", and getting that wrong\n  understates how full a board really was.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `time_slot_id` | STRING | Time Slot ID | PK. Unique time slot identifier. |\n| `session_board_id` | STRING | Session Board ID | The board this slot is one row of. FK to [Session Board](./session-board.md) |\n| `name` | STRING | Time Slot Name | What the slot is called on the board, e.g. `Session 1`. |\n| `type` | STRING | Slot Type | `Session`, `Morning Break`, `Lunch`, `Afternoon Break`, `Closing` or `Party`. Only `Session` slots carry sessions — filter on this before counting slots against the sessions placed in them. |\n| `start_time` | TIMESTAMP | Start Time | When the slot starts. |\n| `end_time` | TIMESTAMP | End Time | When the slot ends. |\n\n# Example Questions\n\n- Which time slots fill up and which ones stay half empty — does the first slot of the day, or the one after lunch, lose out?\n- How long is the session part of the day once breaks, lunch and the closing are set aside?\n- Do the `sessions` in the last slot skew towards discussions rather than presentations?\n\n## Joins\n\n- [Session Board](./session-board.md) — `session_board_id = session_board_id` [N:1] — The board this slot is one row of.\n  - [Session Board Event](./event.md) — The edition this slot belongs to.\n    - [Session Board Event City](./city.md) — The city of the edition this slot belongs to.\n", "retail-chain/inventory-daily": "---\ntitle: \"Inventory (daily)\"\ndescription: |\n  What was on the shelf, store by store and line by line, at the close of every day: units on hand\n  and what they are worth, units still on order, the reorder point the line is managed against,\n  whether it ended the day with nothing left, and how many weeks the remaining stock would last at\n  current demand. Availability is the constraint on everything a store can sell — an empty shelf\n  produces no sale, no margin and no loyalty, and the sale it loses rarely comes back later — so\n  this is the mart that explains sales the sales figures themselves cannot. It is also where\n  working capital sits: stock is cash on a shelf, and the same daily position that reveals a\n  stockout reveals overstock in the lines nobody is buying. Reading the two together is the whole\n  of inventory management — too little loses sales, too much ties up money and, in fresh food, is\n  thrown away.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-07T18:20:47.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `snapshot_id` | STRING | Snapshot ID | PK. Unique identifier for this store, SKU and day position. |\n| `store_id` | STRING | Store ID | Location the stock is held at. FK to [Store](./store.md) |\n| `product_id` | STRING | Product ID | Line the position is recorded for. FK to [Product](./product.md) |\n| `snapshot_date` | DATE | Snapshot Date | Day the position was taken at close of trade. With `store_id` and `product_id` this is the grain of the mart. |\n| `on_hand_units` | INTEGER | On-Hand Units | Selling units left on this line at the close of the day. |\n| `on_hand_value` | NUMERIC | On-Hand Value | Value of the units on hand at unit cost, in USD. The working capital standing on the shelf. |\n| `on_order_units` | INTEGER | On-Order Units | Units already ordered and not yet received. A line can be empty and still covered if a delivery is inbound. |\n| `reorder_point` | INTEGER | Reorder Point | Demand the line must serve before its next delivery lands. On-hand below it means the line is depending on that delivery arriving on time — normal and frequent on lines held to a few days of cover, near-absent on lines held to weeks of it, so compare the share of days below it across lines stocked the same way rather than reading any single figure as a fault. |\n| `is_stockout` | BOOLEAN | Is Stockout | True when the line had no stock left at the close of the day. A line can still have sold during a day that ends in stockout — the snapshot is taken at day end, not across it. |\n| `weeks_of_supply` | FLOAT | Weeks of Supply | How many weeks the stock on hand would last at current demand. Low means lost sales are close; high means cash tied up, and on perishables, write-offs ahead. |\n\n# Example Questions\n\n- What did empty shelves cost us over the period, and do stockouts concentrate in the fast-selling lines where they hurt most?\n- Which `stores` hold weeks of supply far above what their demand justifies, and how much cash is sitting in that overstock?\n- Does a line's reorder point actually protect it, or do the same SKUs run out repeatedly despite being ordered on time?\n\n## Joins\n\n- [Product](./product.md) — `product_id = product_id` [N:1] — The SKU counted in this snapshot.\n- [Store](./store.md) — `store_id = store_id` [N:1] — The store this stock snapshot is for.\n", "retail-chain/loyalty-members": "---\ntitle: \"Loyalty Members\"\ndescription: |\n  Everyone enrolled in the loyalty program, and what each of them is worth to the chain: the store\n  they treat as home, the tier they have reached, when they joined and how they have shopped since\n  — lifetime spend, how many baskets it took, the average basket behind it, and how long it has\n  been since the last one. This is the only place a shopper exists as a person rather than as an\n  anonymous basket, which makes it the entry point for every question about retention, frequency\n  and share of wallet. The RFM block turns that history into segments that can be acted on: who is\n  shopping most, who is spending most, and who has quietly stopped coming. `home_store_id` matters\n  more here than it looks — a member's value is earned at a location, so store performance and\n  member value are two views of the same trade, and a store losing gold members is in trouble long\n  before its sales line shows it.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T04:38:08.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `member_id` | STRING | Member ID | PK. Unique identifier for this loyalty account. |\n| `home_store_id` | STRING | Home Store ID | Location the member shops most often, which is where their value is earned. FK to [Store](./store.md) |\n| `enrolled_at` | DATE | Enrolled Date | Date the member joined the loyalty program. The gap to `first_purchase_date` shows how long enrolment takes to turn into trade. |\n| `tier` | STRING | Loyalty Tier | Program tier earned on spend: `base`, `silver` or `gold`. Tier is partly a result of basket size, so treat it as a segment rather than a cause. |\n| `city` | STRING | City | City the member lives in, which need not be the city of their home store. |\n| `state` | STRING | State | US state the member lives in, e.g. `TX`, `OH`, `FL`. |\n| `age_band` | STRING | Age Band | Banded age group the member falls into. Banding keeps the cut usable without holding a date of birth. |\n| `email_opt_in` | BOOLEAN | Email Opt-In | True when the member has agreed to receive email offers. The reachable base for any mailed campaign. |\n| `is_app_user` | BOOLEAN | Is App User | True when the member uses the mobile app, which is what makes an offer targetable in the moment rather than a week ahead. |\n| `rfm_label` | STRING | RFM Segment | Segment summarising the three scores below into one label, e.g. champions, loyal, at risk, lapsed. The everyday cut for campaign selection. |\n| `recency_score` | INTEGER | Recency Score | 1 to 5, where 5 is a member who shopped most recently. |\n| `frequency_score` | INTEGER | Frequency Score | 1 to 5, where 5 is a member who shops most often. |\n| `monetary_score` | INTEGER | Monetary Score | 1 to 5, where 5 is a member who has spent the most. |\n| `lifetime_spend` | NUMERIC | Lifetime Spend | Total spend by this member since enrolment, in USD. |\n| `lifetime_baskets` | INTEGER | Lifetime Baskets | Number of separate shopping trips the member has made. Divides into `lifetime_spend` to give `avg_basket_value`. |\n| `avg_basket_value` | NUMERIC | Average Basket Value | Average spend per shopping trip for this member, in USD. |\n| `first_purchase_date` | DATE | First Purchase Date | Date of the member's first purchase on the program. |\n| `last_purchase_date` | DATE | Last Purchase Date | Date of the member's most recent purchase. |\n| `days_since_last_purchase` | INTEGER | Days Since Last Purchase | Whole days between the last purchase and the reporting date. The lapse trigger behind any recall campaign. |\n| `is_active` | BOOLEAN | Is Active | True while the member is still shopping within the program's activity window. Exclude the dormant tail before comparing per-member averages. |\n| `count_members` | INTEGER | Member Count | Always `1` on every row; SUM to count members. |\n\n# Example Questions\n\n- Which `stores` are losing their most valuable members, and how much annual spend walks out with the ones who have gone quiet?\n- Do members who use the app shop more often than card-only members, or do they simply spend more per visit when they do come?\n- How long does it take a newly enrolled member to reach the basket size of an established one, and does that ramp differ by tier?\n\n## Joins\n\n- [Store](./store.md) — `home_store_id = store_id` [N:1] — The member's home store.\n", "retail-chain/pos-sales": "---\ntitle: \"POS Sales\"\ndescription: |\n  Every line rung through a till across the chain: what was sold, where, when, at what price, at\n  what discount and at what margin. This is the mart the rest of the model exists to explain — one\n  row per receipt line, with the basket it belonged to, the promotion that priced it, the loyalty\n  account behind it when the shopper was identified, and the way it was paid for and scanned. Price\n  is carried alongside cost so margin is available at line level rather than reconstructed\n  afterwards, which is what lets a discount be judged on the profit it left rather than the volume\n  it moved. Because a sale line also carries its store, its SKU and its calendar day, it reaches\n  straight into the two day-grained marts around it: the footfall the store saw that day and the\n  stock position that line finished the day on. That is what turns a sales figure into a diagnosis\n  — whether a weak day was fewer visitors, worse conversion, a smaller basket, or a shelf that had\n  nothing left on it.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:21:06.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `sale_id` | STRING | Sale ID | PK. Unique identifier for this receipt line. |\n| `store_id` | STRING | Store ID | Location the line was sold at. FK to [Store Traffic](./store-traffic.md) |\n| `product_id` | STRING | Product ID | SKU that was sold. FK to [Product](./product.md) |\n| `promotion_id` | STRING | Promotion ID | NULL when the line sold at regular price, so promoted and full-price trade separate on this column alone. FK to [Promotion](./promotion.md) |\n| `member_id` | STRING | Member ID | NULL when the basket was not identified, which is how an anonymous shopper appears. FK to [Loyalty Members](./loyalty-members.md) |\n| `basket_id` | STRING | Basket ID | Identifier of the basket this line was paid for in. Groups the lines of one transaction, so basket size and mix are a roll-up of this mart. |\n| `sold_at` | TIMESTAMP | Sold At | Exact moment the line was rung through the till. Use this for hour-of-day and daypart questions. |\n| `sale_date` | DATE | Sale Date | Calendar date of the sale. Carried alongside `sold_at` because day-grained marts — store traffic and the daily stock position — join on a date, not a timestamp. FK to [Store Traffic](./store-traffic.md) |\n| `quantity` | INTEGER | Quantity | Selling units sold on this line. |\n| `unit_price` | NUMERIC | Unit Price | Shelf price per unit before any discount, in USD. |\n| `discount` | NUMERIC | Discount | Value taken off the line by the promotion it was on, in USD. Zero on a line sold at regular price — there is no markdown history in this model, so `promotion_id IS NULL` and a zero discount mean the same thing. |\n| `net_sales` | NUMERIC | Net Sales | What the line actually took after discount, in USD. The revenue figure to sum. |\n| `line_cost` | NUMERIC | Line Cost | What the units on this line cost the chain, in USD. |\n| `gross_margin` | NUMERIC | Gross Margin | `net_sales` less `line_cost`, in USD. The only one of the money columns that says whether the line was worth selling — read promotions and categories on this, with revenue beside it. |\n| `checkout_type` | STRING | Checkout Type | Where the line was scanned: `staffed` or `self_checkout`. Summed by store it gives each site's self-checkout share of trade, which is the figure to set beside that store's `Shrinkage` events with `detected_by = 'self_checkout_audit'` — the two marts are read side by side at store level rather than joined. |\n| `payment_method` | STRING | Payment Method | How the basket was settled: `card`, `cash`, `mobile_wallet`, `ebt` or `gift_card`. `ebt` marks a benefits-funded basket, which shops a distinctly different assortment. |\n| `count_sale_lines` | INTEGER | Sale Line Count | Always `1` on every row; SUM to count receipt lines. |\n\n# Example Questions\n\n- Which `promotions` earned their discount and which merely bought volume we would have taken anyway at full price, once line-level margin rather than revenue is the measure?\n- How much trade did we lose to empty shelves — what did the lines that finished a day out of stock sell on the days they were available, and which velocity bands carry that loss?\n- Do identified loyalty baskets differ from anonymous ones in size, margin and category mix by enough to justify what the programme costs?\n\n## Joins\n\n- [Inventory (daily)](./inventory-daily.md) — `store_id = store_id`, `product_id = product_id`, `sale_date = snapshot_date` [N:1] — Stock of this SKU at this store on the day of sale.\n  - [Inventory SKU](./product.md) — The SKU as the sale-day stock snapshot records it.\n  - [Inventory Store](./store.md) — The store the sale-day stock snapshot belongs to.\n- [Loyalty Members](./loyalty-members.md) — `member_id = member_id` [N:1] — The member who bought, where a card was scanned.\n  - [Member Home Store](./store.md) — The buyer's home store, which need not be where they bought.\n- [Product](./product.md) — `product_id = product_id` [N:1] — The SKU sold on this line.\n- [Promotion](./promotion.md) — `promotion_id = promotion_id` [N:1] — The promotion applied to this line.\n- [Store](./store.md) — `store_id = store_id` [N:1] — The store that rang up this line.\n- [Store Traffic](./store-traffic.md) — `store_id = store_id`, `sale_date = traffic_date` [N:1] — Footfall at this store on the day of sale.\n  - [Traffic Store](./store.md) — The store behind that day of footfall.\n", "retail-chain/product": "---\ntitle: \"Product\"\ndescription: |\n  The assortment, one row per SKU: what the line is, who makes it, who supplies it, what it costs\n  the chain and what it lists at. Two fields do most of the analytical work here. `velocity_band`\n  is the A/B/C classification that decides replenishment priority and shelf position — an A line\n  sells every day and a stockout on it costs real money, a C line may sit for weeks and is mostly a\n  question of whether it earns its space. `is_perishable` separates the lines with a shelf life\n  from the rest, and perishability drives both how often a line has to be reordered and how much of\n  it is written off before it ever sells. Alongside those, `unit_cost` against `list_price` gives\n  the intended margin on every line before any promotion touches it, and `is_private_label`\n  separates the chain's own brands — typically higher margin, and the lever a grocer pulls when\n  shoppers trade down.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T00:46:49.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `product_id` | STRING | Product ID | PK. Unique identifier for this SKU. |\n| `sku` | STRING | SKU | Stock-keeping unit code as it appears on the shelf edge and in ordering. |\n| `name` | STRING | Product Name | Description of the line as it reads on the shelf and the receipt. |\n| `category` | STRING | Category | Top level of the merchandising hierarchy, e.g. `Grocery`, `Fresh Food`, `Apparel`, `Home`. |\n| `subcategory` | STRING | Subcategory | Second level of the merchandising hierarchy within the category. |\n| `brand` | STRING | Brand | Brand the line is sold under. Compare against `is_private_label` to separate own brands from national ones. |\n| `supplier_name` | STRING | Supplier | Vendor the chain buys this line from. Matches the supplier on replenishment orders, so supplier service level is answerable from these two together. |\n| `unit_cost` | NUMERIC | Unit Cost | Cost to the chain of one selling unit. The basis of margin on every sale line. |\n| `list_price` | NUMERIC | List Price | Shelf price of one selling unit before any promotion. The gap to `unit_cost` is the intended margin. |\n| `pack_size` | STRING | Pack Size | How the line is packaged for sale, e.g. `12-count`, `2 lb`, `single`. Normalise on this before comparing prices across brands. |\n| `unit_of_measure` | STRING | Unit of Measure | Unit the line is sold in: `each`, `lb`, `oz`, `pack`, `case`. |\n| `velocity_band` | STRING | Velocity Band | ABC velocity class: `A` for the fastest sellers, `C` for the slowest. A stockout on an A line costs far more than one on a C line. |\n| `is_private_label` | BOOLEAN | Is Private Label | True for the chain's own brands, which carry higher margin and gain share when shoppers trade down. |\n| `is_perishable` | BOOLEAN | Is Perishable | True for lines with a shelf life. Perishability drives both replenishment cadence and expiry write-offs. |\n\n# Example Questions\n\n- Which categories carry our margin once private label is separated from national brands, and where is the intended margin never realised at the till?\n- Are our A-band lines the ones we actually keep in stock, or does availability track pack size and perishability instead?\n- Which suppliers concentrate the most of our perishable assortment, and what does that concentration expose us to?\n", "retail-chain/promotion": "---\ntitle: \"Promotion\"\ndescription: |\n  Every offer the chain ran, and the four things that decide whether it was worth running: the\n  mechanic it used, the channel it reached shoppers through, the categories it covered, and — the\n  one most promotional reporting leaves out — who actually paid for the discount. A vendor-funded\n  deal costs the chain nothing but shelf space and can be judged on volume alone; a retailer-funded\n  one comes straight out of margin and has to earn it back in incremental units, not units that\n  would have sold at full price anyway. `start_date` and `end_date` bound the window a promotion\n  can be credited for, which is what any pre-period, promo-period and post-period read is built on,\n  and `category_scope` is what lets an offer be set against the categories it was supposed to move\n  rather than against total sales.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T00:46:49.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `promotion_id` | STRING | Promotion ID | PK. Unique identifier for this promotion. |\n| `name` | STRING | Promotion Name | Name of the offer as it appears in the promotional calendar. |\n| `promo_type` | STRING | Promotion Type | Mechanic used: `discount`, `bogo` (buy one get one), `loyalty_points`, `bundle`. Mechanics are not comparable on discount depth alone. |\n| `promo_channel` | STRING | Promotion Channel | How the offer reached shoppers: `weekly_circular`, `app_offer`, `in_store_display`, `loyalty_targeted`. Separates broad reach from targeted precision. |\n| `funding_source` | STRING | Funding Source | Who paid for the discount: `vendor_funded` when the supplier covered it, `retailer_funded` when the chain absorbed it. This is what decides whether a promotion made money. |\n| `category_scope` | STRING | Category Scope | Part of the assortment the offer covered. Measure uplift against these categories, not against total store sales. |\n| `start_date` | DATE | Start Date | First day the offer was live. |\n| `end_date` | DATE | End Date | Last day the offer was live. Sales outside this window were not on this deal. |\n| `discount_pct` | FLOAT | Discount % | Headline depth of the offer as a percentage off the shelf price. |\n\n# Example Questions\n\n- Which promotions grew margin rather than moving volume we would have sold anyway, once vendor-funded and retailer-funded offers are judged on different bars?\n- Do app offers and loyalty-targeted deals earn more per discount dollar than the weekly circular, and in which categories?\n- How deep does a discount have to go before the category's uplift stops covering the margin given away?\n", "retail-chain/replenishment": "---\ntitle: \"Replenishment\"\ndescription: |\n  Every order placed to refill a store's shelves, from the day it was raised to the day the goods\n  arrived — how much was asked for, how much actually turned up, what it cost, how long it took,\n  and whether it landed when it was promised. This is where an availability problem is diagnosed\n  rather than merely observed: a shelf can be empty because the store never ordered, because the\n  supplier short-shipped, or because the delivery was late, and only the order record separates the\n  three. Fill rate and on-time delivery are the two halves of on-time-in-full, the standard measure\n  of supplier service, and `supplier_name` is what makes them answerable per vendor. Lead time is\n  the other half of the story, because a supplier who reliably takes ten days can be planned around,\n  while one who takes anywhere between three and fifteen forces every store to carry cover stock it\n  should not need.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T04:40:19.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `order_id` | STRING | Order ID | PK. Unique identifier for this replenishment order. |\n| `store_id` | STRING | Store ID | Location the goods were ordered for. FK to [Store](./store.md) |\n| `product_id` | STRING | Product ID | Line being replenished. FK to [Product](./product.md) |\n| `supplier_name` | STRING | Supplier | Vendor the order was placed with. Matches the supplier on the product, so supplier service level is answerable from the two together. |\n| `ordered_at` | DATE | Ordered Date | Date the order was raised with the supplier. |\n| `expected_at` | DATE | Expected Date | Date the supplier promised delivery. The bar `is_on_time` is measured against. |\n| `received_at` | DATE | Received Date | Date the goods actually arrived. NULL while the order is still open, so exclude open orders from lead-time and service-level calculations rather than treating them as received today. |\n| `status` | STRING | Order Status | Where the order stands: `open` (raised, goods not yet received — including orders already overdue, whose `expected_at` has passed with nothing delivered), `partial` (short-shipped), `received` (complete) or `cancelled` (it will never arrive). |\n| `quantity_ordered` | INTEGER | Quantity Ordered | Selling units requested from the supplier. |\n| `quantity_received` | INTEGER | Quantity Received | Selling units actually delivered. Below `quantity_ordered` on a short shipment. |\n| `order_cost` | NUMERIC | Order Cost | Value of the order at unit cost, in USD. |\n| `lead_time_days` | INTEGER | Lead Time (Days) | Whole days from order to receipt. Its variance matters as much as its level — unpredictable lead time has to be covered with stock. |\n| `fill_rate_pct` | FLOAT | Fill Rate % | Quantity received divided by quantity ordered, as a **percentage on a 0–100 scale** — `96.5` means 96.5% of the order arrived, not 9650%. The \"in full\" half of on-time-in-full, and the standard measure of how completely a supplier serves an order. |\n| `is_on_time` | BOOLEAN | Is On Time | True when the goods arrived by `expected_at`. The \"on time\" half of on-time-in-full; read it alongside `fill_rate_pct`, since a punctual short shipment is still a failure. |\n| `count_orders` | INTEGER | Order Count | Always `1` on every row; SUM to count replenishment orders. |\n\n# Example Questions\n\n- Which suppliers miss on-time-in-full most often, and does their shortfall show up as stockouts on the shelf or get absorbed by cover stock?\n- How much of our lead time is genuinely long versus merely unpredictable, and what would consistency alone save us in stock cover?\n- Are the lines that repeatedly run out actually being ordered late, or ordered on time and short-shipped?\n\n## Joins\n\n- [Product](./product.md) — `product_id = product_id` [N:1] — The SKU being replenished.\n- [Store](./store.md) — `store_id = store_id` [N:1] — The store the order was raised for.\n", "retail-chain/returns": "---\ntitle: \"Returns\"\ndescription: |\n  What came back, and what happened to it: one row per returned line, with the sale it came from\n  when there was a receipt, the reason the shopper gave, and what the chain did with the goods\n  afterwards. Across a general-merchandise assortment returns are a material flow rather than a\n  rounding error, and they cost twice over — the refund handed back and the value destroyed when\n  the returned unit cannot go straight back on the shelf. That second cost is what `disposition`\n  measures: a line resold at full price loses almost nothing, one marked down loses part of its\n  margin, one sent back to the vendor recovers cost from someone else, and one disposed of loses\n  everything. The reason a return was made says where the problem actually sits — a defect belongs\n  to the supplier, a wrong item to the shelf edge or the pick, and a change of mind to nobody but\n  the shopper. Elapsed time and whether a receipt was produced complete the picture, because the\n  returns that arrive late and unreceipted behave differently from the rest in both cost and risk.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:21:07.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `return_id` | STRING | Return ID | PK. Unique identifier for this returned line. |\n| `sale_id` | STRING | Sale ID | NULL when the goods came back without a receipt, which is why store and product are also carried directly on this mart. FK to [POS Sales](./pos-sales.md) |\n| `store_id` | STRING | Store ID | Location that accepted the return, which need not be the store that sold the item. FK to [Store](./store.md) |\n| `product_id` | STRING | Product ID | Line that was returned. FK to [Product](./product.md) |\n| `member_id` | STRING | Member ID | NULL when the return was not tied to an identified shopper. FK to [Loyalty Members](./loyalty-members.md) |\n| `returned_at` | TIMESTAMP | Returned At | Exact moment the return was processed at the service desk. |\n| `return_date` | DATE | Return Date | Calendar date the return was processed. |\n| `quantity_returned` | INTEGER | Units Returned | Selling units handed back on this line. |\n| `refund_amount` | NUMERIC | Refund Amount | Money refunded to the shopper for this line, in USD. Only the direct cost — the value destroyed by the disposition sits alongside it. |\n| `reason` | STRING | Return Reason | Why the goods came back: `damaged`, `defective`, `wrong_item`, `changed_mind`, `expired` or `price_dispute`. Separates faults the chain or its suppliers can fix from the cost of a generous returns policy. |\n| `disposition` | STRING | Disposition | What became of the unit: `resell` (back on the shelf at full price), `markdown` (sellable at a reduced price), `vendor_return` (cost recovered from the supplier), `disposal` (written off entirely). This is where the larger cost of a return sits. |\n| `is_receipted` | BOOLEAN | Is Receipted | True when a receipt was produced, so the return resolves to an original sale line. False rows have no `sale_id` and are the harder population to control. |\n| `days_since_purchase` | INTEGER | Days Since Purchase | Days between the original sale and the return. Meaningful only on receipted rows, where the original sale date is known. |\n| `count_returns` | INTEGER | Return Count | Always `1` on every row; SUM to count returned lines. |\n\n# Example Questions\n\n- Which categories and suppliers cost us most after returns, once refunds and the value destroyed by disposition are taken off the margin the original sale reported?\n- How much of the reverse flow arrives without a receipt, where does it concentrate, and how does its reason mix differ from receipted returns?\n- Are defect and wrong-item returns clustered on particular lines or particular `stores`, and how quickly after purchase do they come back?\n\n## Joins\n\n- [Loyalty Members](./loyalty-members.md) — `member_id = member_id` [N:1] — The member who returned it.\n  - [Member Home Store](./store.md) — The home store of the member who returned.\n- [POS Sales](./pos-sales.md) — `sale_id = sale_id` [N:1] — The receipt line being returned.\n  - [Sale-Day Inventory](./inventory-daily.md) — Stock at the selling store on the day of sale.\n    - [Inventory SKU](./product.md) — The SKU as the sale-day stock snapshot records it.\n    - [Inventory Store](./store.md) — The store the sale-day stock snapshot belongs to.\n  - [Buying Member](./loyalty-members.md) — The member who bought, who need not be the one returning.\n    - [Buyer Home Store](./store.md) — The home store of the member who bought.\n  - [Sold Product](./product.md) — The SKU as sold on the original receipt line.\n  - [Sale Promotion](./promotion.md) — The promotion the returned line was bought under.\n  - [Selling Store](./store.md) — The store that made the sale, which can differ from where it came back.\n  - [Sale-Day Traffic](./store-traffic.md) — Footfall at the selling store on the day of sale.\n    - [Sale Traffic Store](./store.md) — The store behind that day of footfall — the selling store.\n- [Product](./product.md) — `product_id = product_id` [N:1] — The SKU returned.\n- [Store](./store.md) — `store_id = store_id` [N:1] — The store that took the return.\n", "retail-chain/shrinkage": "---\ntitle: \"Shrinkage\"\ndescription: |\n  Stock the chain paid for and never sold: one row per write-off event, recording what was lost,\n  where, how much of it, why, and how it came to light. Shrink is one of the largest controllable\n  costs in retail and it comes off the bottom line directly — a dollar of shrink has to be replaced\n  by several dollars of extra sales to break even on it. The reason separates problems that need\n  entirely different responses: theft is a security and layout question, expiry is an ordering and\n  rotation question, damage is a handling question, and administrative error means the loss may not\n  be a physical loss at all but a bookkeeping one. How the loss was *found* matters just as much,\n  because it divides known shrink, where the cause is documented at the moment it happens, from\n  unknown shrink, which only surfaces when a count fails to match the book and by then the cause is\n  gone. Each loss is valued twice — at what it cost the chain and at what it would have sold for —\n  because those two numbers answer different questions.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T04:43:02.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `shrink_id` | STRING | Shrink ID | PK. Unique identifier for this write-off event. |\n| `store_id` | STRING | Store ID | Location the loss was recorded at. FK to [Store](./store.md) |\n| `product_id` | STRING | Product ID | Line that was written off. FK to [Product](./product.md) |\n| `recorded_at` | DATE | Recorded Date | Date the write-off was booked. For a loss found by cycle count this is when it was discovered, not necessarily when it occurred. |\n| `reason` | STRING | Shrink Reason | Why the stock was lost: `theft`, `damage`, `expiry` or `admin_error`. Each points at a different owner — security, handling, ordering and rotation, or the back office. |\n| `detected_by` | STRING | Detected By | How the loss came to light: `cycle_count` (a stock count found the book and the shelf disagreed, so the cause is inferred — unknown shrink), `self_checkout_audit` (an audit of an unattended checkout), `security` (loss prevention caught it in the act), `receiving_check` (a discrepancy found at the door before the stock reached the floor). |\n| `units_lost` | INTEGER | Units Lost | Selling units written off in this event. |\n| `shrink_cost` | NUMERIC | Shrink Cost | The loss valued at unit cost, in USD — the money the chain is out of pocket. Use this basis for any margin or profit question. |\n| `retail_value` | NUMERIC | Retail Value | The same loss valued at shelf price, in USD — the trade that will never be rung through the till. Use this basis when quoting shrink as a percentage of sales. |\n| `count_shrink_events` | INTEGER | Shrink Event Count | Always `1` on every row; SUM to count write-off events. |\n\n# Example Questions\n\n- How much of our shrink is unknown rather than documented, and which `stores` carry a share of it far above their trade?\n- Which `stores` and categories carry a share of shrink far above their share of trade, and how much of that loss surfaces only at a cycle count rather than being caught with its cause attached?\n- Which categories lose most to expiry rather than theft, and does that point at ordering, rotation or shelf life?\n\n## Joins\n\n- [Product](./product.md) — `product_id = product_id` [N:1] — The SKU written off.\n- [Store](./store.md) — `store_id = store_id` [N:1] — The store that wrote the stock off.\n", "retail-chain/store-traffic": "---\ntitle: \"Store Traffic\"\ndescription: |\n  How many people walked through each door each day, how many of them bought something, and what\n  they spent when they did. Footfall is the denominator retail is missing whenever it looks only\n  at sales: a store whose revenue fell may have been busier than ever and converted worse, or\n  quieter and converted the same, and those two are completely different problems with completely\n  different fixes. One row per store and day, with the day itself described — weekend and holiday\n  flags are carried because retail demand is driven by the calendar more than by anything a store\n  does, and a Tuesday is not comparable to a Saturday. Conversion and average basket sit alongside\n  footfall so the three levers of a store day — traffic, conversion, basket — can be separated\n  instead of collapsing into one revenue number.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T04:43:44.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `traffic_id` | STRING | Traffic ID | PK. Unique identifier for this store-day. |\n| `store_id` | STRING | Store ID | Location the footfall was counted at. FK to [Store](./store.md) |\n| `traffic_date` | DATE | Traffic Date | Calendar day the count covers. Together with `store_id` this is the grain of the mart. |\n| `is_weekend` | BOOLEAN | Is Weekend | True for Saturday and Sunday. Weekend footfall runs far above weekday, so match days of week before comparing periods. |\n| `is_holiday` | BOOLEAN | Is Holiday | True on a public holiday. Holidays shift both footfall and basket size and should be isolated, not averaged in. |\n| `footfall` | INTEGER | Footfall | People who entered the store that day, counted at the door. The denominator behind conversion and sales per visitor. |\n| `transactions` | INTEGER | Transactions | Baskets paid for that day. Reconciles with the receipt lines recorded for the same store and day. |\n| `conversion_pct` | FLOAT | Conversion % | Transactions divided by footfall, as a **percentage on a 0–100 scale** — `87.4` means 87.4%, not 8740%. In food and general-merchandise retail this runs high — most people who walk in buy something — so read it against a grocery benchmark rather than a fashion one. |\n| `avg_basket_value` | NUMERIC | Average Basket Value | Average spend per basket that day, in USD. The third lever on a store day, alongside footfall and conversion. |\n\n# Example Questions\n\n- When a `store`'s sales fall, is it losing visitors or losing them at the shelf — and which of the two explains more of the chain's variance?\n- What does holiday trading actually add once the extra footfall is separated from the higher basket that comes with it?\n- Which `stores` convert visitors best for their format, and what would the chain gain if the bottom quartile matched the median?\n\n## Joins\n\n- [Store](./store.md) — `store_id = store_id` [N:1] — The store this day of footfall belongs to.\n", "retail-chain/store": "---\ntitle: \"Store\"\ndescription: |\n  Every location the chain trades from, and the handful of facts that decide what to expect of it:\n  which format it trades as, how much selling space it has, the region and state it reports into,\n  and when it opened. Format is the first thing to hold constant in any store comparison — a\n  supercenter, a supermarket and a neighborhood market carry different assortments, draw different\n  footfall and turn their space at different rates, so ranking them against one another says more\n  about the format than about the store. Selling area is the denominator behind sales per square\n  foot, the standard measure of retail productivity, and the opening date is what makes a\n  like-for-like read possible at all, since a store needs a full year behind it before this year\n  can be set against last. This is the dimension every sales, stock, shrink and footfall number in\n  the model rolls up through.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-06T00:46:46.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `store_id` | STRING | Store ID | PK. Unique identifier for this location. |\n| `name` | STRING | Store Name | Store name as it appears in reporting and on the fascia. |\n| `region` | STRING | Region | Reporting region the store belongs to — the level the estate is managed at. |\n| `state` | STRING | State | US state the store trades in, e.g. `TX`, `OH`, `FL`. The standard external comparison cut. |\n| `city` | STRING | City | City the store is located in. |\n| `format` | STRING | Store Format | Trading format: `supercenter`, `supermarket` or `neighborhood_market`. Hold this constant when comparing stores — the three formats trade nothing alike. |\n| `opened_at` | DATE | Opened Date | Date the store opened. Like-for-like comparison needs at least thirteen months of history behind a store. |\n| `selling_area_sqft` | INTEGER | Selling Area (sq ft) | Trading floor area in square feet, excluding back-of-house. The denominator for sales per square foot. |\n| `is_active` | BOOLEAN | Is Active | True while the location is still trading. Exclude closed sites before comparing per-store averages. |\n\n# Example Questions\n\n- Which formats earn most per square foot of selling space, and does that ranking hold across regions?\n- How do stores opened within the last year compare against the mature estate once their opening period is excluded?\n- Which regions carry the most selling space relative to the trade they actually do?\n", "saas/account": "---\ntitle: \"Account\"\ndescription: |\n  Every customer account (a company), with the signals that frame the whole relationship:\n  industry, size and region, the plan tier they are on, a revenue size band, the channel\n  that acquired them, their success-manager owner, a product-health score, and where they\n  sit in the lifecycle (trial, active, at-risk, churned). The dimension you slice the entire\n  business by.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T12:51:25.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `account_id` | STRING | Account ID | PK. Unique account identifier. |\n| `name` | STRING | Name | Company/account name. |\n| `industry` | STRING | Industry | Industry vertical of the account. |\n| `employee_band` | STRING | Employee Band | Company-size bucket by headcount. |\n| `plan_tier` | STRING | Plan Tier | Subscription plan tier. |\n| `mrr_band` | STRING | MRR Band | Monthly-recurring-revenue size bucket. |\n| `region` | STRING | Region | Sales/geographic region. |\n| `acquisition_channel` | STRING | Acquisition Channel | Marketing channel that sourced the account — blended-CAC join key. |\n| `signup_date` | DATE | Signup Date | Date the account first signed up. |\n| `csm_owner` | STRING | CSM Owner | Customer success manager who owns the account. |\n| `health_score` | INTEGER | Health Score | 0–100 product-health composite. |\n| `lifecycle_stage` | STRING | Lifecycle Stage | trial / active / at-risk / churned. |\n\n# Example Questions\n\n- Which industries and company sizes carry the healthiest accounts and the highest revenue bands?\n- How does the mix of at-risk versus healthy accounts differ across acquisition channels?\n- Do accounts with a dedicated success manager show better health and lifecycle outcomes?\n", "saas/invoices": "---\ntitle: \"Invoices\"\ndescription: |\n  Every invoice and how it was paid — amount, tax, discounts and credits, payment status, and\n  where it sits in the dunning cycle when a payment fails. This is where voluntary revenue meets\n  involuntary churn: failed payments and collections stages that quietly erode the customer base.\n\n  This is the model's revenue mart, and it carries two figures on purpose: `amount` is what was\n  billed on every invoice regardless of outcome, and `net_amount` is what was actually recognised\n  — zero for a voided or written-off invoice, equal to `amount` otherwise. Any revenue total\n  should sum `net_amount`, never `amount`. The four collection signals — `status`, `dunning_stage`,\n  `is_failed` and `paid_at` — always agree with each other: a `paid` invoice always has a\n  `paid_at` and never `is_failed` or a write-off, and `is_write_off` is exactly\n  `dunning_stage = 'write_off'`.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-11T08:52:41.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `invoice_id` | STRING | Invoice ID | PK. Unique invoice identifier. |\n| `account_id` | STRING | Account ID | Account billed. FK to [Account](./account.md) |\n| `subscription_id` | STRING | Subscription ID | Subscription being billed. FK to [Subscription](./subscription.md) |\n| `issued_at` | DATE | Issued At | Date the invoice was issued. |\n| `period_start` | DATE | Period Start | Start of the billing period. |\n| `period_end` | DATE | Period End | End of the billing period. |\n| `amount` | NUMERIC | Amount | Invoice amount before tax. Booked on every status, including void and write-off — see `net_amount` for the recognised figure. |\n| `net_amount` | NUMERIC | Net Amount | Recognised revenue: `0` when the invoice is void or written off, otherwise equal to `amount`. Sum this for revenue totals, not `amount`. |\n| `tax` | NUMERIC | Tax | Tax charged on the invoice. |\n| `status` | STRING | Status | Payment status of the invoice. |\n| `currency` | STRING | Currency | Invoice currency, aligned to the account's region. |\n| `discount_amount` | NUMERIC | Discount Amount | Discount applied to the invoice, if any. Always a fraction of `amount`, never larger than it. |\n| `credit_applied` | NUMERIC | Credit Applied | Account credit applied to the invoice, if any. |\n| `dunning_stage` | STRING | Dunning Stage | Collections stage: none / retry_1 / retry_2 / final_notice / write_off. |\n| `paid_at` | DATE | Paid At | Date the invoice was paid. Set if and only if `status = 'paid'`. |\n| `is_failed` | BOOLEAN | Is Failed | Failed payment — involuntary-churn signal. Never true on a `paid` invoice. |\n| `is_write_off` | BOOLEAN | Is Write Off | Uncollectible invoice, exactly `dunning_stage = 'write_off'`. Use this to gate money rather than string-matching the dunning label. |\n\n# Example Questions\n\n- How much recognised revenue did we collect last quarter, and how much billed revenue never\n- How much revenue is lost to failed payments, and how much does dunning recover before write-off?\n- Which `accounts` are slipping through the collections stages toward involuntary churn?\n- How much do discounts and applied credits reduce collected revenue versus billed revenue?\n\n## Joins\n\n- [Account](./account.md) — `account_id = account_id` [N:1] — The account billed on this invoice.\n- [Subscription](./subscription.md) — `subscription_id = subscription_id` [N:1] — The subscription this invoice bills.\n  - [Subscription Account](./account.md) — The account behind the billed subscription.\n  - [Subscription Plan](./plan.md) — The plan the billed subscription is on.\n", "saas/marketing-spend": "---\ntitle: \"Marketing Spend\"\ndescription: |\n  Marketing investment by channel, campaign and day — cost, leads, and signups — attributed to\n  the cohort of accounts each channel brings in rather than to individual accounts. The numerator\n  and denominator of customer acquisition cost, and the starting point for payback analysis.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-11T08:37:27.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `spend_id` | STRING | Spend ID | PK. Unique identifier for each spend record. |\n| `spend_date` | DATE | Spend Date | Day the spend was incurred. |\n| `channel` | STRING | Channel | Acquisition channel the spend targeted — attributed to the cohort of accounts acquired through it, not to individual accounts. FK to [Account](./account.md) |\n| `campaign` | STRING | Campaign | Campaign the spend belongs to. |\n| `cost` | NUMERIC | Cost | Money spent — the CAC numerator. |\n| `leads` | INTEGER | Leads | Leads generated by the spend. |\n| `signups` | INTEGER | Signups | Accounts created — CAC denominator. |\n\n# Example Questions\n\n- What is blended and per-channel acquisition cost, and which channels turn leads into signups most efficiently?\n- Which channels pay back fastest once their spend is set against the revenue their cohort retains?\n- How has cost per signup shifted over time as spend scaled up or down?\n\n## Joins\n\n- [Account](./account.md) — `channel = acquisition_channel` [N:N] — Accounts acquired through this channel — a cohort, not one account per row.\n", "saas/plan": "---\ntitle: \"Plan\"\ndescription: |\n  The price book: every sellable plan and price point — four tiers (Starter, Pro, Business,\n  Enterprise), each offered monthly or annually, with its list price and whether it is\n  currently sellable. The reference that gives every subscription its list pricing.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T12:51:26.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `plan_id` | STRING | Plan ID | PK. Unique plan/price-point identifier. |\n| `plan_name` | STRING | Plan Name | Human-readable plan name (tier + billing interval). |\n| `tier` | STRING | Tier | Product tier: Starter / Pro / Business / Enterprise. |\n| `billing_interval` | STRING | Billing Interval | Billing cadence:
