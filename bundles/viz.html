 FLOAT | Recurring Value | Amount billed on each cycle, being quantity multiplied by the unit price. |\n| `monthly_recurring_value` | FLOAT | Monthly Recurring Value | Recurring value normalised to a 30-day month, so cadences of different lengths can be summed into one recurring revenue figure. |\n| `billing_interval_days` | INTEGER | Billing Interval Days | Number of days between two charges on this contract. |\n| `cycles_completed` | INTEGER | Cycles Completed | Number of cycles successfully charged and delivered so far. |\n| `cycles_remaining` | INTEGER | Cycles Remaining | Deliveries still owed on a prepaid contract; zero for pay-as-you-go. |\n| `next_charge_date` | DATE | Next Charge Date | Date the next charge is scheduled for, on active contracts. |\n| `last_charge_date` | DATE | Last Charge Date | Date of the most recent successful charge. |\n| `paused_at` | DATE | Paused At | Date the subscriber paused the contract, when it is currently paused. |\n| `cancelled_at` | DATE | Cancelled At | Date the contract ended, when it is no longer active. |\n| `cancel_reason` | STRING | Cancel Reason | Why the contract ended, such as Too much product, Too expensive, Product quality, Found alternative, No longer needed or Payment failure. |\n| `cancel_type` | STRING | Cancel Type | Whether the ending was Voluntary, meaning the subscriber chose it, or Involuntary, meaning payment retries were exhausted. |\n| `failed_payment_count` | INTEGER | Failed Payment Count | Number of charge attempts on this contract that were declined. |\n| `max_retries_reached` | BOOLEAN | Max Retries Reached | Whether the dunning process ran out of retries on this contract. |\n| `is_prepaid` | BOOLEAN | Is Prepaid | Whether the contract was paid upfront for several deliveries. |\n| `tenure_days` | INTEGER | Tenure Days | Number of days the contract has been alive, counted to its end date or to today. |\n\n# Example Questions\n\n- What share of churn is involuntary — failed payments rather than a decision to leave — and how has that share moved?\n- Which cancellation reasons dominate, and do they differ between the shortest and the longest delivery cadences?\n- How long does a subscription survive on average, and how much recurring revenue does it produce before it ends?\n\n## Joins\n\n- [Customers](./customers.md) — `customer_id = customer_id` [N:1] — The subscriber who signed this contract.\n  - [Customer Acquisition Source](./traffic-sources.md) — The channel that acquired the subscriber.\n- [Products](./products.md) — `product_id = product_id` [N:1] — The product shipped on schedule.\n  - [Product Page](./pages.md) — The storefront page of the subscribed product.\n- [Selling Plans](./selling-plans.md) — `selling_plan_id = selling_plan_id` [N:1] — The offer this contract was signed on.\n", "ecommerce-subscription-store/traffic-sources": "---\ntitle: \"Traffic Sources\"\ndescription: |\n  Every source, medium and campaign combination that sends traffic to the storefront, down to the\n  keyword and the creative, grouped into the channels the business actually reports on and\n  flagged for whether the traffic was paid. It is the vocabulary that makes marketing comparable:\n  the same grouping applies to sessions, to customers and to advertising spend.\n\n  Keeping the paid flag and the channel grouping here rather than deriving them per report is\n  what stops the same channel from being named three different ways in three different places.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-28T16:51:50.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `traffic_source_id` | STRING | Traffic Source ID | PK. Unique identifier of the source, medium and campaign combination. |\n| `source` | STRING | Source | Platform or site the traffic originated from. |\n| `medium` | STRING | Medium | Channel type of the traffic, such as cost-per-click, organic or referral. |\n| `campaign` | STRING | Campaign | Marketing campaign the traffic belongs to. |\n| `keyword` | STRING | Keyword | Search term or targeting keyword that triggered the visit. |\n| `ad_content` | STRING | Ad Content | Creative or ad variant the visit came from. |\n| `channel_grouping` | STRING | Channel Grouping | Reporting channel the combination rolls up to, such as Paid Search, Paid Social, Organic, Email or Direct. |\n| `is_paid` | BOOLEAN | Is Paid | Whether the traffic was acquired through a paid channel. |\n\n# Example Questions\n\n- Which channels bring in the most `sessions`, and which bring in the most recurring revenue?\n- How does paid traffic compare with organic and referral on the quality of what it delivers?\n- Which campaigns and keywords are worth their spend once `subscriptions`, not clicks, are the measure?\n", "ecommerce-subscription-store/visitors": "---\ntitle: \"Visitors\"\ndescription: |\n  Everyone who has visited the storefront, whether they ever bought or not: when they first and\n  last appeared, how many sessions they ran, the channel that originally acquired them, the month\n  they belong to, and — where they later bought — the customer they became. This is where\n  anonymous traffic and known customers meet.\n\n  Because the acquisition channel is recorded on the visitor rather than only on the session,\n  every later order and subscription can be credited back to what first brought that person to\n  the site, even when they returned through a different channel.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-08-07T18:21:12.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `visitor_id` | STRING | Visitor ID | PK. Unique identifier of the website visitor. |\n| `linked_customer_id` | STRING | Linked Customer ID | Customer account this visitor was later recognised as, when they bought. |\n| `first_seen_date` | DATE | First Seen Date | Date the visitor first interacted with the site. |\n| `last_seen_date` | DATE | Last Seen Date | Date of the visitor's most recent interaction. |\n| `total_sessions` | INTEGER | Total Sessions | Number of sessions the visitor has run in total. |\n| `acquisition_source` | STRING | Acquisition Source | Platform or site that originally referred the visitor. |\n| `acquisition_medium` | STRING | Acquisition Medium | Channel type the visitor was originally acquired through. |\n| `acquisition_campaign` | STRING | Acquisition Campaign | Marketing campaign that originally brought the visitor to the site. |\n| `cohort_month` | DATE | Cohort Month | First day of the month of the visitor's first visit, used for retention analysis. |\n| `visitor_segment` | STRING | Visitor Segment | Engagement band the visitor falls into, such as One-off, Occasional or Frequent. |\n| `country` | STRING | Country | Country the visitor browses from. |\n\n# Example Questions\n\n- What share of visitors ever return, and how does that repeat rate differ by acquisition channel?\n- How do monthly visitor cohorts convert into `customers`, and how long does that take?\n- Which acquisition channels produce visitors who eventually subscribe rather than buy once?\n", "finance/accounts": "---\ntitle: \"Accounts\"\ndescription: |\n  Every product a customer has opened — the funded relationships that turn a sign-up into\n  an active customer. Tracks how each holding was activated, its current balance, and\n  whether it is still active, dormant, frozen, closed, or written off. This is where you see\n  who actually became a funded customer and how healthy those relationships are.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-04T15:03:02.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `account_id` | STRING | Account ID | PK. Unique account identifier. |\n| `customer_id` | STRING | Customer ID | Owning customer. FK to [Customer](./customer.md) |\n| `product_id` | STRING | Product ID | Product held in this account. FK to [Product](./product.md) |\n| `opened_at` | DATE | Opened At | Date the account was opened. Only customers with `kyc_status = passed` open accounts. |\n| `status` | STRING | Status | Current account status. One of `active` / `dormant` / `frozen` / `closed` / `charged_off`. |\n| `current_balance` | NUMERIC | Current Balance | Current account balance. |\n| `activated_at` | DATE | Activated At | First funding / first card use; `≥ opened_at`; null if never activated. |\n| `is_active` | BOOLEAN | Is Active | Pure derivation: `is_active = (status = 'active')`. Not drawn independently. |\n\n# Example Questions\n\n- What share of opened accounts ever get activated, and how long does activation typically take?\n- How are `balances` distributed across active versus dormant relationships?\n- Which `product` types have the highest rate of accounts going dormant or being closed?\n\n## Joins\n\n- [Customer](./customer.md) — `customer_id = customer_id` [N:1] — The customer who holds this account.\n- [Product](./product.md) — `product_id = product_id` [N:1] — The product this account was opened on.\n", "finance/balances-monthly": "---\ntitle: \"Balances (monthly)\"\ndescription: |\n  A month-by-month snapshot of every account's balance and the money it earns or costs the\n  business — interest earned on lending, interest paid on deposits, and fee income. This is\n  the view for understanding the earning power of the book over time and how balances build\n  up or run down.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:19:34.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `snapshot_id` | STRING | Snapshot ID | PK. Unique identifier for the monthly balance snapshot. |\n| `account_id` | STRING | Account ID | Account the snapshot belongs to. FK to [Accounts](./accounts.md) |\n| `month` | DATE | Month | Calendar month of the snapshot. |\n| `avg_balance` | NUMERIC | Average Balance | Average balance over the month. Carries month-over-month persistence per account (a random walk, not IID noise). |\n| `interest_earned` | NUMERIC | Interest Earned | Interest income the bank earns on the account. Non-zero for `card` / `loan` / `BNPL` products (APR × outstanding balance); ~0 for `deposit`. |\n| `interest_paid` | NUMERIC | Interest Paid | Interest the bank pays out to the customer. Non-zero for `deposit` products (deposit APY × `avg_balance`); ~0 for `card` / `loan` / `BNPL`. |\n| `fees` | NUMERIC | Fees | Fee income for the month; scales with `avg_balance` / activity, not an independent draw. |\n\n# Example Questions\n\n- What is the net interest margin across the book, and how does it trend month over month?\n- Which `products` and balance tiers contribute most to interest and fee income?\n- How stable are deposit balances over time, and where is money quietly draining away?\n\n## Joins\n\n- [Accounts](./accounts.md) — `account_id = account_id` [N:1] — The account this month of balances belongs to.\n  - [Accounts Customer](./customer.md) — The customer holding the account.\n  - [Accounts Product](./product.md) — The product the account was opened on.\n", "finance/collections": "---\ntitle: \"Collections\"\ndescription: |\n  Every action taken to recover money from loans that have fallen behind — reminders, calls,\n  restructures, and hand-offs to agencies — and what came of each. Tracks how much is\n  recovered and how effective different approaches are once a loan is delinquent or written\n  off. This is the last line of defense on losses.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:19:35.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `action_id` | STRING | Action ID | PK. Unique identifier for the collections action. |\n| `loan_id` | STRING | Loan ID | Delinquent loan being worked; rows exist only for loans that reached ≥30 DPD or `is_charged_off`. FK to [Loans](./loans.md) |\n| `action_ts` | TIMESTAMP | Action Time | When the action was taken. |\n| `action_type` | STRING | Action Type | One of `reminder` / `call` / `restructure` / `agency_handoff`. Early-stage (reminder/call) at low DPD; late-stage (restructure/agency_handoff) once charged off. |\n| `outcome` | STRING | Outcome | One of `promise_to_pay` / `paid` / `no_contact` / `dispute`. |\n| `amount_recovered` | NUMERIC | Amount Recovered | Money recovered by this action; bounded by remaining balance. Cumulative recovery per charged-off loan stays well under 100% and decays with time since charge-off. |\n\n# Example Questions\n\n- Which collections actions recover the most money relative to how often they are used?\n- After a `loan` is written off, how much is typically recovered, and how quickly does recovery taper off?\n- Do earlier interventions (reminders and calls) reduce how many `loans` end up handed to an agency?\n\n## Joins\n\n- [Loans](./loans.md) — `loan_id = loan_id` [N:1] — The delinquent loan being collected on.\n  - [Loans Customer](./customer.md) — The borrower being collected from.\n  - [Loans Product](./product.md) — The lending product behind the delinquent loan.\n", "finance/customer": "---\ntitle: \"Customer\"\ndescription: |\n  Everyone the business has taken on as a borrower, with the details that drive every\n  downstream decision: how they were acquired, whether they passed identity and eligibility\n  checks, their credit standing at sign-up, an internal risk tier, and whether they went on\n  to fund an account. The starting point for understanding who your customers are and where\n  they come from.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-29T14:32:39.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `customer_id` | STRING | Customer ID | PK. Unique customer identifier. |\n| `signup_date` | DATE | Signup Date | Date the customer signed up. |\n| `kyc_status` | STRING | KYC Status | `passed` / `pending` / `rejected`. Gates account opening — only `passed` customers get funded accounts. |\n| `risk_band` | STRING | Risk Band | Internal risk tier — the model's central conditioning variable. One of `prime` / `near_prime` / `subprime` / `deep_subprime`. Drives loan approval odds, APR, delinquency (DPD) and charge-off downstream. |\n| `credit_score` | INTEGER | Credit Score | Credit score at onboarding (~300–850). Consistent with `risk_band` (prime high, deep_subprime low). |\n| `acquisition_channel` | STRING | Acquisition Channel | Channel that brought the customer in (e.g. `organic`, `paid_search`, `paid_social`, `referral`, `partner`). |\n| `region` | STRING | Region | Customer's geographic region. |\n| `is_funded` | BOOLEAN | Is Funded | Activation flag — the source of truth for whether the customer ever funded an account (only KYC-passed customers can be funded). Accounts derives its `activated_at` from this: a customer is funded **iff** they have ≥1 account with a non-null `activated_at` (the two are kept consistent by construction). |\n\n# Example Questions\n\n- Which marketing channels bring in the highest share of low-risk, creditworthy customers?\n- How many people pass the initial checks but never open a funded `account` — and where are they lost?\n- Does a customer's credit standing at sign-up line up with whether they become an active, funded borrower?\n", "finance/loans": "---\ntitle: \"Loans\"\ndescription: |\n  Every loan application and what happened to it — approved, declined, or withdrawn —\n  through to how much was actually funded and at what rate. Captures the full underwriting\n  funnel, the reasons applications are turned down, and the pricing applied to each borrower\n  based on their risk. This is the origination story of the loan book.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T12:02:48.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `loan_id` | STRING | Loan ID | PK. Unique loan identifier. |\n| `customer_id` | STRING | Customer ID | Borrowing customer. FK to [Customer](./customer.md) |\n| `product_id` | STRING | Product ID | Loan product applied for. FK to [Product](./product.md) |\n| `applied_at` | DATE | Applied At | Date the loan was applied for. |\n| `decision` | STRING | Decision | `approved` / `declined` / `withdrawn`. Approval odds conditioned on the customer's `risk_band`. |\n| `approved_amount` | NUMERIC | Approved Amount | Amount approved at underwriting; null unless `decision = approved`. |\n| `funded_amount` | NUMERIC | Funded Amount | Amount actually funded; `≤ approved_amount`; null unless funded. Approved → funded is the pull-through rate. |\n| `apr` | FLOAT | Apr | APR on the loan. Seeded from the product's rate-card `apr` and adjusted by a risk-based spread (higher for riskier bands). |\n| `term_months` | INTEGER | Term Months | Loan term; selected from the product's stated term, not drawn independently. |\n| `funded_at` | DATE | Funded At | Date funded; `≥ applied_at`; null unless funded. |\n| `status` | STRING | Status | Current loan status. One of `current` / `delinquent` / `charged_off` / `paid_off`. |\n| `decline_reason` | STRING | Decline Reason | Adverse-action reason (ECOA/Reg B); populated only when `decision = declined`. One of `insufficient_credit_history` / `debt_to_income_too_high` / `delinquent_credit_obligations` / `income_verification_failed` / `fraud_flag`. Weighted by `risk_band`. |\n\n# Example Questions\n\n- How do approval rates and interest rates vary across borrower risk tiers?\n- Of the loans approved, what share actually gets funded, and where does the funnel leak?\n- What are the most common reasons applications are declined, and how does that differ by risk tier?\n\n## Joins\n\n- [Customer](./customer.md) — `customer_id = customer_id` [N:1] — The customer who applied for this loan.\n- [Product](./product.md) — `product_id = product_id` [N:1] — The lending product applied for.\n", "finance/product": "---\ntitle: \"Product\"\ndescription: |\n  The catalog of products the business offers — deposits, cards, loans, and\n  buy-now-pay-later — each with its headline rate and standard term. For deposits the rate\n  is what the business pays the customer; for credit products it is what the customer is\n  charged. This is the lookup that gives every account and loan its pricing context.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T12:02:47.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `product_id` | STRING | Product ID | PK. Unique product identifier. |\n| `name` | STRING | Name | Product display name. |\n| `product_type` | STRING | Product Type | `deposit` / `card` / `loan` / `BNPL`. |\n| `apr` | FLOAT | Apr | Rate-card reference rate. Meaning depends on `product_type`: for `deposit` it is the APY *paid to* the customer (low, ~0.5–4%); for `card` / `loan` / `BNPL` it is the rate *charged to* the customer. `Loans.apr` is seeded from this and adjusted by risk-based spread. |\n| `term_months` | INTEGER | Term Months | Stated product term in months. (BNPL \"Pay in 4\" is modeled here as a short months-denominated term — a deliberate simplification, not real biweekly installments.) |\n\n# Example Questions\n\n- How does the rate charged on lending products compare with the rate paid out on deposits?\n- Which product types carry the longest terms, and how does that shape the revenue they generate?\n- How is the `customer` base split between savings products and credit products?\n", "finance/repayments": "---\ntitle: \"Repayments\"\ndescription: |\n  The repayment schedule for every funded loan and how each installment actually played\n  out — paid on time, paid late, or missed. Tracks how far behind each loan falls, the\n  principal still outstanding, and the point at which a loan is written off. This is where\n  the health of the loan book, and the losses building in it, become visible.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:19:35.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `repayment_id` | STRING | Repayment ID | PK. Unique repayment identifier. |\n| `loan_id` | STRING | Loan ID | Loan this repayment belongs to. FK to [Loans](./loans.md) |\n| `due_date` | DATE | Due Date | Date the payment is due. The full set of rows amortizes the loan's `funded_amount` at its `apr` over `term_months`. |\n| `paid_date` | DATE | Paid Date | Date the payment was made; null if unpaid. |\n| `due_amount` | NUMERIC | Due Amount | Scheduled principal + interest for the installment (from the amortization schedule). |\n| `paid_amount` | NUMERIC | Paid Amount | Amount actually paid (0 / partial / full). |\n| `days_past_due` | INTEGER | Days Past Due | DPD; progresses through the 0 / 30 / 60 / 90 / 120+ ladder per loan (roll-rate mechanics), not an independent draw. Conditioned on `risk_band`. |\n| `outstanding_principal` | NUMERIC | Outstanding Principal | Remaining principal after this installment — enables dollar-weighted roll-rate and vintage analysis. |\n| `is_charged_off` | BOOLEAN | Is Charged Off | True only once cumulative DPD crosses the charge-off threshold (FFIEC: 120 days installment / 180 days revolving). |\n\n# Example Questions\n\n- How does the rate of `loans` falling 90+ days behind differ across risk tiers?\n- What share of lent principal ends up written off, and how does that build over the life of a `loan`?\n- How many delinquent `loans` recover and return to good standing versus rolling into write-off?\n\n## Joins\n\n- [Loans](./loans.md) — `loan_id = loan_id` [N:1] — The loan this instalment is scheduled against.\n  - [Loans Customer](./customer.md) — The borrower who owes this instalment.\n  - [Loans Product](./product.md) — The lending product being repaid.\n", "finance/transactions": "---\ntitle: \"Transactions\"\ndescription: |\n  Every payment, withdrawal, transfer, and card authorization flowing through customer\n  accounts — the day-to-day activity that shows how engaged customers are and where fraud\n  shows up. Each record carries the amount, merchant category, channel, whether it was\n  declined, and the fraud assessment made at the time of authorization. The pulse of\n  everyday customer behavior.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:19:36.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `txn_id` | STRING | Transaction ID | PK. Unique transaction identifier. |\n| `account_id` | STRING | Account ID | Account the transaction belongs to. FK to [Accounts](./accounts.md) |\n| `txn_ts` | TIMESTAMP | Transaction Time | When the transaction occurred. |\n| `txn_type` | STRING | Transaction Type | One of `purchase` / `atm_withdrawal` / `transfer` / `direct_debit` / `refund` / `fee`. |\n| `mcc` | STRING | MCC | Merchant category code. Typical `amount` and implied interchange vary by MCC. |\n| `amount` | NUMERIC | Amount | Transaction amount. |\n| `currency` | STRING | Currency | Currency; consistent with the customer's `region`. |\n| `is_declined` | BOOLEAN | Is Declined | Whether declined. Overall approval ~85–95%; declines skew to low/mid `fraud_score` (false positives) plus high-score fraud blocks. |\n| `fraud_score` | FLOAT | Fraud Score | Model score at authorization (0–1). |\n| `is_confirmed_fraud` | BOOLEAN | Is Confirmed Fraud | Post-investigation label. Steeply correlated with high `fraud_score`; overall a low-basis-points share of volume. Together with `fraud_score` gives capture rate vs false-positive declines. |\n| `channel` | STRING | Channel | One of `card_present` / `ecommerce` / `atm` / `online_banking` / `mobile`. |\n\n# Example Questions\n\n- Where does the fraud-detection system catch real fraud versus wrongly declining good `customers`?\n- Which spending categories and channels drive the most transaction volume and value?\n- How does everyday `account` activity differ between engaged `customers` and those going dormant?\n\n## Joins\n\n- [Accounts](./accounts.md) — `account_id = account_id` [N:1] — The account the money moved through.\n  - [Accounts Customer](./customer.md) — The customer whose account the money moved through.\n  - [Accounts Product](./product.md) — The product the transacting account sits on.\n", "healthcare/appointments": "---\ntitle: \"Appointments\"\ndescription: |\n  One row per scheduled appointment, capturing how a visit was booked and whether the patient\n  actually showed up. Each row links a patient, a provider and a department, records the\n  scheduled date and time, how far in advance it was booked (lead time), how long the patient\n  waited past that time, whether they were a no-show, and the appointment's final status. This\n  is the front door of the clinical and revenue cycle — every encounter and claim downstream\n  starts as a booked appointment here.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T17:34:12.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `appointment_id` | STRING | Appointment ID | PK. Unique appointment identifier. |\n| `patient_id` | STRING | Patient ID | Patient who booked the appointment. FK to [Patient](./patient.md) |\n| `provider_id` | STRING | Provider ID | Provider seeing the patient. FK to [Provider](./provider.md) |\n| `scheduled_at` | TIMESTAMP | Scheduled At | Scheduled date and time of the appointment. |\n| `department_id` | STRING | Department ID | Department where the appointment takes place. FK to [Department](./department.md) |\n| `status` | STRING | Status | Appointment status (e.g. booked, completed, cancelled). |\n| `is_no_show` | BOOLEAN | Is No Show | Whether the patient failed to show up. |\n| `wait_minutes` | INTEGER | Wait Minutes | Door-to-provider wait. |\n| `lead_time_days` | INTEGER | Lead Time Days | Booking-to-visit lead time — no-show driver. |\n\n# Example Questions\n\n- How does no-show rate change with booking lead time, and which lead-time windows should scheduling policy target first?\n- Which `departments` or `providers` have the longest `patient` wait times, and is that linked to no-show behavior?\n- What share of scheduled appointments convert to completed visits versus cancellations and no-shows?\n\n## Joins\n\n- [Department](./department.md) — `department_id = department_id` [N:1] — The department the appointment was booked into.\n- [Patient](./patient.md) — `patient_id = patient_id` [N:1] — The patient the appointment was booked for.\n- [Provider](./provider.md) — `provider_id = provider_id` [N:1] — The clinician the appointment was booked with.\n", "healthcare/bed-census-daily": "---\ntitle: \"Bed Census (daily)\"\ndescription: |\n  One row per department per day, tracking inpatient bed capacity and patient flow over time.\n  Each row records how many beds were staffed and how many were occupied that day, alongside\n  the day's admissions and discharges — the numbers that drive occupancy rate and reveal\n  whether a department is filling up or emptying out. This is the operational pulse of\n  capacity management across the health system.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T17:34:11.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `census_id` | STRING | Census ID | PK. Unique identifier for the daily census record. |\n| `department_id` | STRING | Department ID | Department the census covers. FK to [Department](./department.md) |\n| `census_date` | DATE | Census Date | Calendar day of the census. |\n| `staffed_beds` | INTEGER | Staffed Beds | Beds staffed and available that day. |\n| `occupied_beds` | INTEGER | Occupied Beds | Beds occupied at census time — utilization numerator. |\n| `admissions` | INTEGER | Admissions | Admissions during the day. |\n| `discharges` | INTEGER | Discharges | Discharges during the day. |\n\n# Example Questions\n\n- Which `departments` run at the highest occupancy, and how close are they to their staffed-bed capacity?\n- How does daily occupancy trend over time as admissions and discharges fluctuate?\n- Are there `departments` where staffed beds are consistently underused relative to demand?\n\n## Joins\n\n- [Department](./department.md) — `department_id = department_id` [N:1] — The department these staffed beds belong to.\n", "healthcare/claims": "---\ntitle: \"Claims\"\ndescription: |\n  One row per claim submitted to a payer for a clinical encounter — the revenue-cycle record\n  that turns care into cash. Each claim tracks the billed, payer-allowed and actually paid\n  amounts, its submission and payment dates, current status, the denial reason when one\n  applies, and the number of days it has sat in accounts receivable. This is the mart that\n  answers how well the health system gets paid for the care it delivers, and how quickly.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:19:47.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `claim_id` | STRING | Claim ID | PK. Unique claim identifier. |\n| `encounter_id` | STRING | Encounter ID | Encounter the claim is billed for. FK to [Encounters](./encounters.md) |\n| `payer_id` | STRING | Payer ID | Payer responsible for the claim. FK to [Payer](./payer.md) |\n| `submitted_at` | DATE | Submitted At | Date the claim was submitted. |\n| `paid_at` | DATE | Paid At | Date the claim was paid. |\n| `billed_amount` | NUMERIC | Billed Amount | Amount billed to the payer. |\n| `allowed_amount` | NUMERIC | Allowed Amount | Payer-allowed amount. |\n| `paid_amount` | NUMERIC | Paid Amount | Amount actually paid. |\n| `status` | STRING | Status | Claim status (e.g. submitted, paid, denied). |\n| `denial_code` | STRING | Denial Code | CARC/RARC denial reason, when denied. |\n| `ar_days` | INTEGER | Ar Days | Days in accounts receivable — revenue-cycle speed. |\n\n# Example Questions\n\n- What is the claim denial rate, and which denial reasons account for the most lost revenue?\n- How much longer do denied claims spend in accounts receivable than clean, paid claims?\n- How does the gap between billed and paid amounts vary by `payer`?\n\n## Joins\n\n- [Encounters](./encounters.md) — `encounter_id = encounter_id` [N:1] — The encounter being billed.\n  - [Encounters Appointments](./appointments.md) — The booking behind the billed encounter.\n    - [Encounters Appointments Department](./department.md) — The department that delivered the billed care.\n    - [Encounters Appointments Patient](./patient.md) — The patient as recorded on the booking, not on the encounter.\n    - [Encounters Appointments Provider](./provider.md) — The clinician who delivered the billed care.\n  - [Encounters Patient](./patient.md) — The patient treated in the billed encounter.\n- [Payer](./payer.md) — `payer_id = payer_id` [N:1] — The insurer billed for this claim.\n", "healthcare/department": "---\ntitle: \"Department\"\ndescription: |\n  Reference list of the clinical departments that make up the health system, each with the\n  clinical specialty it serves and its staffed-bed capacity. Departments are the organizational\n  unit behind appointments, provider assignments and daily bed census — staffed beds is the\n  denominator for every occupancy and capacity calculation in the model.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T17:34:11.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `department_id` | STRING | Department ID | PK. Unique department identifier. |\n| `name` | STRING | Name | Department name. |\n| `specialty` | STRING | Specialty | Clinical specialty the department serves. |\n| `staffed_beds` | INTEGER | Staffed Beds | Number of staffed beds — the utilization denominator. |\n\n# Example Questions\n\n- Which departments carry the most staffed-bed capacity, and how does that compare to their `appointment` and `patient volume`?\n- How is clinical specialty distributed across departments?\n- Which departments are capacity-constrained relative to peers with a similar specialty?\n", "healthcare/encounters": "---\ntitle: \"Encounters\"\ndescription: |\n  One row per clinical encounter — the actual visit that followed a scheduled appointment.\n  Each encounter records its type (outpatient, inpatient or emergency department), the primary\n  diagnosis, admission and discharge timestamps, the resulting length of stay, and whether it\n  was an unplanned readmission within 30 days. This is where the clinical story lives: what\n  patients are being treated for, how long they stay, and how often they come back\n  unexpectedly.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-02T16:19:47.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `encounter_id` | STRING | Encounter ID | PK. Unique clinical encounter identifier. |\n| `appointment_id` | STRING | Appointment ID | Appointment that led to this encounter. FK to [Appointments](./appointments.md) |\n| `patient_id` | STRING | Patient ID | Patient seen in the encounter. FK to [Patient](./patient.md) |\n| `provider_id` | STRING | Provider ID | Provider who delivered care. |\n| `admit_ts` | TIMESTAMP | Admit Time | Admission date and time. |\n| `discharge_ts` | TIMESTAMP | Discharge Time | Discharge date and time. |\n| `encounter_type` | STRING | Encounter Type | outpatient / inpatient / ED. |\n| `primary_diagnosis` | STRING | Primary Diagnosis | Primary ICD-10 code. |\n| `length_of_stay_days` | FLOAT | Length Of Stay Days | Length of stay in days. |\n| `is_readmission_30d` | BOOLEAN | Is Readmission 30d | Unplanned readmission within 30 days. |\n\n# Example Questions\n\n- What is the 30-day readmission rate for inpatient stays, and which diagnoses show the highest recurrence?\n- How does average length of stay differ across outpatient, inpatient and ED encounters?\n- Which primary diagnoses account for the most encounter volume, and how does that mix differ between outpatient and inpatient care?\n\n## Joins\n\n- [Appointments](./appointments.md) — `appointment_id = appointment_id` [N:1] — The booking that brought the patient in.\n  - [Appointments Department](./department.md) — The department the visit was booked into.\n  - [Appointments Patient](./patient.md) — The patient as recorded on the booking.\n  - [Appointments Provider](./provider.md) — The clinician the visit was booked with.\n- [Patient](./patient.md) — `patient_id = patient_id` [N:1] — The patient treated in this encounter.\n", "healthcare/patient": "---\ntitle: \"Patient\"\ndescription: |\n  One row per patient, the demographic and coverage anchor for every appointment, encounter\n  and claim in the system. Each patient carries a birth year and gender for age-banded analysis,\n  a postal code for geographic reach, an insurance type (commercial, Medicare, Medicaid or\n  self-pay) that determines how their care gets billed, a risk-stratification tier used by care\n  management to flag patients who need closer follow-up, and the date they first registered\n  with the system.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T17:34:11.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `patient_id` | STRING | Patient ID | PK. Unique de-identified patient identifier. |\n| `birth_year` | INTEGER | Birth Year | Year of birth, used for age banding. |\n| `gender` | STRING | Gender | Patient gender. |\n| `postal_code` | STRING | Postal Code | Patient postal/ZIP code for geographic analysis. |\n| `insurance_type` | STRING | Insurance Type | commercial / Medicare / Medicaid / self-pay. |\n| `risk_tier` | STRING | Risk Tier | Risk-stratification band for care management. |\n| `registered_at` | DATE | Registered At | Date the patient was first registered. |\n\n# Example Questions\n\n- How is the patient population split across insurance types, and how has that mix shifted as new patients register?\n- What share of patients fall into higher-risk tiers, and how does that skew by age band?\n- Which postal codes or regions are driving the most new patient registrations?\n", "healthcare/payer": "---\ntitle: \"Payer\"\ndescription: |\n  Reference list of the insurance payers and plans that reimburse the health system for care,\n  each identified by name and plan type — HMO, PPO, EPO or government (Medicare/Medicaid). Every\n  claim is billed to one of these payers, so this mart is the lookup behind any payer-mix or\n  reimbursement analysis.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-23T17:34:12.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `payer_id` | STRING | Payer ID | PK. Unique payer identifier. |\n| `name` | STRING | Name | Payer / insurance plan name. |\n| `plan_type` | STRING | Plan Type | HMO / PPO / EPO / government. |\n\n# Example Questions\n\n- What is the split between government and commercial plan types among the payers the system bills?\n- Which payers make up the largest share of billed `claim` volume?\n- How does reimbursement performance differ between HMO, PPO and EPO plans?\n", "healthcare/provider": "---\ntitle: \"Provider\"\ndescription: |\n  One row per clinician, the roster behind every appointment and encounter. Each provider is\n  identified by name, clinical specialty, home department, and National Provider Identifier\n  (NPI) — the standard identifier used to credential and bill for a clinician's services. This\n  is the lens for looking at care delivery by clinician: who is seeing patients, in what\n  specialty, and out of which department.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-07-29T14:32:44.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `provider_id` | STRING | Provider ID | PK. Unique provider identifier. |\n| `full_name` | STRING | Full Name | Provider's full name. |\n| `specialty` | STRING | Specialty | Clinical specialty of the provider. |\n| `department` | STRING | Department | Department the provider belongs to. |\n| `npi` | STRING | NPI | National Provider Identifier. |\n\n# Example Questions\n\n- How many providers does each specialty and `department` have, and does that staffing match `patient` demand?\n- Which providers or specialties carry the highest `appointment` and `encounter` volume?\n- Are certain specialties concentrated in a handful of `departments`, or spread thinly across the system?\n", "healthcare-clinic-attribution/call": "---\ntitle: \"Call\"\ndescription: |\n  Every telephone conversation between the practice and someone enquiring. A phone call\n  and a web form are the same step in the funnel, not two funnels: both are the first\n  engagement, both create the same [CRM record](./lead.md), and both carry the same\n  advertising identifiers when the caller was on the website. A report built on web forms\n  alone leaves telephone enquiries out and credits the wrong channels.\n\n  **Those identifiers are empty for a caller with no web history, and that is the record\n  being accurate rather than a tracking defect.** Someone rings a number from a leaflet,\n  a sign or a recommendation, having never opened the site; there is no visit to match\n  them to and no [click](./click.md) to credit. Dropping unattributed calls makes the\n  measurable channels look better than they are, so they are kept and reported as demand\n  the practice knows it has and cannot yet trace.\n\n  `direction` separates calls received from calls placed: a first screen can begin with\n  the practice ringing back, and treating a returned call as a fresh enquiry would\n  double-count demand.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:19:59.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `call_id` | STRING | Call ID | PK. Unique identifier for this one call, separate from the enquiry it belongs to — one enquiry can run to several calls. |\n| `lead_id` | STRING | Lead ID | The enquiry record this call opened or added to; every later call about the same enquiry carries the same value. FK to [Lead](./lead.md) |\n| `person_id` | STRING | Person ID | The human on the other end, where they can be recognised from the website — reachable through the [enquiry](./lead.md) this call opened or through the [visit](./session.md) it was placed from. Empty for a caller never seen online, which is a fact about the call rather than missing data. |\n| `session_id` | STRING | Session ID | The visit the call was placed from, where there was one. Empty for a caller who dialled a number they saw somewhere other than the site. FK to [Session](./session.md) |\n| `click_id` | STRING | Click ID | The paid click behind the call. Empty for organic callers and for anyone who never visited the site at all. FK to [Click](./click.md) |\n| `called_at` | TIMESTAMP | Called At | When the call took place. Compared with the enquiry's creation time, it separates the first contact from the follow-ups. |\n| `direction` | STRING | Direction | Who placed it: `inbound` when the person rang the practice, `outbound` when reception rang them. A returned call is not a second enquiry. |\n| `duration_seconds` | INTEGER | Call Length (Seconds) | How long the conversation lasted, in seconds — the difference between a call that was merely picked up and one in which the practice actually spoke to someone. |\n| `answered` | BOOLEAN | Answered | Whether anyone picked up. A call nobody answered is an enquiry that never reached a person, and it appears in no report built on web forms. |\n| `tracking_number` | STRING | Tracking Number | The number the caller dialled. When a practice publishes a different number per place — site, ad, print — this is what attributes a call that has no web history at all. |\n| `utm_source` | STRING | Call Source | Source declared by the link that brought this caller to the site, where there was one, such as `google` or `facebook`. Empty for a caller with no web visit behind them. |\n| `utm_medium` | STRING | Call Medium | Medium declared by that link, such as `cpc` or `paid_social` — the tag that marks this call as bought rather than earned. |\n| `utm_campaign` | STRING | Call Campaign | Campaign the call is credited to, as named in the ad account. Empty both for unattributed callers and for arrivals that carry no campaign. |\n\n# Example Questions\n\n- What share of our enquiries arrive by phone rather than by form, and does that split differ by campaign?\n- How many calls go unanswered, at what times of day, and what does that cost us in enquiries that never became appointments?\n- Do callers we can attribute to advertising behave differently from callers with no web history — longer calls, better acceptance at the screen?\n\n## Joins\n\n- [Click](./click.md) — `click_id = click_id` [N:1] — The paid click behind the call; absent for organic and offline callers.\n  - [Click Person](./person.md) — The human the paid click behind this call was attributed to.\n  - [Click Session](./session.md) — The visit the ad click produced, which need not be the visit this call was placed from.\n    - [Click Session Person](./person.md) — The human behind the visit that ad click produced.\n- [Lead](./lead.md) — `lead_id = lead_id` [N:1] — The CRM record this call produced or added to.\n  - [Lead Person](./person.md) — The human the CRM enquiry is filed under, which gathers every call about the same enquiry.\n- [Session](./session.md) — `session_id = session_id` [N:1] — The visit the call was placed from; absent for a caller with no web history.\n  - [Session Person](./person.md) — The human behind the visit this call was placed from.\n", "healthcare-clinic-attribution/click": "---\ntitle: \"Click\"\ndescription: |\n  Every click on one of the practice's ads, held as its own record rather than as columns\n  on whatever happened next, and keyed the same way on every platform so clicks across\n  Google, Meta, Microsoft and TikTok count in one place. `session_id` is empty when the\n  click produced no visit — the person tapped and went straight back, the page failed,\n  tracking was blocked — and those clicks were still paid for, so dropping them is how\n  advertising quietly looks better than it was.\n\n  `platform_click_id` holds the raw value the ad platform itself attached: the `gclid`,\n  `fbclid`, `msclkid` or `ttclid`. It is the harder evidence of a paid arrival, and needs\n  one guard: **a value shorter than ten characters should be treated as absent** — below\n  that what turns up is `undefined`, `null`, empty strings and truncated fragments, which\n  inflate whichever channel they land in. Lesley van de Mortel, who described this model,\n  uses that minimum in her own SQL and pairs it with a check on `utm_source` and\n  `utm_medium`, so a claimed channel agrees with itself from two directions.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:19:59.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `click_id` | STRING | Click ID | PK. The practice's own identifier for the click, minted the same way on every platform so clicks can be counted in one place. |\n| `person_id` | STRING | Person ID | The human who clicked, which is what lets several clicks over months be recognised as one person's journey rather than several prospects. FK to [Person](./person.md) |\n| `session_id` | STRING | Session ID | The visit the click produced. Empty when it produced none — the click was still paid for, and excluding those flatters the channel. FK to [Session](./session.md) |\n| `clicked_at` | TIMESTAMP | Clicked At | When the ad was clicked. The gap between here and any money that follows can run from weeks to years in this business, so a same-month comparison will miss it. |\n| `ad_platform` | STRING | Ad Platform | Which advertising platform the click came from: `google_ads`, `meta`, `microsoft` or `tiktok`. |\n| `platform_click_id` | STRING | Platform Click ID | The raw identifier the platform attached — `gclid`, `fbclid`, `msclkid` or `ttclid`. Treat anything shorter than ten characters as absent: below that it is placeholder text, not a click. |\n| `utm_source` | STRING | UTM Source | Source the ad link declared, such as `google` or `tiktok`. Worth checking against `ad_platform` rather than trusting alone, because it is set by hand in the ad. |\n| `utm_medium` | STRING | UTM Medium | Medium the ad link declared, such as `cpc` or `paid_social` — the tag that marks this traffic as bought. |\n| `utm_campaign` | STRING | UTM Campaign | Campaign the click was bought under, as named in the ad account. |\n| `utm_term` | STRING | UTM Term | Keyword the click was bought under, where the platform works that way. Empty on platforms that sell audiences rather than search terms. |\n| `utm_content` | STRING | Ad Creative | Which creative was clicked — the image, video or headline. This is the field that makes \"which ad works\" answerable at all, rather than only \"which campaign works\". |\n| `landing_page_url` | STRING | Ad Landing Page | Address the ad sent the person to, which is what the click's promise has to be judged against. This is the ad's side of a pair: the visit records its own landing page separately. |\n\n# Example Questions\n\n- Which creatives bring the people who go on to be qualified by a clinician, rather than the ones who merely click cheaply?\n- What share of our ad clicks never turn into a visit at all, and does that differ between platforms?\n- How many ad clicks does a patient typically take, and over how long, before they get in touch?\n\n## Joins\n\n- [Person](./person.md) — `person_id = person_id` [N:1] — The human who clicked the ad.\n- [Session](./session.md) — `session_id = session_id` [N:1] — The visit the click landed in; absent when the click never produced one.\n  - [Session Person](./person.md) — The human behind the visit this click produced, reached through the visit rather than off the click.\n", "healthcare-clinic-attribution/consultation": "---\ntitle: \"Consultation\"\ndescription: |\n  Where an enquiry is judged. A practice screens in two steps, both held here, told\n  apart by `type` and by who conducted them: they differ in who screens, not in what\n  is recorded. A `Pre-Consultation` is a telephone conversation held by a receptionist or\n  a practice manager — not a clinician — who decides whether the practice is a plausible\n  fit. A `Consultation` is the appointment that follows: a clinician examines the person\n  and decides whether treatment can go ahead. The first step exists because the second is\n  expensive: without it every enquiry would go straight to a clinician, and no practice\n  has the hours for that.\n\n  **Qualification is decided here, and only here.** The [enquiry](./lead.md) record\n  carries a field of the same name, but it is empty: at the moment of a form or a call\n  nobody has yet formed a view. One enquiry can be screened more than once, so it may\n  have several rows here, to be read in order. `disqualification_reason` carries the\n  practice's own account of a refusal, which turns a low acceptance rate from a count\n  into a diagnosis and shows which campaigns bring people the practice can actually\n  treat.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:19:58.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `consultation_id` | STRING | Consultation ID | PK. Unique identifier for this one screening, not for the enquiry — an enquiry can be screened more than once. |\n| `lead_id` | STRING | Lead ID | The enquiry being screened. Several rows here share one value, which is what makes this a sequence of steps rather than a single verdict. FK to [Lead](./lead.md) |\n| `employee_id` | STRING | Employee ID | Who conducted it. This is what distinguishes a receptionist's phone screen from a clinician's assessment in practice, and it lets acceptance rates be compared between staff. FK to [Employee](./employee.md) |\n| `consultation_date` | DATE | Consultation Date | The day it took place. Measured against the enquiry's creation time, it is how long the practice took to respond; measured against the previous screen, how long the person waited between steps. |\n| `type` | STRING | Consultation Type | Which of the two screens this is: `Pre-Consultation` for the phone conversation with reception or a manager, `Consultation` for the appointment with a clinician. |\n| `is_qualified` | BOOLEAN | Is Qualified | The verdict of this screen: TRUE when the person moves forward, FALSE when they do not. This is where qualification is actually decided; the same field on the enquiry record is empty. |\n| `disqualification_reason` | STRING | Disqualification Reason | Why the person was not taken forward. Empty when they were. This is what turns a low acceptance rate from a count into a diagnosis, because the fix is different for each reason. |\n\n# Example Questions\n\n- Which campaigns bring enquiries that a clinician accepts, and which bring enquiries that fail the phone screen?\n- Where do we lose more people — on the phone or in the room — and has that shifted since we changed our advertising?\n- What are we turning enquiries away for, and does one reason concentrate in one channel enough to be fixed in the ad rather than at reception?\n\n## Joins\n\n- [Employee](./employee.md) — `employee_id = employee_id` [N:1] — Who held it, which is what separates a phone screen from a clinician's assessment.\n- [Lead](./lead.md) — `lead_id = lead_id` [N:1] — The enquiry being screened; one lead can have several screenings.\n  - [Lead Person](./person.md) — The human behind the enquiry being screened, back to the browsing and advertising that preceded it.\n", "healthcare-clinic-attribution/customer-patient": "---\ntitle: \"Customer (Patient)\"\ndescription: |\n  The patient once money is involved. A person exists from the first anonymous visit; a\n  customer exists once there is an invoice or revenue against them — not when someone\n  enquires, and not when a clinician agrees to treat them — and that is the line between\n  an audience and a patient list. In healthcare the two are the same human, so this is\n  one record rather than two: `customer_id` is this model's key and `patient_id` the\n  clinical system's, so a commercial report and a clinical record reconcile without\n  renaming anything. That is not universal — elsewhere an employer or a school pays for\n  the people being served, and payer and patient are separate records.\n\n  One customer covers several treatments and several payments, so counting rows here\n  counts patients while counting [treatments](./treatment.md), [invoices](./invoice.md)\n  or [payments](./revenue.md) counts events, and with returning patients the two are not\n  the same. `person_id` resolves a paying patient back to the anonymous first visit, so\n  the advertising that started a journey can be credited with the money that ended it,\n  however long the gap.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:19:58.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `customer_id` | STRING | Customer ID | PK. Unique identifier for the patient as a paying party, issued when the first invoice or payment appears rather than at the enquiry. |\n| `person_id` | STRING | Person ID | The same human at their anonymous stage, which is what ties money received back to the visit and the advertising that started the journey. FK to [Person](./person.md) |\n| `patient_id` | STRING | Patient ID | The identifier the clinical system issues for the same human. Held alongside the commercial key so a clinical record and a billing record can be reconciled without renaming either. |\n| `first_name` | STRING | Patient First Name | Given name as the practice bills it. The enquiry record holds its own copy of the contact details, on [Lead](./lead.md). |\n| `last_name` | STRING | Patient Last Name | Family name as the practice bills it. |\n| `became_customer_at` | TIMESTAMP | Became a Customer At | When this human stopped being an enquiry and became a paying patient: the moment of the first invoice or payment. Compared with the person's first visit, it is the full length of the journey from first touch to first money. |\n\n# Example Questions\n\n- How long does it take from a person's first visit to their first invoice, and does that gap differ by the channel they first arrived through?\n- Which first-touch campaigns produced paying patients this year, rather than enquiries that stopped at a consultation?\n- How many of our patients have come back for more than one treatment, and what were they worth compared with the ones who came once?\n\n## Joins\n\n- [Person](./person.md) — `person_id = person_id` [N:1] — The same human, tracked from their first anonymous visit onward.\n", "healthcare-clinic-attribution/employee": "---\ntitle: \"Employee\"\ndescription: |\n  Everyone at the practice who takes part in turning an enquiry into a booked treatment —\n  clinicians, receptionists and practice managers alike — kept as one list and told apart\n  by `type`: `Doctor`, `Receptionist`, `Manager`. They are one mart rather than three\n  because they carry the same properties and differ only in what they do; splitting them\n  would duplicate the same five fields three times and make every question about staff a\n  question asked three times.\n\n  Both screening steps are staffed from here: the phone call that decides whether an\n  enquiry is worth an appointment, and the appointment itself, where a clinician decides\n  whether treatment can go ahead. Because both [consultations](./consultation.md) point\n  at this one mart, the same question — who held it, and how did it end — answers for\n  either step, which is what lets a practice see where its enquiries are actually lost,\n  and to whom. Without it every enquiry would appear to go straight to the doctor, and\n  the screen that turns away a poor fit would be invisible.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:19:57.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `employee_id` | STRING | Employee ID | PK. Unique identifier for this member of staff. |\n| `type` | STRING | Employee Type | What the person does in the funnel: `Doctor` sees patients in the room and decides whether treatment goes ahead, while `Receptionist` and `Manager` take the first screening call. |\n| `first_name` | STRING | First Name | Given name, as the practice records it. |\n| `last_name` | STRING | Last Name | Family name, as the practice records it. |\n| `position` | STRING | Position | Job title at the practice — finer than `type`, and the wording a rota or a staff list would use. |\n| `specialty` | STRING | Specialty | Clinical field the person practises in. Empty for reception and management staff, for whom it has no meaning. |\n\n# Example Questions\n\n- Which clinicians qualify the highest share of the enquiries they see, and does the difference follow the specialty rather than the individual?\n- How much of the funnel's loss happens on the phone screen versus in the room, and who is holding each of those steps?\n- Do the enquiries screened by one member of reception reach the clinician in better shape than those screened by another?\n", "healthcare-clinic-attribution/form-submission": "---\ntitle: \"Form Submission\"\ndescription: |\n  Every web form the practice receives, with the advertising that produced it attached. A\n  form submission is one of the two ways an enquiry begins; ringing the practice is the\n  other, and the two are the same step in the funnel. A submission opens a\n  [CRM record](./lead.md) if the person has not enquired before and attaches to the\n  existing one if they have, so one enquiry can produce several rows: counting rows\n  counts contact attempts, not prospective patients.\n\n  It carries two families of identifiers worth keeping apart. The five `utm_*` fields are\n  what the link itself declared, set by hand when the ad was built; the four click\n  identifiers — `gclid`, `fbclid`, `msclkid`, `ttclid` — are what the advertising\n  platform attached, and they are the harder evidence of the two. As on the\n  [ad click](./click.md), **a platform click identifier shorter than ten characters\n  should be treated as absent.**\n\n  An empty attribution field is normal rather than broken: someone who arrived through\n  unpaid search or typed the address in carries no campaign and no click identifier, and\n  the identifiers of platforms a person did not come through are empty too.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:20:00.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `form_submission_id` | STRING | Form Submission ID | PK. Unique identifier for this one form, separate from the enquiry it belongs to — one enquiry can produce several. |\n| `lead_id` | STRING | Lead ID | The enquiry record this submission opened or added to; repeat submissions from the same person all carry the same value. FK to [Lead](./lead.md) |\n| `person_id` | STRING | Person ID | The human who submitted it. Reach them through the [enquiry](./lead.md) this submission opened or through the [visit](./session.md) it was sent during, both of which carry the same identifier back to the anonymous browsing and advertising that came before. |\n| `session_id` | STRING | Session ID | The visit the form was sent during, which is how the pages read beforehand can be counted as part of the same decision. FK to [Session](./session.md) |\n| `click_id` | STRING | Click ID | The paid click that brought this person to the site. Empty for organic and direct arrivals, which is the normal state rather than missing data. FK to [Click](./click.md) |\n| `submitted_at` | TIMESTAMP | Submitted At | When the form was sent. Measured back to the person's first page view, it is how long the journey to an enquiry took. |\n| `form_name` | STRING | Form Name | Which form on the site was used — a consultation request asks for more commitment than a callback request, and they should not be counted as one. |\n| `page_url` | STRING | Form Page | Address of the page the form was sent from, which is the page whose argument actually persuaded the person to get in touch. |\n| `utm_source` | STRING | Submission Source | Source declared by the link that brought this person, such as `google` or `tiktok`. Set by hand in the ad, so worth checking against the platform's own click identifier. |\n| `utm_medium` | STRING | Submission Medium | Medium declared by the link, such as `cpc` or `paid_social` — the tag that marks this enquiry as bought rather than earned. |\n| `utm_campaign` | STRING | Submission Campaign | Campaign the enquiry is credited to, as named in the ad account. Empty for arrivals that carry no campaign at all. |\n| `utm_term` | STRING | Submission Search Term | Keyword behind the enquiry, where the channel sells keywords. Empty on platforms that sell audiences instead. |\n| `utm_content` | STRING | Submission Creative | Which creative the person came through — the image, video or headline. This is the level at which advertising is actually changed, so it is the level worth judging enquiries at. |\n| `gclid` | STRING | Google Click ID | Google's own identifier for the click behind this submission. Treat a value shorter than ten characters as absent. |\n| `fbclid` | STRING | Meta Click ID | Meta's own identifier for the click behind this submission, covering Facebook and Instagram. Treat a value shorter than ten characters as absent. |\n| `msclkid` | STRING | Microsoft Click ID | Microsoft's own identifier for the click behind this submission. Treat a value shorter than ten characters as absent. |\n| `ttclid` | STRING | TikTok Click ID | TikTok's own identifier for the click behind this submission. Treat a value shorter than ten characters as absent. |\n\n# Example Questions\n\n- Which forms on the site produce enquiries a clinician goes on to accept, and which merely produce volume?\n- Which creatives are behind our web enquiries, rather than only which campaigns — and does the ranking change between the two?\n- How many forms does one enquiry take before the practice gets back to them, and does that repeat-submission rate differ by channel?\n\n## Joins\n\n- [Click](./click.md) — `click_id = click_id` [N:1] — The paid click that brought them; absent for organic and direct visits.\n  - [Click Person](./person.md) — The human the paid click that brought this person was attributed to.\n  - [Click Session](./session.md) — The visit the ad click produced, which need not be the visit this form was sent during.\n    - [Click Session Person](./person.md) — The human behind the visit that ad click produced.\n- [Lead](./lead.md) — `lead_id = lead_id` [N:1] — The CRM record this submission produced or added to; one lead may submit several forms.\n  - [Lead Person](./person.md) — The human the CRM enquiry is filed under, which can gather several submissions under one record.\n- [Session](./session.md) — `session_id = session_id` [N:1] — The visit it was submitted during.\n  - [Session Person](./person.md) — The human behind the visit this form was sent during.\n", "healthcare-clinic-attribution/invoice": "---\ntitle: \"Invoice\"\ndescription: |\n  A bill the practice has issued, raised against one treatment and one patient. An\n  invoice is a claim on money, not money: it records what is owed and to whom, and\n  nothing here says any of it has arrived. Money actually received is recorded on\n  [Revenue](./revenue.md), joined by `invoice_id`: a report on invoices answers \"what\n  have we billed\", one on revenue \"what have we been paid\". Read as income they\n  overstate, carrying the full value of work billed, including the part an insurer has\n  not settled and the part that may never be paid at all.\n\n  A treatment is billed in two parts. In the United States, where this pattern was\n  described, the patient's copay can be billed as soon as the treatment is booked, is\n  collected before it starts, and is money straight away, though a small share of the\n  total. The rest is claimed from the insurer after the treatment and becomes money only\n  when the insurer pays, with a lag. `payer_type` tells the two apart. A `written_off`\n  invoice is delivered work that earned nothing, so it belongs in any honest reading of\n  what a channel produced.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:20:02.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `invoice_id` | STRING | Invoice ID | PK. Unique identifier for one bill. The patient's part and the insurer's part are billed separately, so one treatment can produce more than one row here. |\n| `customer_id` | STRING | Customer ID | The patient being billed. In healthcare this is the same human being treated, so no separate payer record is needed. FK to [Customer (Patient)](./customer-patient.md) |\n| `treatment_id` | STRING | Treatment ID | The treatment this bill is for, which is how a charge connects back to the clinician's decision and, through it, to the advertising that produced the enquiry. FK to [Treatment](./treatment.md) |\n| `issued_at` | TIMESTAMP | Issued At | When the bill was sent. For a copay this can be as early as the booking; for an insurance claim it follows the treatment. It is the start of the clock that `Days to Payment` measures. |\n| `amount` | NUMERIC | Invoiced Amount | What this bill asks for. It is not income — the amount actually received against it is recorded on [Revenue](./revenue.md), and it can be smaller, arrive in pieces, or never arrive. |\n| `currency` | STRING | Invoice Currency | Currency the bill was raised in, such as `USD`. Needed before amounts from different bills can be added together. |\n| `payer_type` | STRING | Payer Type | Who is being asked to pay: `patient_copay` for the part the patient settles before treatment, `insurance_claim` for the part claimed from the insurer afterwards. One is settled before the treatment, the other after the claim is processed. |\n| `status` | STRING | Invoice Status | Where the claim stands: `issued`, `partially_paid`, `paid`, or `written_off` when the practice has given up on it. Written-off bills are delivered work that earned nothing and should not be dropped from a channel's result. |\n\n# Example Questions\n\n- How much of what we have billed this quarter is still outstanding, and how much of that is sitting with insurers rather than with patients?\n- What is the split between patient copays and insurance claims on the treatments we deliver, in value rather than in count?\n- Which treatments end up written off, and do they concentrate in one part of our demand?\n\n## Joins\n\n- [Customer (Patient)](./customer-patient.md) — `customer_id = customer_id` [N:1] — Who is being billed.\n  - [Customer (Patient) Person](./person.md) — The human behind the patient being billed, back to their first anonymous visit.\n- [Treatment](./treatment.md) — `treatment_id = treatment_id` [N:1] — What is being billed for.\n  - [Treatment Consultation](./consultation.md) — The assessment that cleared the treatment being billed for.\n    - [Treatment Consultation Employee](./employee.md) — Who held the assessment that cleared this treatment, who need not be the one who delivered it.\n    - [Treatment Consultation Lead](./lead.md) — The enquiry that was screened into the treatment being billed for.\n      - [Treatment Consultation Lead Person](./person.md) — The human behind that enquiry, which is this bill's route back to the first visit.\n  - [Treatment Customer (Patient)](./customer-patient.md) — The patient the treatment was booked for, reached through the treatment rather than off this bill.\n    - [Treatment Customer (Patient) Person](./person.md) — The human behind the patient the treatment was booked for.\n  - [Treatment Employee](./employee.md) — Who delivered the treatment being billed for.\n", "healthcare-clinic-attribution/lead": "---\ntitle: \"Lead\"\ndescription: |\n  The enquiry as the practice's CRM holds it: a named person with contact details,\n  created the moment someone first gets in touch, by web form or by phone. It does not\n  exist beforehand, which is why the [form submission](./form-submission.md) and the\n  [call](./call.md) point at the lead rather than the other way round. `person_id`\n  traces the enquiry back to the [browsing](./person.md) that preceded it by months or\n  years, and the advertising identifiers copied onto the record keep a campaign attached\n  to that name long afterwards. One lead is one person's enquiry, not one contact\n  attempt: the same lead may submit several forms, make several calls, and be screened\n  more than once.\n\n  **`is_qualified` is empty on this mart, and that is by design, not by omission.** The\n  CRM carries the field from the start, but at the enquiry stage nobody has yet spoken to\n  the person; the decision is taken later, at a\n  [consultation](./consultation.md), and stored there. A report that counts unqualified\n  enquiries as `is_qualified = false` will therefore undercount them: the enquiries that\n  were never accepted are not false, they are empty. To judge an enquiry's outcome, look\n  at the consultations attached to it, not at this field.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:19:58.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `lead_id` | STRING | Lead ID | PK. The CRM's own reference for the enquiry, issued when the first form or call arrives. It is a number in the CRM, carried here as a fixed-width string of digits so that sorting by it always follows the order the records were issued. |\n| `person_id` | STRING | Person ID | The human this enquiry belongs to, which is what ties a named enquiry back to the anonymous browsing and advertising that preceded it. FK to [Person](./person.md) |\n| `first_name` | STRING | Lead First Name | Given name as the enquirer supplied it, which is what the practice has to work with — it need not match any later clinical record. |\n| `last_name` | STRING | Lead Last Name | Family name as the enquirer supplied it. |\n| `email` | STRING | Email | Email address given at the enquiry. Empty when the person only ever telephoned and left no address. |\n| `phone` | STRING | Phone | Telephone number given at the enquiry, and the one reception will call back on for the first screen. |\n| `crm_contact_id` | STRING | CRM Contact ID | The contact's identifier in the practice's CRM, which is what a marketing team uses to reconcile this record against the system staff work in day to day. |\n| `created_at` | TIMESTAMP | Created At | When the CRM record was opened, which is the moment of the first form submission or call rather than of any earlier visit. |\n| `first_engagement_type` | STRING | First Engagement Type | Which contact created the record: `form` or `call`. The two are the same funnel step, so this is what separates a channel's telephone demand from its web demand. |\n| `is_qualified` | BOOLEAN | Qualified on the Lead Record | Empty at this stage. The CRM carries the field from the start, but nobody has decided at this stage — the verdict is taken at a consultation and stored there. Counting empty as `false` will undercount the enquiries that were not accepted. |\n\n# Example Questions\n\n- How many enquiries does a channel produce, and how many of them survive the first phone screen rather than merely arriving?\n- Do enquiries that start with a phone call behave differently from those that start with a web form — faster to screen, more likely to be accepted?\n- How long does it take from the first enquiry to a booked appointment, and which campaigns produce the enquiries that move quickest?\n\n## Joins\n\n- [Person](./person.md) — `person_id = person_id` [N:1] — The human behind the enquiry, which is how a lead connects to anything that happened before it.\n", "healthcare-clinic-attribution/page-view": "---\ntitle: \"Page View\"\ndescription: |\n  Every page a visitor actually opened, in the order they opened it. Where a\n  [page](./page.md) is described once and for all, a page view is one reading of it by\n  one person at one moment — which is what turns a site map into a record of behaviour.\n\n  This mart reaches further back than anything else in the model: the very first page\n  view is where a person's identity is minted — before a name, before an email, before\n  anyone at the practice knows a prospective patient is there. It is also what makes\n  \"what did they read before they got in touch\" answerable. `sequence_in_session` makes a\n  journey readable as an order rather than a pile of URLs; `is_entrance` and `is_exit`\n  mark its two ends: entrances say which pages bring people in, exits say where\n  attention is lost, and those are two different lists.\n\n  `time_on_page_seconds` is measured from when the next page was opened, so it cannot be\n  known for the last page of a visit. That value is empty rather than zero, and treating\n  it as zero understates how long the site was read for.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:20:00.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `page_view_id` | STRING | Page View ID | PK. Unique identifier for this one reading of a page by one person at one moment. |\n| `session_id` | STRING | Session ID | The visit this reading happened in, which is what puts it in order next to everything else seen during the same visit. FK to [Session](./session.md) |\n| `person_id` | STRING | Person ID | The human who read the page. Carried here as well as on the visit, so a person's whole reading history can be assembled without walking through sessions. FK to [Person](./person.md) |\n| `page_id` | STRING | Page ID | Which page was read. The view holds this, because one page is read many times. FK to [Page](./page.md) |\n| `viewed_at` | TIMESTAMP | Viewed At | When the page was opened. On a person's earliest page view, this is also the moment their identity was minted. |\n| `sequence_in_session` | INTEGER | Position In Visit | Where this page sat in the visit, counting from 1 — what makes a journey readable as an order rather than a set of URLs. |\n| `time_on_page_seconds` | INTEGER | Time On Page (sec) | Seconds until the next page was opened. Empty for the last page of a visit, where there is no next page to measure against — not zero. |\n| `is_entrance` | BOOLEAN | Is Entrance | TRUE when this was the first page of the visit: the page that had to earn the visitor's attention. |\n| `is_exit` | BOOLEAN | Is Exit | TRUE when this was the last page of the visit — where the visitor stopped, whether satisfied or not. |\n\n# Example Questions\n\n- What did the people whose enquiries a clinician later qualified read on the site, and how does that differ from the people who were turned away?\n- Which pages do visitors leave from most often, and are those pages on the path to an enquiry or off it?\n- How many pages, and how much reading, does a visit usually take before someone gives us their contact details?\n\n## Joins\n\n- [Session](./session.md) — `session_id = session_id` [N:1] — The visit this page was seen during.\n  - [Session Person](./person.md) — The human behind the visit this reading happened in, which the view itself already carries directly.\n- [Person](./person.md) — `person_id = person_id` [N:1] — The human who viewed it.\n- [Page](./page.md) — `page_id = page_id` [N:1] — Which page was viewed.\n", "healthcare-clinic-attribution/page": "---\ntitle: \"Page\"\ndescription: |\n  Every page of the practice's website that a visitor can land on, held once and reused\n  by every view of it. Keeping pages as their own object rather than as a URL repeated on\n  each view is what lets a clinic ask which kinds of page do the work: whether the\n  enquiries that begin on a treatment page and the ones that begin on a pricing page fare\n  the same once a clinician has looked at them. `page_type` is what lets that question be\n  asked of a kind of page rather than of one URL — whether the visitor was reading about\n  a treatment, checking prices, or browsing the blog.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:19:57.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `page_id` | STRING | Page ID | PK. Unique identifier for this page. |\n| `page_url` | STRING | Page URL | Full address of the page, including its domain. |\n| `page_path` | STRING | Page Path | Path portion of the address, without domain or query string — the form that identifies a page across domains and tracking parameters. |\n| `page_title` | STRING | Page Title | Title shown in the browser tab and in search results. |\n| `page_type` | STRING | Page Type | What the page is for: `home`, `treatment`, `pricing`, `contact`, `blog` or `booking_form`. This is what makes a question about page effectiveness answerable at all. |\n\n# Example Questions\n\n- Which kinds of page — treatment, pricing, contact, blog — appear in the journeys of the enquiries a clinician ends up qualifying, and which appear only in the ones refused?\n- Do visitors who reach a pricing page before enquiring convert to booked treatment at a different rate than those who never see one?\n- Which individual pages carry the most first landings, and are those the same pages that carry the most eventual patients?\n", "healthcare-clinic-attribution/person": "---\ntitle: \"Person\"\ndescription: |\n  The human behind everything else in this model. The identity is minted at the very\n  first page view — before anyone has given a name, an email or a phone number — and is\n  never reissued, so a phone at lunchtime, a laptop weeks later and a call months after\n  that all belong to one person. It keeps the source, medium and campaign of that first arrival\n  frozen, so the ad that started a journey is still attached when the money arrives,\n  whether that takes two weeks or twenty years.\n\n  Two levels of identity sit here, and keeping them apart is what makes attribution\n  honest. `visitor_id`, carried on the [session](./session.md), is browser-level — the\n  Google Analytics `client_id` — and changes with a new device, a cleared cookie or a\n  different browser. `person_id` sits above it: several of those resolved to one human.\n  Grouping by `visitor_id` counts devices; grouping by `person_id` counts people, and a\n  practice's patient numbers only mean anything at the second level. This way of\n  stitching a person together across devices and years is the one\n  [APAS® Cloud](https://www.apascloud.com/) uses, described for this model by its\n  co-founder.\ntags: [\"owox\"]\ntype: \"OWOX Data Mart\"\ntimestamp: 2026-09-23T14:19:58.000Z\n---\n\n# Schema\n\n| Column | Type | Alias | Description |\n|--------|------|-------|-------------|\n| `person_id` | STRING | Person ID | PK. Unique identifier for the human, minted at their first page view and never reissued — one person across every device and browser they
