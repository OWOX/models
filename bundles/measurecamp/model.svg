<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 826" width="1580" height="826" role="img" aria-label="Entity relationship diagram of the MeasureCamp data model: ten data marts and fifteen foreign-key relationships, with Event as the root, a people and commerce cluster (Person, Ticket, Attendee, Organizer, Sponsor) and a programme cluster (Session Board, Room, Time Slot, Session).">
<style>
  :root{
    --bg:#fbfbfa; --surface:#ffffff; --border:#dcdcd6; --text:#1a1a18; --muted:#71716a;
    --edge:#a8a8a0; --fk:#5a6f8c;
    --root-bg:#fdf3d7; --root-fg:#8a5a06; --root-bd:#e6c98a;
    --people-bg:#d8f3ee; --people-fg:#0b5f58; --people-bd:#8fd4c9;
    --prog-bg:#e2e5fb; --prog-fg:#3b3796; --prog-bd:#b3b8ef;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15151a; --surface:#1e1e25; --border:#35353f; --text:#ececf0; --muted:#9a9aa6;
      --edge:#5a5a66; --fk:#93a7c4;
      --root-bg:#3a2b0a; --root-fg:#f0c264; --root-bd:#6b5218;
      --people-bg:#0a3330; --people-fg:#6fe0d2; --people-bd:#1c5c55;
      --prog-bg:#1f1c4d; --prog-fg:#aeb6f7; --prog-bd:#3b3782;
    }
  }
  .bg{fill:var(--bg)}
  .box{fill:var(--surface);stroke:var(--border);stroke-width:1}
  .t{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
  .title{font-size:19px;font-weight:700;fill:var(--text)}
  .sub{font-size:12px;fill:var(--muted)}
  .ename{font-size:13px;font-weight:700}
  .fname{font-size:10px;fill:var(--text)}
  .ftype{font-size:9px;fill:var(--muted)}
  .badge{font-size:8.5px;font-weight:700;letter-spacing:.4px}
  .pk{fill:var(--root-fg)}
  .fk{fill:var(--fk)}
  .edge{fill:none;stroke:var(--edge);stroke-width:1.4}
  .ahead{fill:var(--edge)}
  .elabel{font-size:9px;fill:var(--muted)}
  .legend{font-size:11px;fill:var(--muted)}
  .root .hdr{fill:var(--root-bg)} .root .ename{fill:var(--root-fg)} .root .box{stroke:var(--root-bd)}
  .people .hdr{fill:var(--people-bg)} .people .ename{fill:var(--people-fg)} .people .box{stroke:var(--people-bd)}
  .prog .hdr{fill:var(--prog-bg)} .prog .ename{fill:var(--prog-fg)} .prog .box{stroke:var(--prog-bd)}
</style>
